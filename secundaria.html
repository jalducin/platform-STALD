<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Clases de Secundaria</title>
<!-- Secundaria sin Notion (openspec: secundaria-sin-notion): esta página ya no lee la base «📖 Clases» (/data). Es el
     puente del portal a las clases nuevas, `ingles.html?modo=secundaria`, conservando la query (?api=, …) y el #hash.
     `replace`: «Atrás» no vuelve al puente. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    q.set('modo', 'secundaria');
    location.replace('ingles.html?' + q.toString() + location.hash);
  })();
</script>
<style>
  :root { --bg: #faf9f7; --text: #1c1917; --accent: #0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18181b; --text: #f4f4f5; --accent: #5eead4; } }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px 16px; text-align: center; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
  <p>📚 Abriendo tus clases de Secundaria…</p>
  <noscript><p><a href="ingles.html?modo=secundaria">📚 Ir a mis clases de Secundaria</a></p></noscript>
  <p><a href="./">← Inicio</a></p>
</body>
</html>
