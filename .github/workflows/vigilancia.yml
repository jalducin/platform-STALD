# Vigilante del servidor (openspec: vigilancia-servidor).
# Cada 15 min revisa https://stald.jalducin.deno.net/salud. Si el servidor se bloquea (límite de GitHub agotado) o
# no responde, abre un issue "🔴 Servidor bloqueado" que menciona a @jalducin: GitHub le manda el correo.
# Cuando se recupera, comenta y lo cierra. No repite comentarios mientras el estado no cambie.
name: Vigilancia del servidor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Probar el aviso con un estado forzado (vacío = revisión real)"
        required: false
        default: ""
        type: choice
        options: ["", "ok", "advertencia", "bloqueado", "caido"]

permissions:
  issues: write
  contents: read

concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Revisar /salud y avisar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORZAR: ${{ inputs.forzar }}
        run: deno run --allow-net --allow-env server/vigilancia.ts
