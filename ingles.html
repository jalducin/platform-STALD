<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clases de Inglés</title>
<style>
  :root {
    --bg: #faf9f7; --card-bg: #ffffff; --text: #1c1917; --text-muted: #78716c; --border: #e7e5e4;
    --accent: #4f46e5; --chip: #eef2ff; --green: #16a34a; --green-bg: #f0fdf4;
    --overdue: #dc2626; --overdue-bg: #fef2f2; --today: #b45309; --today-bg: #fffbeb;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18181b; --card-bg: #27272a; --text: #f4f4f5; --text-muted: #a1a1aa; --border: #3f3f46;
      --chip: #312e81; --green-bg: #052e16; --overdue-bg: #3b1414; --today-bg: #3a2a08;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 1.15rem; margin: 0 0 2px; }
  .subtitle { color: var(--text-muted); font-size: .8rem; margin-bottom: 18px; }
  .login-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
  .login-box label { font-size: .82rem; font-weight: 600; display: block; margin-bottom: 6px; }
  .login-box input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: .95rem; margin-bottom: 12px; }
  .login-box button, .top-bar button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: .88rem; font-weight: 600; cursor: pointer; width: 100%; }
  .login-error { color: #dc2626; font-size: .8rem; margin-top: 8px; display: none; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .top-bar .who { font-size: .82rem; color: var(--text-muted); }
  .top-bar button { width: auto; padding: 6px 12px; font-size: .78rem; background: var(--border); color: var(--text); }
  .admin-tag { background: var(--accent); color: #fff; font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; text-transform: uppercase; }
  /* Contadores y progreso */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; }
  .stat .num { font-size: 1.35rem; font-weight: 800; line-height: 1; }
  .stat .label { font-size: .62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
  .stat.done .num { color: var(--green); }
  .stat.overdue .num { color: var(--overdue); }
  .stat.today .num { color: var(--today); }
  .stat.upcoming .num { color: var(--accent); }
  button.stat { font: inherit; color: inherit; width: 100%; cursor: pointer; transition: border-color .15s, background .15s; }
  button.stat:hover { border-color: var(--accent); }
  button.stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.stat[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--chip); }
  .row-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .btn.sm { padding: 5px 9px; font-size: .74rem; }
  .ver-todo { font: inherit; font-size: .78rem; font-weight: 700; color: var(--accent); background: none; border: none; cursor: pointer; padding: 2px 0 8px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 2px 0 4px; }
  .progress-bar span { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .4s ease; }
  .progress-text { font-size: .72rem; color: var(--text-muted); margin-bottom: 14px; }

  /* Secciones con scroll interno */
  .section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .section-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .section-head .count { background: var(--chip); color: var(--accent); border-radius: 99px; padding: 2px 8px; font-size: .7rem; }
  .scroll { max-height: 340px; overflow-y: auto; padding: 8px; scroll-behavior: smooth; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  details.section > summary { list-style: none; cursor: pointer; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary .section-head { border-bottom: none; }
  details.section[open] > summary .section-head { border-bottom: 1px solid var(--border); }
  .chevron { transition: transform .2s ease; display: inline-block; margin-right: 4px; }
  details[open] > summary .chevron { transform: rotate(90deg); }

  /* Filas */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .row.done { border-left: 4px solid var(--green); }
  .row.overdue { border-left: 4px solid var(--overdue); background: var(--overdue-bg); }
  .row.today { border-left: 4px solid var(--today); background: var(--today-bg); }
  .row.upcoming, .row.nodate { border-left: 4px solid var(--accent); }
  .badge { font-size: .68rem; font-weight: 700; padding: 4px 8px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; min-width: 64px; text-align: center; }
  .badge.done { background: var(--green); color: #fff; }
  .badge.overdue { background: var(--overdue); color: #fff; }
  .badge.today { background: var(--today); color: #fff; }
  .badge.upcoming, .badge.nodate { background: var(--chip); color: var(--accent); }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-weight: 600; font-size: .88rem; overflow-wrap: anywhere; }
  .meta .row2 { font-size: .74rem; color: var(--text-muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta .fecha { font-weight: 600; color: var(--text); }
  .grade { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: .7rem; }
  .level { background: var(--chip); color: var(--accent); border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: .66rem; }
  .meta .who { font-size: .72rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
  a.link { color: var(--accent); text-decoration: none; font-size: .74rem; font-weight: 600; flex-shrink: 0; }
  .empty, .error, .loading { text-align: center; color: var(--text-muted); padding: 18px 12px; font-size: .85rem; }
  .error { color: #dc2626; }

  /* Admin: un bloque plegable por alumno */
  .student { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; background: var(--card-bg); }
  .student > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: .92rem; display: flex; justify-content: space-between; gap: 8px; align-items: center; list-style: none; }
  .student > summary::-webkit-details-marker { display: none; }
  .student > summary .mini { font-weight: 600; font-size: .72rem; color: var(--text-muted); display: flex; gap: 8px; }
  .student > summary .mini .o { color: var(--overdue); }
  .student > summary .mini .t { color: var(--today); }
  .student .student-body { padding: 0 10px 10px; }
  .student .section { background: var(--bg); }
  .student > summary .mini .g { color: var(--green); }

  /* Exámenes */
  .exam-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .exam-card h3 { margin: 0 0 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
  .exam-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .exam-item:first-of-type { border-top: none; }
  .exam-item .t { font-weight: 700; font-size: .9rem; }
  .exam-item .s { font-size: .74rem; color: var(--text-muted); margin-top: 2px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: .82rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .pill { font-size: .72rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
  .pill.wait { background: var(--chip); color: var(--accent); }
  .pill.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .q { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .q .n { font-size: .68rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .q .e { font-weight: 700; margin: 4px 0 8px; font-size: .92rem; }
  .q label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-top: 6px; cursor: pointer; font-size: .88rem; }
  .q label:has(input:checked) { border-color: var(--accent); background: var(--chip); }
  .q.answered { border-left: 4px solid var(--accent); }
  .exam-sec { font-size: .78rem; font-weight: 800; color: var(--accent); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .exam-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .score { text-align: center; padding: 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; }
  .score .big { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .score .lvl { font-weight: 700; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { font-size: .74rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; }
  .chip.fortaleza { background: var(--green-bg); color: var(--green); }
  .chip.en-progreso { background: var(--today-bg); color: var(--today); }
  .chip.debilidad { background: var(--overdue-bg); color: var(--overdue); }
  .chip.neutra { background: var(--chip); color: var(--accent); }
  .ultimas-tabla { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .ultimas-tabla td { padding: 6px 4px; border-top: 1px solid var(--border); vertical-align: middle; }
  .ultimas-tabla td:first-child { font-weight: 700; white-space: nowrap; width: 1%; padding-right: 10px; }
  .ultimas-tabla .chips { margin: 0; }
  .ultimas-lista { font-size: .8rem; margin: 4px 0 10px; }
  .ultimas-lista div { padding: 3px 0; }
  .topic { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .topic .h { display: flex; justify-content: space-between; font-weight: 700; font-size: .86rem; }
  .topic .bar { height: 6px; background: var(--border); border-radius: 99px; margin: 6px 0; overflow: hidden; }
  .topic .bar span { display: block; height: 100%; border-radius: 99px; }
  .topic.fortaleza .bar span { background: var(--green); }
  .topic.en-progreso .bar span { background: var(--today); }
  .topic.debilidad .bar span { background: var(--overdue); }
  .topic .r { font-size: .78rem; color: var(--text-muted); }
  .rev { font-size: .8rem; padding: 8px 0; border-top: 1px solid var(--border); }
  .rev .bad { color: var(--overdue); } .rev .good { color: var(--green); font-weight: 700; }
  .rev .why { color: var(--text-muted); margin-top: 2px; }
  .q .antes { font-size: .8rem; color: var(--overdue); margin: -4px 0 6px; }
  .q.fija { opacity: .85; } .q.fija label, .q.fija input { cursor: default; }
  .aviso-corr { background: var(--chip); color: var(--accent); border-radius: 10px; padding: 10px 12px; font-size: .85rem; font-weight: 600; margin: 8px 0; }
  table.teo { width: 100%; border-collapse: collapse; font-size: .82rem; }
  table.teo th, table.teo td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  table.teo th { background: var(--chip); color: var(--accent); }
  .teo-list { margin: 6px 0 0; padding-left: 18px; font-size: .84rem; }
  .teo-list li { margin: 3px 0; }
  .q-text { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: .95rem; margin-top: 4px; }

  /* ---------- Modo presentación (Meet) ---------- */
  .deck { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(ellipse at top, #1e1b4b, #0b1020 70%); display: flex; flex-direction: column; }
  .deck-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1.5vh 2vw; min-height: 0; }
  .slide { container-type: inline-size; width: min(96vw, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; background: #fffdf8; color: #1c1917; border-radius: 1.6vmin; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 2vmin 6vmin rgba(0,0,0,.45); animation: slideIn .35s ease; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(1.5vmin) scale(.985); } to { opacity: 1; transform: none; } }
  .slide[data-tone="indigo"] { --tone: #4f46e5; --tone2: #7c3aed; --soft: #eef2ff; }
  .slide[data-tone="amber"] { --tone: #d97706; --tone2: #f59e0b; --soft: #fffbeb; }
  .slide[data-tone="blue"] { --tone: #2563eb; --tone2: #0ea5e9; --soft: #eff6ff; }
  .slide[data-tone="green"] { --tone: #16a34a; --tone2: #22c55e; --soft: #f0fdf4; }
  .slide[data-tone="pink"] { --tone: #db2777; --tone2: #f472b6; --soft: #fdf2f8; }
  .slide[data-tone="orange"] { --tone: #ea580c; --tone2: #fb923c; --soft: #fff7ed; }
  .slide[data-tone="teal"] { --tone: #0d9488; --tone2: #2dd4bf; --soft: #f0fdfa; }
  .slide-top { background: linear-gradient(90deg, var(--tone), var(--tone2)); color: #fff; padding: 2.2cqw 4cqw; font-size: 3.6cqw; font-weight: 800; letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: center; }
  .slide-top small { font-size: 1.6cqw; font-weight: 600; opacity: .85; }
  .slide-body { flex: 1; padding: 2.6cqw 4cqw; font-size: 2.3cqw; line-height: 1.35; overflow: hidden; display: flex; flex-direction: column; gap: 1.6cqw; }
  .slide-body p { margin: 0; }
  .slide.hero { background: linear-gradient(135deg, var(--tone), var(--tone2)); color: #fff; justify-content: center; align-items: center; text-align: center; gap: 1cqw; }
  .slide.hero .big-emoji { font-size: 9cqw; line-height: 1; }
  .slide.hero h1 { font-size: 7.5cqw; margin: 0; letter-spacing: -.03em; }
  .slide.hero h2 { font-size: 3cqw; margin: 0; font-weight: 600; opacity: .95; }
  .slide.hero .pill-hero { font-size: 1.9cqw; background: rgba(255,255,255,.2); border-radius: 99px; padding: .6cqw 2cqw; margin-top: 1.5cqw; }
  .s-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 2.1cqw; border-radius: 1cqw; overflow: hidden; }
  .s-table th { background: var(--tone); color: #fff; text-align: left; padding: .9cqw 1.4cqw; }
  .s-table td { padding: .8cqw 1.4cqw; border-bottom: .15cqw solid #eee; background: #fff; }
  .s-table tr:nth-child(even) td { background: var(--soft); }
  .s-table td:first-child { font-weight: 800; color: var(--tone); }
  .s-points { margin: 0; padding-left: 3cqw; }
  .s-points li { margin: .5cqw 0; }
  .s-ex { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqw; }
  .s-ex div { background: var(--soft); border-left: .6cqw solid var(--tone); border-radius: 1cqw; padding: 1cqw 1.6cqw; }
  .s-ex b { color: var(--tone); display: block; font-size: 2.6cqw; }
  .s-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4cqw; }
  .s-card { background: var(--soft); border-radius: 1.2cqw; padding: 1.4cqw 1.8cqw; display: flex; gap: 1.4cqw; align-items: center; }
  .s-num { flex-shrink: 0; width: 4.2cqw; height: 4.2cqw; border-radius: 50%; background: var(--tone); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 2.2cqw; }
  .s-time { margin-left: auto; font-size: 1.7cqw; font-weight: 700; color: var(--tone); background: #fff; border-radius: 99px; padding: .3cqw 1.2cqw; white-space: nowrap; }
  .s-stat { background: #fff; border: .2cqw solid var(--soft); border-radius: 1.4cqw; padding: 1.4cqw; text-align: center; }
  .s-stat .n { font-size: 5.2cqw; font-weight: 800; color: var(--tone); line-height: 1; }
  .s-stat .l { font-size: 1.7cqw; color: #57534e; margin-top: .6cqw; }
  .s-bar { height: 1cqw; background: #eee; border-radius: 99px; overflow: hidden; margin-top: 1cqw; }
  .s-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--tone), var(--tone2)); }
  .s-col h3 { margin: 0 0 .8cqw; font-size: 2.3cqw; color: var(--tone); }
  .s-col ul { margin: 0; padding-left: 2.6cqw; font-size: 2cqw; }
  .s-lead { font-size: 2.5cqw; font-weight: 700; color: #44403c; }
  .s-qr { background: #fff; padding: 1.2cqw; border-radius: 1.4cqw; box-shadow: 0 .5cqw 2cqw rgba(0,0,0,.08); display: flex; align-items: center; justify-content: center; }
  .s-qr img, .s-qr canvas { width: 22cqw !important; height: 22cqw !important; }
  .s-url { font-size: 1.8cqw; font-weight: 700; color: var(--tone); word-break: break-all; }
  .deck-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; color: #e0e7ff; font-size: .85rem; }
  .deck-bar button { background: rgba(255,255,255,.12); color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
  .deck-bar button:hover { background: rgba(255,255,255,.22); }
  .deck-progress { flex: 1; height: 6px; background: rgba(255,255,255,.15); border-radius: 99px; overflow: hidden; }
  .deck-progress span { display: block; height: 100%; background: linear-gradient(90deg, #818cf8, #c084fc); transition: width .3s ease; }
  #app { display: none; }
  .home-link { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--accent); text-decoration: none; margin-bottom: 8px; }
  .home-link:hover { text-decoration: underline; }
  /* Ruta del profe (openspec: ruta-profe) */
  .ruta-sem { border-top: 1px solid var(--border); padding: 10px 0; display: grid; gap: 4px; }
  .ruta-sem:first-of-type { border-top: 0; }
  .ruta-sem.actual { background: var(--chip); border-radius: 10px; padding: 10px; border-top: 0; }
  .ruta-sem .h { font-weight: 800; }
  .ruta-sem .meta { font-size: .82rem; color: var(--muted); }
  .ruta-lista { margin: 4px 0 0; padding-left: 18px; font-size: .86rem; display: grid; gap: 3px; }
  .ruta-reparto { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .86rem; margin: 6px 0; }
  .ruta-reparto span:nth-child(2n) { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ruta-body { padding: 8px; }
  /* Audio y pronunciación (openspec: pronunciacion) */
  .tts { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .tts button, .pron-btns button { font: inherit; font-size: .85rem; font-weight: 700; border-radius: 99px; border: 1px solid var(--border); background: var(--chip); color: var(--accent); padding: 6px 12px; cursor: pointer; }
  .pron-frase { font-size: 1.15rem; font-weight: 700; margin: 6px 0; line-height: 1.4; }
  .pron-btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pron-btns button.rec { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pron-btns button.rec.on { animation: pulso 1s infinite; }
  @keyframes pulso { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .pron-btns button.rec.on { animation: none; } }
  .pron-oido { font-size: .86rem; margin-top: 4px; }
  .pron-oido.ok { color: var(--green); } .pron-oido.mal { color: var(--overdue); }
  .profe-link { display: inline-block; margin: 0 0 12px; font-weight: 700; color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <a class="home-link" href="./">← Inicio</a> <a class="home-link games-link" href="juegos.html" style="margin-left:12px">🎮 Juegos</a>
  <h1 id="titulo">📗 Clases de Inglés</h1>
  <div class="subtitle" id="subtitulo">Progreso de alumnos y alumnas, actualizado desde Notion</div>

  <div id="login" class="login-box">
    <label for="email-input">Tu correo</label>
    <input id="email-input" type="email" placeholder="tucorreo@gmail.com" autocomplete="email">
    <button id="login-btn">Entrar</button>
    <div class="login-error" id="login-error">No encontré clases asociadas a ese correo.</div>
  </div>

  <div id="app">
    <div class="top-bar">
      <div class="who" id="who-label"></div>
      <button id="logout-btn">Cerrar sesión</button>
    </div>
    <div id="content"><div class="loading">Cargando…</div></div>
  </div>

<script>
  // Backend: Deno Deploy (sin Supabase). Para pruebas locales se puede usar ?api=http://localhost:8000
  const DEFAULT_API = 'https://stald.jalducin.deno.net';
  const API_BASE = (new URLSearchParams(location.search).get('api') || DEFAULT_API).replace(/\/$/, '');
  const DATA_URL_BASE = API_BASE + '/ingles/data';
  // ?modo=profe → ruta de estudio del profe (solo admin, openspec: ruta-profe).
  const MODO_PROFE = new URLSearchParams(location.search).get('modo') === 'profe';
  const conApiParam = href => { const a = new URLSearchParams(location.search).get('api'); return a ? href + (href.includes('?') ? '&' : '?') + 'api=' + encodeURIComponent(a) : href; };
  if (MODO_PROFE) {
    document.title = 'Mi ruta B1 → C1';
    document.getElementById('titulo').textContent = '🎓 Mi ruta B1 → C1';
    document.getElementById('subtitulo').textContent = 'Temas de estudio, práctica y 2 exámenes por semana. Solo tú la ves.';
  }
  const STORAGE_KEY = 'ingles_email';
  // Claves de sesión compartidas con el portal (index.html): solo el correo.
  const SESSION_KEYS = ['stald_email', 'ingles_email', 'secundaria_email'];
  // "← Inicio" conserva ?api= (pruebas locales).
  (() => { const api = new URLSearchParams(location.search).get('api'); const l = document.querySelector('.home-link'); if (api && l) l.href = './?api=' + encodeURIComponent(api); const g = document.querySelector('.games-link'); if (api && g) g.href = 'juegos.html?api=' + encodeURIComponent(api); })();

  const loginEl = document.getElementById('login');
  const appEl = document.getElementById('app');
  const emailInput = document.getElementById('email-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const whoLabel = document.getElementById('who-label');
  const logoutBtn = document.getElementById('logout-btn');
  const contentEl = document.getElementById('content');

  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Días que cuentan como "realizadas recientes": hoy y los 2 anteriores.
  const RECENT_DAYS = 3;

  function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function todayStr() { return fmtDate(new Date()); }
  function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return fmtDate(d); }
  function diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
  // Fecha local (AAAA-MM-DD) de la última edición; se usa como fecha de realización.
  function localDateOf(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d) ? null : fmtDate(d); }

  function formatFecha(fecha) {
    try { return new Date(fecha + 'T00:00:00').toLocaleDateString('es-MX', {weekday:'short', day:'numeric', month:'short'}); }
    catch (e) { return fecha; }
  }

  // Estado de cada clase respecto a hoy.
  function classify(r, today) {
    if (r.completado) {
      const hecho = localDateOf(r.editadoEn);
      return { status: 'done', hecho, recent: !!hecho && hecho >= daysAgoStr(RECENT_DAYS - 1) };
    }
    if (!r.fecha) return { status: 'nodate' };
    if (r.fecha < today) return { status: 'overdue', diff: diffDays(r.fecha, today) };
    if (r.fecha === today) return { status: 'today' };
    return { status: 'upcoming', diff: diffDays(today, r.fecha) };
  }

  function badgeText(c) {
    if (c.status === 'done') return '✅ Hecho';
    if (c.status === 'overdue') return c.diff + 'd atraso';
    if (c.status === 'today') return '📌 Hoy';
    if (c.status === 'upcoming') return 'en ' + c.diff + 'd';
    return 'Sin fecha';
  }

  function renderRow(r, isAdmin) {
    const c = r._c;
    const parts = [];
    if (r.fecha) parts.push('<span class="fecha">📅 ' + escapeHtml(formatFecha(r.fecha)) + '</span>');
    if (c.status === 'done' && c.hecho) parts.push('<span>hecho ' + escapeHtml(formatFecha(c.hecho)) + '</span>');
    if (r.dificultad) parts.push('<span class="level">' + escapeHtml(r.dificultad) + '</span>');
    if (r.label) parts.push('<span>' + escapeHtml(r.label) + '</span>');
    if (r.calificacion) parts.push('<span class="grade">⭐ ' + escapeHtml(r.calificacion) + '</span>');
    let whoStr = '';
    if (isAdmin) {
      const who = (r.userNames && r.userNames.length) ? r.userNames.join(', ') : 'Usuario sin asignar en Notion';
      whoStr = '<div class="who">👤 ' + escapeHtml(who) + '</div>';
    }
    return '<div class="row ' + c.status + '">' +
      '<span class="badge ' + c.status + '">' + badgeText(c) + '</span>' +
      '<div class="meta">' +
        '<div class="name">' + escapeHtml(r.name) + '</div>' +
        '<div class="row2">' + parts.join('') + '</div>' +
        whoStr +
      '</div>' +
      rowAction(r) +
    '</div>';
  }


  // Agrupa en el orden pedido: realizadas recientes, atrasadas, hoy, próximas, y lo demás plegado.
  function buildGroups(rows) {
    const today = todayStr();
    rows.forEach(r => { r._c = classify(r, today); });
    const byFecha = (a, b) => (a.fecha || '').localeCompare(b.fecha || '');
    const byHechoDesc = (a, b) => (b._c.hecho || '').localeCompare(a._c.hecho || '');
    const done = rows.filter(r => r._c.status === 'done');
    return {
      recent: done.filter(r => r._c.recent).sort(byHechoDesc),
      overdue: rows.filter(r => r._c.status === 'overdue').sort(byFecha),
      today: rows.filter(r => r._c.status === 'today').sort(byFecha),
      upcoming: rows.filter(r => r._c.status === 'upcoming').sort(byFecha),
      older: done.filter(r => !r._c.recent).sort(byHechoDesc),
      nodate: rows.filter(r => r._c.status === 'nodate'),
      // Los exámenes aparecen en las secciones pero no cuentan en el total de actividades.
      total: rows.filter(r => !r._examen).length,
      completed: done.filter(r => !r._examen).length,
    };
  }

  function section(title, items, isAdmin, opts) {
    const o = opts || {};
    const grupo = o.grupo ? ' data-grupo="' + o.grupo + '"' : '';
    if (!items.length && o.hideEmpty) return '';
    const body = items.length
      ? '<div class="scroll"><div class="list">' + items.map(r => renderRow(r, isAdmin)).join('') + '</div></div>'
      : '<div class="empty">' + escapeHtml(o.empty || 'Nada por aquí.') + '</div>';
    const head = '<div class="section-head"><span>' + (o.collapsible ? '<span class="chevron">▶</span>' : '') + escapeHtml(title) + '</span><span class="count">' + items.length + '</span></div>';
    return o.collapsible
      ? '<details class="section"' + grupo + '><summary>' + head + '</summary>' + body + '</details>'
      : '<div class="section"' + grupo + '>' + head + body + '</div>';
  }

  function renderStats(g) {
    const pct = g.total ? Math.round(g.completed * 100 / g.total) : 0;
    const tarjeta = (cls, grupo, n, label) => '<button type="button" class="stat ' + cls + '" data-action="filtrar" data-grupo="' + grupo + '" aria-pressed="false" title="Ver solo: ' + label + '">' +
      '<div class="num">' + n + '</div><div class="label">' + label + '</div></button>';
    return '<div class="stats">' +
        tarjeta('done', 'recent', g.recent.length, 'Hechas 3 días') +
        tarjeta('overdue', 'overdue', g.overdue.length, 'Atrasadas') +
        tarjeta('today', 'today', g.today.length, 'Hoy') +
        tarjeta('upcoming', 'upcoming', g.upcoming.length, 'Próximas') +
      '</div>' +
      '<button type="button" class="ver-todo" data-action="ver-todo" hidden>✕ Ver todo</button>' +
      '<div class="progress-bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="progress-text">' + g.completed + '/' + g.total + ' completadas (' + pct + '%)</div>';
  }

  function renderBoard(rows, isAdmin) {
    const g = buildGroups(rows);
    return '<div class="board">' + renderStats(g) +
      section('✅ Realizadas · últimos 3 días', g.recent, isAdmin, { grupo: 'recent', empty: 'Aún no hay entregas en los últimos 3 días.' }) +
      section('⏰ Atrasadas', g.overdue, isAdmin, { grupo: 'overdue', empty: '¡Nada atrasado! 🎉' }) +
      section('📌 Hoy', g.today, isAdmin, { grupo: 'today', empty: 'No hay entrega para hoy.' }) +
      section('📅 Próximas', g.upcoming, isAdmin, { grupo: 'upcoming', empty: 'No hay entregas próximas.' }) +
      section('✔️ Realizadas anteriores', g.older, isAdmin, { grupo: 'older', collapsible: true, hideEmpty: true }) +
      section('🗒️ Sin fecha', g.nodate, isAdmin, { grupo: 'nodate', collapsible: true, hideEmpty: true }) + '</div>';
  }

  // Filtro por tarjeta: solo afecta a su tablero (en admin, a ese alumno o alumna). null = ver todo.
  function aplicarFiltro(board, grupo) {
    board.querySelectorAll('.section[data-grupo]').forEach(sec => { sec.hidden = !!grupo && sec.dataset.grupo !== grupo; });
    board.querySelectorAll('button.stat[data-grupo]').forEach(t => t.setAttribute('aria-pressed', String(t.dataset.grupo === grupo)));
    const todo = board.querySelector('[data-action="ver-todo"]');
    if (todo) todo.hidden = !grupo;
  }

  function render(data) {
    const rows = data.rows || [];
    whoLabel.textContent = data.isAdmin ? 'Modo maestro — viendo todo' : 'Tu progreso';
    if (data.isAdmin) {
      const tag = document.createElement('span');
      tag.className = 'admin-tag';
      tag.textContent = 'Admin';
      whoLabel.appendChild(tag);
    }

    const clases = rows.filter(r => r.source === 'clases_ingles');
    if (!clases.length && !(state.act && state.act.items && state.act.items.length)) {
      contentEl.innerHTML = '<div class="empty">No hay clases registradas todavía.</div>';
      return;
    }

    if (!data.isAdmin) {
      contentEl.innerHTML = (MODO_PROFE ? '<a class="profe-link" href="' + escapeHtml(conApiParam('ingles.html')) + '">← Vista de mi grupo</a>' + renderGrupoProfe(state.act) + renderPlanProfe(state.act) : '') +
        renderWeekCard(state.act) + renderBoard(clases.concat(itemRowsAlumno(state.act)), false);
      return;
    }

    // Admin: un bloque plegable por alumno o alumna (campo "Nombre" de Notion) con su tablero dentro.
    const groups = new Map();
    clases.forEach(r => {
      const key = r.alumno || 'Sin nombre asignado';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    // Alta desde la página (fila de identidad, sin tarea): también tiene su bloque.
    rows.filter(r => r.source === 'registro' && r.alumno && !groups.has(r.alumno)).forEach(r => groups.set(r.alumno, []));
    const items = (state.act && state.act.items) || [];
    const resumen = (state.act && state.act.resumen) || {};
    const diag = items.find(i => i.id === 'diagnostico-a1');
    const names = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b, 'es'));
    contentEl.innerHTML = '<a class="profe-link" href="' + escapeHtml(conApiParam('ingles.html?modo=profe')) + '">🎓 Mi ruta B1 → C1 →</a>' + renderAlumnosAdmin() + renderUltimasAdmin(names, groups, items) + renderJuegosAdmin() + renderAdminWeek(state.act) + names.map(name => {
      const list = groups.get(name);
      const g = buildGroups(list);
      const ultima = lastGraded(list);
      const resDiag = diag && (diag.resultados || []).find(r => r.alumno === name);
      const temas = (resumen[name] && resumen[name].temasAReforzar) || [];
      const suyos = items.map(it => ({ it, r: (it.resultados || []).find(r => r.alumno === name) })).filter(x => x.r);
      return '<details class="student" data-alumno="' + escapeHtml(name) + '">' +
        '<summary><span>👤 ' + escapeHtml(name) + '</span>' +
          '<span class="mini"><span>' + g.completed + '/' + g.total + '</span>' +
          '<span class="o">⏰ ' + g.overdue.length + '</span><span class="t">📌 ' + g.today.length + '</span>' +
          '<span class="g" title="Última actividad calificada (Notion)">⭐ ' + escapeHtml(ultima ? ultima.calificacion : '—') + '</span>' +
          '<span title="Diagnóstico">📝 ' + (resDiag && resDiag.mejor ? resDiag.mejor.porcentaje + '%' : 'pendiente') + '</span>' +
          '<span class="o" title="Temas a reforzar">🎯 ' + temas.length + '</span></span></summary>' +
        '<div class="student-body">' +
          lineaJuegos(name) +
          (() => {
            const u = ultimasCalificaciones(name, list, items);
            return u.length ? '<div class="ultimas-lista"><div class="progress-text" style="margin:4px 0 2px">🗓️ Últimas 5 calificaciones</div>' +
              u.map(x => '<div>• ' + x.icono + ' ' + escapeHtml(x.titulo) + ' · <span class="chip ' + claseNota(x.pct) + '">' + escapeHtml(x.valor) + '</span> · ' + escapeHtml(fechaCorta(x.fecha)) + '</div>').join('') + '</div>' : '';
          })() +
          (temas.length ? '<div class="progress-text" style="margin:4px 0 2px">🎯 Temas a reforzar (para armar su clase)</div><div class="chips">' +
            temas.map(t => '<span class="chip ' + t.estado + '" title="' + escapeHtml(t.fuente) + '">' + escapeHtml(t.titulo) + '</span>').join('') + '</div>' : '') +
          (ultima ? '<div class="progress-text">⭐ Última actividad calificada en Notion: <b>' + escapeHtml(ultima.calificacion) + '</b> · ' + escapeHtml(ultima.name) + '</div>' : '') +
          suyos.map(({ it, r }) => '<details class="section"><summary><div class="section-head"><span><span class="chevron">▶</span>' + icono(it.tipo) + ' ' + escapeHtml(it.titulo) +
            ' · ' + (r.mejor ? r.mejor.porcentaje + '%' : '—') + '</span><span class="count">' + r.intentos.length + '/' + it.intentosMax + ' intento(s)</span></div></summary><div class="scroll">' +
            (r.intentos.length > 1 ? '<div class="progress-text">Intentos: ' + r.intentos.map(x => x.calificacion.porcentaje + '%').join(' → ') + ' · cuenta el mejor</div>' : '') +
            (r.mejor ? renderResultado(r.mejor, true) : '') + '</div></details>').join('') +
          renderBoard(list.concat(itemRowsAdmin(items, name)), true) +
        '</div>' +
      '</details>';
    }).join('');
  }

  // ---------- Actividades y exámenes (servidor: /ingles/actividades) ----------
  const ACT_URL = API_BASE + (MODO_PROFE ? '/ingles/profe/actividades' : '/ingles/actividades');
  const state = { email: null, data: null, act: null };

  function isAdminView() { return !!(state.data && state.data.isAdmin); }
  function icono(tipo) { return ({ actividad: '📘', refuerzo: '🎯', examen: '📝', meet: '🎥' })[tipo] || '📘'; }
  function tipoTexto(tipo) { return ({ actividad: 'Actividad', refuerzo: 'Refuerzo', examen: 'Examen', meet: 'Repaso por Meet' })[tipo] || 'Actividad'; }

  // Un elemento (actividad, examen, refuerzo, Meet) como fila del tablero.
  function itemRow(it, estado, mejor, ultimoEnvio, intentosUsados) {
    const esMeet = it.tipo === 'meet';
    return {
      _item: it.id, _tipo: it.tipo, _estado: estado, _meetUrl: it.meetUrl, source: 'item',
      name: icono(it.tipo) + ' ' + it.titulo,
      label: tipoTexto(it.tipo) + (esMeet ? (it.hora ? ' · ' + it.hora : '') + (it.tieneReto ? ' · reto en vivo ' + (intentosUsados || 0) + '/' + it.intentosMax : '') : ' · ' + it.preguntas + ' ejercicios · ' + (intentosUsados || 0) + '/' + it.intentosMax + ' intento(s)'),
      dificultad: it.nivel,
      fecha: it.fechaLimite,
      // Con un intento enviado ya está hecha: la corrección (2.º intento) es opcional.
      completado: estado === 'completo' || (intentosUsados || 0) > 0 || (esMeet && !it.tieneReto && todayStr() > it.fechaLimite),
      calificacion: mejor ? mejor.porcentaje + '%' : null,
      editadoEn: ultimoEnvio || (esMeet ? it.fechaLimite + 'T23:00:00' : null),
      userNames: [],
    };
  }
  function itemRowsAlumno(act) {
    return ((act && act.items) || []).map(it => itemRow(it, it.estado, it.mejor, it.ultimoEnvio, it.intentosUsados));
  }
  function itemRowsAdmin(items, alumno) {
    return items.map(it => {
      const r = (it.resultados || []).find(x => x.alumno === alumno);
      const usados = r ? r.intentos.length : 0;
      const perfecto = it.tipo !== 'examen' && r && r.intentos.length && r.intentos[r.intentos.length - 1].calificacion.porcentaje === 100;
      const estado = it.tipo === 'meet' ? 'disponible' : (usados >= it.intentosMax || perfecto ? 'completo' : (usados ? 'en-curso' : 'disponible'));
      return itemRow(it, estado, r && r.mejor, r && r.intentos.length ? r.intentos[r.intentos.length - 1].enviadoEn : null, usados);
    });
  }

  function accionItem(it, estado) {
    if (it.tipo === 'meet') {
      const enlace = it.meetUrl ? '<a class="btn" href="' + escapeHtml(it.meetUrl) + '" target="_blank" rel="noopener">Unirme</a>' : '<span class="pill wait">Enlace por WhatsApp</span>';
      if (!it.tieneReto) return enlace;
      let reto = '';
      if (estado === 'completo') reto = '<button class="btn ghost" data-action="ver-resultado" data-id="' + escapeHtml(it.id) + '">Ver reto</button>';
      else if (estado === 'en-curso') reto = '<button class="btn" data-action="abrir-item" data-id="' + escapeHtml(it.id) + '">Corregir reto</button>';
      else if (estado === 'disponible') reto = '<button class="btn" data-action="abrir-item" data-id="' + escapeHtml(it.id) + '">Reto en vivo</button>';
      return '<span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">' + enlace + reto + '</span>';
    }
    if (estado === 'completo') return '<button class="btn ghost" data-action="ver-resultado" data-id="' + escapeHtml(it.id) + '">Ver resultado</button>';
    // Examen con 2.ª oportunidad (openspec: examen-segunda-oportunidad): en espera hasta su fecha.
    if (estado === 'en-espera') return '<span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center"><span class="pill wait">2.ª oportunidad ' + escapeHtml(formatFecha(it.segundaOportunidad)) + '</span><button class="btn ghost" data-action="ver-resultado" data-id="' + escapeHtml(it.id) + '">Ver resultado</button></span>';
    if (estado === 'en-curso') return '<button class="btn" data-action="abrir-item" data-id="' + escapeHtml(it.id) + '">' + (it.tipo === 'examen' ? (it.segundaOportunidad ? '2.ª oportunidad' : 'Reintentar') : 'Corregir errores') + '</button>';
    if (estado === 'disponible') return '<button class="btn" data-action="abrir-item" data-id="' + escapeHtml(it.id) + '">' + (it.tipo === 'examen' ? 'Resolver' : 'Empezar') + '</button>';
    return '<span class="pill wait">Abre ' + escapeHtml(formatFecha(it.disponibleDesde)) + '</span>';
  }

  function rowAction(r) {
    if (r._item) {
      if (isAdminView()) return '';
      const it = ((state.act && state.act.items) || []).find(x => x.id === r._item);
      return it ? accionItem(it, it.estado) : '';
    }
    const abrir = r.url ? '<a class="link" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">Abrir ↗</a>' : '';
    if (!r.id) return abrir;
    const marcar = r.completado
      ? '<button class="btn ghost sm" data-action="marcar" data-id="' + escapeHtml(r.id) + '" data-valor="false" data-titulo="' + escapeHtml(r.name) + '" title="Desmarcar (no hecha)">↩ Desmarcar</button>'
      : '<button class="btn sm" data-action="marcar" data-id="' + escapeHtml(r.id) + '" data-valor="true" data-titulo="' + escapeHtml(r.name) + '">✓ Marcar hecha</button>';
    return '<span class="row-actions">' + marcar + abrir + '</span>';
  }

  // Marca o desmarca "Completado" en Notion y vuelve a dibujar conservando la vista (alumnos abiertos, scroll).
  async function marcarTarea(btn) {
    const hecha = btn.dataset.valor === 'true';
    if (!confirm((hecha ? '¿Marcar como hecha "' : '¿Desmarcar "') + btn.dataset.titulo + '"?')) return;
    btn.disabled = true; btn.textContent = 'Guardando…';
    const r = await fetchJson(DATA_URL_BASE + '/' + encodeURIComponent(btn.dataset.id) + '/completado?email=' + encodeURIComponent(state.email), {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ completado: hecha }),
    });
    if (!r.ok) {
      btn.disabled = false; btn.textContent = hecha ? '✓ Marcar hecha' : '↩ Desmarcar';
      alert('No se pudo guardar (' + (r.body.error || r.status) + '). Intenta de nuevo.');
      return;
    }
    const abiertos = [...document.querySelectorAll('details.student[open]')].map(d => d.dataset.alumno);
    const y = window.scrollY;
    const d = await fetchJson(DATA_URL_BASE + '?email=' + encodeURIComponent(state.email));
    if (d.ok) state.data = d.body;
    render(state.data);
    document.querySelectorAll('details.student').forEach(det => { if (abiertos.includes(det.dataset.alumno)) det.open = true; });
    window.scrollTo(0, y);
  }

  // Última actividad completada con calificación en Notion (la de edición más reciente).
  // Últimas calificaciones de un alumno o alumna: actividades/exámenes en línea (mejor, fecha del último envío)
  // y filas de Notion con "Calificación" (fecha de edición). De la más reciente a la más antigua.
  function ultimasCalificaciones(name, filas, items, n = 5) {
    const enLinea = items.map(it => ({ it, r: (it.resultados || []).find(r => r.alumno === name) }))
      .filter(x => x.r && x.r.mejor && x.r.intentos.length)
      .map(({ it, r }) => ({ icono: icono(it.tipo), titulo: it.titulo, valor: r.mejor.porcentaje + '%', pct: r.mejor.porcentaje, fecha: r.intentos[r.intentos.length - 1].enviadoEn }));
    const notion = filas.filter(r => r.calificacion && !r._item).map(r => {
      const num = Number(String(r.calificacion).replace(',', '.'));
      return { icono: '📓', titulo: r.name, valor: String(r.calificacion), pct: Number.isFinite(num) ? (num <= 10 ? num * 10 : num) : null, fecha: r.editadoEn || r.fecha || '' };
    });
    return enLinea.concat(notion).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, n);
  }
  const claseNota = pct => pct === null ? 'neutra' : pct >= 80 ? 'fortaleza' : pct >= 60 ? 'en-progreso' : 'debilidad';
  const fechaCorta = f => f ? new Date(f.length === 10 ? f + 'T12:00:00' : f).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }) : '';

  function renderUltimasAdmin(names, groups, items) {
    return '<details class="section" id="ultimas" open><summary><div class="section-head"><span><span class="chevron">▶</span>📊 Últimas calificaciones</span><span class="count">' + names.length + '</span></div></summary>' +
      '<div style="padding:4px 12px 10px"><div class="progress-text" style="margin:4px 0">Las 5 más recientes de cada alumno o alumna · en línea (mejor intento) y Notion</div>' +
      '<table class="ultimas-tabla"><tbody>' + names.map(name => {
        const u = ultimasCalificaciones(name, groups.get(name), items);
        return '<tr data-alumno="' + escapeHtml(name) + '"><td>' + escapeHtml(name) + '</td><td>' + (u.length
          ? '<div class="chips">' + u.map(x => '<span class="chip ' + claseNota(x.pct) + '" data-fecha="' + escapeHtml(x.fecha) + '" title="' + escapeHtml(x.titulo + ' · ' + fechaCorta(x.fecha)) + '">' + escapeHtml(x.valor) + '</span>').join('') + '</div>'
          : '<span class="progress-text">—</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div></details>';
  }

  function lastGraded(rows) {
    return rows.filter(r => r.completado && r.calificacion && !r._item)
      .sort((a, b) => String(b.editadoEn || '').localeCompare(String(a.editadoEn || '')))[0] || null;
  }

  function semanaItems(act) {
    if (!act || !act.semana) return [];
    const ids = new Set(act.semana.ids);
    return (act.items || []).filter(i => ids.has(i.id));
  }

  function renderWeekCard(act) {
    const lista = semanaItems(act);
    if (!lista.length) return '';
    return '<div class="exam-card"><h3>📚 Esta semana · ' + escapeHtml(act.semana.titulo) + '</h3>' + lista.map(it => {
      let sub = escapeHtml(formatFecha(it.fechaLimite)) + ' · ' + tipoTexto(it.tipo);
      if (it.tipo !== 'meet') sub += ' · ' + (it.intentosUsados || 0) + '/' + it.intentosMax + ' intento(s)';
      if (it.mejor) sub += ' · <span class="pill ok">⭐ ' + it.mejor.porcentaje + '%</span>';
      return '<div class="exam-item"><div><div class="t">' + icono(it.tipo) + ' ' + escapeHtml(it.titulo) + '</div><div class="s">' + sub + '</div></div>' + accionItem(it, it.estado) + '</div>';
    }).join('') + '</div>';

  function renderAdminWeek(act) {
    const lista = semanaItems(act);
    if (!lista.length) return '';
    return '<div class="exam-card"><h3>📚 Esta semana · ' + escapeHtml(act.semana.titulo) + '</h3>' + lista.map(it => {

  function renderResultado(r, compacto) {
    const chips = (arr, cls) => arr.map(t => '<span class="chip ' + cls + '">' + escapeHtml(t) + '</span>').join('');
    let html = '';
    if (!compacto) {
      html += '<div class="score"><div class="big">' + r.porcentaje + '%</div>' +
        '<div class="progress-text" style="margin:4px 0 0">' + r.correctas + ' de ' + r.total + ' correctas</div>' +
        '<div class="lvl">' + escapeHtml(r.nivelSugerido) + '</div></div>';
    }
    if (r.fortalezas.length) html += '<div class="progress-text" style="margin:0">💪 Fortalezas</div><div class="chips">' + chips(r.fortalezas, 'fortaleza') + '</div>';
    if (r.enProgreso.length) html += '<div class="progress-text" style="margin:0">📈 En progreso</div><div class="chips">' + chips(r.enProgreso, 'en-progreso') + '</div>';
    if (r.debilidades.length) html += '<div class="progress-text" style="margin:0">🎯 A reforzar</div><div class="chips">' + chips(r.debilidades, 'debilidad') + '</div>';
    html += r.secciones.map(s =>
      '<div class="topic ' + s.estado + '"><div class="h"><span>' + escapeHtml(s.titulo) + '</span><span>' + s.correctas + '/' + s.total + ' · ' + s.porcentaje + '%</span></div>' +
      '<div class="bar"><span style="width:' + s.porcentaje + '%"></span></div><div class="r">' + escapeHtml(s.retroalimentacion) + '</div></div>'
    ).join('');
    if (r.revision && r.revision.length) {
      html += '<details class="section"' + (compacto ? '' : ' open') + '><summary><div class="section-head"><span><span class="chevron">▶</span>🔍 Revisa tus errores</span><span class="count">' + r.revision.length + '</span></div></summary><div class="scroll">' +
        r.revision.map(x => '<div class="rev"><div><b>' + escapeHtml(x.enunciado) + '</b></div>' +
          '<div class="bad">✗ ' + (x.tuRespuesta === null ? 'Sin responder' : escapeHtml(x.tuRespuesta)) + '</div>' +
          '<div class="good">✓ ' + escapeHtml(x.correcta) + '</div><div class="why">' + escapeHtml(x.explicacion) + '</div></div>').join('') +
        '</div></details>';
    } else {
      html += '<div class="empty">¡Sin errores! 🎉</div>';
    }
    return html;
  }

  const ERRORES_ALTA = { correo_invalido: 'Escribe un correo válido.', nombre_invalido: 'Escribe un nombre de 2 a 40 letras.', correo_en_uso: 'Ese correo ya tiene acceso.', nombre_en_uso: 'Ya hay alguien con ese nombre y correo. Usa otro nombre (por ejemplo, con apellido).' };
  async function altaAlumno(form) {

    const r = await fetchJson(API_BASE + '/ingles/alumnos?email=' + encodeURIComponent(state.email), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nombre, email }) });

    state.altaAbierta = true;
    state.altaAviso = '✅ ' + r.body.alumno.nombre + ' ya puede entrar con ' + r.body.alumno.email + '.';
    await loadFor(state.email);

  function volverBtn() { return '<button class="btn ghost" data-action="volver">← Volver</button>'; }

  async function openItem(id) {
    contentEl.innerHTML = '<div class="loading">Cargando…</div>';
    const r = await fetchJson(ACT_URL + '/' + encodeURIComponent(id) + '?email=' + encodeURIComponent(state.email));
    if (r.status === 409 && r.body.resultado) return showResult(r.body.resultado.mejor, { titulo: r.body.resultado.titulo });
    if (!r.ok) {
      const msg = r.body.error === 'no_disponible' ? 'Se abre el ' + formatFecha(r.body.disponibleDesde) + '.' : 'No se pudo abrir (' + (r.body.error || r.status) + ').';
      contentEl.innerHTML = '<div class="exam-card"><div class="empty">' + escapeHtml(msg) + '</div>' + volverBtn() + '</div>';
      return;
    }
    const it = r.body;
    const titulos = new Map(it.temas.map(t => [t.id, t.titulo]));
    // Corrección (actividades): las correctas del intento anterior vienen fijas; solo se contestan las falladas.
    const corr = it.correccion || null;
    const fijas = corr ? corr.fijas : {};
    const porCorregir = it.preguntas.filter(p => !(p.id in fijas));
    const yaBien = it.preguntas.filter(p => p.id in fijas);
    const pregunta = (p, n, total, fija) => {
      const v = fija ? fijas[p.id] : undefined;
      const dis = fija ? ' disabled' : '';
      const tts = t => '<div class="tts"><button type="button" data-action="tts" data-texto="' + escapeHtml(t) + '">🔊 Escuchar</button><button type="button" data-action="tts" data-lento="1" data-texto="' + escapeHtml(t) + '">🐢 Lento</button></div>';
      const cuerpo = p.tipo === 'pronunciar'
        ? '<div class="pron-frase">' + escapeHtml(p.frase) + '</div>' + tts(p.frase) +
          '<input class="q-text" type="hidden" name="' + escapeHtml(p.id) + '"' + (fija ? ' value="' + escapeHtml(v) + '"' : '') + dis + '>' +
          (fija ? '' : Reconocedor
            ? '<div class="pron-btns"><button type="button" class="rec" data-action="grabar">🎙️ Decirlo</button></div>'
            : '<div class="pron-btns"><button type="button" data-action="auto" data-valor="auto:ok">✔ Me salió bien</button><button type="button" data-action="auto" data-valor="auto:repetir">↺ Necesito repetir</button></div><div class="s" style="font-size:.78rem">Tu navegador no reconoce voz: usa Chrome o Edge para calificarla. Mientras, escucha el modelo, repítelo y autoevalúate.</div>') +
          '<div class="pron-oido">' + (fija ? 'Ya te salió bien ✔' : '') + '</div>'
        : p.tipo === 'escribir'
        ? (p.audio ? tts(p.audio) : '') + '<input class="q-text" type="text" name="' + escapeHtml(p.id) + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe tu respuesta"' + (fija ? ' value="' + escapeHtml(v) + '"' : '') + dis + '>'
        : (p.audio ? tts(p.audio) : '') + p.opciones.map((o, i) => '<label><input type="radio" name="' + escapeHtml(p.id) + '" value="' + i + '"' + (fija && v === i ? ' checked' : '') + dis + '> ' + escapeHtml(o) + '</label>').join('');
      const antes = corr && !fija ? '<div class="antes">Antes respondiste: ' + escapeHtml(corr.anteriores[p.id] || 'Sin responder') + ' ✗</div>' : '';
      return '<div class="q' + (fija ? ' fija answered' : '') + '" data-q="' + escapeHtml(p.id) + '"' + (p.tipo === 'pronunciar' ? ' data-frase="' + escapeHtml(p.frase) + '"' : '') + '><div class="n">' + (fija ? '✓ Ya la tenías bien' : 'Ejercicio ' + n + ' de ' + total) + '</div>' +
        '<div class="e">' + escapeHtml(p.enunciado) + '</div>' + antes + cuerpo + '</div>';
    };
    const conTemas = (lista, fija) => {
      let lastTema = null, n = 0;
      return lista.map(p => {
        n++;
        const head = p.tema !== lastTema ? '<div class="exam-sec">' + escapeHtml(titulos.get(p.tema) || p.tema) + '</div>' : '';
        lastTema = p.tema;
        return head + pregunta(p, n, lista.length, fija);
      }).join('');
    };
    const qs = corr
      ? '<div class="aviso-corr">✏️ Corrección: tus ' + yaBien.length + ' respuestas correctas ya están guardadas. Corrige solo ' + (porCorregir.length === 1 ? 'la que fallaste' : 'las ' + porCorregir.length + ' que fallaste') + '.</div>' +
        conTemas(porCorregir, false) +
        (yaBien.length ? '<details class="section"><summary><div class="section-head"><span><span class="chevron">▶</span>✅ Ya las tenías bien</span><span class="count">' + yaBien.length + '</span></div></summary><div style="padding:8px">' + conTemas(yaBien, true) + '</div></details>' : '')
      : conTemas(it.preguntas, false);
    const info = (it.vistaPrevia ? 'Vista previa (no se guarda)' : (corr ? 'Corrección · intento ' : 'Intento ') + it.intento + ' de ' + it.intentosMax) +

      renderTips(it.tips) +

  // ---------- Voz: modelo (speechSynthesis) y reconocimiento (SpeechRecognition) ----------
  function hablar(texto, lento) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = 'en-US'; u.rate = lento ? 0.7 : 1;
    const voz = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (voz) u.voice = voz;
    speechSynthesis.speak(u);
  }
  const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const CONTRACCIONES = [[/\bcan't\b/g, 'can not'], [/\bcannot\b/g, 'can not'], [/\bwon't\b/g, 'will not'], [/\blet's\b/g, 'let us'], [/\b(it|that|there|he|she|what|where|who)'s\b/g, '$1 is'],
    [/n't\b/g, ' not'], [/'ve\b/g, ' have'], [/'ll\b/g, ' will'], [/'re\b/g, ' are'], [/'m\b/g, ' am'], [/'d\b/g, ' would']];
  function palabrasPron(t) {
    t = String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/[’‘`]/g, "'");
    for (const [re, por] of CONTRACCIONES) t = t.replace(re, por);
    return t.replace(/[^a-z0-9' ]+/g, ' ').replace(/'/g, '').split(/\s+/).filter(Boolean);
  }
  function similitudPron(frase, oido) {
    const a = palabrasPron(frase), b = palabrasPron(oido);
    if (!a.length || !b.length) return 0;
    const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    return dp[a.length][b.length] / a.length;
  }
  function ponerRespuestaPron(q, valor, texto, ok) {
    const inp = q.querySelector('input.q-text');
    inp.value = valor;
    const o = q.querySelector('.pron-oido');
    o.textContent = texto; o.className = 'pron-oido ' + (ok ? 'ok' : 'mal');
    updateExamProgress(q.closest('#exam-form'));
  }
  function grabarPron(btn) {
    const q = btn.closest('.q'); const frase = q.dataset.frase;
    if (!Reconocedor) return;
    const r = new Reconocedor();
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 3;
    btn.classList.add('on'); btn.textContent = '🎙️ Escuchando…';
    r.onresult = ev => {
      const alts = Array.from(ev.results[0] || []).map(x => x.transcript);
      const mejor = alts.sort((x, y) => similitudPron(frase, y) - similitudPron(frase, x))[0] || '';
      const p = Math.round(similitudPron(frase, mejor) * 100);
      ponerRespuestaPron(q, mejor, 'Te escuché: «' + mejor + '» · coincide ' + p + ' % ' + (p >= 80 ? '✔' : '↺ inténtalo otra vez'), p >= 80);
    };
    r.onerror = ev => { const o = q.querySelector('.pron-oido'); o.textContent = ev.error === 'not-allowed' ? 'Permite el micrófono para calificar tu voz.' : 'No te escuché bien; inténtalo otra vez.'; o.className = 'pron-oido mal'; };
    r.onend = () => { btn.classList.remove('on'); btn.textContent = '🎙️ Decirlo otra vez'; };
    r.start();
  }

  function examAnswers(form) {
    const out = {};
    form.querySelectorAll('input[type=radio]:checked:not(:disabled)').forEach(i => { out[i.name] = Number(i.value); });
    form.querySelectorAll('input.q-text:not(:disabled)').forEach(i => { if (i.value.trim()) out[i.name] = i.value; });
    return out;
  }

  function updateExamProgress(form) {
    const total = Number(form.dataset.total);
    const answers = examAnswers(form);
    const count = Object.keys(answers).length;
    form.querySelectorAll('.q:not(.fija)').forEach(q => q.classList.toggle('answered', q.dataset.q in answers));
    document.getElementById('exam-count').textContent = count + '/' + total + ' respondidas' + (count < total ? ' · faltan ' + (total - count) : '');
    document.getElementById('exam-send').disabled = count < total;
  }

  // Guion de la clase del domingo (solo admin): retroalimentación automática + bloques de la clase.
  function retroAlumnos() {
    const items = semanaItems(state.act).filter(i => i.tipo !== 'meet');
    const resumen = (state.act && state.act.resumen) || {};
    const diag = ((state.act && state.act.items) || []).find(i => i.id === 'diagnostico-a1');
    const nombres = [...new Set(((state.data && state.data.rows) || []).map(r => r.alumno).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
    // Errores más comunes del grupo en la semana (por enunciado, en el mejor intento).
    const cuenta = new Map();
    items.forEach(it => (it.resultados || []).forEach(r => ((r.mejor && r.mejor.revision) || []).forEach(x => cuenta.set(x.enunciado, (cuenta.get(x.enunciado) || 0) + 1))));
    const comunes = [...cuenta].sort((a, b) => b[1] - a[1]).slice(0, 5);
    let html = '<div class="exam-card"><h3>👥 Errores más comunes del grupo (esta semana)</h3>' +
      (comunes.length ? '<ul class="teo-list">' + comunes.map(([e, n]) => '<li>' + escapeHtml(e) + ' <span class="pill wait">' + n + '</span></li>').join('') + '</ul>' : '<div class="s">Aún no hay intentos esta semana.</div>') + '</div>';
    html += nombres.map(name => {
      const notas = items.map(it => { const r = (it.resultados || []).find(x => x.alumno === name); return icono(it.tipo) + ' ' + escapeHtml(it.titulo) + ': <b>' + (r && r.mejor ? r.mejor.porcentaje + '%' : '—') + '</b>'; });
      const d = diag && (diag.resultados || []).find(x => x.alumno === name);
      const temas = (resumen[name] && resumen[name].temasAReforzar) || [];
      const fuertes = new Set();
      items.forEach(it => (it.resultados || []).filter(x => x.alumno === name).forEach(r => ((r.mejor && r.mejor.fortalezas) || []).forEach(f => fuertes.add(f))));
      return '<div class="topic"><div class="h"><span>👤 ' + escapeHtml(name) + '</span><span>📝 ' + (d && d.mejor ? d.mejor.porcentaje + '%' : '—') + '</span></div>' +
        '<ul class="teo-list">' + notas.map(n => '<li>' + n + '</li>').join('') + '</ul>' +
        (fuertes.size ? '<div class="chips">' + [...fuertes].map(t => '<span class="chip fortaleza">💪 ' + escapeHtml(t) + '</span>').join('') + '</div>' : '') +
        (temas.length ? '<div class="chips">' + temas.map(t => '<span class="chip ' + t.estado + '">🎯 ' + escapeHtml(t.titulo) + '</span>').join('') + '</div>' : '') + '</div>';
    }).join('');
    return html;
  }

  // ---------- Modo presentación para el Meet (solo admin) ----------
  const TONOS = { portada: 'indigo', agenda: 'indigo', retro: 'amber', teoria: 'blue', practica: 'green', juego: 'pink', reto: 'orange', libreta: 'teal', cierre: 'indigo' };

  // Retroalimentación grupal, sin nombres: promedio del mejor intento, entregas, fortalezas y errores comunes.
  function retroGrupal() {
    const items = semanaItems(state.act).filter(i => i.tipo !== 'meet');
    const total = new Set(((state.data && state.data.rows) || []).map(r => r.alumno).filter(Boolean)).size || 5;
    const fuertes = new Map(), errores = new Map(), debiles = new Map();
    const stats = items.map(it => {
      const rs = (it.resultados || []).filter(r => r.mejor);
      rs.forEach(r => {
        (r.mejor.fortalezas || []).forEach(f => fuertes.set(f, (fuertes.get(f) || 0) + 1));
        (r.mejor.debilidades || []).forEach(f => debiles.set(f, (debiles.get(f) || 0) + 2));
        (r.mejor.enProgreso || []).forEach(f => debiles.set(f, (debiles.get(f) || 0) + 1));
        (r.mejor.revision || []).forEach(x => errores.set(x.enunciado, (errores.get(x.enunciado) || 0) + 1));
      });
      const prom = rs.length ? Math.round(rs.reduce((a, r) => a + r.mejor.porcentaje, 0) / rs.length) : null;
      return { it, prom, n: rs.length };
    });
    const top = (m, k) => [...m].sort((a, b) => b[1] - a[1]).slice(0, k).map(x => x[0]);
    // Para proyectar: se omiten preguntas que mencionan a alguien del grupo (p. ej. «Pronombre para "Marisol"»).
    const nombres = [...new Set(((state.data && state.data.rows) || []).map(r => r.alumno).filter(Boolean))];
    const sinNombres = new Map([...errores].filter(([e]) => !nombres.some(n => e.includes(n))));
    return { stats, total, fuertes: top(fuertes, 3), debiles: top(debiles, 3), errores: top(sinNombres, 1) };
  }

  function slideHtml(d, ctx) {
    const tono = TONOS[d.tipo] || 'indigo';
    const wrap = (titulo, cuerpo, extra) => '<div class="slide" data-tone="' + tono + '"><div class="slide-top"><span>' + escapeHtml(titulo) + '</span><small>' + escapeHtml(extra || ctx.titulo) + '</small></div><div class="slide-body">' + cuerpo + '</div></div>';
    if (d.tipo === 'portada' || d.tipo === 'cierre') {
      return '<div class="slide hero" data-tone="' + tono + '"><div class="big-emoji">' + escapeHtml(d.emoji || '🎥') + '</div><h1>' + escapeHtml(d.titulo) + '</h1>' +
        (d.subtitulo ? '<h2>' + escapeHtml(d.subtitulo) + '</h2>' : '') + (d.texto ? '<div class="pill-hero">' + escapeHtml(d.texto) + '</div>' : '') +
        (d.tipo === 'portada' ? '<div class="pill-hero">' + escapeHtml(formatFecha(ctx.fecha)) + (ctx.hora ? ' · ' + escapeHtml(ctx.hora) : '') + '</div>' : '') + '</div>';
    }
    if (d.tipo === 'agenda') {
      return wrap(d.titulo, '<div class="s-grid">' + (ctx.guion || []).map((b, i) => '<div class="s-card"><span class="s-num">' + (i + 1) + '</span><span>' + escapeHtml(String(b.titulo).replace(/^\d+\.\s*/, '')) + '</span><span class="s-time">' + escapeHtml(b.tiempo) + '</span></div>').join('') + '</div>');
    }
    if (d.tipo === 'retro') {
      const g = retroGrupal();
      if (!g.stats.some(s => s.n)) return wrap(d.titulo, '<p class="s-lead">Esta semana arrancamos 💪 — hoy vemos juntos lo que viene.</p>');
      const cards = g.stats.map(s => '<div class="s-stat"><div class="n">' + (s.prom === null ? '—' : s.prom + '%') + '</div><div class="l">' + icono(s.it.tipo) + ' ' + escapeHtml(s.it.titulo) + '<br>' + s.n + ' de ' + g.total + ' entregas</div>' +
        '<div class="s-bar"><span style="width:' + (s.prom || 0) + '%"></span></div></div>').join('');
      return wrap(d.titulo, '<div style="display:grid;grid-template-columns:repeat(' + Math.min(4, g.stats.length) + ',1fr);gap:1.4cqw">' + cards + '</div>' +
        '<div class="s-grid"><div class="s-col"><h3>💪 Lo que el grupo ya domina</h3><ul>' + (g.fuertes.length ? g.fuertes.map(f => '<li>' + escapeHtml(f) + '</li>').join('') : '<li>¡Vamos por ello!</li>') + '</ul></div>' +
        '<div class="s-col"><h3>🎯 Lo que reforzamos hoy</h3><ul>' + (g.debiles.length ? g.debiles.map(e => '<li>' + escapeHtml(e) + '</li>').join('') : '<li>¡Todo en verde! 🎉</li>') + '</ul>' +
        (g.errores.length ? '<p style="font-size:1.7cqw;color:#78716c;margin-top:1cqw">Pregunta más fallada: «' + escapeHtml(g.errores[0]) + '»</p>' : '') + '</div></div>', 'Resultados del grupo');
    }
    if (d.tipo === 'teoria') {
      const b = (ctx.teoria || [])[d.ref] || {};
      let c = '';
      if (b.texto) c += '<p class="s-lead">' + escapeHtml(b.texto) + '</p>';
      if (b.tabla) {

        const fs = b.tabla.filas;

          ? '<div class="s-grid" style="align-items:start">' + tabla(fs.slice(0, Math.ceil(fs.length / 2))) + tabla(fs.slice(Math.ceil(fs.length / 2))) + '</div>'
          : tabla(fs);

      if (b.ejemplos) c += '<div class="s-ex">' + b.ejemplos.map(e => '<div><b>' + escapeHtml(e.en) + '</b>' + escapeHtml(e.es) + '</div>').join('') + '</div>';

      return wrap(b.titulo || '', c);

    }

        '<div style="display:flex;flex-direction:column;gap:1.2cqw">' + (d.pasos || []).map((p, i) => '<div class="s-card"><span class="s-num">' + (i + 1) + '</span><span style="font-size:2.4cqw">' + escapeHtml(p) + '</span></div>').join('') + '<div class="s-url">' + escapeHtml(d.url || '') + '</div></div>' +
        '<div style="display:flex;justify-content:center"><div class="s-qr" id="deck-qr" data-url="' + escapeHtml(d.url || '') + '"></div></div></div>', '¡Desde tu celular!');
    }
    if (d.tipo === 'libreta') {
      const tips = (ctx.tips || []).filter(t => t.tipo === 'libreta');
      return wrap(d.titulo, '<div style="display:flex;flex-direction:column;gap:1.1cqw">' + tips.map((t, i) => '<div class="s-card"><span class="s-num">✓</span><span style="font-size:2.2cqw">' + escapeHtml(t.texto) + '</span></div>').join('') + '</div>', 'Tarea de la semana');
    }
    return wrap(d.titulo || '', '');
  }

  let qrLib = null;
  function ensureQr(el) {
    if (!el || el.dataset.done) return;
    const draw = () => { try { el.innerHTML = ''; new window.QRCode(el, { text: el.dataset.url, width: 256, height: 256, correctLevel: window.QRCode.CorrectLevel.M }); el.dataset.done = '1'; } catch (e) { el.textContent = el.dataset.url; } };
    if (window.QRCode) return draw();
    if (!qrLib) {
      qrLib = new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
    }
    qrLib.then(draw).catch(() => { el.textContent = el.dataset.url; });
  }

  async function openPresentacion(id) {
    const r = await fetchJson(ACT_URL + '/' + encodeURIComponent(id) + '?email=' + encodeURIComponent(state.email));
    const it = r.body || {};
    const diapos = (it.presentacion && it.presentacion.diapositivas) || [];
    if (!r.ok || !diapos.length) { alert('Esta clase no tiene presentación.'); return; }
    const ctx = { titulo: it.titulo, fecha: it.fechaLimite, hora: it.hora, guion: it.guion, teoria: it.teoria, tips: it.tips };
    const slides = diapos.map(d => slideHtml(d, ctx));
    let i = 0;
    const deck = document.createElement('div');
    deck.className = 'deck';
    deck.innerHTML = '<div class="deck-stage" id="deck-stage"></div><div class="deck-bar">' +
      '<button data-deck="prev" title="Anterior (←)">←</button><button data-deck="next" title="Siguiente (→)">→</button>' +
      '<span id="deck-count"></span><div class="deck-progress"><span id="deck-prog"></span></div>' +
      '<button data-deck="full" title="Pantalla completa (F)">⛶</button><button data-deck="exit" title="Salir (Esc)">✕ Salir</button></div>';
    document.body.appendChild(deck);
    const show = () => {
      document.getElementById('deck-stage').innerHTML = slides[i];
      document.getElementById('deck-count').textContent = (i + 1) + ' / ' + slides.length;
      document.getElementById('deck-prog').style.width = ((i + 1) * 100 / slides.length) + '%';
      ensureQr(document.getElementById('deck-qr'));
    };
    const go = (n) => { i = Math.max(0, Math.min(slides.length - 1, n)); show(); };
    const salir = () => { document.removeEventListener('keydown', onKey); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); deck.remove(); };
    const full = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else deck.requestFullscreen && deck.requestFullscreen().catch(() => {}); };
    function onKey(e) {
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(i + 1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(i - 1); }
      else if (e.key === 'Home') go(0);
      else if (e.key === 'End') go(slides.length - 1);
      else if (e.key === 'f' || e.key === 'F') full();
      else if (e.key === 'Escape' && !document.fullscreenElement) salir();
    }
    document.addEventListener('keydown', onKey);
    deck.addEventListener('click', (e) => {
      const b = e.target.closest('[data-deck]');
      if (b) { const a = b.dataset.deck; if (a === 'prev') go(i - 1); if (a === 'next') go(i + 1); if (a === 'full') full(); if (a === 'exit') salir(); return; }
      if (e.target.closest('.slide')) go(i + 1);
    });
    show();
  }

  contentEl.addEventListener('submit', (e) => { if (e.target.id === 'alta-alumno') { e.preventDefault(); altaAlumno(e.target); } });
  contentEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const act = b.dataset.action;
    if (act === 'filtrar') { const board = b.closest('.board'); aplicarFiltro(board, b.getAttribute('aria-pressed') === 'true' ? null : b.dataset.grupo); }
    if (act === 'ver-todo') aplicarFiltro(b.closest('.board'), null);
    if (act === 'marcar') { e.preventDefault(); marcarTarea(b); }
    if (act === 'quitar-alumno') { e.preventDefault(); quitarAlumno(b); }
    if (act === 'tts') { e.preventDefault(); hablar(b.dataset.texto, !!b.dataset.lento); }
    if (act === 'grabar') { e.preventDefault(); grabarPron(b); }
    if (act === 'auto') { e.preventDefault(); const q = b.closest('.q'); const okv = b.dataset.valor === 'auto:ok'; ponerRespuestaPron(q, b.dataset.valor, okv ? '✔ Marcaste que te salió bien' : '↺ Marcaste que necesitas repetir', okv); }
    if (act === 'abrir-item') { e.preventDefault(); openItem(b.dataset.id); }
    if (act === 'ver-resultado') {
      const it = ((state.act && state.act.items) || []).find(x => x.id === b.dataset.id);
      if (it && it.mejor) showResult(it.mejor, { titulo: it.titulo + ' · mejor intento (' + it.intentosUsados + '/' + it.intentosMax + ')' });
    }
    if (act === 'abrir-guion') { e.preventDefault(); openGuion(b.dataset.id); }
    if (act === 'presentar') { e.preventDefault(); openPresentacion(b.dataset.id); }
    if (act === 'volver') { e.preventDefault(); render(state.data); window.scrollTo(0, 0); }
  });
  contentEl.addEventListener('change', (e) => { const f = e.target.closest('#exam-form'); if (f) updateExamProgress(f); });
  contentEl.addEventListener('input', (e) => { const f = e.target.closest('#exam-form'); if (f && e.target.classList.contains('q-text')) updateExamProgress(f); });
  contentEl.addEventListener('submit', (e) => { const f = e.target.closest('#exam-form'); if (f) { e.preventDefault(); submitExam(f); } });

  async function loadProfe(email) {
    const r = await fetchJson(ACT_URL + '?email=' + encodeURIComponent(email));
    if (!r.ok) {
      loginError.textContent = r.status === 403 ? 'Esta ruta es solo para el profe. Entra con el correo de administrador.' : '⚠️ No se pudo cargar (' + (r.body.error || r.status) + ').';
      loginError.style.display = 'block'; loginEl.style.display = 'block'; appEl.style.display = 'none';
      return;
    }
    localStorage.setItem(STORAGE_KEY, email);
    loginEl.style.display = 'none'; appEl.style.display = 'block';
    state.act = r.body; state.data = { isAdmin: false, rows: [] };
    render(state.data);
  }

  // Tarjeta "Lo de tu grupo": actividades del grupo que el profe resuelve antes (openspec: profe-actividades-grupo).
  function renderGrupoProfe(act) {
    const lista = ((act && act.items) || []).filter(it => it.grupo);
    if (!lista.length) return '';
    const hoy = todayStr();
    const pendientes = lista.filter(it => it.estado !== 'completo'), hechas = lista.filter(it => it.estado === 'completo');
    const fila = it => {
      const atraso = it.estado !== 'completo' && it.fechaLimite < hoy;
      let sub = 'Para ti: ' + escapeHtml(formatFecha(it.fechaLimite)) + ' · ' + tipoTexto(it.tipo) + ' · ' + (it.intentosUsados || 0) + '/' + it.intentosMax + ' intento(s)';
      if (atraso) sub += ' · <span class="pill" style="background:var(--overdue-bg);color:var(--overdue)">⏰ En atraso</span>';
      if (it.mejor) sub += ' · <span class="pill ok">⭐ ' + it.mejor.porcentaje + '%</span>';
      return '<div class="exam-item"><div><div class="t">' + icono(it.tipo) + ' ' + escapeHtml(it.titulo) + '</div><div class="s">' + sub + '</div></div>' + accionItem(it, it.estado) + '</div>';
    };
    return '<div class="exam-card" id="grupo-profe"><h3>📚 Lo de tu grupo · resuélvelo antes que ellos (' + pendientes.length + ' pendiente' + (pendientes.length === 1 ? '' : 's') + ')</h3>' +
      pendientes.map(fila).join('') + (hechas.length ? '<div class="s" style="font-size:.8rem;margin-top:6px">✅ Hechas: ' + hechas.length + '</div>' + hechas.map(fila).join('') : '') + '</div>';
  }

  // Tarjeta "Ruta del mes": semanas con objetivo, temas, Busuu, rutina y resultados.
  function renderPlanProfe(act) {
    const plan = act && act.plan;
    if (!plan) return '';
    const items = new Map(((act && act.items) || []).map(it => [it.id, it]));
    const actual = act.semana && act.semana.id;
    const estadoDe = id => {
      const it = items.get(id);
      if (!it) return '<span class="pill wait">🔒 abre su lunes</span>';
      if (it.mejor) return '<span class="pill ok">⭐ ' + it.mejor.porcentaje + '%</span>';
      if (it.estado === 'proximamente') return '<span class="pill wait">🔒 ' + escapeHtml(formatFecha(it.disponibleDesde)) + '</span>';
      return '<span class="pill">pendiente</span>';
    };
    const semanas = (plan.semanas || []).map(s => {
      const elementos = (s.elementos || []).map(e => '<li>' + icono(e.tipo) + ' ' + escapeHtml(e.titulo) + ' · <span class="meta">' + escapeHtml(formatFecha(e.fecha)) + '</span> · ' + estadoDe(e.id) + '</li>').join('');
      return '<div class="ruta-sem' + (s.id === actual ? ' actual' : '') + '"><div class="h">' + (s.id === actual ? '👉 ' : '') + escapeHtml(s.titulo) + '</div>' +
        '<div>' + escapeHtml(s.objetivo) + '</div>' +
        '<div class="chips">' + (s.temas || []).map(t => '<span class="chip neutra">' + escapeHtml(t) + '</span>').join('') + '</div>' +
        '<div class="meta">📗 ' + escapeHtml(s.busuu) + '</div><div class="meta">✍️ ' + escapeHtml(s.extra) + '</div>' +
        '<ul class="ruta-lista">' + elementos + '</ul></div>';
    }).join('');
    return '<details class="section" id="ruta-plan" open><summary><div class="section-head"><span><span class="chevron">▶</span>🗺️ ' + escapeHtml(plan.titulo) + '</span><span class="count">' + escapeHtml(plan.nivelActual + ' → ' + plan.meta) + '</span></div></summary><div class="ruta-body">' +
      '<div class="progress-text" style="margin:0 0 6px">' + escapeHtml(plan.subtitulo || '') + '</div>' +
      '<div class="progress-text">🎯 ' + escapeHtml(plan.horizonte || '') + '</div>' +
      '<div class="progress-text" style="margin-top:8px"><b>⏱️ ' + escapeHtml(plan.horasSemana || '') + '</b></div><div class="ruta-reparto">' + (plan.reparto || []).map(x => '<span>' + escapeHtml(x.que) + '</span><span>' + escapeHtml(x.tiempo) + '</span>').join('') + '</div>' +
      '<details class="section"><summary><div class="section-head"><span><span class="chevron">▶</span>☀️ Rutina diaria y reglas</span></div></summary><div class="scroll"><ul class="ruta-lista">' +
        (plan.rutinaDiaria || []).map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul><ul class="ruta-lista" style="margin-top:8px">' + (plan.reglas || []).map(x => '<li>' + escapeHtml(x) + '</li>').join('') + '</ul></div></details>' +
      semanas + '</div></details>';
  }

  async function loadFor(email) {
    contentEl.innerHTML = '<div class="loading">Cargando…</div>';
    loginError.style.display = 'none';
    try {
      // Tablero y exámenes en paralelo para no sumar las dos esperas.
      state.email = email;
      if (MODO_PROFE) return await loadProfe(email);
      const actividadesP = loadActividades();
      const res = await fetch(DATA_URL_BASE + '?email=' + encodeURIComponent(email), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

      if (!data.isAdmin && (!data.rows || data.rows.length === 0)) {
        loginError.textContent = 'No encontré clases asociadas a ese correo.';
        loginError.style.display = 'block';
        localStorage.removeItem(STORAGE_KEY);
        loginEl.style.display = 'block';
        appEl.style.display = 'none';
        return;
      }

      localStorage.setItem(STORAGE_KEY, email);
      loginEl.style.display = 'none';
      appEl.style.display = 'block';
      state.data = data;
      await actividadesP;
      if (data.isAdmin) await Promise.all([loadJuegosAdmin(), loadAlumnosAdmin()]);
      render(data);
      if (state.altaAviso) { const m = document.getElementById('alta-msg'); if (m) m.innerHTML = '<div class="progress-text">' + escapeHtml(state.altaAviso) + '</div>'; state.altaAviso = null; }
    } catch (e) {
      loginError.textContent = '⚠️ ' + e.message;
      loginError.style.display = 'block';
    }
  }

  loginBtn.addEventListener('click', () => {
    const email = emailInput.value.trim().toLowerCase();
    if (!email) return;
    loadFor(email);
  });
  emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

  logoutBtn.addEventListener('click', () => {
    SESSION_KEYS.forEach(k => localStorage.removeItem(k));
    appEl.style.display = 'none';
    loginEl.style.display = 'block';
    emailInput.value = '';
  });

  const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('stald_email');
  if (saved) {
    emailInput.value = saved;
    loadFor(saved);
  }
</script>
