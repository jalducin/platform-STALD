<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clases de Inglés</title>
<style>
  :root {
    --bg: #faf9f7; --card-bg: #ffffff; --text: #1c1917; --text-muted: #78716c; --border: #e7e5e4;
    --accent: #4f46e5; --chip: #eef2ff; --green: #16a34a; --green-bg: #f0fdf4;
    --overdue: #dc2626; --overdue-bg: #fef2f2; --today: #b45309; --today-bg: #fffbeb;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18181b; --card-bg: #27272a; --text: #f4f4f5; --text-muted: #a1a1aa; --border: #3f3f46;
      --chip: #312e81; --green-bg: #052e16; --overdue-bg: #3b1414; --today-bg: #3a2a08;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    max-width: 720px; margin: 0 auto;
  }
  h1 { font-size: 1.15rem; margin: 0 0 2px; }
  .subtitle { color: var(--text-muted); font-size: .8rem; margin-bottom: 18px; }
  .login-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 24px; }
  .login-box label { font-size: .82rem; font-weight: 600; display: block; margin-bottom: 6px; }
  .login-box input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: .95rem; margin-bottom: 12px; }
  .login-box button, .top-bar button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: .88rem; font-weight: 600; cursor: pointer; width: 100%; }
  .login-error { color: #dc2626; font-size: .8rem; margin-top: 8px; display: none; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
  .top-bar .who { font-size: .82rem; color: var(--text-muted); }
  .top-bar button { width: auto; padding: 6px 12px; font-size: .78rem; background: var(--border); color: var(--text); }
  .admin-tag { background: var(--accent); color: #fff; font-size: .65rem; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; text-transform: uppercase; }
  /* Contadores y progreso */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 4px; text-align: center; }
  .stat .num { font-size: 1.35rem; font-weight: 800; line-height: 1; }
  .stat .label { font-size: .62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
  .stat.done .num { color: var(--green); }
  .stat.overdue .num { color: var(--overdue); }
  .stat.today .num { color: var(--today); }
  .stat.upcoming .num { color: var(--accent); }
  .progress-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin: 2px 0 4px; }
  .progress-bar span { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .4s ease; }
  .progress-text { font-size: .72rem; color: var(--text-muted); margin-bottom: 14px; }

  /* Secciones con scroll interno */
  .section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .section-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .section-head .count { background: var(--chip); color: var(--accent); border-radius: 99px; padding: 2px 8px; font-size: .7rem; }
  .scroll { max-height: 340px; overflow-y: auto; padding: 8px; scroll-behavior: smooth; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  details.section > summary { list-style: none; cursor: pointer; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary .section-head { border-bottom: none; }
  details.section[open] > summary .section-head { border-bottom: 1px solid var(--border); }
  .chevron { transition: transform .2s ease; display: inline-block; margin-right: 4px; }
  details[open] > summary .chevron { transform: rotate(90deg); }

  /* Filas */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .row.done { border-left: 4px solid var(--green); }
  .row.overdue { border-left: 4px solid var(--overdue); background: var(--overdue-bg); }
  .row.today { border-left: 4px solid var(--today); background: var(--today-bg); }
  .row.upcoming, .row.nodate { border-left: 4px solid var(--accent); }
  .badge { font-size: .68rem; font-weight: 700; padding: 4px 8px; border-radius: 99px; white-space: nowrap; flex-shrink: 0; min-width: 64px; text-align: center; }
  .badge.done { background: var(--green); color: #fff; }
  .badge.overdue { background: var(--overdue); color: #fff; }
  .badge.today { background: var(--today); color: #fff; }
  .badge.upcoming, .badge.nodate { background: var(--chip); color: var(--accent); }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-weight: 600; font-size: .88rem; overflow-wrap: anywhere; }
  .meta .row2 { font-size: .74rem; color: var(--text-muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .meta .fecha { font-weight: 600; color: var(--text); }
  .grade { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: .7rem; }
  .level { background: var(--chip); color: var(--accent); border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: .66rem; }
  .meta .who { font-size: .72rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
  a.link { color: var(--accent); text-decoration: none; font-size: .74rem; font-weight: 600; flex-shrink: 0; }
  .empty, .error, .loading { text-align: center; color: var(--text-muted); padding: 18px 12px; font-size: .85rem; }
  .error { color: #dc2626; }

  /* Admin: un bloque plegable por alumno */
  .student { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; background: var(--card-bg); }
  .student > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: .92rem; display: flex; justify-content: space-between; gap: 8px; align-items: center; list-style: none; }
  .student > summary::-webkit-details-marker { display: none; }
  .student > summary .mini { font-weight: 600; font-size: .72rem; color: var(--text-muted); display: flex; gap: 8px; }
  .student > summary .mini .o { color: var(--overdue); }
  .student > summary .mini .t { color: var(--today); }
  .student .student-body { padding: 0 10px 10px; }
  .student .section { background: var(--bg); }
  .student > summary .mini .g { color: var(--green); }

  /* Exámenes */
  .exam-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .exam-card h3 { margin: 0 0 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
  .exam-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .exam-item:first-of-type { border-top: none; }
  .exam-item .t { font-weight: 700; font-size: .9rem; }
  .exam-item .s { font-size: .74rem; color: var(--text-muted); margin-top: 2px; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: .82rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .pill { font-size: .72rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
  .pill.wait { background: var(--chip); color: var(--accent); }
  .pill.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .q { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .q .n { font-size: .68rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .q .e { font-weight: 700; margin: 4px 0 8px; font-size: .92rem; }
  .q label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-top: 6px; cursor: pointer; font-size: .88rem; }
  .q label:has(input:checked) { border-color: var(--accent); background: var(--chip); }
  .q.answered { border-left: 4px solid var(--accent); }
  .exam-sec { font-size: .78rem; font-weight: 800; color: var(--accent); margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .exam-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .score { text-align: center; padding: 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; }
  .score .big { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .score .lvl { font-weight: 700; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { font-size: .74rem; font-weight: 700; border-radius: 99px; padding: 3px 9px; }
  .chip.fortaleza { background: var(--green-bg); color: var(--green); }
  .chip.en-progreso { background: var(--today-bg); color: var(--today); }
  .chip.debilidad { background: var(--overdue-bg); color: var(--overdue); }
  .topic { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .topic .h { display: flex; justify-content: space-between; font-weight: 700; font-size: .86rem; }
  .topic .bar { height: 6px; background: var(--border); border-radius: 99px; margin: 6px 0; overflow: hidden; }
  .topic .bar span { display: block; height: 100%; border-radius: 99px; }
  .topic.fortaleza .bar span { background: var(--green); }
  .topic.en-progreso .bar span { background: var(--today); }
  .topic.debilidad .bar span { background: var(--overdue); }
  .topic .r { font-size: .78rem; color: var(--text-muted); }
  .rev { font-size: .8rem; padding: 8px 0; border-top: 1px solid var(--border); }
  .rev .bad { color: var(--overdue); } .rev .good { color: var(--green); font-weight: 700; }
  .rev .why { color: var(--text-muted); margin-top: 2px; }
  #app { display: none; }
</style>
</head>
<body>
  <h1>📗 Clases de Inglés</h1>
  <div class="subtitle">Progreso por alumno, actualizado desde Notion</div>

  <div id="login" class="login-box">
    <label for="email-input">Tu correo</label>
    <input id="email-input" type="email" placeholder="tucorreo@gmail.com" autocomplete="email">
    <button id="login-btn">Entrar</button>
    <div class="login-error" id="login-error">No encontré clases asociadas a ese correo.</div>
  </div>

  <div id="app">
    <div class="top-bar">
      <div class="who" id="who-label"></div>
      <button id="logout-btn">Cerrar sesión</button>
    </div>
    <div id="content"><div class="loading">Cargando…</div></div>
  </div>

<script>
  const DATA_URL_BASE = 'https://xozsrcnjnugwbrrrwoeb.supabase.co/functions/v1/tareas-estudio-secundaria/ingles/data';
  const STORAGE_KEY = 'ingles_email';

  const loginEl = document.getElementById('login');
  const appEl = document.getElementById('app');
  const emailInput = document.getElementById('email-input');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const whoLabel = document.getElementById('who-label');
  const logoutBtn = document.getElementById('logout-btn');
  const contentEl = document.getElementById('content');

  function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Días que cuentan como "realizadas recientes": hoy y los 2 anteriores.
  const RECENT_DAYS = 3;

  function fmtDate(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function todayStr() { return fmtDate(new Date()); }
  function daysAgoStr(n) { const d = new Date(); d.setDate(d.getDate() - n); return fmtDate(d); }
  function diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
  // Fecha local (AAAA-MM-DD) de la última edición; se usa como fecha de realización.
  function localDateOf(iso) { if (!iso) return null; const d = new Date(iso); return isNaN(d) ? null : fmtDate(d); }

  function formatFecha(fecha) {
    try { return new Date(fecha + 'T00:00:00').toLocaleDateString('es-MX', {weekday:'short', day:'numeric', month:'short'}); }
    catch (e) { return fecha; }
  }

  // Estado de cada clase respecto a hoy.
  function classify(r, today) {
    if (r.completado) {
      const hecho = localDateOf(r.editadoEn);
      return { status: 'done', hecho, recent: !!hecho && hecho >= daysAgoStr(RECENT_DAYS - 1) };
    }
    if (!r.fecha) return { status: 'nodate' };
    if (r.fecha < today) return { status: 'overdue', diff: diffDays(r.fecha, today) };
    if (r.fecha === today) return { status: 'today' };
    return { status: 'upcoming', diff: diffDays(today, r.fecha) };
  }

  function badgeText(c) {
    if (c.status === 'done') return '✅ Hecho';
    if (c.status === 'overdue') return c.diff + 'd atraso';
    if (c.status === 'today') return '📌 Hoy';
    if (c.status === 'upcoming') return 'en ' + c.diff + 'd';
    return 'Sin fecha';
  }

  function renderRow(r, isAdmin) {
    const c = r._c;
    const parts = [];
    if (r.fecha) parts.push('<span class="fecha">📅 ' + escapeHtml(formatFecha(r.fecha)) + '</span>');
    if (c.status === 'done' && c.hecho) parts.push('<span>hecho ' + escapeHtml(formatFecha(c.hecho)) + '</span>');
    if (r.dificultad) parts.push('<span class="level">' + escapeHtml(r.dificultad) + '</span>');
    if (r.label) parts.push('<span>' + escapeHtml(r.label) + '</span>');
    if (r.calificacion) parts.push('<span class="grade">⭐ ' + escapeHtml(r.calificacion) + '</span>');
    let whoStr = '';
    if (isAdmin) {
      const who = (r.userNames && r.userNames.length) ? r.userNames.join(', ') : 'Usuario sin asignar en Notion';
      whoStr = '<div class="who">👤 ' + escapeHtml(who) + '</div>';
    }
    return '<div class="row ' + c.status + '">' +
      '<span class="badge ' + c.status + '">' + badgeText(c) + '</span>' +
      '<div class="meta">' +
        '<div class="name">' + escapeHtml(r.name) + '</div>' +
        '<div class="row2">' + parts.join('') + '</div>' +
        whoStr +
      '</div>' +
      rowAction(r) +
    '</div>';
  }

  function rowAction(r) {
    if (r._examen) {
      if (r._estado === 'resuelto' && !isAdminView()) return '<button class="btn ghost" data-action="ver-resultado" data-id="' + escapeHtml(r._examen) + '">Ver resultado</button>';
      if (r._estado === 'disponible' && !isAdminView()) return '<button class="btn" data-action="abrir-examen" data-id="' + escapeHtml(r._examen) + '">Resolver</button>';
      return '';
    }
    return r.url ? '<a class="link" href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">Abrir ↗</a>' : '';
  }

  // Agrupa en el orden pedido: realizadas recientes, atrasadas, hoy, próximas, y lo demás plegado.
  function buildGroups(rows) {
    const today = todayStr();
    rows.forEach(r => { r._c = classify(r, today); });
    const byFecha = (a, b) => (a.fecha || '').localeCompare(b.fecha || '');
    const byHechoDesc = (a, b) => (b._c.hecho || '').localeCompare(a._c.hecho || '');
    const done = rows.filter(r => r._c.status === 'done');
    return {
      recent: done.filter(r => r._c.recent).sort(byHechoDesc),
      overdue: rows.filter(r => r._c.status === 'overdue').sort(byFecha),
      today: rows.filter(r => r._c.status === 'today').sort(byFecha),
      upcoming: rows.filter(r => r._c.status === 'upcoming').sort(byFecha),
      older: done.filter(r => !r._c.recent).sort(byHechoDesc),
      nodate: rows.filter(r => r._c.status === 'nodate'),
      // Los exámenes aparecen en las secciones pero no cuentan en el total de actividades.
      total: rows.filter(r => !r._examen).length,
      completed: done.filter(r => !r._examen).length,
    };
  }

  function section(title, items, isAdmin, opts) {
    const o = opts || {};
    if (!items.length && o.hideEmpty) return '';
    const body = items.length
      ? '<div class="scroll"><div class="list">' + items.map(r => renderRow(r, isAdmin)).join('') + '</div></div>'
      : '<div class="empty">' + escapeHtml(o.empty || 'Nada por aquí.') + '</div>';
    const head = '<div class="section-head"><span>' + (o.collapsible ? '<span class="chevron">▶</span>' : '') + escapeHtml(title) + '</span><span class="count">' + items.length + '</span></div>';
    return o.collapsible
      ? '<details class="section"><summary>' + head + '</summary>' + body + '</details>'
      : '<div class="section">' + head + body + '</div>';
  }

  function renderStats(g) {
    const pct = g.total ? Math.round(g.completed * 100 / g.total) : 0;
    return '<div class="stats">' +
        '<div class="stat done"><div class="num">' + g.recent.length + '</div><div class="label">Hechas 3 días</div></div>' +
        '<div class="stat overdue"><div class="num">' + g.overdue.length + '</div><div class="label">Atrasadas</div></div>' +
        '<div class="stat today"><div class="num">' + g.today.length + '</div><div class="label">Hoy</div></div>' +
        '<div class="stat upcoming"><div class="num">' + g.upcoming.length + '</div><div class="label">Próximas</div></div>' +
      '</div>' +
      '<div class="progress-bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="progress-text">' + g.completed + '/' + g.total + ' completadas (' + pct + '%)</div>';
  }

  function renderBoard(rows, isAdmin) {
    const g = buildGroups(rows);
    return renderStats(g) +
      section('✅ Realizadas · últimos 3 días', g.recent, isAdmin, { empty: 'Aún no hay entregas en los últimos 3 días.' }) +
      section('⏰ Atrasadas', g.overdue, isAdmin, { empty: '¡Nada atrasado! 🎉' }) +
      section('📌 Hoy', g.today, isAdmin, { empty: 'No hay entrega para hoy.' }) +
      section('📅 Próximas', g.upcoming, isAdmin, { empty: 'No hay entregas próximas.' }) +
      section('✔️ Realizadas anteriores', g.older, isAdmin, { collapsible: true, hideEmpty: true }) +
      section('🗒️ Sin fecha', g.nodate, isAdmin, { collapsible: true, hideEmpty: true });
  }

  function render(data) {
    const rows = data.rows || [];
    whoLabel.textContent = data.isAdmin ? 'Modo maestro — viendo todo' : 'Tu progreso';
    if (data.isAdmin) {
      const tag = document.createElement('span');
      tag.className = 'admin-tag';
      tag.textContent = 'Admin';
      whoLabel.appendChild(tag);
    }

    const clases = rows.filter(r => r.source === 'clases_ingles');
    if (!clases.length) {
      contentEl.innerHTML = '<div class="empty">No hay clases registradas todavía.</div>';
      return;
    }

    if (!data.isAdmin) {
      contentEl.innerHTML = renderExamCard(state.examenes) + renderBoard(clases.concat(examRowsAlumno(state.examenes)), false);
      return;
    }

    // Admin: un bloque plegable por alumno (campo "Nombre" de Notion) con el mismo tablero dentro.
    const groups = new Map();
    clases.forEach(r => {
      const key = r.alumno || 'Sin alumno';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });
    const diag = (state.examenes && state.examenes.examenes && state.examenes.examenes[0]) || null;
    const porAlumno = new Map(((diag && diag.resultados) || []).map(r => [r.alumno, r]));
    const names = Array.from(groups.keys()).sort((a, b) => a.localeCompare(b, 'es'));
    contentEl.innerHTML = renderAdminExams(diag) + names.map(name => {
      const list = groups.get(name);
      const g = buildGroups(list);
      const ultima = lastGraded(list);
      const res = porAlumno.get(name);
      return '<details class="student">' +
        '<summary><span>👤 ' + escapeHtml(name) + '</span>' +
          '<span class="mini"><span>' + g.completed + '/' + g.total + '</span>' +
          '<span class="o">⏰ ' + g.overdue.length + '</span><span class="t">📌 ' + g.today.length + '</span>' +
          '<span class="g" title="Última actividad calificada">⭐ ' + escapeHtml(ultima ? ultima.calificacion : '—') + '</span>' +
          '<span title="Diagnóstico">📝 ' + (res ? res.porcentaje + '%' : 'pendiente') + '</span></span></summary>' +
        '<div class="student-body">' +
          (ultima ? '<div class="progress-text">⭐ Última actividad calificada: <b>' + escapeHtml(ultima.calificacion) + '</b> · ' + escapeHtml(ultima.name) + (ultima._c && ultima._c.hecho ? ' · ' + escapeHtml(formatFecha(ultima._c.hecho)) : '') + '</div>' : '') +
          (res ? '<details class="section"><summary><div class="section-head"><span><span class="chevron">▶</span>📝 ' + escapeHtml(diag.titulo) + ' · ' + res.porcentaje + '%</span><span class="count">' + escapeHtml(res.nivelSugerido) + '</span></div></summary><div class="scroll">' + renderResultado(res, true) + '</div></details>' : '') +
          renderBoard(list.concat(examRowAdmin(diag, res)), true) +
        '</div>' +
      '</details>';
    }).join('');
  }

  // ---------- Exámenes ----------
  const EXAMS_URL = DATA_URL_BASE.replace(/\/data$/, '/examenes');
  const state = { email: null, data: null, examenes: null };

  function isAdminView() { return !!(state.data && state.data.isAdmin); }

  // El examen como una actividad más del tablero (fecha = disponibleDesde).
  function examRow(e, estado, resultado) {
    return {
      _examen: e.id, _estado: estado, source: 'examen',
      name: '📝 ' + e.titulo,
      label: 'Examen · ' + e.total + ' preguntas',
      dificultad: e.nivel,
      fecha: e.disponibleDesde,
      completado: estado === 'resuelto',
      calificacion: resultado ? resultado.porcentaje + '%' : null,
      editadoEn: resultado ? resultado.enviadoEn : null,
      userNames: [],
    };
  }
  function examRowsAlumno(ex) {
    return ((ex && ex.examenes) || []).map(e => examRow(e, e.estado, e.resultado));
  }
  function examRowAdmin(diag, res) {
    return diag ? [examRow(diag, res ? 'resuelto' : (diag.disponible ? 'disponible' : 'proximamente'), res)] : [];
  }

  // Última actividad completada con calificación (la de edición más reciente).
  function lastGraded(rows) {
    return rows.filter(r => r.completado && r.calificacion && !r._examen)
      .sort((a, b) => String(b.editadoEn || '').localeCompare(String(a.editadoEn || '')))[0] || null;
  }

  function renderExamCard(ex) {
    const lista = (ex && ex.examenes) || [];
    if (!lista.length) return '';
    return '<div class="exam-card"><h3>📝 Exámenes</h3>' + lista.map(e => {
      let right = '', sub = e.total + ' preguntas · nivel ' + escapeHtml(e.nivel);
      if (e.estado === 'resuelto' && e.resultado) {
        right = '<button class="btn ghost" data-action="ver-resultado" data-id="' + escapeHtml(e.id) + '">Ver resultado</button>';
        sub = '<span class="pill ok">' + e.resultado.porcentaje + '% · ' + escapeHtml(e.resultado.nivelSugerido) + '</span>';
      } else if (e.estado === 'disponible') {
        right = '<button class="btn" data-action="abrir-examen" data-id="' + escapeHtml(e.id) + '">Resolver</button>';
      } else {
        right = '<span class="pill wait">Disponible el ' + escapeHtml(formatFecha(e.disponibleDesde)) + '</span>';
      }
      return '<div class="exam-item"><div><div class="t">' + escapeHtml(e.titulo) + '</div><div class="s">' + sub + '</div></div>' + right + '</div>';
    }).join('') + '</div>';
  }

  function renderAdminExams(diag) {
    if (!diag) return '';
    const n = (diag.resultados || []).length;
    return '<div class="exam-card"><h3>📝 Exámenes</h3><div class="exam-item"><div><div class="t">' + escapeHtml(diag.titulo) + '</div>' +
      '<div class="s">' + n + ' resuelto(s) · abre ' + escapeHtml(formatFecha(diag.disponibleDesde)) + '</div></div>' +
      '<button class="btn ghost" data-action="abrir-examen" data-id="' + escapeHtml(diag.id) + '">👁 Vista previa</button></div></div>';
  }

  function renderResultado(r, compacto) {
    const chips = (arr, cls) => arr.map(t => '<span class="chip ' + cls + '">' + escapeHtml(t) + '</span>').join('');
    let html = '';
    if (!compacto) {
      html += '<div class="score"><div class="big">' + r.porcentaje + '%</div>' +
        '<div class="progress-text" style="margin:4px 0 0">' + r.correctas + ' de ' + r.total + ' correctas</div>' +
        '<div class="lvl">' + escapeHtml(r.nivelSugerido) + '</div></div>';
    }
    if (r.fortalezas.length) html += '<div class="progress-text" style="margin:0">💪 Fortalezas</div><div class="chips">' + chips(r.fortalezas, 'fortaleza') + '</div>';
    if (r.enProgreso.length) html += '<div class="progress-text" style="margin:0">📈 En progreso</div><div class="chips">' + chips(r.enProgreso, 'en-progreso') + '</div>';
    if (r.debilidades.length) html += '<div class="progress-text" style="margin:0">🎯 A reforzar</div><div class="chips">' + chips(r.debilidades, 'debilidad') + '</div>';
    html += r.secciones.map(s =>
      '<div class="topic ' + s.estado + '"><div class="h"><span>' + escapeHtml(s.titulo) + '</span><span>' + s.correctas + '/' + s.total + ' · ' + s.porcentaje + '%</span></div>' +
      '<div class="bar"><span style="width:' + s.porcentaje + '%"></span></div><div class="r">' + escapeHtml(s.retroalimentacion) + '</div></div>'
    ).join('');
    if (r.revision && r.revision.length) {
      html += '<details class="section"' + (compacto ? '' : ' open') + '><summary><div class="section-head"><span><span class="chevron">▶</span>🔍 Revisa tus errores</span><span class="count">' + r.revision.length + '</span></div></summary><div class="scroll">' +
        r.revision.map(x => '<div class="rev"><div><b>' + escapeHtml(x.enunciado) + '</b></div>' +
          '<div class="bad">✗ ' + (x.tuRespuesta === null ? 'Sin responder' : escapeHtml(x.tuRespuesta)) + '</div>' +
          '<div class="good">✓ ' + escapeHtml(x.correcta) + '</div><div class="why">' + escapeHtml(x.explicacion) + '</div></div>').join('') +
        '</div></details>';
    } else {
      html += '<div class="empty">¡Sin errores! 🎉</div>';
    }
    return html;
  }

  async function fetchJson(url, opts) {
    const res = await fetch(url, Object.assign({ cache: 'no-store' }, opts || {}));
    const body = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, body };
  }

  async function loadExamenes() {
    try {
      const r = await fetchJson(EXAMS_URL + '?email=' + encodeURIComponent(state.email));
      state.examenes = r.ok ? r.body : null;
    } catch (e) { state.examenes = null; }
  }

  function volverBtn() { return '<button class="btn ghost" data-action="volver">← Volver</button>'; }

  async function openExam(id) {
    contentEl.innerHTML = '<div class="loading">Cargando examen…</div>';
    const r = await fetchJson(EXAMS_URL + '/' + encodeURIComponent(id) + '?email=' + encodeURIComponent(state.email));
    if (r.status === 409 && r.body.resultado) return showResult(r.body.resultado, false);
    if (!r.ok) {
      const msg = r.body.error === 'no_disponible' ? 'Este examen se abre el ' + formatFecha(r.body.disponibleDesde) + '.' : 'No se pudo abrir el examen (' + (r.body.error || r.status) + ').';
      contentEl.innerHTML = '<div class="exam-card"><div class="empty">' + escapeHtml(msg) + '</div>' + volverBtn() + '</div>';
      return;
    }
    const ex = r.body;
    const titulos = new Map(ex.secciones.map(s => [s.id, s.titulo]));
    let lastSec = null, n = 0;
    const qs = ex.preguntas.map(p => {
      n++;
      const head = p.seccion !== lastSec ? '<div class="exam-sec">' + escapeHtml(titulos.get(p.seccion) || p.seccion) + '</div>' : '';
      lastSec = p.seccion;
      return head + '<div class="q" data-q="' + escapeHtml(p.id) + '"><div class="n">Pregunta ' + n + ' de ' + ex.total + '</div>' +
        '<div class="e">' + escapeHtml(p.enunciado) + '</div>' +
        p.opciones.map((o, i) => '<label><input type="radio" name="' + escapeHtml(p.id) + '" value="' + i + '"> ' + escapeHtml(o) + '</label>').join('') + '</div>';
    }).join('');
    contentEl.innerHTML =
      '<div class="exam-card"><h3>📝 ' + escapeHtml(ex.titulo) + (ex.vistaPrevia ? ' · vista previa (no se guarda)' : '') + '</h3>' +
      '<div class="s" style="font-size:.82rem">' + escapeHtml(ex.descripcion || '') + '</div></div>' +
      '<form id="exam-form" data-id="' + escapeHtml(ex.id) + '" data-total="' + ex.total + '">' + qs +
      '<div class="exam-bar">' + volverBtn() + '<span class="progress-text" id="exam-count" style="margin:0">0/' + ex.total + ' respondidas</span>' +
      '<button class="btn" type="submit" id="exam-send" disabled>Enviar</button></div></form>';
    window.scrollTo(0, 0);
  }

  function examAnswers(form) {
    const out = {};
    new FormData(form).forEach((v, k) => { out[k] = Number(v); });
    return out;
  }

  function updateExamProgress(form) {
    const total = Number(form.dataset.total);
    const answers = examAnswers(form);
    const count = Object.keys(answers).length;
    form.querySelectorAll('.q').forEach(q => q.classList.toggle('answered', q.dataset.q in answers));
    document.getElementById('exam-count').textContent = count + '/' + total + ' respondidas' + (count < total ? ' · faltan ' + (total - count) : '');
    document.getElementById('exam-send').disabled = count < total;
  }

  async function submitExam(form) {
    if (!confirm('¿Enviar tus respuestas? Solo tienes un intento.')) return;
    const btn = document.getElementById('exam-send');
    btn.disabled = true; btn.textContent = 'Enviando…';
    const r = await fetchJson(EXAMS_URL + '/' + encodeURIComponent(form.dataset.id) + '?email=' + encodeURIComponent(state.email), {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ respuestas: examAnswers(form) }),
    });
    if (r.ok || (r.status === 409 && r.body.resultado)) {
      await loadExamenes();
      return showResult(r.body.resultado, !r.body.guardado && r.status !== 409);
    }
    btn.disabled = false; btn.textContent = 'Enviar';
    alert('No se pudo enviar (' + (r.body.error || r.status) + '). Intenta de nuevo.');
  }

  function showResult(resultado, vistaPrevia) {
    contentEl.innerHTML = '<div class="exam-card"><h3>📝 Tu resultado' + (vistaPrevia ? ' · vista previa (no se guardó)' : '') + '</h3></div>' +
      renderResultado(resultado, false) + '<div class="exam-bar">' + volverBtn() + '<span></span></div>';
    window.scrollTo(0, 0);
  }

  contentEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const act = b.dataset.action;
    if (act === 'abrir-examen') { e.preventDefault(); openExam(b.dataset.id); }
    if (act === 'ver-resultado') {
      const ex = ((state.examenes && state.examenes.examenes) || []).find(x => x.id === b.dataset.id);
      if (ex && ex.resultado) showResult(ex.resultado, false);
    }
    if (act === 'volver') { e.preventDefault(); render(state.data); window.scrollTo(0, 0); }
  });
  contentEl.addEventListener('change', (e) => { const f = e.target.closest('#exam-form'); if (f) updateExamProgress(f); });
  contentEl.addEventListener('submit', (e) => { const f = e.target.closest('#exam-form'); if (f) { e.preventDefault(); submitExam(f); } });

  async function loadFor(email) {
    contentEl.innerHTML = '<div class="loading">Cargando…</div>';
    loginError.style.display = 'none';
    try {
      // Tablero y exámenes en paralelo para no sumar las dos esperas.
      state.email = email;
      const examenesP = loadExamenes();
      const res = await fetch(DATA_URL_BASE + '?email=' + encodeURIComponent(email), { cache: 'no-store' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));

      if (!data.isAdmin && (!data.rows || data.rows.length === 0)) {
        loginError.textContent = 'No encontré clases asociadas a ese correo.';
        loginError.style.display = 'block';
        localStorage.removeItem(STORAGE_KEY);
        loginEl.style.display = 'block';
        appEl.style.display = 'none';
        return;
      }

      localStorage.setItem(STORAGE_KEY, email);
      loginEl.style.display = 'none';
      appEl.style.display = 'block';
      state.data = data;
      await examenesP;
      render(data);
    } catch (e) {
      loginError.textContent = '⚠️ ' + e.message;
      loginError.style.display = 'block';
    }
  }

  loginBtn.addEventListener('click', () => {
    const email = emailInput.value.trim().toLowerCase();
    if (!email) return;
    loadFor(email);
  });
  emailInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    appEl.style.display = 'none';
    loginEl.style.display = 'block';
    emailInput.value = '';
  });

  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    emailInput.value = saved;
    loadFor(saved);
  }
</script>
</body>
</html>
