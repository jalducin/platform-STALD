<style>

<script>
/* Brigada Xalli — página del juego (openspec: brigada-xalli). Embebido en juegos.html (🕹️ Arcade): misiones con
   avance (la página de Juegos lo lee y guarda) y puntos de ranking por misión. Motor sin DOM: juegos/brigada-motor.js;
   misiones: juegos/brigada-misiones.js. Todo el arte son trazos de canvas propios y los sonidos, síntesis propia. */
'use strict';
const M = window.BrigadaMotor, MIS = window.BrigadaMisiones;
const Q = new URLSearchParams(location.search);
const EMBED = window.parent !== window, PRUEBA = Q.get('prueba') === '1';
const $ = id => document.getElementById(id);
const esc = s => String(s).replaceAll(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const leerLS = k => { try { return localStorage.getItem(k); } catch { return null; } };
const guardarLS = (k, v) => { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } };
const REDUCIR = matchMedia('(prefers-reduced-motion: reduce)').matches;
const apodo = n => (String(n || '').trim().split(/\s+/)[0] || '').slice(0, 8);
function enviar(m) {
  if (!EMBED) return;
  try { parent.postMessage({ juego: 'brigada', ...m }, location.origin); } catch { /* sin plataforma */ }
}

/* ================= Audio: síntesis propia + juegos/emocion.js en los momentos grandes ================= */
let AC = null, master = null, sonido = leerLS('arcade_sonido') !== '0';
function audio() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); }
    master.gain.value = sonido ? 0.8 : 0;
    if (AC.state === 'suspended' && !document.hidden) AC.resume();
  } catch { AC = null; }
}
let tonosCuadro = 0;
function tono(f, d, tipo = 'square', v = 0.05, hasta = 0, retraso = 0) {
  if (!AC || !sonido || tonosCuadro > 6) return;
  tonosCuadro++;
  const o = AC.createOscillator(), ga = AC.createGain(), s = AC.currentTime + retraso;
  o.type = tipo; o.frequency.setValueAtTime(f, s); if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, s + d);
  ga.gain.setValueAtTime(v, s); ga.gain.exponentialRampToValueAtTime(0.001, s + d);
  o.connect(ga); ga.connect(master); o.start(s); o.stop(s + d + 0.02);
}
const SON = {
  burbuja: () => tono(520, 0.07, 'sine', 0.035, 900),
  laser: () => tono(1400, 0.08, 'triangle', 0.025, 700),
  canon: () => tono(180, 0.18, 'square', 0.05, 70),
  salto: () => tono(330, 0.12, 'triangle', 0.04, 620),
  boom: () => { tono(140, 0.2, 'square', 0.05, 50); tono(900, 0.08, 'triangle', 0.02, 1500, 0.03); },
  globo: () => { tono(90, 0.3, 'sawtooth', 0.06, 40); [784, 988, 1175].forEach((f, i) => tono(f, 0.08, 'triangle', 0.03, 0, 0.05 + i * 0.05)); },
  rescate: () => [523, 659, 784, 1047].forEach((f, i) => tono(f, 0.14, 'triangle', 0.045, 0, i * 0.08)),
  objeto: () => { tono(880, 0.08, 'sine', 0.05); tono(1320, 0.12, 'sine', 0.04, 0, 0.06); },
  herido: () => tono(440, 0.25, 'square', 0.05, 160),
  bloqueo: () => tono(1800, 0.05, 'square', 0.02, 1200),
  checkpoint: () => [659, 880, 1175].forEach((f, i) => tono(f, 0.12, 'square', 0.035, 0, i * 0.09)),
  jefe: () => [220, 196, 220, 196].forEach((f, i) => tono(f, 0.22, 'sawtooth', 0.04, 0, i * 0.24)),
  revive: () => [392, 523, 659, 784].forEach((f, i) => tono(f, 0.1, 'sine', 0.05, 0, i * 0.06)),
};
function pintarSonido() { $('b-sonido').textContent = sonido ? '🔊' : '🔇'; $('b-sonido').setAttribute('aria-pressed', String(!sonido)); }
$('b-sonido').onclick = e => { sonido = !sonido; guardarLS('arcade_sonido', sonido ? '1' : '0'); audio(); window.Emocion?.silencio(!sonido); pintarSonido(); e.currentTarget.blur(); };
pintarSonido();
addEventListener('pointerdown', audio, { passive: true });
addEventListener('touchend', audio, { passive: true });
addEventListener('keydown', audio);

/* ================= Entrada: capa de acciones BrigadaEntrada =================
   Eje de la palanca (x a la derecha, y hacia abajo) + A (saltar), B (disparar, mantener = ráfaga), X (globo) e
   Y (cambiar arma). Fuentes: teclado, toques (joystick + rombo), mando común y las que se registren (pruebas).
   Las presiones más cortas que un cuadro no se pierden (pulso). */
const TOQUES = 'ontouchstart' in window;
const TACTIL = TOQUES || matchMedia('(any-pointer: coarse)').matches;
if (TACTIL) document.body.classList.add('tactil');
const teclas = new Set(), toque = { a: false, b: false, gx: false, gy: false }, fuentes = [];
const pulso = { a: false, b: false, gx: false, gy: false };
const TECLAS = { ArrowLeft: 'izq', KeyA: 'izq', ArrowRight: 'der', KeyD: 'der', ArrowUp: 'arriba', KeyW: 'arriba', ArrowDown: 'abajo', KeyS: 'abajo',
  Space: 'a', KeyK: 'a', KeyJ: 'b', KeyZ: 'b', KeyL: 'gx', KeyX: 'gx', KeyI: 'gy', KeyC: 'gy' };
const jugando = () => S.vista === 'partido';
addEventListener('keydown', e => {
  if ((e.code === 'KeyP' || e.code === 'Escape') && (S.vista === 'partido' || S.vista === 'pausa')) { e.preventDefault(); alternarPausa(); return; }
  const k = TECLAS[e.code];
  if (!k || !jugando()) return;
  e.preventDefault(); teclas.add(k);
  if (k in pulso && !e.repeat) pulso[k] = true;
});
addEventListener('keyup', e => { const k = TECLAS[e.code]; if (k) teclas.delete(k); });
addEventListener('blur', () => teclas.clear());
document.addEventListener('touchmove', e => { if (jugando()) e.preventDefault(); }, { passive: false });
function tactil(el, h) {
  const vivos = new Set();
  const ini = (id, x, y) => { vivos.add(id); h.inicio(id, x, y); };
  const mov = (id, x, y) => { if (vivos.has(id) && h.mover) h.mover(id, x, y); };
  const fin = id => { if (vivos.delete(id)) h.fin(id); };
  el.addEventListener('touchstart', e => { e.preventDefault(); for (const t of e.changedTouches) ini('t' + t.identifier, t.clientX, t.clientY); }, { passive: false });
  el.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) mov('t' + t.identifier, t.clientX, t.clientY); }, { passive: false });
  const finT = e => { e.preventDefault(); for (const t of e.changedTouches) fin('t' + t.identifier); };
  el.addEventListener('touchend', finT, { passive: false });
  el.addEventListener('touchcancel', finT, { passive: false });
  const propio = e => e.pointerType !== 'touch' || !TOQUES;
  el.addEventListener('pointerdown', e => {
    if (!propio(e)) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch { /* nada */ }
    ini('p' + e.pointerId, e.clientX, e.clientY);
  });
  el.addEventListener('pointermove', e => { if (propio(e)) mov('p' + e.pointerId, e.clientX, e.clientY); });
  const finP = e => { if (propio(e)) fin('p' + e.pointerId); };
  el.addEventListener('pointerup', finP); el.addEventListener('pointercancel', finP);
  el.addEventListener('contextmenu', e => e.preventDefault());

/* ================= Misión individual ================= */
let acum = 0, extraPasos = 0;
function entradasSolo(local, primera) {
  return S.m.jugadores.map((p, i) => {
    if (i !== S.yo) return M.ia(S.m, i);
    return primera ? local : { ...local, ga: false, gx: false, gy: false };
  });
}
function avanzarLocal(dt) {
  acum += dt;
  let n = 0;
  const local = leerEntrada();
  while (acum >= M.PASO && n < 5) { eventos(M.paso(S.m, entradasSolo(local, n === 0))); acum -= M.PASO; n++; }
  if (n === 5) acum = 0;
  for (let k = 0; k < extraPasos && !terminada(); k++) eventos(M.paso(S.m, entradasSolo(local, false)));
  if (S.m.estado === 'cumplida' && S.ctx.modo === 'solo') terminarMision();
  else if (S.m.estado === 'cumplida') terminarSala(false); // sala con una sola persona y compañeros IA
  else if (S.m.estado === 'fallida') fallida();
}
const terminada = () => S.m.estado === 'cumplida' || S.m.estado === 'fallida';
function fallida() {
  if (S.ctx.modo !== 'solo') { reintentoEquipo(); return; }
  if (S.vista !== 'partido') return;
  window.Emocion?.intensidad(0); window.Emocion?.derrota(); soltarToques();
  pantalla('<h2>😵 ¡Uy! La brigada necesita otro intento</h2><p>Vuelves al último punto de control con todas tus vidas.</p>' +
    '<div class="fila"><button class="btn" data-a="reintentar" id="b-reintentar">🔁 Reintentar</button><button class="btn sec" data-a="menu">🗺️ Misiones</button></div>', 'fallida');
}
function terminarMision() {
  if (S.fin) return;
  S.fin = true; soltarToques(); window.Emocion?.intensidad(0);
  const r = M.resumen(S.m), mio = r.puntos[S.yo], antes = prog().misiones[String(r.mision)];
  const record = !antes || mio > antes.record;
  const pj = S.m.jugadores[S.yo];
  S.prog = M.registrarMision(prog(), { mision: r.mision, puntos: mio, ms: r.ms, estrellas: r.estrellas, robots: pj.robots, rescatados: pj.rescates, completada: true });
  enviar({ tipo: 'guardar', datos: structuredClone(S.prog) });
  const ranking = M.puntosRanking(mio);
  S.puntosEnviados = ranking;
  enviar({ tipo: 'puntos', puntos: ranking, aciertos: r.rescatados, total: r.jaulas, segundos: Math.round(r.ms / 1000) });
  window.Emocion?.nivelSuperado();
  if (record) setTimeout(() => window.Emocion?.record(), 900);
  const sigue = r.mision < MIS.LISTA.length;
  const bono = M.bonoTiempo(S.m.def.tiempoMeta, r.ms / 1000);
  pantalla('<h2>🎉 ¡Misión cumplida!</h2><p>' + S.m.def.emoji + ' ' + esc(S.m.def.nombre) + '</p><div class="grande-estrellas" aria-label="' + r.estrellas + ' de 3 estrellas">' + estrellasTxt(r.estrellas) + '</div>' +
    '<table class="tabla"><tr><td>🤖 Robots</td><td class="num">' + pj.robots + '</td></tr><tr><td>🐾 Rescates</td><td class="num">' + r.rescatados + ' / ' + r.jaulas + '</td></tr>' +
    '<tr><td>⏱ Tiempo</td><td class="num">' + Math.floor(r.ms / 60000) + ':' + String(Math.floor(r.ms / 1000) % 60).padStart(2, '0') + '</td></tr><tr><td>⚡ Bono de tiempo</td><td class="num">+' + bono + '</td></tr>' +
    '<tr><td>🏅 Puntos</td><td class="num">' + mio.toLocaleString('es-MX') + (record ? ' 🆕 récord' : '') + '</td></tr></table>' +
    '<p class="sub">★ completar · ★ rescatar a todos · ★ sin reintentos</p><p id="res-puntos"><b>+' + ranking + '</b> puntos de ranking' + (EMBED ? ' · registrando…' : '') + '</p>' +
    '<div class="fila">' + (sigue ? '<button class="btn" data-a="siguiente" id="b-siguiente">▶ Siguiente misión</button>' : '<p>🏆 ¡Terminaste las 4 misiones de la brigada!</p>') +
    '<button class="btn sec" data-a="repetir">🔁 Repetir</button><button class="btn sec" data-a="menu">🗺️ Misiones</button></div>', 'resultado');
}

/* ================= Botones de las pantallas ================= */
const ACCIONES = {
  jugar: empezarSolo, repetir: empezarSolo, seguir: alternarPausa,
  menu: () => { window.Emocion?.intensidad(0); window.Emocion?.calma(); S.m = null; portada(); },
  siguiente: () => { ajustes.mision = Math.min(MIS.LISTA.length, ajustes.mision + 1); empezarSolo(); },
  reintentar: () => { M.reintentar(S.m); $('ov').classList.add('hide'); $('hud').classList.remove('hide'); document.body.classList.add('en-partido'); S.vista = 'partido'; pintarControl(); ultimo = performance.now(); },
  'ir-solo': () => (EMBED ? enviar({ tipo: 'ir-solo' }) : portada()),
};
$('ov').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  audio();
  if (b.dataset.a && ACCIONES[b.dataset.a]) { ACCIONES[b.dataset.a](); return; }
  if (b.dataset.control) { elegirControl(b.dataset.control); return; }
  if (b.dataset.pj) { ajustes.personaje = Personajes.preferencia(b.dataset.pj); portada(); return; }
  if (b.dataset.mision) { ajustes.mision = Number(b.dataset.mision); portada(); return; }
  if (b.dataset.comp) { ajustes.companeros = Number(b.dataset.comp); portada(); }
});

/* ================= HUD ================= */
let hudClave = '';
const corazones = p => '❤️'.repeat(Math.max(0, p.cor)) + '🤍'.repeat(Math.max(0, M.COR - p.cor));
function pintarHud(m) {
  const p = m.jugadores[S.yo], equipo = m.jugadores.reduce((s, q) => s + q.puntos, 0);
  const filas = m.jugadores.map((q, i) => '<div class="fila-j' + (q.estado === 'vivo' ? '' : ' fuera') + '" data-i="' + i + '"><img src="' + Personajes.retrato(q.personaje, 'quieto') + '" alt="">' +
    (m.jugadores.length > 1 ? '<span class="n" style="color:' + FIRMA_PJ(q.personaje) + '">' + esc(S.nombres[i] || '') + '</span>' : '') +
    '<span>' + (q.estado === 'burbuja' ? '🫧' : corazones(q)) + '</span><span>×' + q.vidas + '</span></div>');
  const clave = filas.join('') + '|' + p.puntos + '|' + equipo + '|' + p.arma + p.mun[p.arma] + p.vehiculo + '|' + p.globos;
  if (clave !== hudClave) {
    hudClave = clave;
    $('equipo').innerHTML = (m.jugadores.length > 4 ? filas.map(f => f.replace(/<span>❤️|<span>🤍/, '<span>')) : filas).join('');
    $('puntos').textContent = '🏅 ' + p.puntos.toLocaleString('es-MX') + (m.jugadores.length > 1 && S.ctx.modo !== 'solo' ? ' · equipo ' + equipo.toLocaleString('es-MX') : '');
    const municion = p.arma === 'burbuja' ? '∞' : p.mun[p.arma];
    $('arma').textContent = p.vehiculo >= 0 ? '🎊 Cañón' : M.ARMAS[p.arma].emoji + ' ' + municion;
    $('globos').textContent = '🎈 ' + p.globos;
  }
  $('avance-barra').style.width = Math.min(100, Math.round(m.cam.x / (m.def.largo - M.W) * 100)) + '%';
  const j = m.jefe;
  $('jefe-barra').classList.toggle('hide', !j);
  if (j) { $('jefe-nombre').textContent = (j.mini ? '⚠️ ' : '👾 ') + M.JEFES[j.tipo].nombre; $('jefe-vida').style.width = Math.max(0, Math.round(j.hp / j.hpMax * 100)) + '%'; }
}
function tensionJefe(m) {
  const j = m.jefe;
  if (!j || j.mini) return;
  const x = j.hp < j.hpMax * 0.3 ? 0.95 : 0.7;
  if (Math.abs((tensionJefe.x || 0) - x) > 0.05) { tensionJefe.x = x; window.Emocion?.intensidad(x); }
}

/* ================= Bucle ================= */
let ultimo = performance.now(), cuadros = 0, fpsDesde = performance.now(), fps = 0, enJuego = null;
function avanzar(dt) {
  if (S.rol === 'anfitrion' && S.red) avanzarAnfitrion(dt);
  else if (S.rol === 'invitado' && S.red) avanzarInvitado(dt);
  else avanzarLocal(dt);
}
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  tonosCuadro = 0;
  let dt = (ahora - ultimo) / 1000; ultimo = ahora;
  if (dt > 0.25) dt = 0.25;
  cuadros++; if (ahora - fpsDesde >= 1000) { fps = Math.round(cuadros * 1000 / (ahora - fpsDesde)); cuadros = 0; fpsDesde = ahora; }
  const juega = S.vista === 'partido' || S.vista === 'pausa';
  if (juega !== enJuego) { enJuego = juega; mando.activar(juega); pintarControl(); }
  if (S.vista === 'partido' && S.m && !document.hidden) avanzar(dt);
  else acum = 0;
  S.sacudir = Math.max(0, S.sacudir - dt * 2);
  const ver = S.m && ['partido', 'pausa', 'resultado', 'fallida', 'conectando'].includes(S.vista);
  vista.dibujar({ m: ver ? S.m : null, yo: S.yo, nombres: S.nombres, sacudir: S.sacudir }, S.vista === 'partido' ? dt : 0, ahora / 1000);
  if (S.vista === 'partido' && S.m) { pintarHud(S.m); tensionJefe(S.m); if (S.canal) pintarRed(ahora); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { soltarToques(); if (S.vista === 'partido' && S.ctx && S.ctx.modo === 'solo') alternarPausa(); }
  else ultimo = performance.now();
});

/* ================= Modo sala (cooperativo en vivo de 1 a 8; juegos/brigada-red.js) =================
   La página manda { modo: 'sala', rol, anfitrion, yo, asientos: [{ id, nombre, bot, personaje }], seed, vivo, mision }.
   Con una sola persona (y compañeros IA) se simula aquí mismo; con más, el anfitrión simula y manda fotos y los
   invitados mandan su entrada por el canal en vivo. Sin canal: respaldo («Jugar solo»). */
const R = window.BrigadaRed, ESPERA_MS = 20000;
function misionSala(d) {
  const usados = new Set(d.asientos.map(a => a.personaje).filter(Boolean)), libres = M.PERSONAJES.filter(id => !usados.has(id));
  const personajes = d.asientos.map((a, i) => ({ personaje: a.personaje || libres.shift() || M.PERSONAJES[i % 8], ia: !!a.bot }));
  return M.crearMision({ mision: Number(d.mision) || 1, personajes, semilla: 'sala-' + d.seed });
}
function iniciarSala(d) {
  S.sala = d; S.reintentoEn = 0;
  const personas = d.asientos.filter(a => !a.bot), yo = d.asientos.findIndex(a => a.id === d.yo.id);
  S.ctx = { modo: 'sala' };
  if (yo < 0) { respaldo('No encontramos tu lugar en la mesa.'); return; }
  const nombres = d.asientos.map(a => (a.bot ? '🤖 ' : '') + apodo(a.nombre));
  if (personas.length === 1) { S.rol = 'local'; iniciarMision(misionSala(d), yo, nombres); return; }
  conectarSala(d, yo, nombres);
}
function respaldo(motivo) {
  cerrarCanal(); S.red = null; S.rol = null;
  pantalla('<h2>📡 La misión en vivo no está disponible en esta sala</h2><p>' + esc(motivo) + '</p><p>Mientras tanto, juega solo: tus puntos cuentan en el ranking individual.</p>' +
    '<div class="fila"><button class="btn" data-a="ir-solo" id="b-ir-solo">🦎 Jugar solo</button></div>', 'respaldo');
}
function cerrarCanal() { try { if (S.canal) S.canal.cerrar(); } catch { /* ya cerrado */ } S.canal = null; }
async function conectarSala(d, yo, nombres) {
  pantalla('<h2>🦎 Misión en equipo</h2><p id="linea-estado">📡 Conectando el canal en vivo…</p>', 'conectando');
  if (!d.vivo || !window.EnVivo) { respaldo('Esta sala no tiene canal en vivo.'); return; }
  const ids = d.asientos.filter(a => !a.bot).map(a => a.id), anf = d.rol === 'anfitrion';
  try {
    const intento = EnVivo.conectar({ transporte: EnVivo.transporteMarco('brigada'), yo: d.yo, participantes: ids, hz: anf ? R.HZ_FOTO : R.hzEntrada(ids.length) });
    S.canal = await Promise.race([intento, new Promise((_, mal) => setTimeout(() => mal(new Error('tiempo')), 6000))]);
  } catch { respaldo('No se pudo conectar el canal en vivo.'); return; }
  if (anf) esperarInvitados(d, yo, ids, nombres); else empezarInvitado(d, yo, nombres);
}
// El anfitrión arranca cuando todas las personas saludaron (o a los 10 s: quien falte lo maneja la IA hasta que llegue).
function esperarInvitados(d, yo, ids, nombres) {
  const vistos = new Set([d.yo.id]), est = $('linea-estado');
  let listo = false;
  const arrancar = () => { if (!listo && S.sala === d) { listo = true; empezarAnfitrion(d, yo, nombres); } };
  const pinta = () => { if (est) est.textContent = '⏳ Esperando a la brigada (' + vistos.size + ' de ' + ids.length + ')…'; };
  pinta();
  S.canal.al('bx:entrada', (_m, meta) => { if (meta && ids.includes(meta.de)) { vistos.add(meta.de); pinta(); if (vistos.size >= ids.length) arrancar(); } });
  setTimeout(arrancar, 10000);
}
function empezarAnfitrion(d, yo, nombres) {
  const m = misionSala(d);
  S.rol = 'anfitrion';
  S.red = R.anfitrion({ canal: S.canal, m, M, ids: d.asientos.map(a => (a.bot ? null : a.id)), yo, ahora: () => performance.now() });
  iniciarMision(m, yo, nombres);
}
function empezarInvitado(d, yo, nombres) {
  const m = misionSala(d);
  S.rol = 'invitado';
  S.red = R.invitado({ canal: S.canal, m, M, anfitrion: d.anfitrion, yo, ahora: () => performance.now(), hz: R.hzEntrada(d.asientos.filter(a => !a.bot).length) });
  iniciarMision(m, yo, nombres);
  avisarRed('⏳ Esperando al anfitrión…');
}
function avisarRed(t) {
  const el = $('red-aviso');
  if (!t) { el.classList.add('hide'); return; }
  if (el.textContent !== t) el.textContent = t;
  el.classList.remove('hide');
}
let redT = 0;
function pintarRed(ahora) {
  if (ahora - redT < 500 || !S.canal) return;
  redT = ahora;
  let ms = null;
  try { ms = S.canal.latencia(); } catch { ms = null; }
  const lat = $('lat');
  lat.classList.remove('hide');
  lat.textContent = '📶 ' + (Number.isFinite(ms) ? Math.round(ms) + ' ms' : '—');
  if (S.rol !== 'invitado') return;
  const caido = S.red.anfitrionCaido();
  if (caido !== null) avisarRed('📡 Se perdió la conexión con el anfitrión · la misión se cierra en ' + Math.max(0, Math.ceil((R.DESCONEXION_MS - (ahora - caido)) / 1000)) + ' s');
  else if (S.red.ultimaFoto()) avisarRed('');
}
// En equipo, si todos quedan fuera, la brigada vuelve sola al punto de control a los 2.5 s.
function reintentoEquipo() {
  const ahora = performance.now();
  if (!S.reintentoEn) { S.reintentoEn = ahora + 2500; gritar('¡Uy!', 'Otra vez desde el punto de control', 2200); return; }
  if (ahora >= S.reintentoEn) { S.reintentoEn = 0; M.reintentar(S.m); }
}
function avanzarAnfitrion(dt) {
  acum += dt;
  let n = 0;
  const local = leerEntrada();
  while (acum >= M.PASO && n < 5) { eventos(S.red.paso(n === 0 ? local : { ...local, ga: false, gx: false, gy: false })); acum -= M.PASO; n++; }
  if (n === 5) acum = 0;
  for (let k = 0; k < extraPasos && !terminada(); k++) eventos(S.red.paso({ ...local, ga: false, gx: false, gy: false }));
  S.red.enviarSiToca();
  if (S.m.estado === 'cumplida') terminarSala(false);
  else if (S.m.estado === 'fallida') reintentoEquipo();
}
function avanzarInvitado(dt) {
  S.red.entrada(leerEntrada());
  const d = S.red.dibujar(dt);
  if (d) eventos(d.eventos);
  else if (performance.now() - S.inicioReal > ESPERA_MS) { respaldo('El anfitrión no se conectó al canal en vivo.'); return; }
  if (d && d.estado === 'cumplida') terminarSala(false);
  else if (S.red.cerrarPorCaida()) terminarSala(true);
}
function terminarSala(corte) {
  if (S.fin) return;
  S.fin = true;
  if (S.rol === 'anfitrion') [0, 150, 300].forEach(t => setTimeout(() => { if (S.red) S.red.enviarSiToca(true); }, t));
  soltarToques(); avisarRed(''); window.Emocion?.intensidad(0);
  const m = S.m, r = M.resumen(m), puntos = {};
  S.sala.asientos.forEach((a, i) => { if (!a.bot) puntos[a.id] = m.jugadores[i].puntos; });
  if (r.completada) window.Emocion?.nivelSuperado();
  pantalla('<h2>' + (r.completada ? '🎉 ¡Misión cumplida en equipo!' : '📡 Misión cerrada') + '</h2><div class="grande-estrellas">' + estrellasTxt(r.estrellas) + '</div>' +
    '<p>🏅 Equipo: <b>' + r.equipo.toLocaleString('es-MX') + '</b> · tú: <b>' + m.jugadores[S.yo].puntos.toLocaleString('es-MX') + '</b></p>' +
    (corte ? '<p>📡 La misión se cerró por la desconexión del anfitrión.</p>' : '') + '<p id="res-puntos">Registrando el resultado…</p>', 'resultado');
  setTimeout(cerrarCanal, 1500);
  enviar({ tipo: 'fin-sala', puntos, ms: r.ms, completada: r.completada, corte: !!corte });
}

/* ================= Plataforma ================= */
addEventListener('message', ev => {
  if (ev.origin !== location.origin || ev.source !== parent) return;
  const d = ev.data || {};
  if (d.tipo === 'inicio' && d.modo === 'sala' && Array.isArray(d.asientos)) iniciarSala(d);
  else if (d.tipo === 'inicio') {
    S.prog = d.progreso && M.validarProgreso(d.progreso) ? d.progreso : null;
    if (S.prog) { ajustes.personaje = Personajes.preferencia(S.prog.personaje); ajustes.companeros = S.prog.companeros; ajustes.mision = S.prog.desbloqueada; }
    if (S.vista === 'carga' || S.vista === 'menu') portada();
    if (d.aviso) avisar(d.aviso, 4000);
  } else if (d.tipo === 'puntos-ok') pintarPuntosOk(d);
});
function pintarPuntosOk(d) {
  const el = $('res-puntos');
  if (!el || S.puntosEnviados === null) return;
  if (!d.guardado) { el.innerHTML = '⚠️ No se guardaron los puntos (' + esc(d.error || 'sin conexión') + ').'; return; }
  el.innerHTML = '<b>+' + esc(d.puntos) + '</b> puntos guardados' + (d.pos ? ' · lugar ' + esc(d.pos) + ' de la semana' : '');
}
requestAnimationFrame(t => { ultimo = t; cuadro(t); });
if (EMBED) { enviar({ tipo: 'listo' }); setTimeout(() => { if (S.vista === 'carga') portada(); }, 4000); }
else portada();
if (PRUEBA) {
  // Ganchos solo para pruebas E2E (?prueba=1).
  window.__brigada = {
    m: () => S.m,
    estado: () => {
      const m = S.m, p = m && m.jugadores[S.yo];
      return {
        vista: S.vista, modo: S.ctx && S.ctx.modo, rol: S.rol, fps, control, tactil: TACTIL, vertical: document.body.classList.contains('vertical'), entrada: eje(),
        mision: m && m.mision, estadoM: m && m.estado, cam: m && m.cam.x, enemigos: m ? M.contarEnemigos(m) : 0, prog: S.prog, puntosEnviados: S.puntosEnviados,
        jefe: m && m.jefe ? { tipo: m.jefe.tipo, hp: m.jefe.hp, hpMax: m.jefe.hpMax, fase: m.jefe.fase } : null, mando: mando.estado(),
        yo: p ? { x: p.x, y: p.y, vx: p.vx, vy: p.vy, suelo: p.suelo, agachado: p.agachado, aim: p.aim, arma: p.arma, mun: { ...p.mun }, globos: p.globos, cor: p.cor, vidas: p.vidas, estado: p.estado, puntos: p.puntos, rescates: p.rescates, robots: p.robots, dir: p.dir, vehiculo: p.vehiculo } : null,
      };
    },
    acelerar: n => { extraPasos = Math.max(0, Number(n) || 0); },
    red: () => (S.red ? {
      rol: S.rol, recibidas: S.red.st.recibidas || 0, caidos: S.rol === 'anfitrion' ? S.red.caidos() : [], caido: S.rol === 'invitado' ? S.red.anfitrionCaido() : null,
      bytes: S.rol === 'anfitrion' ? S.red.st.bytes.slice(-120) : [], aviso: $('red-aviso').classList.contains('hide') ? '' : $('red-aviso').textContent, lat: $('lat').textContent,
      enemigos: S.m.enemigos.filter(e => e.vivo).map(e => e.id).sort((a, b) => a - b),
    } : null),
    invulnerable: () => { for (const p of S.m.jugadores) p.inv = 1e6; },
    // Lleva al equipo a la entrada de la arena del jefe.
    alJefe: () => {
      const m = S.m, x = m.def.jefe.x;
      m.cam.x = x - 200; m.miniHecho = true; m.cp = m.cps.length - 2;
      m.jugadores.forEach((p, i) => Object.assign(p, { x: x + 40 + 10 * i, y: M.sueloEn(m.def, x + 40), vx: 0, vy: 0, suelo: true, plat: -1 }));
      for (const e of m.enemigos) e.vivo = false;
      m.sig = m.lista.length;
    },
    debilitarJefe: () => { const j = S.m.jefe; if (j) { j.hp = Math.min(j.hp, 2); j.invul = false; } },
    // Pone un enemigo o una jaula a dx px adelante del personaje.
    enemigo: (tipo, dx) => { const p = S.m.jugadores[S.yo]; const e = M.ponerEnemigo(S.m, tipo, p.x + dx, 0); return e && e.id; },
    jaula: dx => { const m = S.m, p = m.jugadores[S.yo], j = { k: m.jaulas.length, x: p.x + dx, y: M.sueloEn(m.def, p.x + dx), animal: 'xolito', abierta: false }; m.jaulas.push(j); return j.k; },
    limpiar: () => {
      for (const e of S.m.enemigos) e.vivo = false;
      for (const b of S.m.balasE) b.vivo = false;
    },
    terminarYa: () => { const m = S.m; m.estado = 'victoria'; m.estT = 99; },
    fallarYa: () => { const m = S.m; m.jugadores.forEach(p => { p.estado = 'burbuja'; p.vidas = 0; }); },
  };
}
