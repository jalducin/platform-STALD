<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fútbol Estelar 2010</title>
<style>
:root{--bg:#06122a;--panel:#0b1d40;--panel2:#10295a;--txt:#eef2ff;--suave:#b8c4e0;--acento:#b6f03c;--acento2:#22c55e;--oro:#facc15;--rojo:#ef4444;--borde:rgba(255,255,255,.22)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#juego{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#pantalla{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{display:block}
#c{position:absolute;left:0;top:0}
.hide{display:none!important}
/* ---- HUD ---- */
#hud{position:absolute;inset:0;pointer-events:none;font-weight:800;text-shadow:0 1px 0 #000}
#marcador{position:absolute;left:8px;top:6px;display:flex;align-items:center;gap:5px;padding:3px 8px 3px 5px;border-radius:8px;background:linear-gradient(#13306b,#081a3d);border:1px solid rgba(255,255,255,.35);box-shadow:0 3px 8px rgba(0,0,0,.45);font-size:16px;font-style:italic}
#marcador img{width:22px;height:22px}
#marcador .gol{min-width:20px;text-align:center;background:#f8fafc;color:#0b1d40;border-radius:4px;padding:0 4px;font-style:normal;text-shadow:none}
#reloj{margin-left:4px;padding:0 6px;border-radius:4px;background:var(--acento);color:#0b1d40;font-style:normal;text-shadow:none;min-width:34px;text-align:center}
#hud .der{position:absolute;right:8px;top:6px;display:flex;gap:6px;pointer-events:auto}
.mini{font:inherit;font-size:16px;border:1px solid var(--borde);background:rgba(0,0,0,.45);color:#fff;border-radius:10px;min-width:40px;min-height:36px;padding:2px 8px;cursor:pointer}
#info-j{position:absolute;left:8px;top:40px;display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:8px;background:rgba(6,18,42,.7);border:1px solid rgba(255,255,255,.2)}
#info-j .ene{width:46px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}
#info-j .ene i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#b6f03c)}
#radar{position:absolute;right:8px;bottom:8px;width:132px;height:86px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#aviso{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(6,18,42,.88);border:1px solid rgba(255,255,255,.3);padding:5px 14px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .2s;z-index:5}
#aviso.ver{opacity:1}
/* futbol-en-linea: latencia y aviso de desconexión */
#lat{font-size:12px;min-width:0;padding:2px 6px;pointer-events:none}
#lat[data-nivel=bueno]{color:#86efac}#lat[data-nivel=regular]{color:#fde68a}#lat[data-nivel=malo]{color:#fca5a5}
#red-aviso{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:7;background:#7c2d12;border:2px solid #fdba74;color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:12px;max-width:92%;text-align:center;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#grito{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:5;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s}
#grito.ver{opacity:1;transform:scale(1)}
#grito b{display:block;font-size:clamp(40px,11vw,86px);font-style:italic;font-weight:900;color:var(--oro);text-shadow:0 4px 0 #9a3412,0 0 24px rgba(0,0,0,.7);letter-spacing:.02em}
#grito small{display:inline-block;margin-top:4px;font-size:16px;font-weight:800;background:rgba(6,18,42,.85);padding:3px 12px;border-radius:999px}
#tuto{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(6,18,42,.9);border:2px solid var(--acento);border-radius:14px;padding:6px 12px;font-weight:800;font-size:12.5px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;min-width:min(260px,92%)}
#tuto.ver{opacity:1}
#tuto h3{margin:0 0 3px;font-size:14px;color:var(--acento);text-align:center}
#tuto div{display:flex;gap:10px;justify-content:space-between;line-height:1.45}
#tuto b{color:#fde68a}
#girar{position:absolute;left:8px;top:72px;z-index:8;display:flex;align-items:center;gap:8px;background:#fde68a;color:#3b2a05;font-weight:800;font-size:13px;padding:6px 6px 6px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.4);max-width:94%}
#girar button{font:inherit;border:0;border-radius:999px;background:rgba(0,0,0,.15);min-width:32px;min-height:32px;cursor:pointer}
/* ---- Pantallas (menús) ---- */
.ov{position:absolute;inset:0;z-index:6;overflow:auto;padding:14px 12px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;background:radial-gradient(120% 80% at 50% 0,rgba(22,58,120,.96),rgba(4,12,30,.97));text-align:center}
.ov h1{margin:4px 0 0;font-size:clamp(28px,8vw,46px);font-style:italic;font-weight:900;letter-spacing:.01em;color:#fff;text-shadow:0 3px 0 #0b5b3f,0 0 18px rgba(182,240,60,.45);line-height:1}
.ov h1 span{color:var(--acento)}
.ov h2{margin:0;font-size:clamp(20px,5.6vw,30px);font-style:italic;color:var(--acento);text-shadow:0 2px 0 #0b3b1f}
.ov h3{margin:6px 0 2px;font-size:15px;color:var(--oro)}
.ov p{margin:0;max-width:560px;line-height:1.35;color:var(--suave)}
.sub{font-size:13px;color:var(--suave)}
.caja{width:min(620px,100%);background:linear-gradient(var(--panel2),var(--panel));border:1px solid var(--borde);border-radius:14px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.btn{font:inherit;font-weight:900;font-size:17px;font-style:italic;border:0;border-radius:12px;padding:11px 20px;min-height:50px;background:linear-gradient(#c7f562,#7cc61a);color:#0b2a12;box-shadow:0 4px 0 #3f6b0b;cursor:pointer}
.btn.sec{background:linear-gradient(#3b5b98,#22396b);color:#fff;box-shadow:0 4px 0 #0f1f40}
.btn.chico{font-size:14px;min-height:42px;padding:7px 14px}
.btn:active{transform:translateY(3px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:min(620px,100%)}
.modo{font:inherit;color:#fff;text-align:left;border:1px solid var(--borde);border-radius:12px;padding:10px 12px;min-height:64px;cursor:pointer;background:linear-gradient(135deg,#17407e,#0c2350);display:flex;flex-direction:column;gap:2px;box-shadow:inset 4px 0 0 var(--acento)}
.modo b{font-size:16px;font-style:italic}
.modo small{font-size:12px;color:var(--suave)}
.op{font:inherit;font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.4);background:#122a57;color:#fff;border-radius:10px;min-height:42px;padding:4px 10px;cursor:pointer}
.op[aria-pressed="true"]{background:#2d6a12;border-color:var(--acento)}
.ops{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
fieldset{margin:0;padding:0;border:0;min-width:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;width:min(560px,100%)}
.club{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800}
.club img{width:64px;height:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.club small{color:var(--suave);font-weight:700}
.vs .x{font-size:26px;font-style:italic;font-weight:900;color:var(--oro)}
.deslizadores{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 12px;width:100%;text-align:left}
.deslizadores label{font-size:13px;font-weight:800;display:flex;flex-direction:column;gap:2px}
.deslizadores span{display:flex;justify-content:space-between;font-size:11px;color:var(--suave);font-weight:700}
input[type=range]{width:100%;accent-color:#7cc61a;min-height:28px}
.alineacion{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:3px 10px;text-align:left;font-size:13px}
.alineacion div{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{display:inline-block;min-width:22px;text-align:center;border-radius:5px;background:#f8fafc;color:#0b1d40;font-weight:900;font-size:12px}
.pos{font-size:10px;font-weight:900;color:#0b1d40;background:var(--acento);border-radius:4px;padding:0 3px}
.carta{font-size:14px}
.ligas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;width:min(860px,100%)}
.clubes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.cbtn{font:inherit;color:#fff;display:flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--borde);background:#102756;border-radius:10px;padding:4px 6px;min-height:44px;cursor:pointer;min-width:0}
.cbtn img{width:30px;height:30px;flex:0 0 auto}
.cbtn span{display:flex;flex-direction:column;min-width:0;font-size:12.5px;font-weight:800;line-height:1.15}
.cbtn small{font-weight:700;color:var(--suave);font-size:11px}
.cbtn[aria-pressed="true"]{border-color:var(--acento);background:#1f4d14}
table.tabla{border-collapse:collapse;width:100%;font-size:13px;font-weight:700}
.tabla th,.tabla td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.tabla td.n{text-align:left;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tabla tr.yo{background:rgba(182,240,60,.2)}
.tabla tr.sube td:first-child{box-shadow:inset 3px 0 0 #22c55e}
.tabla tr.baja td:first-child{box-shadow:inset 3px 0 0 #ef4444}
.tabla img{width:18px;height:18px;vertical-align:middle;margin-right:3px}
.llave{display:flex;gap:8px;overflow-x:auto;width:100%;justify-content:center}
.ronda{display:flex;flex-direction:column;gap:6px;justify-content:space-around;min-width:150px}
.ronda h3{font-size:12px;margin:0}
.par{background:#0f2552;border:1px solid var(--borde);border-radius:8px;padding:3px 6px;font-size:12px;font-weight:800;text-align:left}
.par div{display:flex;justify-content:space-between;gap:6px;align-items:center}
.par img{width:16px;height:16px;vertical-align:middle;margin-right:3px}
.par .gano{color:var(--acento)}
.par.tuyo{border-color:var(--oro)}
.stats{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 10px;font-weight:800;font-size:14px;width:min(360px,100%)}
.stats span:nth-child(3n+2){color:var(--suave);font-size:12px}
.marcadorg{display:flex;align-items:center;gap:12px;font-size:44px;font-weight:900;font-style:italic}
.marcadorg img{width:56px;height:56px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tab{font:inherit;font-weight:800;font-size:13px;border:1px solid var(--borde);background:#0f2552;color:#fff;border-radius:999px;padding:6px 11px;min-height:38px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--acento);color:#0b2a12}
.lista{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left}
.lista .it{display:flex;align-items:center;gap:6px;background:#0f2552;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:4px 6px;font-size:13px;font-weight:700}
.lista .it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lista select{font:inherit;font-size:12px;background:#102756;color:#fff;border:1px solid var(--borde);border-radius:6px;min-height:30px}
.dinero{color:var(--oro);font-weight:900}
.forma{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;width:100%;text-align:left}
.forma label{font-weight:800;font-size:13px;display:flex;flex-direction:column;gap:3px}
.forma input[type=text]{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--borde);background:#06122a;color:#fff}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:30px;height:30px;border-radius:7px;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--acento)}
.vista-club{display:flex;gap:12px;align-items:center;justify-content:center}
.vista-club img{width:84px;height:84px}
.personas{display:flex;flex-direction:column;gap:6px;width:100%}
.persona{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;align-items:center;background:#0f2552;border-radius:10px;padding:6px;border:1px solid var(--borde)}
.persona b{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#0b1d40}
.persona select{font:inherit;font-size:13px;background:#102756;color:#fff;border:1px solid var(--borde);border-radius:8px;min-height:38px;min-width:0;width:100%}
#ctl{display:none;flex-direction:column;align-items:center;gap:5px;width:min(620px,100%)}
body.tactil #ctl{display:flex}
#teclas{font-size:12.5px;color:var(--suave)}
body.tactil #teclas{display:none}
/* ---- Mandos táctiles (como Karts: joystick a la izquierda, botones grandes a la derecha) ---- */
#mandos{display:none;flex:0 0 auto;align-items:flex-end;justify-content:space-between;gap:8px;padding:6px 10px 10px;background:linear-gradient(#081733,#06122a)}
body.tactil.en-partido.ctl-joystick #mandos{display:flex}
#m-izq{flex:1 1 auto;min-width:0;height:172px}
#joy-zona{position:relative;width:100%;height:100%;border-radius:18px;background:rgba(255,255,255,.04);touch-action:none}
#joy-base{position:absolute;left:50%;top:55%;width:108px;height:108px;margin:-54px 0 0 -54px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.05),rgba(255,255,255,.16) 70%);border:2px solid rgba(255,255,255,.4);pointer-events:none}
#joy-perilla{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 60%,#94a3b8);box-shadow:0 3px 8px rgba(0,0,0,.5)}
#joy-zona.on #joy-perilla{background:radial-gradient(circle at 35% 30%,#fff,#d9f99d 60%,#84cc16)}
.joy-txt{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;opacity:.55;pointer-events:none}
#m-der{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:34px repeat(3,50px);gap:4px 6px;grid-template-areas:"L . R" ". Y ." "X . B" ". A ."}
.m{font:inherit;border-radius:50%;border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;padding:0;line-height:1;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.45);text-shadow:0 1px 1px rgba(0,0,0,.5)}
.m small{font-size:8.5px;letter-spacing:.02em;font-weight:900;margin-top:1px}
.m.on{transform:translateY(2px) scale(.94);filter:brightness(1.25);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#m-A{grid-area:A;background:radial-gradient(circle at 35% 30%,#f87171,#b91c1c);width:62px;height:62px;justify-self:center;align-self:center}
#m-B{grid-area:B;background:radial-gradient(circle at 35% 30%,#fcd34d,#b45309);width:62px;height:62px;justify-self:center;align-self:center}
#m-X{grid-area:X;background:radial-gradient(circle at 35% 30%,#60a5fa,#1d4ed8)}
#m-Y{grid-area:Y;background:radial-gradient(circle at 35% 30%,#4ade80,#15803d)}
#m-L,#m-R{border-radius:10px;font-size:14px;flex-direction:row;gap:4px;background:linear-gradient(#64748b,#334155)}
#m-L{grid-area:L}#m-R{grid-area:R}
#m-L small,#m-R small{margin:0;font-size:9px}
body.tuto #mandos .m,body.tuto #joy-zona{box-shadow:0 0 0 3px rgba(182,240,60,.85)}
@media (max-width:340px){#m-der{grid-template-columns:repeat(3,48px);grid-template-rows:30px repeat(3,44px)}#m-A,#m-B{width:54px;height:54px}.m{font-size:17px}}
@media (orientation:landscape) and (max-height:520px){
  body.tactil.en-partido.ctl-joystick #mandos{position:absolute;left:0;right:0;bottom:0;background:none;pointer-events:none;padding:4px 12px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
  #mandos>*{pointer-events:auto}
  #m-izq{flex:0 1 38%;height:150px}
  #joy-zona{background:rgba(255,255,255,.03)}
  .m{opacity:.88}
  #radar{right:50%;transform:translateX(50%);width:110px;height:72px;bottom:6px}
  #tuto{bottom:86px;max-width:46%;min-width:0}
  body:not(.en-partido) .mando{display:none!important}
  #marcador{font-size:14px}#marcador img{width:18px;height:18px}
}
@media (orientation:portrait){#radar{width:110px;height:72px}}
@media (max-width:400px){#marcador{font-size:13px;gap:3px;padding:2px 6px 2px 4px}#marcador img{width:16px;height:16px}#marcador .gol{min-width:16px;padding:0 3px}#reloj{min-width:28px;padding:0 4px}#hud .der{gap:4px}.mini{min-width:34px;font-size:14px;padding:2px 5px}}
@media (prefers-reduced-motion:reduce){#aviso,#grito,#tuto{transition:none}.m.on{transform:none}}
</style></head><body class="ctl-joystick">
<div id="juego">
  <div id="pantalla">
    <canvas id="c" width="400" height="300" aria-label="Partido de Fútbol Estelar 2010"></canvas>

      <div class="der"><output class="mini hide" id="lat" aria-label="Latencia del partido en vivo"></output><button class="mini" id="b-sonido" aria-label="Sonido">🔊</button><button class="mini" id="b-pausa" aria-label="Pausa">⏸</button></div>
      <div id="info-j"></div>
      <canvas id="radar" aria-label="Radar de la cancha"></canvas>
    </div>
    <output id="aviso"></output>
    <output id="red-aviso" class="hide" aria-live="polite"></output>
    <div id="grito" aria-live="polite"></div>
    <div id="tuto" aria-live="polite"></div>
    <output id="girar" class="hide"><span>📱↻ Mejor en horizontal</span><button id="b-girar" aria-label="Cerrar aviso">✕</button></output>
    <div class="ov" id="ov"><h1>⚽ Fútbol <span>Estelar</span> 2010</h1><p>Cargando…</p></div>
  </div>
  <div id="mandos" aria-hidden="true">
    <div id="m-izq"><div id="joy-zona"><div id="joy-base"><div id="joy-perilla"></div></div><span class="joy-txt">Arrastra para moverte</span></div></div>
    <div id="m-der">
      <button class="m" data-k="cambiar" id="m-L" tabindex="-1">L<small>CAMBIAR</small></button>

      <button class="m" data-k="tiro" id="m-B" tabindex="-1">B<small>TIRO</small></button>
      <button class="m" data-k="pase" id="m-A" tabindex="-1">A<small>PASE</small></button>
    </div>
  </div>
</div>

<script src="futbol-motor.js?v=1"></script>

<script src="futbol-red.js?v=1"></script> <!-- futbol-en-linea: netcode sin DOM -->
<script src="en-vivo.js?v=1"></script> <!-- futbol-en-linea: canal en vivo (sprint 27A); sin él, respaldo -->
<script src="emocion.js?v=1"></script> <!-- emocion-sonora: gol, silbato, tensión, victoria, penales y podio -->
<script>
/* Fútbol Estelar 2010 — página del juego (openspec: futbol-estelar). Embebido en juegos.html (🕹️ Arcade): la
   plataforma le pasa el avance del servidor y guarda puntos y progreso (postMessage, solo mismo origen).

  S.alElegir = alElegir;
  const ligas = U.ligas.map(l => '<div class="caja"><h3>' + l.emoji + ' ' + esc(l.nombre) + ' <small class="sub">· ' + esc(l.d) + '</small></h3><div class="clubes">' +

// ---- Previa del partido: rivales + pizarra táctica (valores guardados; «¡A jugar!» con un toque) ----
function previa(ctx) {
  S.ctx = ctx;
  const [a, b] = ctx.equipos.map(clubDe), t = prog.tactica;
  const tuyo = ctx.humanos.length ? ctx.equipos[ctx.humanos[0].eq] : ctx.equipos[0];
  const eq = L.equipoMotor(U, tuyo, prog.carrera, { formacion: t.formacion });
  const cambiar = ctx.cambiar ? '<div class="fila"><button class="btn sec chico" data-a="cambiar-tuyo">🔁 Tu club</button><button class="btn sec chico" data-a="cambiar-rival">🎲 Otro rival</button></div>' : '';
  pantalla('<h2>' + esc(ctx.titulo) + '</h2>' +
    '<div class="vs"><div class="club">' + escudo(a) + esc(a.nombre) + '<small>' + estrellas(L.fuerzaClub(U, ctx.equipos[0], prog.carrera)) + '</small></div><div class="x">VS</div><div class="club">' + escudo(b) + esc(b.nombre) + '<small>' + estrellas(L.fuerzaClub(U, ctx.equipos[1], prog.carrera)) + '</small></div></div>' +
    '<div class="sub">🏟️ ' + esc(ctx.estadio || a.estadio) + ' · ' + NOMBRE_NIVEL[ctx.dificultad] + ' · ' + ajustes.minutos + ' min</div>' + cambiar +
    '<button class="btn" data-a="jugar" id="b-jugar">▶ ¡A jugar!</button>' +
    '<div class="caja"><h3>📋 Pizarra táctica</h3>' + opciones(Object.keys(M.FORMACIONES).map(f => [f, f]), t.formacion, 'formacion') +
    '<div class="deslizadores" style="margin-top:8px">' +
    deslizador('linea', '🧱 Línea defensiva', 'Baja', 'Alta') + deslizador('ancho', '↔️ Amplitud', 'Cerrada', 'Abierta') +
    deslizador('mentalidad', '🧠 Mentalidad', 'Defensiva', 'Ofensiva') + deslizador('presion', '🔥 Presión', 'Poca', 'Mucha') + '</div></div>' +
    '<details class="caja"><summary style="font-weight:800;cursor:pointer">👥 Alineación y cartas de habilidad</summary><div class="alineacion" style="margin-top:6px">' + alineacion(eq.jugadores) + '</div></details>', 'previa');
}
const deslizador = (k, t, a, b) => '<label>' + t + '<input type="range" min="0" max="100" step="5" data-tac="' + k + '" value="' + prog.tactica[k] + '"><span><i>' + a + '</i><i>' + b + '</i></span></label>';
const iconoCarta = c => (c && M.CARTA[c] ? '<span class="carta" title="' + esc(M.CARTA[c].nombre) + '">' + M.CARTA[c].icono + '</span>' : '');
const alineacion = js => js.map(j => '<div><span class="num">' + j.num + '</span><span class="pos">' + j.pos + '</span>' + esc(j.nombre) + ' <small class="sub">' + L.mediaJugador(j) + '</small>' + iconoCarta(j.carta) + '</div>').join('');

/* ================= Partido ================= */
const vista = V.crearVista($('c'));
function ajustarVista() { const r = $('pantalla').getBoundingClientRect(); vista.ajustar(Math.max(200, r.width), Math.max(150, r.height), window.devicePixelRatio || 1); }
addEventListener('resize', () => { ajustarVista(); revisarGirar(); });
function revisarGirar() {
  const vertical = innerHeight > innerWidth;
  $('girar').classList.toggle('hide', !(TACTIL && vertical && !S.girarCerrado && S.vista === 'partido'));
}
$('b-girar').onclick = () => { S.girarCerrado = true; revisarGirar(); };

function rivalAzar(excluir, d) {
  const r = M.rngDe(String(Date.now()), 'rival'), lista = (d === undefined ? U.clubes.map(c => c.id) : U.ligas[d].clubes).filter(x => x !== excluir);
  return lista[Math.floor(r() * lista.length)];
}
function tacticaIA(idx) { const c = clubDe(idx); return { ...M.TACTICA_BASE, formacion: c.formacion }; }
function armarEquipos(ctx) {
  const humanosEq = new Set(ctx.humanos.map(h => h.eq));
  const tacticas = [0, 1].map(e => (humanosEq.has(e) ? { ...prog.tactica } : { ...tacticaIA(ctx.equipos[e]), ...(ctx.formacionRival && e === 1 ? { formacion: ctx.formacionRival } : {}) }));
  const a = L.equipoMotor(U, ctx.equipos[0], prog.carrera, { formacion: tacticas[0].formacion });
  const visitante = L.chocan(a.uniforme.c1, clubDe(ctx.equipos[1]).uniforme.c1);
  const b = L.equipoMotor(U, ctx.equipos[1], prog.carrera, { formacion: tacticas[1].formacion, visitante });
  return { equipos: [a, b], tacticas };
}
function empezarPartido() {
  const ctx = S.ctx, { equipos, tacticas } = armarEquipos(ctx);
  const semilla = PRUEBA && Q.get('semilla') ? Q.get('semilla') : String(Date.now());
  S.p = M.crearPartido({ semilla, equipos, tacticas, humanos: ctx.humanos.map(h => ({ eq: h.eq })), dificultad: ctx.dificultad, minutos: ajustes.minutos, fueraDeLugar: ajustes.fuera, eliminatoria: !!ctx.eliminatoria });
  S.yoH = 0; S.red = null; $('b-pausa').classList.remove('hide'); // futbol-en-linea: persona de este aparato en p.humanos (y sin red)
  mostrarPartido(equipos, ctx);
}
// Pantalla del partido (también la usa el en línea).
function mostrarPartido(equipos, ctx) {
  S.pausa = false; S.inicioReal = performance.now(); S.enLocal = !!ctx.local; S.ultimoPuntos = null; textosActuales = '';
  vista.olvidarSprites(); vista.seguir(0, 0);
  ['0', '1'].forEach(e => { const c = equipos[e]; $('e-' + e).src = V.escudoUrl(c.escudo, 64); $('n-' + e).textContent = c.corto; });
  $('ov').classList.add('hide'); $('hud').classList.remove('hide');
  S.vista = 'partido'; document.body.classList.add('en-partido');
  pintarControl(); ajustarVista(); revisarGirar(); soltarToques();
  setTimeout(() => { S.girarCerrado = true; revisarGirar(); }, 6000); // el aviso de girar se va solo
  audio(); ambiente(true); silbatoInicioFin(1); tension = 0;
  avisar('🏟️ ' + (ctx.estadio || clubDe(ctx.equipos[0]).estadio), 1800);
  if (!S.tutoVisto && ctx.humanos.length && !ctx.local) tutorial();
}
function tutorial() {
  S.tutoVisto = true;
  const t = $('tuto');
  t.innerHTML = '<h3>🎮 Controles</h3><div><b>A</b><span>pase · presiona</span></div><div><b>B (mantén)</b><span>tiro · entrada</span></div><div><b>X / Y</b><span>al hueco · centro</span></div><div><b>R / L</b><span>sprint · cambiar</span></div>';
  t.classList.add('ver'); document.body.classList.add('tuto');
  setTimeout(() => { t.classList.remove('ver'); document.body.classList.remove('tuto'); }, 4000);
}
function alternarPausa() {
  if (S.red) { avisar('📡 El partido en vivo no se pausa'); return; } // futbol-en-linea
  if (S.vista !== 'partido' && S.vista !== 'pausa') return;
  if (S.vista === 'pausa') { reanudar(); return; }
  S.vista = 'pausa'; S.pausa = true; soltarToques(); ambiente(false); apagarTension();
  const t = prog.tactica;
  const ov = $('ov');
  ov.innerHTML = '<h2>⏸ Pausa</h2><p>' + esc(S.p.eq[0].datos.nombre) + ' ' + S.p.eq[0].goles + ' – ' + S.p.eq[1].goles + ' ' + esc(S.p.eq[1].datos.nombre) + ' · ' + S.p.minuto + "'</p>" +
    '<div class="fila"><button class="btn" data-a="seguir">▶ Seguir</button><button class="btn sec" data-a="abandonar">🏳️ Dejar el partido</button></div>' +
    (S.ctx.humanos.length && !S.ctx.local ? '<div class="caja"><h3>📋 Cambiar la táctica</h3>' + opciones(Object.keys(M.FORMACIONES).map(f => [f, f]), t.formacion, 'formacion') + '<div class="deslizadores" style="margin-top:8px">' +
      deslizador('linea', '🧱 Línea defensiva', 'Baja', 'Alta') + deslizador('ancho', '↔️ Amplitud', 'Cerrada', 'Abierta') + deslizador('mentalidad', '🧠 Mentalidad', 'Defensiva', 'Ofensiva') + deslizador('presion', '🔥 Presión', 'Poca', 'Mucha') + '</div></div>' : '');
  ov.classList.remove('hide');
  mando.mostrar(false);
}
function reanudar() {
  S.vista = 'partido'; S.pausa = false;
  if (S.ctx.humanos.length && !S.ctx.local) M.cambiarTactica(S.p, S.ctx.humanos[0].eq, prog.tactica);
  $('ov').classList.add('hide'); pintarControl(); ambiente(true); ultimo = performance.now();
}
$('b-pausa').onclick = e => { alternarPausa(); e.currentTarget.blur(); };

// Eventos del motor → sonido, avisos y emoción.
const AVISOS = { banda: '↔️ Saque de banda', meta: '🥅 Saque de meta', esquina: '🚩 Tiro de esquina', fuera_lugar: '🚩 ¡Fuera de lugar!', falta: '⚠️ Falta', amarilla: '🟨 Tarjeta amarilla', poste: '💥 ¡Al poste!', ultimos: '⏱️ ¡Últimos minutos!', tanda: '🎯 Tanda de penales', penal_gol: '✅ ¡Adentro!', penal_falla: '❌ ¡Falló!' };

  }
}
const silbatazo = () => SON.silbato(1);
const SONIDOS = {
  patada: () => SON.patada(),
  gol: e => {
    const p = S.p, autor = e.i >= 0 ? p.jug[e.i].datos.nombre : '';
    if (!window.Emocion?.gol()) SON.gol();

  },

  tanda: () => window.Emocion?.suspenso(),

/* ================= Fin del partido ================= */
function terminarPartido() {
  const p = S.p, ctx = S.ctx;
  S.vista = 'resultado'; ambiente(false); soltarToques();
  const yo = ctx.humanos.length ? ctx.humanos[0].eq : 0, gf = p.eq[yo].goles, gc = p.eq[1 - yo].goles, g = M.ganador(p);
  const r = { gf, gc, gano: g === yo, empate: g === null, segundos: Math.round((performance.now() - S.inicioReal) / 1000) };
  apagarTension();
  const extra = ctx.alTerminar ? ctx.alTerminar(r) : {};
  if (!extra.podio && r.gano) window.Emocion?.victoria(); // en la llave suena el podio
  else if (!extra.podio && !r.empate) window.Emocion?.derrota();
  if (ctx.puntua) puntuar(r, ctx);
  resultado(r, extra);
}
function puntuar(r, ctx) {
  const st = prog.stats;
  st.partidos++; st.gf += r.gf; st.gc += r.gc;
  if (r.gano) st.ganados++; else if (r.empate) st.empatados++; else st.perdidos++;
  const puntos = L.puntosPartido({ gf: r.gf, gc: r.gc, dificultad: ctx.dificultad, clasificatoria: ctx.modo === 'clasif' });
  r.puntos = puntos;
  if (ctx.modo === 'clasif') {
    const sem = L.semanaISO(new Date());
    if (!prog.clasif || prog.clasif.semana !== sem) prog.clasif = { semana: sem, mejor: 0, jugados: 0 };
    prog.clasif.jugados++; prog.clasif.mejor = Math.max(prog.clasif.mejor, puntos);
  }
  guardar();
  S.ultimoPuntos = null;
  enviar({ tipo: 'puntos', puntos, aciertos: r.gf, total: 0, segundos: r.segundos });
}
function resultado(r, extra) {
  const p = S.p, ctx = S.ctx, a = p.eq[0].datos, b = p.eq[1].datos, st = p.stats;
  const pos = Math.round(st.posesion[0] / Math.max(1, st.posesion[0] + st.posesion[1]) * 100);
  const tanda = p.tanda ? '<div class="sub">Penales: ' + p.tanda.goles[0] + ' – ' + p.tanda.goles[1] + '</div>' : '';
  let titulo = '🤝 Empate';
  if (r.gano) titulo = '🏆 ¡Victoria!'; else if (!r.empate) titulo = '😓 Derrota';
  if (!ctx.humanos.length || ctx.local) titulo = '🏁 Final';
  pantalla('<h2>' + titulo + '</h2><div class="marcadorg">' + escudo(a, 56) + '<span>' + p.eq[0].goles + ' – ' + p.eq[1].goles + '</span>' + escudo(b, 56) + '</div>' +
    '<div class="sub">' + esc(a.nombre) + ' vs ' + esc(b.nombre) + '</div>' + tanda +
    '<div class="stats"><span>' + st.tiros[0] + '</span><span>Tiros</span><span>' + st.tiros[1] + '</span><span>' + st.puerta[0] + '</span><span>A puerta</span><span>' + st.puerta[1] + '</span>' +
    '<span>' + pos + ' %</span><span>Posesión</span><span>' + (100 - pos) + ' %</span><span>' + st.pases[0] + '</span><span>Pases</span><span>' + st.pases[1] + '</span><span>' + st.faltas[0] + '</span><span>Faltas</span><span>' + st.faltas[1] + '</span></div>' +
    (extra.texto ? '<p>' + extra.texto + '</p>' : '') +
    '<p id="res-puntos">' + textoPuntos(r, ctx) + '</p>' +
    '<div class="fila">' + (extra.botones || '<button class="btn" data-a="revancha">🔁 Revancha</button>') + '<button class="btn sec" data-a="menu">🏠 Menú</button></div>', 'resultado');
  if (S.ultimoPuntos && ctx.puntua) mostrarPuntos(S.ultimoPuntos);
}
function textoPuntos(r, ctx) {
  if (ctx.puntua) return '⭐ +' + r.puntos + ' puntos · guardando…';
  return ctx.local ? '🛋️ Partido local: no suma al ranking.' : '';
}
function mostrarPuntos(d) {
  const el = $('res-puntos'); if (!el) return;
  if (!d.guardado) { el.textContent = 'No se guardaron los puntos (' + (d.error || 'sin conexión') + ').'; return; }
  el.textContent = '✔ +' + d.puntos + ' a tus ⭐ individuales' + (d.pos ? ' · #' + d.pos + ' de la semana' : '');
}

// ---- Copa ----
function modoCopa(club) {
  S.copa = L.crearCopa(U, club, String(Date.now()), prog.carrera);

function filaPar(t, m, r) {
  const ea = t.equipos[m.a], eb = t.equipos[m.b], ca = clubDe(ea.club), cb = clubDe(eb.club);
  const lado = (e, c, x, g) => '<div class="' + (m.ganador === x ? 'gano' : '') + '"><span>' + escudo(c, 16) + esc(c.corto) + (e.humano !== null ? ' 🎮' : '') + '</span><b>' + (g === null ? '' : g) + '</b></div>';
  const pen = m.pen !== null && m.ga === m.gb ? '<small class="sub">penales</small>' : '';
  return '<div class="par' + (ea.humano !== null || eb.humano !== null ? ' tuyo' : '') + '">' + lado(ea, ca, m.a, m.ga) + lado(eb, cb, m.b, m.gb) + pen + '</div>';
}
function htmlLlave(t) {
  return '<div class="llave">' + t.rondas.map((r, k) => '<div class="ronda"><h3>' + esc(L.nombreRonda(t, k)) + '</h3>' + r.map(m => filaPar(t, m, k)).join('') + '</div>').join('') + '</div>';
}
function verLlave(tipo) {
  const t = tipo === 'copa' ? S.copa : S.torneo, sig = L.siguientePartido(t);
  let cuerpo;
  if (t.campeon !== null) { const c = clubDe(t.equipos[t.campeon].club); cuerpo = '<div class="club">' + escudo(c, 84) + '<b>🏆 ¡' + esc(c.nombre) + ' es campeón!</b></div>'; }
  else if (sig) cuerpo = '<button class="btn" data-a="' + tipo + '-jugar">▶ Jugar: ' + esc(L.nombreRonda(t, sig.ronda)) + '</button>';
  else cuerpo = '<p>Quedaste fuera. ¡A la próxima!</p>';
  const nombre = tipo === 'copa' ? '🏆 ' + L.COPA.nombre : '🛋️ Torneo local';
  pantalla('<h2>' + esc(nombre) + '</h2>' + (tipo === 'copa' ? '<div class="sub">Trofeo «' + esc(L.COPA.trofeo) + '»</div>' : '') + cuerpo + '<div class="caja">' + htmlLlave(t) + '</div><div class="fila"><button class="btn sec" data-a="menu">🏠 Menú</button></div>', 'llave');
}
// Lugar final de las personas en la llave (1 campeón, 2 finalista, 3 semifinal, 4 antes) o null si siguen vivas.
function lugarEnLlave(t) {
  const humanos = new Set(t.equipos.map((e, i) => (e.humano === null ? -1 : i)).filter(i => i >= 0));
  if (t.campeon !== null && humanos.has(t.campeon)) return 1;
  const total = Math.log2(t.equipos.length);
  let mejor = null;
  t.rondas.forEach((r, k) => r.forEach(m => {
    const perdedor = m.ganador === m.a ? m.b : m.a;
    if (m.ganador !== null && humanos.has(perdedor)) mejor = Math.min(mejor || 9, [4, 3, 2][k + 3 - total] || 4);
  }));
  const vivas = [...humanos].some(i => t.rondas[t.rondas.length - 1].some(m => (m.a === i || m.b === i) && m.ganador === null));
  return vivas && t.campeon === null ? null : mejor;
}
function jugarLlave(tipo) {
  const t = tipo === 'copa' ? S.copa : S.torneo, sig = L.siguientePartido(t);
  const humanosDe = e => {
    if (tipo !== 'copa') return S.local.personas.filter(x => x.club === t.equipos[e].club);
    return t.equipos[e].humano === null ? [] : [{ fuente: 'todo' }];
  };
  const hs = [...humanosDe(sig.a).map(h => ({ eq: 0, fuente: h.fuente })), ...humanosDe(sig.b).map(h => ({ eq: 1, fuente: h.fuente }))];
  const ctx = { modo: tipo, titulo: (tipo === 'copa' ? '🏆 ' : '🛋️ ') + L.nombreRonda(t, sig.ronda), equipos: [t.equipos[sig.a].club, t.equipos[sig.b].club], humanos: hs, dificultad: ajustes.nivel, eliminatoria: true, puntua: tipo === 'copa', local: tipo === 'torneo' };
  ctx.alTerminar = r => {
    const p = S.p, pen = p.tanda ? M.ganador(p) : null;
    L.registrarTorneo(U, t, p.eq[0].goles, p.eq[1].goles, pen);
    L.simularIA(U, t);
    if (tipo === 'copa' && t.campeon !== null && t.equipos[t.campeon].humano !== null) { prog.stats.copas++; gritar('¡CAMPEÓN!', L.COPA.nombre, 3000); }

    if (lugar !== null) window.Emocion?.podio(lugar);
    return { podio: lugar !== null, botones: '<button class="btn" data-a="ver-' + tipo + '">▶ Ver la llave</button>' };
  };
  if (tipo === 'copa') { previa(ctx); return; }
  S.ctx = ctx; empezarPartido();
}

  const club = { nombre: c.nombre, corto: c.corto, escudo: { ...c.escudo }, uniforme: { ...c.uniforme }, estadio: c.estadio };
  if (S.clubNuevo) prog.carrera = L.nuevaCarrera(U, { club, semilla: Math.floor(Date.now() % 2147483000) + 1 });

function partidoLocal() {
  const ps = S.local.personas, locales = ps.filter(x => x.lado === 0), visitas = ps.filter(x => x.lado === 1);
  const a = (locales[0] || visitas[0]).club;
  let b = visitas.length && locales.length ? visitas[0].club : rivalAzar(a);
  if (b === a) b = rivalAzar(a);
  const humanos = locales.length ? ps.map(x => ({ eq: x.lado, fuente: x.fuente })) : ps.map(x => ({ eq: 0, fuente: x.fuente }));
  S.ctx = { modo: 'local', titulo: '🛋️ Partido local', equipos: [a, b], humanos, dificultad: ajustes.nivel, local: true, puntua: false };
  S.ctx.alTerminar = () => ({ botones: '<button class="btn" data-a="local">▶ Otra vez</button>' });
  empezarPartido();
}
function torneoLocal(n) {
  const ps = S.local.personas, clubes = [...new Set(ps.map(x => x.club))].slice(0, n);
  const r = M.rngDe(String(Date.now()), 'torneo'), resto = U.clubes.map(c => c.id).filter(x => !clubes.includes(x));
  while (clubes.length < n) clubes.push(resto.splice(Math.floor(r() * resto.length), 1)[0]);
  S.torneo = L.crearTorneo(U, clubes.map(club => ({ club, humano: ps.some(x => x.club === club) ? 0 : null })), String(Date.now()));
  L.simularIA(U, S.torneo);
  verLlave('torneo');
}

    red: () => (S.red ? { rol: S.rol, recibidas: S.red.st.recibidas || 0, ultimaS: S.red.st.ultimaS, ia: !!S.red.st.iaInvitado, caido: S.rol === 'anfitrion' ? S.red.invitadoCaido() : S.red.anfitrionCaido(), aviso: $('red-aviso').classList.contains('hide') ? '' : $('red-aviso').textContent, lat: $('lat').textContent } : null),
  };
}
</script>
