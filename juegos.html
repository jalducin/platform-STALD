<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos · STALD</title>
<meta name="description" content="Aprende jugando: inglés, español, cultura, mente ágil y más.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23db2777'/><text x='32' y='44' font-size='34' text-anchor='middle'>🎮</text></svg>">
<style>
  :root {
    --bg: #f7f5fb; --card: #ffffff; --text: #1e1b2e; --muted: #6b6880; --border: #e6e4f0;
    --accent: #db2777; --accent-2: #7c3aed; --accent-soft: #fce7f3; --ok: #16a34a; --ok-soft: #dcfce7; --bad: #dc2626; --bad-soft: #fee2e2;
    --gold: #f59e0b; --shadow: 0 1px 2px rgba(30, 27, 46, .06), 0 8px 24px rgba(30, 27, 46, .07); --radius: 18px;
    --ingles: #2563eb; --ingles-soft: #dbeafe; --espanol: #ea580c; --espanol-soft: #ffedd5; --cultura: #0d9488; --cultura-soft: #ccfbf1;
    --mente: #7c3aed; --mente-soft: #ede9fe; --clasicos: #db2777; --clasicos-soft: #fce7f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13111c; --card: #1e1b2e; --text: #f4f3fa; --muted: #a8a5bd; --border: #2e2a45; --accent-soft: #45162f;
      --ok-soft: #12351f; --bad-soft: #3b1414; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
      --ingles-soft: #1e2a4d; --espanol-soft: #432411; --cultura-soft: #113b37; --mente-soft: #2e2159; --clasicos-soft: #45162f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(800px 420px at 110% -10%, rgba(219, 39, 119, .14), transparent 60%),
      radial-gradient(700px 400px at -10% 0%, rgba(124, 58, 237, .12), transparent 60%), var(--bg);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45; -webkit-font-smoothing: antialiased;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  [hidden] { display: none !important; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .home-link { font-size: .84rem; font-weight: 700; color: var(--accent-2); text-decoration: none; }
  .chip { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; background: var(--card); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 99px; box-shadow: var(--shadow); }
  .chip-btn { font: inherit; font-size: .8rem; font-weight: 700; color: var(--text); cursor: pointer; }
  .av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--avc); flex-shrink: 0; line-height: 1; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .fotos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
  .fotos-grid .card { text-align: center; padding: 10px; margin: 0; }
  .fotos-grid img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; }
  .av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
  .av-grid button, .col-grid button { font: inherit; font-size: 1.4rem; aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--border); background: var(--card); cursor: pointer; }
  .av-grid button[aria-pressed="true"], .col-grid button[aria-pressed="true"] { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--mente-soft); }
  .col-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); gap: 6px; }
  .menu-musica { position: absolute; right: 0; top: 40px; z-index: 20; background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; width: 210px; display: flex; flex-direction: column; gap: 6px; }
  .mus-opt { flex: 1; font: inherit; font-weight: 700; font-size: .88rem; padding: 9px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; text-align: left; }
  .mus-opt[aria-pressed="true"] { border-color: var(--accent-2); background: var(--mente-soft); }
  .chip .inv { font-size: .66rem; color: var(--muted); font-weight: 700; }
  h1 { font-size: 1.55rem; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .lead { color: var(--muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 4px; margin: 10px 0 6px; }
  .tab { flex: 1; font: inherit; font-weight: 700; font-size: .86rem; padding: 9px 6px; border-radius: 10px; border: none; background: none; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
  .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  .game { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: var(--text); cursor: pointer;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .game:hover { transform: translateY(-2px); border-color: var(--tone); }
  .game:focus-visible, .btn:focus-visible, .opt:focus-visible, .tab:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
  .game .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem; background: var(--tone-soft); }
  .game .t { font-weight: 800; font-size: .95rem; line-height: 1.2; margin-top: 4px; }
  .game .d { font-size: .76rem; color: var(--muted); }
  .game .best { position: absolute; top: 12px; right: 12px; font-size: .7rem; font-weight: 800; color: var(--gold); }
  .cat-ingles { --tone: var(--ingles); --tone-soft: var(--ingles-soft); }
  .cat-espanol { --tone: var(--espanol); --tone-soft: var(--espanol-soft); }
  .cat-cultura { --tone: var(--cultura); --tone-soft: var(--cultura-soft); }
  .cat-mente { --tone: var(--mente); --tone-soft: var(--mente-soft); }
  .cat-clasicos { --tone: var(--clasicos); --tone-soft: var(--clasicos-soft); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 800; font-size: .95rem; border: none; border-radius: 12px;
    padding: 12px 16px; cursor: pointer; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px rgba(219, 39, 119, .25); }
  .btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  .btn.sm { padding: 7px 11px; font-size: .8rem; }
  .btn:disabled { opacity: .55; cursor: default; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .row-btns .btn { flex: 1; }
  label { display: block; font-size: .82rem; font-weight: 700; margin: 10px 0 6px; }
  input[type=email], input[type=text] { width: 100%; font: inherit; font-size: 1rem; padding: 12px 13px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
  input:focus { border-color: var(--accent-2); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .84rem; font-weight: 500; margin: 12px 0; }
  .check input { width: 20px; height: 20px; margin-top: 1px; flex-shrink: 0; }
  .alert { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: .86rem; background: var(--bad-soft); color: var(--bad); }
  .muted { color: var(--muted); font-size: .84rem; }
  .loading { padding: 40px; text-align: center; color: var(--muted); }
  /* Marco de juego */
  .play-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .play-top .t { flex: 1; font-weight: 800; font-size: 1rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat { font-size: .82rem; font-weight: 800; background: var(--card); border: 1px solid var(--border); border-radius: 99px; padding: 5px 10px; white-space: nowrap; }
  .stat.warn { color: var(--bad); border-color: var(--bad); }
  .bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s linear; }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 16px; text-align: center; margin-bottom: 12px; }
  .q-card .big { font-size: 3rem; line-height: 1.1; margin-bottom: 6px; }
  .q-card .q { font-size: 1.2rem; font-weight: 800; }
  .q-card .sub { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .opts { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  .opts.una-col { grid-template-columns: 1fr; }
  .opt { font: inherit; font-weight: 700; font-size: 1rem; padding: 14px 10px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; transition: transform .08s, background .12s, border-color .12s; }
  .opt:hover { border-color: var(--accent-2); }
  .opt:active { transform: scale(.98); }
  .opt .k { display: inline-block; font-size: .7rem; color: var(--muted); margin-right: 6px; }
  .opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .feedback { min-height: 22px; text-align: center; font-size: .86rem; font-weight: 700; margin-top: 10px; }
  .feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
  .flash-ok { animation: pop .35s; } @keyframes pop { 50% { transform: scale(1.04); } }
  /* Memorama */
  .memo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .memo button { aspect-ratio: 1; font: inherit; font-weight: 800; font-size: .82rem; border-radius: 12px; border: 1.5px solid var(--border); cursor: pointer; padding: 4px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: transparent; transition: background .15s; word-break: break-word; }
  .memo button.up, .memo button.done { background: var(--card); color: var(--text); }
  .memo button.done { border-color: var(--ok); background: var(--ok-soft); cursor: default; }
  .memo button .em { display: block; font-size: 1.5rem; }
  /* Ordena */
  .slots { min-height: 58px; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border: 2px dashed var(--border); border-radius: 14px; margin-bottom: 10px; background: var(--card); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .word { font: inherit; font-weight: 700; font-size: .95rem; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .slots .word { background: var(--mente-soft); border-color: var(--mente); }
  /* Simón */
  .simon { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 320px; margin: 0 auto; }
  .simon button { aspect-ratio: 1; border: none; border-radius: 22px; cursor: pointer; opacity: .55; transition: opacity .1s, transform .1s; }
  .simon button.on { opacity: 1; transform: scale(1.04); box-shadow: 0 0 24px currentColor; }
  .simon button:disabled { cursor: default; }
  /* Sopa */
  .sopa { display: grid; gap: 3px; user-select: none; margin: 0 auto 10px; max-width: 420px; }
  .sopa button { aspect-ratio: 1; font: inherit; font-weight: 800; font-size: .9rem; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text); cursor: pointer; padding: 0; }
  .sopa button.sel { background: var(--mente-soft); border-color: var(--mente); }
  .sopa button.found { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .lista-sopa { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-size: .82rem; }
  .lista-sopa span { padding: 4px 9px; border-radius: 99px; background: var(--card); border: 1px solid var(--border); }
  .lista-sopa span.found { text-decoration: line-through; color: var(--ok); border-color: var(--ok); }
  /* Resultado */
  .result { text-align: center; }
  .result .score { font-size: 3rem; font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1; }
  .result .record { display: inline-block; margin-top: 8px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--gold), #ef4444); padding: 4px 12px; border-radius: 99px; }
  .result .pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .burst span { position: absolute; top: -40px; font-size: 1.6rem; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: .2; } }
  /* Ranking */
  .rank { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .rank li { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
  .rank li.yo { border: 2px solid var(--accent-2); }
  .rank .pos { width: 34px; text-align: center; font-weight: 900; font-size: 1.05rem; }
  .rank .n { flex: 1; font-weight: 700; }
  .rank .n small { color: var(--muted); font-weight: 600; }
  .rank .pts { font-weight: 900; }
  table.inv { width: 100%; border-collapse: collapse; font-size: .8rem; }
  table.inv th, table.inv td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); }
  .scroll-x { overflow-x: auto; }
  .kbd-hint { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 8px; }
  .p-share { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 12px; text-align: left; }
  #p-qr { background: #fff; padding: 6px; border-radius: 10px; min-width: 162px; min-height: 162px; }
  .sel { width: 100%; font: inherit; font-size: .95rem; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); }
  /* Sudoku */
  .sdk { display: grid; grid-template-columns: repeat(9, 1fr); max-width: 430px; margin: 8px auto; border: 2px solid var(--text); border-radius: 10px; overflow: hidden; background: var(--card); }
  .sdk button { aspect-ratio: 1; border: 0; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--card); font: inherit; font-size: clamp(1rem, 5.2vw, 1.45rem); font-weight: 700; color: var(--accent-2); padding: 0; cursor: pointer; }
  .sdk button.fija { color: var(--text); }
  .sdk button.bd { border-right: 2px solid var(--text); }
  .sdk button.bb { border-bottom: 2px solid var(--text); }
  .sdk button.zona { background: var(--mente-soft); }
  .sdk button.igual { background: var(--accent-soft); }
  .sdk button.sel { box-shadow: inset 0 0 0 3px var(--accent-2); }
  .sdk button.mal { color: var(--bad); background: var(--bad-soft); }
  .sdk-pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 430px; margin: 10px auto; }
  .sdk-pad button { font: inherit; font-size: 1.25rem; font-weight: 800; padding: 8px 0; border-radius: 12px; border: 2px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .sdk-pad button small { display: block; font-size: .65rem; color: var(--muted); font-weight: 600; }
  .sdk-pad button:disabled { opacity: .35; cursor: default; }
  /* Basta */
  .letra { font-size: 4rem; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .basta-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; }
  .basta-grid label { margin: 0; }
  .basta-res td small { color: var(--muted); }
  /* ¡Una! */
  .una-bots { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .una-bot { flex: 1; min-width: 100px; display: flex; flex-direction: column; font-size: .8rem; font-weight: 700; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; }
  .una-bot.activo { border: 2px solid var(--accent-2); }
  .una-dijo { color: var(--accent); }
  .una-mesa { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 6px 0; }
  .una-card { position: relative; display: inline-grid; place-items: center; width: 54px; height: 80px; border-radius: 10px; background: var(--c); color: #fff; font-size: 1.3rem;
    border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); overflow: hidden; }
  .una-card b { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  .una-card.grande { width: 84px; height: 124px; font-size: 2rem; }
  .una-wild { position: absolute; inset: 0; background: conic-gradient(#ef4444 0 25%, #eab308 0 50%, #22c55e 0 75%, #3b82f6 0); opacity: .9; }
  .una-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
  .una-mazo { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 2.4rem; background: var(--card); border: 1.5px dashed var(--border); border-radius: 12px; padding: 6px 12px; cursor: pointer; color: var(--text); }
  .una-mazo small { font-size: .7rem; font-weight: 700; }
  .una-mazo:disabled { opacity: .5; cursor: default; }
  .una-mano { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
  .una-btn { background: none; border: none; padding: 0; cursor: pointer; transition: transform .12s; }
  .una-btn[data-no] .una-card { opacity: .55; }
  .una-btn .jugable { transform: translateY(-6px); box-shadow: 0 6px 14px rgba(0,0,0,.3); }
  .una-btn.robada { position: relative; } .una-btn.robada::after { content: "🆕"; position: absolute; top: -14px; right: -6px; font-size: .9rem; }
  .una-color { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; margin: 0 4px; cursor: pointer; vertical-align: middle; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .una-grito.pulsa { animation: pulsa .6s infinite alternate; }
  @keyframes pulsa { to { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(219, 39, 119, .25); } }
  .opt[aria-pressed="true"] { border-color: var(--accent-2); background: var(--mente-soft); }
  /* Lotería */
  .lot-top { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; margin-bottom: 10px; }
  .lot-carta { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; text-align: center; min-height: 150px; }
  .lot-carta .big { font-size: 2.6rem; }
  .lot-carta .q { font-size: 1rem; font-weight: 900; }
  .lot-carta .sub { font-size: .76rem; color: var(--muted); }
  .lot-lado { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; }
  .lot-hist { display: flex; gap: 4px; font-size: 1.2rem; flex-wrap: wrap; min-height: 28px; }
  .lot-bot { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; font-weight: 700; }
  .lot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .lot-cell { position: relative; aspect-ratio: .78; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: inherit; cursor: pointer;
    background: var(--card); border: 2px solid var(--border); border-radius: 10px; color: var(--text); padding: 4px; }
  .lot-cell .em { font-size: 1.6rem; }
  .lot-cell .nm { font-size: .6rem; font-weight: 700; text-align: center; line-height: 1.1; }
  .lot-cell.marcada::after { content: "🫘"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 2rem; background: rgba(22, 163, 74, .18); border-radius: 8px; }
  .lot-cell.marcada { border-color: var(--ok); }
  .tiembla { animation: tiembla .35s; }
  @keyframes tiembla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  /* Póker (openspec: poker) */
  .pk-mesa { position: relative; background: radial-gradient(ellipse at center, #1f7a4a 0%, #13603a 60%, #0b3d26 100%); border: 7px solid #6b4423;
    border-radius: 110px / 70px; box-shadow: inset 0 0 28px rgba(0,0,0,.5), var(--shadow); padding: 14px 10px 12px; color: #fff; text-align: center; margin: 6px 0 10px; }
  .pk-titulo { font-size: .68rem; letter-spacing: .25em; text-transform: uppercase; color: #fde68a; opacity: .85; font-weight: 800; }
  .pk-comunes { display: flex; gap: 5px; justify-content: center; min-height: 66px; margin: 6px 0; flex-wrap: wrap; }
  .pk-bote { font-weight: 900; color: #fde68a; }

    background: #fffdf5; border: 2px solid var(--pc); color: var(--pc); font-weight: 900; padding: 4px 2px 3px; box-shadow: 0 2px 6px rgba(0,0,0,.25); line-height: 1; vertical-align: middle; }
  .es-carta .v { font-size: 1.15rem; } .es-carta .p { font-size: 1.25rem; } .es-carta .f { font-size: .5rem; font-weight: 800; letter-spacing: .02em; }
  .es-carta.chica { width: 36px; height: 54px; padding: 2px 1px; } .es-carta.chica .v { font-size: .85rem; } .es-carta.chica .p { font-size: .9rem; } .es-carta.chica .f { display: none; }
  .es-carta.oculta { background: repeating-linear-gradient(45deg, #1e3a8a 0 6px, #1d4ed8 6px 12px); border-color: #fff; color: transparent; }

<body>
<div class="wrap">
  <div class="top">
    <a class="home-link" href="./">← Inicio</a>
    <span style="display:flex;gap:6px;align-items:center;position:relative"><button class="chip chip-btn" id="btn-musica" type="button" aria-label="Música">🔇</button><button class="chip chip-btn" id="chip" type="button" hidden title="Cambiar mi avatar"></button><span id="menu-musica-wrap"></span></span>
  </div>
  <main id="app"><div class="loading">Cargando juegos…</div></main>
</div>

<script src="juegos/cartas.js?v=2"></script>
<script src="juegos/ajedrez.js?v=1"></script>
<script src="comun/auth.js?v=1"></script>
<script>
  // Backend en Deno Deploy (ver docs/deno-deploy-setup.md). `?api=` para probar contra un servidor local.
  const DEFAULT_API = 'https://stald.jalducin.deno.net';
  const API_PARAM = new URLSearchParams(location.search).get('api');
  const API_BASE = (API_PARAM || DEFAULT_API).replace(/\/$/, '');
  const SESSION_KEYS = ['stald_email', 'ingles_email', 'secundaria_email'];
  if (API_PARAM) document.querySelector('.home-link').href = './?api=' + encodeURIComponent(API_PARAM);
  // Enlace de partida: juegos.html?sala=KXQP entra (o registra al invitado) y se une solo.
  const SALA_URL = (new URLSearchParams(location.search).get('sala') || '').trim().toUpperCase();
  let salaPendiente = /^[A-Z]{4}$/.test(SALA_URL) ? SALA_URL : null;
  let abrirAvatar = new URLSearchParams(location.search).get('avatar') === '1';
  // Registro de Juegos en 2 pasos (openspec: registro-juegos-boton): apodo y aviso primero, luego el correo. El
  // apodo espera en este navegador (sin correo) hasta que el enlace confirma la sesión.
  let abrirRegistro = new URLSearchParams(location.search).get('registro') === '1';
  const REGISTRO_KEY = 'juegos_registro';
  const registroPendiente = () => { try { const r = JSON.parse(localStorage.getItem(REGISTRO_KEY) || 'null'); return r && r.apodo && r.acepto === true ? r : null; } catch (e) { return null; } };
  const borrarRegistro = () => { try { localStorage.removeItem(REGISTRO_KEY); } catch (e) { /* sin almacenamiento */ } };

  const app = document.getElementById('app');
  const chip = document.getElementById('chip');
  // Puntos por tipo (openspec: puntos-por-tipo): ⭐ individuales y 👥 partidas; todo suma.
  const state = { email: null, jugador: null, totalIndividual: 0, totalPartidas: 0, pos: null, posPartidas: null, mejores: {}, semana: null, tab: 'juegos', rtipo: 'individual' };
  let limpiezas = []; // timers del juego en curso
  function limpiar() { limpiezas.forEach(f => { try { f(); } catch (e) { /* ya detenido */ } }); limpiezas = []; if (window.speechSynthesis) speechSynthesis.cancel(); }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  const fmt = n => Number(n || 0).toLocaleString('es-MX');
  const barajar = (a, rnd = Math.random) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const tomar = (a, n, rnd = Math.random) => barajar(a, rnd).slice(0, n);
  const sinAcentos = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

  // Cada petición lleva la sesión (Authorization: Bearer, comun/auth.js; openspec: plataforma-login). Sin sesión, durante
  // la transición, se manda el correo guardado de antes como ?email=. Un 401 de sesión lleva a la pantalla de entrada.
  async function api(ruta, opts) {
    const url = API_BASE + (StaldAuth.email() ? ruta : ruta + (ruta.includes('?') ? '&' : '?') + 'email=' + encodeURIComponent(state.email));
    const res = await StaldAuth.fetchConSesion(url, opts);
    const body = await res.json().catch(() => ({}));
    if (StaldAuth.esSesionVencida(res, body) && !state.pidiendoSesion) {
      state.pidiendoSesion = true;
      const eraViejo = !StaldAuth.email();
      StaldAuth.salir().then(() => pantallaLogin(eraViejo ? '🔒 Por seguridad, ahora entras con un enlace que te mandamos a tu correo.' : 'Tu sesión terminó. Vuelve a entrar con tu correo.'));
    }
    return { ok: res.ok, status: res.status, body };
  }
  const post = (ruta, datos) => api(ruta, { method: 'POST', headers: { 'content-type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(datos) });

  const cacheDatos = {};
  async function datos(nombre) {
    if (!cacheDatos[nombre]) cacheDatos[nombre] = fetch('juegos/datos/' + nombre + '.json').then(r => { if (!r.ok) throw new Error('datos ' + nombre); return r.json(); });
    return cacheDatos[nombre];
  }

  // ---------- Sonido (WebAudio, sin archivos) ----------
  let audioCtx = null;
  function tono(freq, ms = 120, tipo = 'sine', vol = .08) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = tipo; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + ms / 1000);
    } catch (e) { /* sin audio */ }
  }
  const sonidoOk = () => { tono(660, 90); setTimeout(() => tono(880, 120), 90); };
  const sonidoMal = () => tono(180, 220, 'square', .05);

  function hablar(texto, lang = 'en-US', rate = .9) {
    if (!window.speechSynthesis) return false;
    if (typeof bajarMusica === 'function') bajarMusica();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = lang; u.rate = rate;
    const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
    return true;
  }

  // ---------- Catálogo ----------
  const CATEGORIAS = [
    { id: 'ingles', titulo: '📘 Inglés', clase: 'cat-ingles' },
    { id: 'espanol', titulo: '📝 Español', clase: 'cat-espanol' },
    { id: 'cultura', titulo: '🧠 Maratón de cultura', clase: 'cat-cultura' },
    { id: 'mente', titulo: '⚡ Mente ágil', clase: 'cat-mente' },
    { id: 'clasicos', titulo: '🎲 Clásicos', clase: 'cat-clasicos' },
  ];
  const JUEGOS = [
    { id: 'en-vocab', cat: 'ingles', emoji: '⏱️', t: 'Vocabulario contra reloj', d: '60 segundos: elige la palabra en inglés.', jugar: () => jugarVocab() },
    { id: 'en-spelling', cat: 'ingles', emoji: '🐝', t: 'Spelling bee', d: 'Escucha y escribe la palabra.', jugar: () => jugarSpelling() },
    { id: 'en-frases', cat: 'ingles', emoji: '🧩', t: 'Completa y responde', d: 'Completa frases y responde preguntas en inglés.', jugar: () => jugarFrases() },
    { id: 'en-memorama', cat: 'ingles', emoji: '🃏', t: 'Memorama', d: 'Une cada palabra con su significado.', jugar: () => jugarMemorama() },
    { id: 'en-ordena', cat: 'ingles', emoji: '🔀', t: 'Ordena la oración', d: 'Arma la oración en inglés.', jugar: () => jugarOrdena('en') },
    { id: 'es-ortografia', cat: 'espanol', emoji: '✍️', t: 'Ortografía', d: 'Letras, acentos, sinónimos y antónimos.', jugar: () => jugarOrtografia() },
    { id: 'es-ordena', cat: 'espanol', emoji: '🔀', t: 'Ordena la oración', d: 'Pon las palabras en orden.', jugar: () => jugarOrdena('es') },
    { id: 'cultura', cat: 'cultura', emoji: '🏃', t: 'Maratón de cultura', d: 'Historia, geografía, ciencias, arte… 3 vidas.', jugar: () => elegirCultura() },
    { id: 'mente-calculo', cat: 'mente', emoji: '🧮', t: 'Cálculo y secuencias', d: '75 segundos: operaciones y ¿qué número sigue?', jugar: () => jugarCalculo() },
    { id: 'mente-simon', cat: 'mente', emoji: '🟢', t: 'Simón dice', d: 'Repite la secuencia de colores.', jugar: () => jugarSimon() },
    { id: 'mente-sopa', cat: 'mente', emoji: '🔎', t: 'Sopa de letras', d: 'Encuentra las palabras en inglés.', jugar: () => jugarSopa() },
    { id: 'mente-sudoku', cat: 'mente', emoji: '🔢', t: 'Sudoku', d: 'Por niveles: fácil, medio, difícil y experto.', jugar: () => elegirSudoku() },
    { id: 'dragon-run', cat: 'mente', emoji: '🐉', t: 'Dragon Run', d: 'Corre, salta (¡doble salto!) y llega al castillo.', jugar: () => jugarDragonRun() },
    { id: 'ajedrez', cat: 'mente', emoji: '♟️', t: 'Ajedrez', d: 'Contra el bot (3 niveles) o 1 vs 1 en partida.', jugar: () => elegirAjedrez() },
    { id: 'basta-es', cat: 'clasicos', emoji: '✋', t: 'Basta', d: 'Nombre, animal, fruta, país… ¡con la letra que salga!', jugar: () => jugarBasta('es') },
    { id: 'basta-en', cat: 'clasicos', emoji: '🗽', t: 'Basta en inglés', d: 'Name, animal, food… in English!', jugar: () => jugarBasta('en') },
    { id: 'una', cat: 'clasicos', emoji: '🃏', t: '¡Una!', d: 'Cartas de colores. Con una carta, ¡presiona el botón UNA!', jugar: () => elegirUna() },
    { id: 'loteria', cat: 'clasicos', emoji: '🎴', t: 'Lotería', d: 'Lotería mexicana bilingüe con gritón.', jugar: () => elegirLoteria() },
    { id: 'poker', cat: 'clasicos', emoji: '♠️', t: 'Póker', d: "Texas Hold'em estilo Casino Royale, con fichas de juego.", jugar: () => elegirPoker() },
    { id: 'brisca', cat: 'clasicos', emoji: '🏆', t: 'Brisca', d: 'Baraja española: gana rondas con el triunfo. Solo, contra 2 o en pareja.', jugar: () => elegirBrisca() },
    { id: 'conquian', cat: 'clasicos', emoji: '🪙', t: 'Conquián', d: 'Baraja española: baja tercias y escaleras hasta juntar 9 cartas.', jugar: () => elegirConquian() },
  ];
  const juegoPorId = id => JUEGOS.find(j => j.id === id);

  // ---------- Sesión ----------
  // Foto del avatar (openspec: avatar-foto): si ya no existe, queda el personaje.
  const fotoSrc = av => av.fotoUrl || (API_BASE + '/juegos/foto/' + encodeURIComponent(av.foto));
  const avatarHtml = (av, px = 26) => av ? '<span class="av" style="--avc:' + escapeHtml(av.color) + ';width:' + px + 'px;height:' + px + 'px;font-size:' + Math.round(px * 0.58) + 'px" aria-hidden="true">' +
    (av.foto || av.fotoUrl ? '<img src="' + escapeHtml(fotoSrc(av)) + '" alt="" data-e="' + escapeHtml(av.emoji) + '" onerror="this.replaceWith(document.createTextNode(this.dataset.e))">' : escapeHtml(av.emoji)) + '</span>' : '';

  // Recorta al centro y reduce a 128×128 JPEG (≤ 40 KB); el canvas descarta los metadatos.
  async function fotoAvatar(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('formato')); i.src = url; });
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const g = c.getContext('2d'), lado = Math.min(img.naturalWidth, img.naturalHeight);
      g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128);
      g.drawImage(img, (img.naturalWidth - lado) / 2, (img.naturalHeight - lado) / 2, lado, lado, 0, 0, 128, 128);
      for (const q of [0.82, 0.6, 0.4]) { const d = c.toDataURL('image/jpeg', q); if (d.length <= 40000) return d; }
      throw new Error('grande');
    } finally { URL.revokeObjectURL(url); }
  }

  function pantallaAvatar() {
    limpiar();
    const listas = state.avatares || { emojis: [], colores: [] };
    let sel = Object.assign({}, state.jugador.avatar || { emoji: listas.emojis[0], color: listas.colores[0] });
    let fotoNueva = null, permiso = false; // modo foto: sel.foto (actual) o fotoNueva (data URL)
    const pintar = () => {
      const vista = fotoNueva ? Object.assign({}, sel, { fotoUrl: fotoNueva }) : sel;
      app.innerHTML = '<div class="card"><h1>🎨 Tu avatar</h1><p class="lead">Elige un personaje y un color, o sube una foto. Así te verán en el ranking y en las partidas.</p>' +
        '<div style="display:flex;justify-content:center;margin:6px 0 14px" id="av-vista">' + avatarHtml(vista, 96) + '</div>' +
        '<label>Personaje</label><div class="av-grid">' + listas.emojis.map(e => '<button type="button" data-av-emoji="' + escapeHtml(e) + '" aria-pressed="' + (e === sel.emoji) + '">' + escapeHtml(e) + '</button>').join('') + '</div>' +
        '<label>Color</label><div class="col-grid">' + listas.colores.map(c => '<button type="button" data-av-color="' + escapeHtml(c) + '" aria-pressed="' + (c === sel.color) + '" style="background:' + escapeHtml(c) + '" aria-label="Color ' + escapeHtml(c) + '"></button>').join('') + '</div>' +
        '<label>📷 O sube una foto de tu galería</label><input type="file" id="av-file" accept="image/*">' +
        '<label class="check"><input id="av-permiso" type="checkbox"' + (permiso ? ' checked' : '') + '><span>Tengo permiso de mi mamá, papá o tutor para usar esta imagen.</span></label>' +
        '<p class="muted" style="margin:4px 0 0">Se ve pequeña en el ranking y las partidas. Elegir un personaje o color quita la foto.</p>' +
        '<div class="row-btns"><button class="btn ghost" data-a="hub">Cancelar</button><button class="btn" data-av-guardar>Guardar</button></div><div id="av-msg"></div></div>';
    };
    pintar();
    const avMsg = t => { document.getElementById('av-msg').innerHTML = '<div class="alert">' + escapeHtml(t) + '</div>'; };
    app.onchange = async e => {
      if (e.target.id === 'av-permiso') permiso = e.target.checked;
      if (e.target.id === 'av-file' && e.target.files[0]) {
        try { fotoNueva = await fotoAvatar(e.target.files[0]); pintar(); }
        catch (err) { avMsg(err.message === 'grande' ? 'La imagen es demasiado pesada. Prueba con otra.' : 'No se pudo leer esa imagen. Prueba con una foto JPG o PNG.'); }
      }
    };
    app.onclick = async e => {
      const em = e.target.closest('[data-av-emoji]'), co = e.target.closest('[data-av-color]'), gu = e.target.closest('[data-av-guardar]');
      if (em) { sel.emoji = em.dataset.avEmoji; delete sel.foto; fotoNueva = null; pintar(); }
      if (co) { sel.color = co.dataset.avColor; delete sel.foto; fotoNueva = null; pintar(); }
      if (gu) {
        if (fotoNueva && !permiso) { avMsg('Marca la casilla de permiso para usar tu foto.'); return; }
        gu.disabled = true;
        const r = fotoNueva ? await post('/juegos/foto', { imagen: fotoNueva, acepto: true })
          : sel.foto ? { ok: true, body: { avatar: state.jugador.avatar } } // sin cambios: conserva su foto
          : await post('/juegos/avatar', { emoji: sel.emoji, color: sel.color });
        if (!r.ok) { document.getElementById('av-msg').innerHTML = '<div class="alert">No se pudo guardar (' + escapeHtml(r.body.error || r.status) + ').</div>'; gu.disabled = false; return; }
        state.jugador.avatar = r.body.avatar; pintarChip(); app.onclick = null; app.onchange = null; pantallaHub();
      }
      if (e.target.closest('[data-a="hub"]')) { app.onclick = null; app.onchange = null; }
    };
  }

  function pintarChip() {
    if (!state.jugador) { chip.hidden = true; return; }
    chip.hidden = false;
    chip.innerHTML = avatarHtml(state.jugador.avatar, 22) + ' ' + escapeHtml(state.jugador.nombre) + (state.jugador.tipo === 'invitado' ? ' <span class="inv">INVITADO</span>' : '') +
      ' · ⭐ ' + fmt(state.totalIndividual) + ' · 👥 ' + fmt(state.totalPartidas) + (state.pos ? ' · #' + state.pos : '');
  }

  async function cargarYo() {
    const r = await api('/juegos/yo');
    if (r.ok) {
      Object.assign(state, { jugador: r.body.jugador, totalIndividual: r.body.totalIndividual || 0, totalPartidas: r.body.totalPartidas || 0, pos: r.body.pos, posPartidas: r.body.posPartidas, mejores: r.body.mejores, semana: r.body.semana, avatares: r.body.avatares });
      pintarChip();
    }
    return r;
  }

  async function iniciar() {
    app.innerHTML = '<div class="loading">Cargando juegos…</div>';
    await StaldAuth.iniciar(API_BASE);
    state.pidiendoSesion = false;
    state.email = StaldAuth.email() || StaldAuth.correoViejo();
    if (!state.email) { if (abrirRegistro) { abrirRegistro = false; return pantallaRegistro(); } return pantallaLogin(); }
    try {
      const r = await cargarYo();
      if (state.pidiendoSesion) return; // 401: ya se muestra la pantalla de entrada
      if (r.status === 403 && r.body.error === 'no_registrado') {
        const reg = registroPendiente();
        if (!reg) return pantallaInvitado();
        // Correo confirmado: se crea la cuenta con el apodo que eligió antes.
        const alta = await post('/juegos/invitado', { nombre: reg.apodo, acepto: true });
        borrarRegistro();
        if (!alta.ok) return pantallaInvitado('No se pudo crear tu cuenta (' + (alta.body.error || alta.status) + '). Intenta de nuevo.');
        return iniciar();
      }
      if (!r.ok) throw new Error(r.body.error || ('HTTP ' + r.status));
      borrarRegistro(); // ya tenía cuenta (alumno, alumna o invitado): no hay nada que registrar
      if (salaPendiente) { const c = salaPendiente; salaPendiente = null; return unirseCodigo(c); }
      if (abrirAvatar) { abrirAvatar = false; return pantallaAvatar(); }
      pantallaHub();
    } catch (e) {
      const txt = e.message === 'mucho_trafico' ? '⏳ Hay mucha actividad en este momento. Intenta de nuevo en unos minutos.' : '⚠️ No pude conectarme (' + escapeHtml(e.message) + ').';
      app.innerHTML = '<div class="card"><div class="alert">' + txt + '</div><div class="row-btns"><button class="btn" data-a="reintentar">Reintentar</button></div></div>';
    }
  }

  // Entrada con enlace mágico o código (comun/auth.js). El enlace regresa a esta misma URL (conserva ?sala=).
  function pantallaLogin(msg) {
    limpiar(); chip.hidden = true;
    StaldAuth.pintarEntrada(app, {
      titulo: '🎮 Juegos',
      texto: salaPendiente ? '🎉 Te invitaron a la partida ' + salaPendiente + '. Escribe tu correo y te mandamos un enlace para entrar y unirte.' : 'Aprende jugando. Escribe tu correo y te mandamos un enlace para entrar, sin contraseña. ¿Primera vez? Así también creas tu cuenta de Juegos en un minuto.',
      correo: state.email || '',
      aviso: msg,
      alEntrar: () => iniciar(),
      pie: salaPendiente ? '' : '<div class="card registro-cta" id="registro-cta"><b>🆕 ¿Primera vez en Juegos?</b><p class="muted" style="margin:4px 0 10px">Crea tu cuenta con tu correo y un apodo, sin contraseña y sin estar en las clases.</p><button class="btn ghost" type="button" data-a="registro">🆕 Registrarme en Juegos</button></div>',
    });
  }

  // Registro, paso 1: apodo y aviso. Paso 2: la entrada con correo (enlace o código) de comun/auth.js.
  function pantallaRegistro(msg) {
    limpiar(); chip.hidden = true;
    let r = null; try { r = JSON.parse(localStorage.getItem(REGISTRO_KEY) || 'null'); } catch (e) { /* sin almacenamiento */ }
    app.innerHTML = '<div class="card"><h1>🆕 Crea tu cuenta de Juegos</h1><p class="lead">Paso 1 de 2: elige cómo te llamamos en el ranking.</p>' +
      '<form id="f-registro" novalidate><label for="reg-apodo">Tu apodo</label><input id="reg-apodo" type="text" maxlength="20" placeholder="Ej. Leo" autocomplete="nickname" value="' + escapeHtml(r ? r.apodo : '') + '">' +
      '<label class="check"><input id="reg-acepto" type="checkbox"><span>Acepto que se guarde mi correo y mis puntos para registrar mi avance y mejorar la plataforma.</span></label>' +
      '<div class="row-btns"><button class="btn ghost" type="button" data-a="ya-tengo">Ya tengo cuenta</button><button class="btn" type="submit">Continuar →</button></div></form>' +

      '<form id="f-invitado" novalidate><label for="apodo">¿Cómo te llamamos? (apodo)</label><input id="apodo" type="text" maxlength="20" placeholder="Ej. Leo" autocomplete="nickname">' +

  // ---------- Hub ----------
  function pantallaHub(tab) {
    limpiar();
    state.tab = tab || state.tab || 'juegos';
    const admin = state.jugador && state.jugador.tipo === 'admin';
    const tabs = '<div class="tabs" role="tablist">' +
      ['juegos:🎮 Juegos', 'partidas:👥 Partidas', 'ranking:🏆 Ranking'].concat(admin ? ['invitados:📋 Invitados', 'fotos:📷 Fotos'] : []).map(x => {
        const [id, t] = x.split(':');
        return '<button class="tab" role="tab" data-tab="' + id + '" aria-selected="' + (state.tab === id) + '">' + t + '</button>';
      }).join('') + '</div>';
    app.innerHTML = '<h1>🎮 Juegos</h1><p class="lead">Aprende jugando y suma puntos para el ranking de la semana.</p>' +
      '<div class="row-btns" style="margin:-6px 0 12px"><button class="btn ghost" type="button" id="registrar-btn" data-a="registrar">🆕 Registrar</button></div>' +
      tabs + '<div id="tab-body"></div>';
    if (state.tab === 'ranking') return pintarRanking();
    if (state.tab === 'partidas') return pintarPartidas();
    if (state.tab === 'invitados') return pintarInvitados();
    if (state.tab === 'fotos') return pintarFotos();
    document.getElementById('tab-body').innerHTML = CATEGORIAS.map(c => {
      const js = JUEGOS.filter(j => j.cat === c.id);

      return '<h2>' + c.titulo + '</h2><div class="grid">' + js.map(j => {
        const best = state.mejores[j.id];

  function rangoSemana(lunes) {
    const d = new Date(lunes + 'T12:00:00'); const f = new Date(d); f.setDate(d.getDate() + 6);
    const o = { day: 'numeric', month: 'short' };
    return d.toLocaleDateString('es-MX', o) + ' al ' + f.toLocaleDateString('es-MX', o);
  }

          (x.tipo === 'invitado' ? ' <small>(invitado)</small>' : '') + '<br><small>' + x.partidas + ' partida(s)</small></span><span class="pts">' + ico + ' ' + fmt(x.total) + '</span></li>').join('') + '</ol>'
        : '<div class="card muted" style="text-align:center">' + (tipo === 'partidas' ? 'Nadie ha jugado partidas esta semana. ¡Crea una en 👥 Partidas! 🚀' : 'Nadie ha jugado esta semana. ¡Estrena el ranking! 🚀') + '</div>') +
      (r.body.yo.pos && r.body.yo.pos > 20 ? '<p class="muted">Tu lugar: #' + r.body.yo.pos + ' con ' + ico + ' ' + fmt(r.body.yo.total) + '</p>' : '');

        lista.map(x => '<tr><td>' + escapeHtml(x.email) + '</td><td>' + escapeHtml(x.nombre) + '</td><td>' + x.visitas + '</td><td>' + escapeHtml(fecha(x.ultimaVisita)) + '</td><td>' + fmt(x.puntosSemana) + '</td></tr>').join('') +

        '<small class="muted">' + escapeHtml(fecha(f.en)) + '</small><div><button class="btn ghost sm" data-quitar-foto="' + escapeHtml(f.id) + '">🗑️ Quitar</button></div></div>').join('') + '</div>';

  async function quitarFoto(b) {
    if (!confirm('¿Quitar esta foto? El jugador volverá a su personaje.')) return;
    b.disabled = true;
    const r = await post('/juegos/fotos/quitar', { id: b.dataset.quitarFoto });
    if (!r.ok) { b.disabled = false; alert('No se pudo quitar (' + (r.body.error || r.status) + ').'); return; }
    if (b.dataset.quitarFoto === state.jugador.id) { delete state.jugador.avatar.foto; pintarChip(); }
    pintarFotos();

  function descargarCsv() {
    const filas = [['correo', 'apodo', 'registrado', 'ultima_visita', 'visitas', 'puntos_semana']].concat((state.invitadosLista || []).map(x => [x.email, x.nombre, x.registradoEn, x.ultimaVisita, x.visitas, x.puntosSemana]));
    const csv = filas.map(f => f.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
    a.download = 'invitados-juegos.csv'; a.click();
  }

  // ---------- Marco común y resultado ----------
  function marco(id, extra) {
    const j = juegoPorId(id);
    const tone = (CATEGORIAS.find(c => c.id === j.cat) || {}).clase || '';
    app.innerHTML = '<div class="' + tone + '"><div class="play-top"><button class="btn ghost sm" data-a="salir" aria-label="Salir">✕</button><span class="t">' + j.emoji + ' ' + escapeHtml(j.t) + '</span>' +
      '<span class="stat" id="m-tiempo" hidden></span><span class="stat" id="m-vidas" hidden></span><span class="stat" id="m-puntos">⭐ 0</span></div>' +
      '<div class="bar" id="m-bar" hidden><span style="width:100%"></span></div><div id="m-body"></div></div>';
    const $ = s => document.getElementById(s);
    return {
      body: $('m-body'),
      puntos: n => { $('m-puntos').textContent = '⭐ ' + fmt(n); },
      vidas: n => { const e = $('m-vidas'); e.hidden = false; e.textContent = '❤️'.repeat(Math.max(0, n)) + '🖤'.repeat(Math.max(0, (extra && extra.vidas || 3) - n)); },
      tiempo: (s, total) => {
        const e = $('m-tiempo'); e.hidden = false; e.textContent = '⏱ ' + Math.max(0, Math.ceil(s)); e.classList.toggle('warn', s <= 10);
        if (total) { $('m-bar').hidden = false; $('m-bar').firstChild.style.width = Math.max(0, s / total * 100) + '%'; }
      },
    };
  }

  // Cuenta regresiva; devuelve la función para detenerla.
  // Las pruebas E2E pueden acelerar los relojes con window.__TIEMPO_JUEGOS (p. ej. 0.1); para quien juega vale 1.
  const TIEMPO = Number(window.__TIEMPO_JUEGOS) || 1;
  function reloj(segundos, onTick, onFin) {
    const fin = Date.now() + segundos * 1000 * TIEMPO;
    const t = setInterval(() => {
      const quedan = (fin - Date.now()) / 1000 / TIEMPO;
      onTick(quedan);
      if (quedan <= 0) { clearInterval(t); onFin(); }
    }, 200);
    onTick(segundos);
    const stop = () => clearInterval(t);
    limpiezas.push(stop);
    return stop;
  }

  async function terminar(id, r) {
    limpiar();
    const j = juegoPorId(id);
    app.innerHTML = '<div class="card result"><div class="loading">Guardando tus puntos…</div></div>';
    const puntos = Math.max(0, Math.round(r.puntos));
    let s = null;
    try {
      const res = await post('/juegos/partida', { juego: id, puntos, aciertos: r.aciertos || 0, total: r.total || 0, segundos: Math.round(r.segundos || 0) });
      s = res.ok ? res.body : { error: res.body.error || res.status };
    } catch (e) { s = { error: e.message }; }
    if (s && s.guardado) {
      state.totalIndividual = s.totalIndividual; state.totalPartidas = s.totalPartidas; state.pos = s.pos; state.mejores[id] = s.mejor; pintarChip();
    }
    app.innerHTML = '<div class="card result"><div style="font-size:2.4rem">' + j.emoji + '</div><h1>' + escapeHtml(r.titulo || '¡Terminaste!') + '</h1>' +
      '<div class="score">' + fmt(s && s.guardado ? s.puntos : puntos) + '</div><div class="muted">puntos</div>' +
      (s && s.nuevoRecord ? '<div class="record">🏅 ¡Nuevo récord personal!</div>' : '') +
      '<div class="pills">' + (r.total ? '<span class="stat">✅ ' + r.aciertos + ' de ' + r.total + '</span>' : '') +
      (s && s.guardado ? '<span class="stat">➕ ' + fmt(s.puntos) + ' a tus individuales</span><span class="stat">⭐ ' + fmt(s.totalIndividual) + ' en la semana</span>' + (s.pos ? '<span class="stat">🏆 #' + s.pos + ' de la semana</span>' : '') : '') + '</div>' +
      (r.detalle ? '<div class="muted" style="margin-top:12px">' + r.detalle + '</div>' : '') +
      (s && s.guardado ? '' : '<div class="alert">No se guardaron tus puntos (' + escapeHtml(s && s.error) + '). ' + (s && s.error === 'limite_diario' ? 'Llegaste al límite de partidas de hoy.' : 'Revisa tu conexión.') + '</div>') +
      '<div class="row-btns"><button class="btn ghost" data-a="hub">🎮 Otros juegos</button><button class="btn" data-juego="' + id + '">🔁 Jugar otra vez</button></div></div>';
    if (s && s.nuevoRecord) confeti();
  }

  function confeti() {
    const b = document.createElement('div'); b.className = 'burst';
    b.innerHTML = Array.from({ length: 24 }, () => '<span style="left:' + Math.random() * 100 + '%;animation-delay:' + Math.random() * .6 + 's">' + ['🎉', '⭐', '✨', '🏅'][Math.floor(Math.random() * 4)] + '</span>').join('');
    document.body.appendChild(b); setTimeout(() => b.remove(), 2600);
  }

  // ---------- Motor quiz (opción múltiple) ----------
  // opts: id, modo 'reloj' | 'vidas', segundos (reloj), porPregunta (vidas), siguiente() → { big, q, sub, opciones, correcta, explicacion } | null
  function quiz(opts) {
    const m = marco(opts.id, { vidas: 3 });
    let puntos = 0, aciertos = 0, total = 0, racha = 0, vidas = 3, actual = null, bloqueado = false, inicioQ = 0, stopQ = null, terminado = false;
    const t0 = Date.now();
    const acabar = (titulo) => {
      if (terminado) return; terminado = true;
      terminar(opts.id, { puntos, aciertos, total, segundos: (Date.now() - t0) / 1000, titulo, detalle: opts.detalle ? opts.detalle({ aciertos, total }) : '' });
    };
    if (opts.modo === 'vidas') m.vidas(vidas);
    else reloj(opts.segundos || 60, s => m.tiempo(s, opts.segundos || 60), () => acabar('⏰ ¡Se acabó el tiempo!'));
    function pintar() {
      actual = opts.siguiente(total);
      if (!actual) return acabar(opts.modo === 'vidas' ? '🏁 ¡Llegaste a la meta!' : '¡Terminaste!');
      bloqueado = false; inicioQ = Date.now();
      const opciones = actual.opciones;
      m.body.innerHTML = '<div class="q-card">' + (actual.big ? '<div class="big">' + escapeHtml(actual.big) + '</div>' : '') +
        '<div class="q">' + escapeHtml(actual.q) + '</div>' + (actual.sub ? '<div class="sub">' + escapeHtml(actual.sub) + '</div>' : '') + '</div>' +
        '<div class="opts' + (opciones.some(o => String(o).length > 18) ? ' una-col' : '') + '">' +
        opciones.map((o, i) => '<button class="opt" data-opt="' + i + '"><span class="k">' + (i + 1) + '</span>' + escapeHtml(o) + '</button>').join('') + '</div>' +
        '<div class="feedback" id="fb"></div><div class="kbd-hint">Tip: usa las teclas 1–' + opciones.length + '</div>';

  // ---------- Mente ágil ----------
  // Operación n (la dificultad sube con n). `aleatorio` permite semilla en partidas.
  function genCalculo(n, aleatorio = Math.random) {
    const rnd = (a, b) => a + Math.floor(aleatorio() * (b - a + 1));
    const nivel = Math.min(4, Math.floor(n / 5));
    const ops = nivel < 1 ? ['+', '−'] : nivel < 2 ? ['+', '−', '×'] : ['+', '−', '×', '÷'];
    const op = ops[rnd(0, ops.length - 1)];
    let a, b, r;
    const max = [10, 20, 50, 100, 200][nivel];
    if (op === '+') { a = rnd(1, max); b = rnd(1, max); r = a + b; }
    if (op === '−') { a = rnd(2, max); b = rnd(1, a); r = a - b; }
    if (op === '×') { a = rnd(2, nivel < 3 ? 10 : 15); b = rnd(2, 10); r = a * b; }
    if (op === '÷') { b = rnd(2, 10); r = rnd(2, 12); a = b * r; }
    const dis = new Set();
    while (dis.size < 3) { const x = r + [1, -1, 2, -2, 10, -10, 5][rnd(0, 6)]; if (x !== r && x >= 0) dis.add(x); }
    return conOpciones({ big: '🧮', q: a + ' ' + op + ' ' + b + ' = ?', explicacion: a + ' ' + op + ' ' + b + ' = ' + r }, String(r), [...dis].map(String), aleatorio);
  }
  // Cálculo y secuencias (openspec: juegos-fusion): cada tercera pregunta es una secuencia.
  function jugarCalculo() {
    quiz({ id: 'mente-calculo', modo: 'reloj', segundos: 75, siguiente: n => n % 3 === 2 ? genSecuencia(Math.floor(n / 3)) : genCalculo(n) });
  }

  function genSecuencia(n, aleatorio = Math.random) {
    const rnd = (a, b) => a + Math.floor(aleatorio() * (b - a + 1));
    const tipos = [
      () => { const a = rnd(1, 20), k = rnd(2, 9); return { s: [0, 1, 2, 3].map(i => a + k * i), r: a + 4 * k, regla: 'sumar ' + k }; },
      () => { const a = rnd(60, 99), k = rnd(2, 9); return { s: [0, 1, 2, 3].map(i => a - k * i), r: a - 4 * k, regla: 'restar ' + k }; },
      () => { const a = rnd(1, 5), k = rnd(2, 3); return { s: [0, 1, 2, 3].map(i => a * k ** i), r: a * k ** 4, regla: 'multiplicar por ' + k }; },
      () => { const a = rnd(1, 6); return { s: [0, 1, 2, 3].map(i => (a + i) ** 2), r: (a + 4) ** 2, regla: 'cuadrados' }; },
      () => { let x = rnd(1, 4), y = rnd(1, 5); const s = [x, y]; while (s.length < 5) s.push(s[s.length - 1] + s[s.length - 2]); return { s: s.slice(0, 4), r: s[4], regla: 'sumar los dos anteriores' }; },
      () => { const a = rnd(1, 9), k = rnd(1, 4); return { s: [a, a + k, a + 3 * k, a + 6 * k], r: a + 10 * k, regla: 'sumar ' + k + ', ' + 2 * k + ', ' + 3 * k + '…' }; },
    ];
    const g = tipos[rnd(0, Math.min(tipos.length - 1, 1 + Math.floor(n / 3)))]();
    const dis = new Set();
    while (dis.size < 3) { const x = g.r + [1, -1, 2, -2, 3, 5, -5, 10][rnd(0, 7)]; if (x !== g.r) dis.add(x); }
    return conOpciones({ big: '🔢', q: g.s.join(', ') + ', ?', sub: '¿Qué número sigue?', explicacion: 'Era ' + g.r + ' (' + g.regla + ')' }, String(g.r), [...dis].map(String), aleatorio);
  }

    const candidatas = barajar(d.vocabulario.filter(v => /^[a-z]{3,8}$/.test(v.en)));
    const grid = Array.from({ length: N }, () => Array(N).fill(''));
    const dirs = [[0, 1], [1, 0], [1, 1], [-1, 1]];
    const puestas = [];
    for (const w of candidatas) {
      if (puestas.length >= 6) break;
      const W = w.en.toUpperCase();
      for (let intento = 0; intento < 60; intento++) {
        const [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)];
        const r0 = Math.floor(Math.random() * N), c0 = Math.floor(Math.random() * N);
        const celdas = [...W].map((_, k) => [r0 + dr * k, c0 + dc * k]);
        if (celdas.every(([r, c], k) => r >= 0 && r < N && c >= 0 && c < N && (!grid[r][c] || grid[r][c] === W[k]))) {
          celdas.forEach(([r, c], k) => { grid[r][c] = W[k]; });
          puestas.push({ w, W, celdas, found: false });
          break;
        }
      }
    }
    const letras = 'ABCDEFGHIJKLMNOPRSTUVWY';
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!grid[r][c]) grid[r][c] = letras[Math.floor(Math.random() * letras.length)];
    const m = marco('mente-sopa');
    const TOT = 180;
    let inicio = null, encontradas = 0, terminado = false;
    const t0 = Date.now();
    const fin = () => {
      if (terminado) return; terminado = true;
      const seg = (Date.now() - t0) / 1000;
      const bono = encontradas === puestas.length ? Math.max(0, Math.round(TOT - seg)) * 3 : 0;
      terminar('mente-sopa', { puntos: encontradas * 150 + bono, aciertos: encontradas, total: puestas.length, segundos: seg, titulo: '🔎 Sopa de letras', detalle: encontradas === puestas.length ? '¡Las encontraste todas! Bono de tiempo: ' + bono : '' });
    };
    reloj(TOT, s => m.tiempo(s, TOT), fin);
    m.body.innerHTML = '<p class="muted" style="text-align:center;margin-top:0">Toca la primera y la última letra de cada palabra en inglés.</p>' +
      '<div class="sopa" style="grid-template-columns:repeat(' + N + ',1fr)">' + grid.flatMap((fila, r) => fila.map((l, c) => '<button data-r="' + r + '" data-c="' + c + '">' + l + '</button>')).join('') + '</div>' +
      '<div class="lista-sopa">' + puestas.map((p, i) => '<span id="sopa-w' + i + '">' + escapeHtml(p.w.emoji + ' ' + p.w.es) + '</span>').join('') + '</div>';
    const celda = (r, c) => m.body.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-r]'); if (!b || terminado) return;
      const r = Number(b.dataset.r), c = Number(b.dataset.c);
      if (!inicio) { inicio = [r, c]; b.classList.add('sel'); return; }
      celda(inicio[0], inicio[1]).classList.remove('sel');
      const [r0, c0] = inicio; inicio = null;
      const hit = puestas.findIndex(p => !p.found && ((p.celdas[0][0] === r0 && p.celdas[0][1] === c0 && p.celdas.at(-1)[0] === r && p.celdas.at(-1)[1] === c) ||
        (p.celdas.at(-1)[0] === r0 && p.celdas.at(-1)[1] === c0 && p.celdas[0][0] === r && p.celdas[0][1] === c)));
      if (hit >= 0) {
        const p = puestas[hit]; p.found = true; encontradas++;
        p.celdas.forEach(([rr, cc]) => celda(rr, cc).classList.add('found'));
        const s = document.getElementById('sopa-w' + hit); s.classList.add('found'); s.textContent = p.w.emoji + ' ' + p.w.es + ' = ' + p.W;
        m.puntos(encontradas * 150); sonidoOk();
        if (encontradas === puestas.length) setTimeout(fin, 700);
      } else sonidoMal();
    });
  }

  // ---------- Mente ágil: Sudoku por niveles (openspec: sudoku-niveles) ----------
  const SUDOKU_NIVELES = {
    facil: { t: 'Fácil', emoji: '🟢', pistas: 40, base: 400, limite: 600 },
    medio: { t: 'Medio', emoji: '🟡', pistas: 32, base: 700, limite: 900 },
    dificil: { t: 'Difícil', emoji: '🟠', pistas: 27, base: 1000, limite: 1200 },
    experto: { t: 'Experto', emoji: '🔴', pistas: 23, base: 1400, limite: 1500 },
  };
  const sdkPuede = (g, i, v) => {
    const r = Math.floor(i / 9), c = i % 9, br = r - r % 3, bc = c - c % 3;
    for (let k = 0; k < 9; k++) if (g[r * 9 + k] === v || g[k * 9 + c] === v || g[(br + Math.floor(k / 3)) * 9 + bc + k % 3] === v) return false;
    return true;
  };
  // Tablero resuelto al azar (backtracking con números barajados).
  function sudokuResuelto(rnd = Math.random) {
    const g = Array(81).fill(0);
    const llenar = i => {
      if (i === 81) return true;
      for (const v of barajar([1, 2, 3, 4, 5, 6, 7, 8, 9], rnd)) if (sdkPuede(g, i, v)) { g[i] = v; if (llenar(i + 1)) return true; g[i] = 0; }
      return false;
    };
    llenar(0);
    return g;
  }
  // Cuenta soluciones hasta `tope` (la celda con menos candidatos primero).
  function contarSoluciones(g0, tope = 2) {
    const g = g0.slice(); let n = 0;
    const buscar = () => {
      let mejor = -1, cands = null;
      for (let i = 0; i < 81; i++) {
        if (g[i]) continue;
        const cs = []; for (let v = 1; v <= 9; v++) if (sdkPuede(g, i, v)) cs.push(v);
        if (!cs.length) return;
        if (!cands || cs.length < cands.length) { mejor = i; cands = cs; if (cs.length === 1) break; }
      }
      if (mejor === -1) { n++; return; }
      for (const v of cands) { g[mejor] = v; buscar(); g[mejor] = 0; if (n >= tope) return; }
    };
    buscar();
    return n;
  }
  // Quita números al azar mientras haya una sola solución, hasta las pistas del nivel.
  function generarSudoku(nivel, rnd = Math.random) {
    const sol = sudokuResuelto(rnd), g = sol.slice();
    let pistas = 81;
    for (const i of barajar([...Array(81).keys()], rnd)) {
      if (pistas <= SUDOKU_NIVELES[nivel].pistas) break;
      const v = g[i]; g[i] = 0;
      if (contarSoluciones(g, 2) === 1) pistas--; else g[i] = v;
    }
    return { puzzle: g, sol };
  }
  const puntosSudoku = (nivel, seg, errores) => {
    const n = SUDOKU_NIVELES[nivel];
    return Math.max(Math.round(n.base * 0.2), Math.round(n.base * (1 + 0.4 * Math.max(0, 1 - seg / n.limite))) - 40 * errores);
  };

  function elegirSudoku() {
    const m = marco('mente-sudoku');
    let nivel = 'facil';
    m.body.innerHTML = '<div class="q-card"><div class="big">🔢</div><div class="q">Sudoku</div><div class="sub">Llena el tablero: cada fila, columna y caja de 3×3 lleva los números del 1 al 9 sin repetir. Tienes 3 vidas.</div></div>' +
      '<label>Nivel</label><div class="opts">' + Object.entries(SUDOKU_NIVELES).map(([id, n]) => '<button class="opt" data-sdk-nivel="' + id + '" aria-pressed="' + (id === nivel) + '">' + n.emoji + ' ' + n.t + '<br><small>' + n.pistas + ' pistas · hasta ⭐ ' + fmt(puntosSudoku(id, 0, 0)) + '</small></button>').join('') + '</div>' +
      '<div class="row-btns"><button class="btn" data-sdk-go>Empezar</button></div>';
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-sdk-nivel]');
      if (b) { nivel = b.dataset.sdkNivel; m.body.querySelectorAll('[data-sdk-nivel]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
      if (e.target.closest('[data-sdk-go]')) { m.body.innerHTML = '<div class="loading">Armando tu tablero…</div>'; setTimeout(() => jugarSudoku(nivel), 30); }
    });
  }

  function jugarSudoku(nivel) {
    const N = SUDOKU_NIVELES[nivel];
    const { puzzle, sol } = generarSudoku(nivel);
    window.__sudoku = { puzzle, sol, nivel }; // para pruebas E2E
    const m = marco('mente-sudoku', { vidas: 3 });
    const g = puzzle.slice();
    let sel = g.findIndex(v => !v), errores = 0, terminado = false;
    const t0 = Date.now();
    m.vidas(3);
    const segundos = () => (Date.now() - t0) / 1000 / TIEMPO;
    const tTimer = setInterval(() => { const e = document.getElementById('m-tiempo'); if (!e) return; const sg = Math.floor(segundos()); e.hidden = false; e.textContent = '⏱ ' + Math.floor(sg / 60) + ':' + String(sg % 60).padStart(2, '0'); }, 500);
    limpiezas.push(() => clearInterval(tTimer));
    m.body.innerHTML = '<p class="muted" style="text-align:center;margin:0">' + N.emoji + ' ' + N.t + ' · faltan <b id="sdk-faltan"></b></p>' +
      '<div class="sdk" id="sdk">' + g.map((v, i) => { const r = Math.floor(i / 9), c = i % 9; return '<button data-sdk-i="' + i + '" class="' + [v ? 'fija' : '', c % 3 === 2 && c < 8 ? 'bd' : '', r % 3 === 2 && r < 8 ? 'bb' : ''].join(' ').trim() + '" aria-label="Fila ' + (r + 1) + ', columna ' + (c + 1) + '">' + (v || '') + '</button>'; }).join('') + '</div>' +
      '<div class="sdk-pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => '<button data-sdk-n="' + n + '">' + n + '<small id="sdk-q' + n + '"></small></button>').join('') + '<button data-sdk-n="0" aria-label="Borrar">⌫<small>borrar</small></button></div>';
    const celdas = [...m.body.querySelectorAll('[data-sdk-i]')];
    const pintar = () => {
      const r = Math.floor(sel / 9), c = sel % 9, br = r - r % 3, bc = c - c % 3, v = g[sel];
      celdas.forEach((b, i) => {
        const ri = Math.floor(i / 9), ci = i % 9;
        b.classList.toggle('sel', i === sel);
        b.classList.toggle('zona', i !== sel && (ri === r || ci === c || (ri - ri % 3 === br && ci - ci % 3 === bc)));
        b.classList.toggle('igual', i !== sel && !!v && g[i] === v);
      });
      const faltan = g.filter(x => !x).length;
      document.getElementById('sdk-faltan').textContent = faltan;
      for (let n = 1; n <= 9; n++) { const q = 9 - g.filter(x => x === n).length; document.getElementById('sdk-q' + n).textContent = q ? q : '✓'; m.body.querySelector('[data-sdk-n="' + n + '"]').disabled = !q; }
    };
    const fin = gano => {
      if (terminado) return; terminado = true;
      const seg = segundos();
      if (gano) terminar('mente-sudoku', { puntos: puntosSudoku(nivel, seg, errores), aciertos: 81 - puzzle.filter(Boolean).length, total: 81 - puzzle.filter(Boolean).length, segundos: seg, titulo: '🔢 ¡Sudoku resuelto!', detalle: N.emoji + ' ' + N.t + ' · ' + Math.floor(seg / 60) + ' min ' + Math.round(seg % 60) + ' s · ' + errores + ' error(es)' });
      else terminar('mente-sudoku', { puntos: 0, aciertos: g.filter(Boolean).length - puzzle.filter(Boolean).length, total: 81 - puzzle.filter(Boolean).length, segundos: seg, titulo: '💔 Sin vidas', detalle: 'Te equivocaste 3 veces. ¡Inténtalo de nuevo!' });
    };
    const poner = n => {
      if (terminado || sel < 0 || puzzle[sel]) return;
      const b = celdas[sel];
      if (n === 0) { g[sel] = 0; b.textContent = ''; pintar(); return; }
      if (sol[sel] === n) {
        g[sel] = n; b.textContent = n; b.classList.remove('mal'); sonidoOk(); pintar();
        m.puntos(puntosSudoku(nivel, segundos(), errores));
        if (g.every((v, i) => v === sol[i])) setTimeout(() => fin(true), 600);
      } else {
        errores++; sonidoMal(); m.vidas(3 - errores);
        b.textContent = n; b.classList.add('mal');
        const idx = sel;
        setTimeout(() => { celdas[idx].textContent = g[idx] || ''; celdas[idx].classList.remove('mal'); }, 700);
        if (errores >= 3) setTimeout(() => fin(false), 800);
      }
    };
    m.body.addEventListener('click', e => {
      const c = e.target.closest('[data-sdk-i]'), n = e.target.closest('[data-sdk-n]');
      if (c) { sel = Number(c.dataset.sdkI); pintar(); }
      if (n && !n.disabled) poner(Number(n.dataset.sdkN));
    });
    const onKey = e => {
      if (terminado) return;
      if (/^[1-9]$/.test(e.key)) { poner(Number(e.key)); e.preventDefault(); }
      else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { poner(0); e.preventDefault(); }
      else {
        const d = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key];
        if (d !== undefined) { sel = (sel + d + 81) % 81; pintar(); e.preventDefault(); }
      }
    };
    document.addEventListener('keydown', onKey);
    limpiezas.push(() => document.removeEventListener('keydown', onKey));
    pintar();
  }

  // ---------- Clásicos: Basta ----------
  // Compara sin mayúsculas ni acentos, pero conserva la ñ como letra propia.
  const normBasta = s => String(s || '').trim().toLowerCase().replace(/ñ/g, '\u0001').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\u0001/g, 'ñ').replace(/\s+/g, ' ');

  async function jugarBasta(idioma) {
    const id = idioma === 'en' ? 'basta-en' : 'basta-es';
    const d = (await datos('basta'))[idioma];
    const letra = d.letras[Math.floor(Math.random() * d.letras.length)];
    const L = normBasta(letra);
    const dic = Object.fromEntries(d.categorias.map(c => [c.id, new Set((d.palabras[c.id] || []).map(normBasta))]));
    const m = marco(id);
    const TOT = 60;
    let terminado = false;
    const t0 = Date.now();
    m.body.innerHTML = '<div class="q-card"><div class="sub">' + (idioma === 'en' ? 'Letter' : 'Letra') + '</div><div class="letra">' + escapeHtml(letra) + '</div>' +

        '<label for="b-' + c.id + '">' + escapeHtml(c.emoji + ' ' + c.titulo) + '</label><input id="b-' + c.id + '" data-bcat="' + c.id + '" type="text" autocapitalize="off" spellcheck="false" maxlength="40" placeholder="' + escapeHtml(letra) + '…">').join('') +
      '<div class="row-btns" style="grid-column:1/-1"><button class="btn" type="submit">✋ ¡Basta!</button></div></form>';
    const primero = m.body.querySelector('input'); if (primero) primero.focus();
    const calificar = (porBasta, quedan) => {
      if (terminado) return; terminado = true; limpiar();
      const vistas = new Set();
      let puntos = 0, aciertos = 0;
      const filas = d.categorias.map(c => {
        const valor = (document.getElementById('b-' + c.id) || {}).value || '';
        const n = normBasta(valor);
        let estado, pts = 0;
        if (!n) estado = '—';
        else if (!n.startsWith(L) || n.length < 2) estado = '✘ ' + (idioma === 'en' ? 'no empieza con ' : 'no empieza con ') + letra;
        else if (vistas.has(n)) estado = '✘ repetida';
        else if (dic[c.id].has(n)) { estado = '✔ verificada'; pts = 100; aciertos++; }
        else if (n.length >= 3) { estado = '¿? no la conozco'; pts = 50; }
        else estado = '✘ muy corta';
        if (n) vistas.add(n);
        puntos += pts;
        const ej = pts === 100 ? '' : (d.palabras[c.id] || []).find(w => normBasta(w).startsWith(L));
        return '<tr><td>' + escapeHtml(c.emoji + ' ' + c.titulo) + '</td><td><b>' + escapeHtml(valor || '—') + '</b>' + (ej ? '<br><small>p. ej. ' + escapeHtml(ej) + '</small>' : '') + '</td><td>' + escapeHtml(estado) + '</td><td>' + pts + '</td></tr>';
      });
      const llenas = d.categorias.every(c => ((document.getElementById('b-' + c.id) || {}).value || '').trim());
      const bono = porBasta && llenas ? Math.max(0, Math.round(quedan)) * 5 : 0;
      terminar(id, {
        puntos: puntos + bono, aciertos, total: d.categorias.length, segundos: (Date.now() - t0) / 1000,
        titulo: porBasta ? '✋ ¡Basta!' : '⏰ ¡Se acabó el tiempo!',
        detalle: '<div class="scroll-x"><table class="inv basta-res"><thead><tr><th>Categoría</th><th>Tu palabra</th><th></th><th>Pts</th></tr></thead><tbody>' + filas.join('') + '</tbody></table></div>' +
          (bono ? '<p>⚡ Bono por decir ¡Basta! a tiempo: +' + bono + '</p>' : ''),
      });
    };
    let quedan = TOT;
    reloj(TOT, s => { quedan = s; m.tiempo(s, TOT); }, () => calificar(false, 0));
    m.body.addEventListener('submit', e => { e.preventDefault(); calificar(true, quedan); });
  }

  // ---------- Clásicos: ¡Una! (cartas de colores) ----------
  const UNA_COLOR = { r: '#ef4444', y: '#eab308', g: '#22c55e', b: '#3b82f6' };
  const UNA_TXT = {
    es: { color: { r: 'Rojo', y: 'Amarillo', g: 'Verde', b: 'Azul' }, skip: 'Salta', rev: 'Reversa', '+2': 'Más dos', wild: 'Comodín', '+4': 'Más cuatro', tu: 'Tu turno', robar: 'Robar', pasar: 'Pasar', una: 'UNA' },
    en: { color: { r: 'Red', y: 'Yellow', g: 'Green', b: 'Blue' }, skip: 'Skip', rev: 'Reverse', '+2': 'Draw two', wild: 'Wild', '+4': 'Wild draw four', tu: 'Your turn', robar: 'Draw', pasar: 'Pass', una: 'UNA' },
  };
  const NUM_EN = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  const NUM_ES = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'];

  function unaMazo() {
    const m = [];
    for (const c of ['r', 'y', 'g', 'b']) {
      m.push({ c, v: '0' });
      for (let k = 0; k < 2; k++) { for (let n = 1; n <= 9; n++) m.push({ c, v: String(n) }); m.push({ c, v: 'skip' }, { c, v: 'rev' }, { c, v: '+2' }); }
    }
    for (let k = 0; k < 4; k++) m.push({ c: null, v: 'wild' }, { c: null, v: '+4' });
    return barajar(m);
  }
  // Castigo por tardar en presionar UNA (segundos desde que se tira la penúltima carta).
  const castigoUna = seg => seg <= 2 ? 0 : seg <= 3 ? 1 : seg <= 4 ? 2 : seg <= 5 ? 3 : 4;
  const unaSimbolo = v => ({ skip: '⊘', rev: '⇄', '+2': '+2', wild: '★', '+4': '+4' }[v] || v);

  function elegirUna() {
    const m = marco('una');
    m.body.innerHTML = '<div class="q-card"><div class="big">🃏</div><div class="q">¡Una!</div><div class="sub">Iguala el color o el número. Cuando te quede una carta, ¡presiona el botón UNA!</div></div>' +

      '<label>Idioma</label><div class="opts"><button class="opt" data-una-lang="es" aria-pressed="true">🇲🇽 Español</button><button class="opt" data-una-lang="en">🇺🇸 English</button></div>' +
      '<div class="row-btns"><button class="btn" data-una-go>Repartir cartas</button></div>';
    let bots = 2, lang = 'es';
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-una-bots]'), l = e.target.closest('[data-una-lang]');
      if (b) { bots = Number(b.dataset.unaBots); m.body.querySelectorAll('[data-una-bots]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
      if (l) { lang = l.dataset.unaLang; m.body.querySelectorAll('[data-una-lang]').forEach(x => x.setAttribute('aria-pressed', String(x === l))); }
      if (e.target.closest('[data-una-go]')) jugarUna(bots, lang);
    });
  }

  function jugarUna(numBots, lang) {
    const T = UNA_TXT[lang];
    const m = marco('una');

    let resolverUna = () => {};

    const t0 = Date.now();
    // Devuelve cuántas cartas llegaron de verdad (0 si ya no hay mazo ni pila para rebarajar).
    const robar = (j, n) => { let r = 0; for (let k = 0; k < n; k++) { if (!mazo.length) { const top = pila.pop(); mazo = barajar(pila); pila = [top]; } if (mazo.length) { manos[j].push(mazo.pop()); r++; } } return r; };
    const hayParaRobar = () => mazo.length > 0 || pila.length > 1;
    for (let k = 0; k < 7; k++) manos.forEach((_, j) => robar(j, 1));
    let primera = mazo.pop(); while (primera.v === '+4') { mazo.unshift(primera); primera = mazo.pop(); }
    pila.push(primera); color = primera.c || ['r', 'y', 'g', 'b'][Math.floor(Math.random() * 4)];
    const top = () => pila[pila.length - 1];
    const valida = c => !c.c || c.c === color || c.v === top().v;
    const nombreCarta = c => {
      if (c.v === 'wild' || c.v === '+4') return T[c.v];
      const num = /^\d$/.test(c.v) ? (lang === 'en' ? NUM_EN : NUM_ES)[Number(c.v)] : T[c.v];
      return lang === 'en' ? T.color[c.c] + ' ' + num : num + ' ' + T.color[c.c].toLowerCase();
    };
    const anunciar = texto => hablar(texto, lang === 'en' ? 'en-US' : 'es-MX', 1);
    const sig = (desde, pasos = 1) => ((desde + dir * pasos) % manos.length + manos.length) % manos.length;
    const cartaHtml = (c, extra) => '<span class="una-card' + (extra || '') + '" style="--c:' + (c.c ? UNA_COLOR[c.c] : '#1e1b2e') + '">' + (c.c ? '' : '<span class="una-wild"></span>') + '<b>' + escapeHtml(unaSimbolo(c.v)) + '</b></span>';

    function dibujar() {
      if (terminado) return;

      m.body.innerHTML =
        '<div class="una-bots">' + manos.slice(1).map((h, k) => '<div class="una-bot' + (turno === k + 1 ? ' activo' : '') + '"><span>' + escapeHtml(nombres[k + 1]) + '</span><span>🂠 × ' + h.length + (h.length === 1 ? ' <b class="una-dijo">' + escapeHtml(T.una) + '</b>' : '') + '</span></div>').join('') + '</div>' +
        '<div class="una-mesa"><div>' + cartaHtml(top(), ' grande') + '<div class="muted" style="text-align:center">' + escapeHtml(T.color[color]) + ' <span class="una-dot" style="background:' + UNA_COLOR[color] + '"></span></div></div>' +
        '<button class="una-mazo" data-una="robar"' + (tuTurno && !robada && hayParaRobar() ? '' : ' disabled') + '>🂠<small>' + escapeHtml(T.robar) + ' (' + mazo.length + ')</small></button></div>' +
        '<div class="feedback" id="una-msg">' + escapeHtml(msg || (tuTurno ? T.tu + ' · ' + (lang === 'en' ? 'dir ' : 'sentido ') + (dir === 1 ? '↻' : '↺') : '…')) + '</div>' +
        '<div class="una-mano">' + manos[0].map((c, i) => '<button class="una-btn' + (c === robada ? ' robada' : '') + '" data-una-card="' + i + '"' + (tuTurno && valida(c) && (!robada || robada === c) ? '' : ' data-no="1"') + ' aria-label="' + escapeHtml(nombreCarta(c)) + '">' + cartaHtml(c, tuTurno && valida(c) && (!robada || robada === c) ? ' jugable' : '') + '</button>').join('') + '</div>' +
        '<div class="row-btns">' + (robada || (tuTurno && !hayParaRobar() && !manos[0].some(valida)) ? '<button class="btn ghost" data-una="pasar">' + escapeHtml(T.pasar) + '</button>' : '') +
        '<button class="btn una-grito' + (esperandoUna ? ' pulsa' : '') + '" data-una="una"' + (esperandoUna ? '' : ' disabled') + '>📣 ' + escapeHtml(T.una) + '</button></div>';

    function fin(ganador) {

    function aplicar(j, c) {

    }

    function programar() {

    }

    function turnoBot() {
      if (terminado) return;
      const j = turno, mano = manos[j];
      const siguiente = manos[sig(j)].length;
      let opciones = mano.filter(valida);
      if (!opciones.length) { const llego = robar(j, 1); const n = llego ? mano[mano.length - 1] : null; if (n && valida(n)) opciones = [n]; else { msg = nombres[j] + (lang === 'en' ? ' draws a card' : ' roba una carta'); turno = sig(j); return programar(); } }
      const accion = opciones.filter(c => ['skip', '+2', '+4', 'rev'].includes(c.v));
      const numeros = opciones.filter(c => c.c && /^\d$/.test(c.v));
      // Bots amables: solo a veces castigan a quien tiene pocas cartas, para que el juego sea retador pero ganable.

  // ---------- Clásicos: Póker Texas Hold'em (openspec: poker). Motor en juegos/cartas.js; fichas sin valor real ----------
  const PK_BOTS = [{ nombre: 'Vesper', emoji: '💎' }, { nombre: 'Le Chiffre', emoji: '🃏' }, { nombre: 'Felix', emoji: '🎩' }, { nombre: 'Mathis', emoji: '🍸' }];

  // Puntos del póker: fichas ÷ jugadores (tope 1000) y +150 al equipo o pareja ganadora.
  function pkPuntos(st, equipos) {

  }
  // Mesa compartida por el modo individual y la partida: asientos, comunes, bote y botonera.
  function pkMesaHtml(st, o) {
    const yo = o.yo, fin = st.fase === 'fin', res = st.resultado;
    const ganadorCartas = new Set(fin && res && res.mostrar ? res.ganadores.flatMap(g => res.manos[g] ? res.manos[g].cartas : []) : []);

        (j.fichas === 0 && !fuera && st.cartas && st.cartas[i].length && !fin ? '<span class="pk-tag">ALL-IN</span>' : '');
      const cartas = st.cartas && st.cartas[i] && st.cartas[i].length ? st.cartas[i].map(c => pkCarta(ver(i) ? c : undefined, ' chica' + (ganadorCartas.has(c) ? ' gana' : ''))).join(' ') : '';
      const extra = fin && res ? (res.premios[i] > 0 ? '<b style="color:var(--ok)">+' + fmt(res.premios[i]) + '</b>' + (res.mostrar && res.manos[i] ? ' · ' + escapeHtml(res.manos[i].nombre) : '') : res.mostrar && res.manos[i] ? escapeHtml(res.manos[i].nombre) : '')
        : st.apuesta && st.apuesta[i] ? 'apuesta ' + fmt(st.apuesta[i]) : fuera ? 'retirado' : '';
      return '<div class="pk-asiento' + (!fin && st.turno === i && !st.terminada ? ' turno' : '') + (fuera || j.fichas === 0 && (!st.cartas || !st.cartas[i].length) ? ' fuera' : '') + '"><span class="n">' + o.avatar(i) + escapeHtml(o.nombre(i)) + tags + '</span>' +
        '<span class="pk-fichas">🪙 ' + fmt(j.fichas) + '</span><span>' + cartas + '</span><span class="muted">' + extra + '</span></div>';
    };
    const bote = fin && res ? res.bote : Cartas.bote(st);
    const comunes = [0, 1, 2, 3, 4].map(k => pkCarta(st.comunes && k < st.comunes.length ? st.comunes[k] : null, ganadorCartas.has(st.comunes && st.comunes[k]) ? ' gana' : '')).join('');
    const msg = fin && res ? '🏆 ' + res.ganadores.map(g => escapeHtml(o.nombre(g))).join(' y ') + ' gana' + (res.ganadores.length > 1 ? 'n' : '') + ' ' + fmt(res.bote) + (res.mostrar ? ' con ' + escapeHtml(res.manos[res.ganadores[0]].nombre) : ' (los demás se retiraron)') : pkUltima(st, o.nombre) || '¡Se reparten las cartas!';

      const op = Cartas.opciones(st);

  function pkMontoVivo(e) { if (e.target.id === 'pk-monto') { const v = document.getElementById('pk-monto-v'); if (v) v.textContent = fmt(Number(e.target.value)); } }

  const pkJugadaDe = b => b.dataset.pk === 'subir' ? { accion: 'subir', monto: Number(document.getElementById('pk-monto').value) } : { accion: b.dataset.pk };

  function elegirPoker() {
