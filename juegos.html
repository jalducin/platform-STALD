<script>
  // ---------- Partidas multijugador (openspec: juegos-partidas) ----------
  // Aleatorio con semilla: todos los dispositivos de una partida generan lo mismo.
  function fnv(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rngDe = (seed, etiqueta) => mulberry(fnv(seed + '|' + etiqueta));

  const JUEGOS_PARTIDA = ['en-vocab', 'en-frases', 'en-tiempos', 'es-ortografia', 'cultura', 'cultura-linea', 'mente-calculo', 'basta-es', 'basta-en', 'loteria', 'una', 'poker', 'brisca', 'conquian', 'ajedrez', 'plataformas', 'karts', 'futbolito', 'billar'];
  JUEGOS_PARTIDA.push(...TableroUI.SALA); // juegos-tablero
  JUEGOS_PARTIDA.push(...Object.keys(SALAS_GRANDES)); // juegos-salas-grandes: bingo, blackjack, dibuja, en-memorama, mente-sopa
  const ARCADE = new Set(['plataformas', 'karts']); // carreras en sala (openspec: juegos-plataformas-karts)
  const BOT_EXTRA = { id: 'bot-chonita', nombre: 'BOT-CHONITA', acierto: 0.5, avatar: { emoji: '👵', color: '#a855f7' } }; // 3.er bot para completar la Brisca
  const BOTS = [{ id: 'bot-vachira', nombre: 'BOT-VACHIRA', acierto: 0.6, avatar: { emoji: '⚡', color: '#f59e0b' } }, { id: 'bot-isagii', nombre: 'BOT-ISAGII', acierto: 0.45, avatar: { emoji: '🌀', color: '#0ea5e9' } }];
  const P_Q = 15000, P_REV = 4000, P_N = 10; // ms por pregunta, ms de revelación, preguntas
  const P_BASTA = 60000, P_GRACIA = 3000, P_PAUSA = 10000; // Basta por rondas: escribir, gracia tras ¡Basta!, resultados
  const dur = ms => ms * TIEMPO;

  // Diez preguntas iguales para todos a partir de la semilla.
  async function preguntasPartida(juego, seed, opciones) {
    if (juego === 'cultura-linea') return lineasDeSala(seed, opciones); // cultura-conocimiento: 5 líneas del tiempo
    const rnd = rngDe(seed, 'preguntas');
    const d = juego.startsWith('en-') ? await datos('ingles') : juego.startsWith('es-') ? await datos('espanol') : juego === 'cultura' ? await datos('cultura') : null;
    const lista = [];
    if (juego === 'en-vocab') for (const w of tomar(d.vocabulario, P_N, rnd)) {
      const dis = tomar(d.vocabulario.filter(x => x.en !== w.en && x.tema === w.tema), 2, rnd).concat(tomar(d.vocabulario.filter(x => x.tema !== w.tema), 3, rnd)).map(x => x.en).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
      lista.push(conOpciones({ big: w.emoji, q: w.es, sub: '¿Cómo se dice en inglés?' }, w.en, dis, rnd));
    }
    if (juego === 'en-preguntas') for (const f of tomar(d.preguntas, P_N, rnd)) lista.push(conOpciones({ big: '💬', q: f.pregunta, sub: f.es }, f.opciones[f.correcta], f.opciones.filter((_, k) => k !== f.correcta), rnd));
    // Fusionados (openspec: juegos-fusion): las 10 preguntas se reparten entre sus fuentes.
    // Con tema de la sala y la regla de cada pregunta en la revelación (openspec: juegos-ingles-gramatica).
    if (juego === 'en-frases') return InglesGramatica.preguntasFrasesPartida(d, opciones.tema, rnd, P_N);
    if (juego === 'en-tiempos') return InglesGramatica.preguntasTiempos(d, P_N, rnd);
    if (juego === 'es-ortografia') {
      for (const [t, n] of [['ortografia', 4], ['acentos', 3]]) for (const f of tomar(d[t], n, rnd))
        lista.push(conOpciones({ big: t === 'acentos' ? 'á' : '✍️', q: f.frase, sub: f.regla ? 'Regla: ' + f.regla : '' }, f.opciones[f.correcta], f.opciones.filter((_, k) => k !== f.correcta), rnd));
      for (const f of tomar(poolSinonimos(d), 3, rnd)) lista.push(conOpciones({ big: f.tipo === 'sinónimo' ? '🟰' : '↔️', q: '«' + f.palabra + '»', sub: 'Elige el ' + f.tipo }, f.respuesta, f.distractores, rnd));
      return barajar(lista, rnd);
    }
    if (juego === 'es-acentos') for (const f of tomar(d.acentos, P_N, rnd))
      lista.push(conOpciones({ big: 'á', q: f.frase, sub: f.regla ? 'Regla: ' + f.regla : '' }, f.opciones[f.correcta], f.opciones.filter((_, k) => k !== f.correcta), rnd));
    if (juego === 'es-sinonimos') {
      const pool = d.sinonimos.map(x => Object.assign({ tipo: 'sinónimo' }, x)).concat(d.antonimos.map(x => Object.assign({ tipo: 'antónimo' }, x)));
      for (const f of tomar(pool, P_N, rnd)) lista.push(conOpciones({ big: f.tipo === 'sinónimo' ? '🟰' : '↔️', q: '«' + f.palabra + '»', sub: 'Elige el ' + f.tipo }, f.respuesta, f.distractores, rnd));
    }
    if (juego === 'cultura') {
      const del = d.preguntas.filter(p => !opciones.cat || opciones.cat === 'todas' || p.cat === opciones.cat);
      const orden = tomar(del.filter(p => p.nivel === 1), 4, rnd).concat(tomar(del.filter(p => p.nivel === 2), 4, rnd), tomar(del.filter(p => p.nivel === 3), 2, rnd));
      for (const p of orden.concat(tomar(del.filter(x => !orden.includes(x)), P_N, rnd)).slice(0, P_N))
        lista.push(conOpciones({ q: p.pregunta, sub: (d.categorias.find(c => c.id === p.cat) || {}).titulo, dato: p.dato }, p.opciones[p.correcta], p.opciones.filter((_, k) => k !== p.correcta), rnd));
    }
    if (juego === 'mente-calculo') for (let n = 0; n < P_N; n++) lista.push(n % 3 === 2 ? genSecuencia(Math.floor(n / 3) * 2, rnd) : genCalculo(n * 2, rnd));
    if (juego === 'mente-secuencias') for (let n = 0; n < P_N; n++) lista.push(genSecuencia(n, rnd));
    return lista;
  }

  // Respuesta de un bot a la pregunta q: al azar con su % de acierto y un tiempo de 2 a 13 s.
  function botPregunta(seed, bot, q, pregunta) {
    const r = rngDe(seed, bot.id + '|q' + q);
    const correcta = r() < bot.acierto;
    const ms = Math.round((2 + r() * 11) * 1000);
    const malas = pregunta.opciones.map((_, k) => k).filter(k => k !== pregunta.correcta);
    const opcion = correcta ? pregunta.correcta : malas[Math.floor(r() * malas.length)];
    return { correcta, opcion, ms, puntos: correcta ? 100 + Math.round(100 * Math.max(0, 1 - ms / P_Q)) : 0 };
  }

  // Palabras de un bot en Basta: 75 % de las categorías con una palabra del diccionario al azar.
  function botBasta(seed, bot, letra, d, ronda = 0) {
    const r = rngDe(seed, bot.id + '|basta' + (ronda ? '|' + ronda : ''));
    const L = normBasta(letra);
    return Object.fromEntries(d.categorias.map(c => {
      const opciones = (d.palabras[c.id] || []).filter(w => normBasta(w).startsWith(L));
      return [c.id, r() < 0.75 && opciones.length ? opciones[Math.floor(r() * opciones.length)] : ''];
    }));
  }

  // Puntuación de Basta en sala: única/verificada 100, repetida 50; no verificada 25/10; inválida 0 (juegos/basta.js).
  const puntuarBasta = Basta.puntuar; // basta-divertida-una-robo

  const sala = { codigo: null, estado: null, offset: 0, poll: null, guardado: false };
  const ahoraServidor = () => Date.now() + sala.offset;

  const TIEMPO_REAL = new Set(['una', 'basta-es', 'basta-en', 'loteria', 'poker', 'brisca', 'conquian', 'ajedrez', 'futbolito', 'billar']); // futbolito-billar
  ClasicosRapidosUI.IDS.forEach(id => { JUEGOS_PARTIDA.push(id); TIEMPO_REAL.add(id); }); // clasicos-rapidos
  TableroUI.SALA.forEach(j => TIEMPO_REAL.add(j)); // juegos-tablero
  ['bingo', 'blackjack', 'dibuja', 'mente-sopa'].forEach(j => TIEMPO_REAL.add(j)); // juegos-salas-grandes
  const FISICA = new Set(['futbolito', 'billar']); // futbolito-billar: 1 vs 1 por tiros en su iframe

  // Supabase Realtime (openspec: salas-realtime): si el servidor entrega `rt`, la página escucha el canal de la
  // sala y recibe cada cambio al instante; el sondeo baja a 30 s de respaldo. Si el canal falla, vuelve el sondeo normal.
  let supabaseLib = null;
  function cargarSupabase() {
    if (window.supabase) return Promise.resolve(window.supabase);
    if (supabaseLib) return supabaseLib;
    supabaseLib = new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
      s.onload = () => ok(window.supabase); s.onerror = () => { supabaseLib = null; mal(new Error('supabase')); };
      document.head.appendChild(s);
    });
    return supabaseLib;
  }
  // Los avisos pueden llegar fuera de orden: por jugador gana la versión `v` más alta, se conservan los jugadores que
  // solo existen localmente y una sala ya empezada no vuelve a la espera.
  function mezclarEstado(local, p) {
    const previos = new Map(local.jugadores.map(j => [j.id, j]));
    const jugadores = p.jugadores.map(j => { const l = previos.get(j.id); previos.delete(j.id); return l && (l.v || 0) > (j.v || 0) ? l : j; }).concat([...previos.values()]);
    const salaNueva = local.sala.inicio !== null && p.sala.inicio === null ? local.sala : p.sala;
    return { sala: salaNueva, jugadores };
  }
  async function conectarRealtime(rt, codigo, alCambiar) {
    try {
      const lib = await cargarSupabase();
      if (sala.codigo !== codigo) return;
      const cliente = lib.createClient(rt.url, rt.key, { auth: { persistSession: false, autoRefreshToken: false } });
      const canal = cliente.channel(rt.topic);
      canal.on('broadcast', { event: 'estado' }, ({ payload: p }) => {
        if (sala.codigo !== codigo || !sala.estado || !p || !p.sala) return;
        sala.estado = Object.assign({}, sala.estado, mezclarEstado(sala.estado, p), { ahora: p.ahora });
        sala.offset = p.ahora - Date.now();
        sala.rtRecibidos = (sala.rtRecibidos || 0) + 1;
        pintarSala();
      }).subscribe(st => {
        const antes = sala.rtVivo;
        sala.rtVivo = st === 'SUBSCRIBED';
        if (antes !== sala.rtVivo) alCambiar();
        // Ponerse al día con lo que cambió mientras se conectaba (un aviso previo a la suscripción no llega).
        if (sala.rtVivo && !antes) traerSala().then(r => { if (r.ok && sala.codigo === codigo) pintarSala(); });
      });
      limpiezas.push(() => { sala.rtVivo = false; cliente.removeChannel(canal); });
    } catch (e) { sala.rtVivo = false; /* sin Realtime: sigue el sondeo normal */ }
  }

  async function traerSala() {

    if (r.ok) { sala.estado = r.body; sala.offset = r.body.ahora - Date.now(); }
    return r;
  }

  async function entrarSala(codigo) {
    limpiar();
    Object.assign(sala, { codigo, estado: null, guardado: false, arcadeMia: null, mias: {}, enviado: false, misPalabras: null, vista: null, lot: null, unaSt: null, unaLocal: null, unaElegir: null, unaEnviando: false, unaAnunciada: null, unaAnimado: null, bastaDatos: null, cqSel: new Set(), cqDestino: null, cqMsg: '', csEnviando: false, csSt: null, ajSel: null, ajPromo: null, ajEnviando: false, ajA: null, ajCache: new Map(), finAciertos: undefined, finTotal: undefined, bastaEnviado: {}, misRondas: {}, letrasBasta: null, rondaActual: 0, rtVivo: false, rtRecibidos: 0, finT: 0, revEnviando: false, revMsg: '' });
    app.innerHTML = '<div class="loading">Entrando a la partida ' + escapeHtml(codigo) + '…</div>';
    const r = await traerSala();
    if (!r.ok) { pantallaHub('partidas'); const m = document.getElementById('p-msg'); if (m) m.innerHTML = '<div class="alert">No se pudo abrir la partida (' + escapeHtml(r.body.error || r.status) + ').</div>'; return; }
    // Recargar regresa aquí (openspec: juegos-recarga): código en la URL y sala activa guardada.
    recordarSala(codigo);
    try { history.replaceState(history.state, '', urlConSala(codigo)); } catch (e) { /* sin historial */ }
    modoPartida(true);
    const j = juegoPorId(sala.estado.sala.juego);
    const preparar = SALAS_GRANDES[sala.estado.sala.juego] ? Promise.resolve(SALAS_GRANDES[sala.estado.sala.juego].preparar()) : /* juegos-salas-grandes */ ['una', 'poker', 'brisca', 'conquian', 'ajedrez', 'futbolito', 'billar'].includes(sala.estado.sala.juego) ? Promise.resolve(null) : sala.estado.sala.juego.startsWith('basta') ? datos('basta') : sala.estado.sala.juego === 'loteria' ? datos('loteria') : preguntasPartida(sala.estado.sala.juego, sala.estado.sala.seed, sala.estado.sala.opciones);
    sala.contenido = await preparar;
    // Deja de consultar cuando ya no sirve (openspec: github-etag-cache): partida terminada, sala vencida o
    // inexistente, o 1 h con la pestaña abierta. Así una pestaña olvidada no gasta el límite de GitHub.
    const t0 = Date.now();
    let tick, detenido = false, fallos = 0, consultando = false;
    const parar = msg => { detenido = true; clearTimeout(tick); const pb = document.getElementById('p-body'); if (msg && pb && sala.vista !== 'final') pb.innerHTML = '<div class="card muted" style="text-align:center">' + msg + '</div>'; };
    const avisoRed = ver => { const e = document.getElementById('p-red'); if (e) e.hidden = !ver; };
    // Intervalo por tipo de juego (openspec: ahorro-peticiones): 2.5 s en la sala de espera y en los juegos que
    // necesitan verse en tiempo real (¡Una!, Basta, Lotería); 5 s en los de preguntas (van sincronizados por
    // reloj); 30 s de respaldo con Realtime. La sala de espera deja de consultar a los 15 min si nadie empieza.
    // Sondeo resistente (openspec: cache-estabilidad): un error de red nunca lo detiene; mientras falle, la espera
    // se duplica hasta 30 s y se avisa «Reconectando…»; al primer éxito vuelve a su ritmo.
    const intervalo = () => {
      if (sala.vista === 'final') return sala.rtVivo ? 30000 : 5000; // podio: espera una revancha (openspec: revancha-partidas)
      const esperando = sala.estado && sala.estado.sala.inicio === null;
      const base = sala.rtVivo ? 30000 : esperando || TIEMPO_REAL.has(sala.estado.sala.juego) ? 2500 : 5000;
      return fallos ? Math.min(30000, base * Math.pow(2, fallos)) : base;
    };
    const ciclo = () => {
      if (detenido) return;
      if (document.hidden) return programarTick(); // pestaña oculta: no consulta (al volver, alVolver)
      // En el podio sigue consultando hasta ver la revancha (`siguiente`) o 15 min (openspec: revancha-partidas).
      if (sala.vista === 'final' && (sala.estado.sala.siguiente || Date.now() - sala.finT > REVANCHA_MS)) return parar();
      if (Date.now() - t0 > 60 * 60000 || (sala.estado.sala.inicio === null && Date.now() - t0 > 15 * 60000)) return parar('⏸️ La partida se pausó por inactividad. Vuelve a entrar con el código 🔑 ' + escapeHtml(codigo) + '.');
      consultando = true;
      traerSala().catch(() => ({ ok: false, status: 0, body: {} })).then(r => {
        consultando = false;
        if (detenido) return;
        if (!r.ok && [403, 404, 410].includes(r.status)) return parar(r.status === 410 ? '⌛ Esta partida ya terminó (vencen a las 3 horas).' : 'Esta partida ya no está disponible.');
        if (r.ok) { fallos = 0; avisoRed(false); pintarSala(); }
        else if (r.status === 0 || r.status === 429 || r.status >= 500) { fallos++; avisoRed(true); }
        else pintarSala();
        programarTick();
      });
    };
    const programarTick = () => { clearTimeout(tick); tick = setTimeout(ciclo, intervalo()); };
    programarTick();
    // Al volver a la pestaña se consulta enseguida (si no hay una consulta en vuelo).
    const alVolver = () => { if (!document.hidden && !detenido && !consultando) { clearTimeout(tick); ciclo(); } };
    document.addEventListener('visibilitychange', alVolver);
    // Al cambiar el estado del canal se reprograma el siguiente ciclo con el intervalo que corresponde.
    if (sala.estado.rt) conectarRealtime(sala.estado.rt, codigo, () => { if (detenido) return; programarTick(); });
    const reloj = setInterval(() => pintarSala(), 250);
    limpiezas.push(() => { detenido = true; clearTimeout(tick); document.removeEventListener('visibilitychange', alVolver); }, () => clearInterval(reloj));
    app.innerHTML = '<div class="cat-' + escapeHtml(j.cat) + '"><div class="play-top"><button class="btn ghost sm" data-a="salir" aria-label="Salir">✕</button><span class="t">' + j.emoji + ' ' + escapeHtml(j.t) + (sala.estado.sala.opciones.tema ? ' · ' + escapeHtml(InglesGramatica.nombreTema(sala.estado.sala.opciones.tema)) : '') + ' · partida</span>' +
      '<span class="stat" id="p-codigo-chip">🔑 ' + escapeHtml(codigo) + '</span></div><div class="bar" id="m-bar" hidden><span style="width:100%"></span></div>' +
      '<div id="p-red" class="muted" role="status" hidden style="text-align:center;font-size:.85rem;margin:6px 0">📶 Reconectando… tu partida sigue guardada.</div><div id="p-body"></div></div>';
    sala.vista = null;
    pintarSala();
  }

  function participantes() {
    const e = sala.estado;
    const humanos = e.jugadores.map(x => ({ id: x.id, nombre: x.nombre, tipo: x.tipo, avatar: x.avatar, respuestas: x.respuestas || {}, palabras: x.palabras, basta: x.basta, rondasBasta: x.rondasBasta || {}, loteria: x.loteria }));
    const comoBot = b => ({ id: b.id, nombre: b.nombre, tipo: 'bot', bot: b, avatar: b.avatar });
    // Mesas (openspec: mesas-con-bots, juegos/mesas.js): con asientos, los bots completan los lugares libres y cada
    // persona que entra quita un bot (Brisca: 3 personas + 1 bot); sin mesa, los bots se suman aparte.
    const mesa = Mesas.de(e.sala.juego);
    const h = mesa ? humanos.slice(0, mesa.max) : humanos;
    const nb = Mesas.botsEnMesa(e.sala.juego, h.length, e.sala.bots);
    if (nb !== null) return h.concat(BOTS.concat(BOT_EXTRA).slice(0, nb).map(comoBot));
    return e.sala.bots && !(mesa && mesa.bots === 'nunca') ? h.concat(BOTS.map(comoBot)) : h;
  }

  function pintarSala() {
    const e = sala.estado; if (!e) return;
    const body = document.getElementById('p-body'); if (!body) return;
    const s = e.sala;
    if (sala.vista === 'final') return pintarRevancha(); // el podio ya no se vuelve a dibujar
    if (s.inicio === null) return pintarEspera(body);
    if (s.juego.startsWith('basta')) return pintarBastaSala(body);
    if (s.juego === 'loteria') return pintarLoteriaSala(body);
    if (s.juego === 'una') return pintarUnaSala(body);
    if (s.juego === 'poker') return pintarPokerSala(body);
    if (s.juego === 'brisca' || s.juego === 'conquian') return pintarCartasSala(body, s.juego);
    if (s.juego === 'ajedrez') return pintarAjedrezSala(body);
    if (ClasicosRapidosUI.IDS.includes(s.juego)) return ClasicosRapidosUI.pintarSala(body); // clasicos-rapidos
    if (TableroUI.esSala(s.juego)) return TableroUI.pintarSala(body); // juegos-tablero
    if (ARCADE.has(s.juego)) return pintarArcadeSala(body);
    if (SALAS_GRANDES[s.juego]) return SALAS_GRANDES[s.juego].pintar(body); // juegos-salas-grandes
    if (s.juego === 'cultura-linea') return pintarLineaSala(body); // cultura-conocimiento
    if (FISICA.has(s.juego)) return pintarFisicaSala(body); // futbolito-billar
    return pintarPreguntaSala(body);
  }

  // basta-divertida-una-robo: categorías divertidas de la partida, visibles en la sala de espera.
  function extrasEspera(s) {
    const ids = s.juego.startsWith('basta') ? Basta.extrasDe(s.opciones) : [];

    return ex.length ? '<p class="muted" id="p-extras" style="margin:8px 0">🎉 Categorías divertidas: <b>' + ex.map(x => escapeHtml(x.emoji + ' ' + x.titulo)).join(' · ') + '</b></p>' : '';
  }
  function pintarEspera(body) {
    const e = sala.estado;

      '<div class="row-btns" style="margin-top:8px"><button class="btn ghost sm" data-p="compartir">📤 Compartir</button></div></div></div></div>' +
      extrasEspera(e.sala) + // basta-divertida-una-robo
      '<h2>👥 Jugadores (' + lista.length + ')</h2>' + (Mesas.de(e.sala.juego) ? '<p class="muted" id="p-mesa" style="margin:-4px 0 8px">🪑 ' + escapeHtml(Mesas.textoMesa(e.sala.juego, lista.filter(x => !x.bot).length, lista.filter(x => x.bot).length)) + '</p>' : '') + '<ol class="rank">' + lista.map(x => '<li>' + avatarHtml(x.avatar, 32) + '<span class="n">' + escapeHtml(x.nombre) +
        (x.id === e.sala.host ? ' <small>(anfitrión)</small>' : '') + (x.tipo === 'invitado' ? ' <small>(invitado)</small>' : '') + '</span></li>').join('') + '</ol>' +
      '<div class="row-btns">' + (e.soyHost ? '<button class="btn" data-p="empezar">▶ Empezar partida</button>' : '<div class="muted" style="text-align:center;width:100%">Esperando a que el anfitrión empiece…</div>') + '</div>';
    // La clave cuenta personas y bots: en una mesa de 4, una persona nueva desplaza a un bot y la lista no cambia de largo.
    const clave = 'espera:' + lista.map(x => x.id).join(',') + ':' + e.soyHost;
    if (sala.vista !== clave) { body.innerHTML = html; sala.vista = clave; pintarQr(document.getElementById('p-qr'), enlaceSala(e.sala.codigo)); }

  function totalesPreguntas(hasta) {
    const e = sala.estado; const s = e.sala;
    return participantes().map(p => {
      let total = 0, ultimo = 0;
      for (let q = 0; q <= hasta; q++) {
        const r = p.bot ? botPregunta(s.seed, p.bot, q, sala.contenido[q]) : p.respuestas[q];
        if (r) { total += r.puntos; if (q === hasta) ultimo = r.puntos; }
      }
      return { id: p.id, nombre: p.nombre, tipo: p.tipo, avatar: p.avatar, total, ultimo };
    }).sort((a, b) => b.total - a.total);
  }

  function marcadorHtml(filas, yo, max = 6) {
    return '<ol class="rank">' + filas.slice(0, max).map((f, i) => '<li class="' + (f.id === yo ? 'yo' : '') + '"><span class="pos">' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1) + '</span>' +
      avatarHtml(f.avatar, 28) + '<span class="n">' + escapeHtml(f.nombre) + (f.tipo === 'bot' ? ' <small>🤖</small>' : '') + (f.ultimo ? ' <small>+' + f.ultimo + '</small>' : '') + '</span><span class="pts">⭐ ' + fmt(f.total) + '</span></li>').join('') + '</ol>';
  }

  function pintarPreguntaSala(body) {
    const e = sala.estado; const s = e.sala;
    const t = ahoraServidor() - s.inicio;
    const ciclo = dur(P_Q + P_REV);
    const bar = document.getElementById('m-bar');
    if (t < 0) { bar.hidden = true; const k = 'cuenta:' + Math.ceil(-t / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárate!</div><div class="letra">' + Math.ceil(-t / 1000) + '</div><div class="sub">' + participantes().length + ' jugadores</div></div>'; sala.vista = k; } return; }
    const q = Math.floor(t / ciclo);
    if (q >= P_N) return pintarFinalSala(body, totalesPreguntas(P_N - 1));
    const enQ = t - q * ciclo;
    const p = sala.contenido[q];
    const mia = (e.jugadores.find(x => x.id === e.yo) || { respuestas: {} }).respuestas[q] || sala.mias && sala.mias[q];
    if (enQ < dur(P_Q)) {
      bar.hidden = false; bar.firstChild.style.width = Math.max(0, 100 - enQ / dur(P_Q) * 100) + '%';
      const k = 'q:' + q + ':' + (mia ? 'r' : '');
      if (sala.vista !== k) {
        sala.vista = k;
        body.innerHTML = '<div class="muted" style="text-align:center;margin-bottom:6px">Pregunta ' + (q + 1) + ' de ' + P_N + '</div><div class="q-card">' + (p.big ? '<div class="big">' + escapeHtml(p.big) + '</div>' : '') +
          '<div class="q">' + escapeHtml(p.q) + '</div>' + (p.sub ? '<div class="sub">' + escapeHtml(p.sub) + '</div>' : '') + '</div>' +
          (mia ? '<div class="feedback ok">✔ Respuesta enviada · esperando a los demás…</div>'
            : '<div class="opts' + (p.opciones.some(o => String(o).length > 18) ? ' una-col' : '') + '">' + p.opciones.map((o, i) => '<button class="opt" data-pq="' + q + '" data-po="' + i + '"><span class="k">' + (i + 1) + '</span>' + escapeHtml(o) + '</button>').join('') + '</div>');
        sala.inicioQ = s.inicio + q * ciclo;
      }
    } else {
      bar.hidden = true;
      const k = 'rev:' + q + ':' + e.jugadores.map(x => Object.keys(x.respuestas || {}).length).join(',');
      if (sala.vista !== k) {
        sala.vista = k;
        body.innerHTML = '<div class="q-card"><div class="q">' + escapeHtml(p.q) + '</div><div class="sub">Respuesta correcta: <b>' + escapeHtml(p.opciones[p.correcta]) + '</b></div>' +
          (mia ? '<div class="feedback ' + (mia.correcta ? 'ok">✔ ¡Bien! +' + mia.puntos : 'bad">✘ Esta vez no') + '</div>' : '<div class="feedback bad">⏰ No respondiste</div>') +
          (p.dato ? '<div class="sub">💡 ' + escapeHtml(p.dato) + '</div>' : '') + '</div><h2>🏆 Marcador</h2>' + marcadorHtml(totalesPreguntas(q), e.yo);
      }
    }
  }

  async function responderSala(q, i) {
    const s = sala.estado.sala; const p = sala.contenido[q];
    if (sala.mias && sala.mias[q]) return;
    const ms = Math.max(0, ahoraServidor() - (s.inicio + q * dur(P_Q + P_REV)));
    if (ms > dur(P_Q)) return;
    const correcta = i === p.correcta;
    const puntos = correcta ? 100 + Math.round(100 * Math.max(0, 1 - ms / dur(P_Q))) : 0;
    sala.mias = sala.mias || {}; sala.mias[q] = { correcta, puntos, ms };
    correcta ? sonidoOk() : sonidoMal();
    sala.vista = null; pintarSala();
    await post('/juegos/sala/' + sala.codigo + '/respuesta', { q, correcta, puntos, ms: Math.round(ms / TIEMPO) });
  }

  // ---- Basta en sala por rondas (openspec: basta-rondas) ----
  const rondasDeSala = () => Number(sala.estado.sala.opciones.rondas || 1);
  const datosBasta = () => { // basta-divertida-una-robo: con las categorías divertidas de la sala (la revancha las hereda)
    const ids = Basta.extrasDe(sala.estado.sala.opciones), k = sala.estado.sala.juego + '|' + ids.join(',');
    if (!sala.bastaDatos || sala.bastaDatos.k !== k) sala.bastaDatos = { k, d: bastaConExtras(sala.contenido, sala.estado.sala.juego === 'basta-en' ? 'en' : 'es', ids) };
    return sala.bastaDatos.d;
  };
  // Letras sin repetir, iguales para todos (semilla de la sala).
  function letrasBasta() {
    if (!sala.letrasBasta) sala.letrasBasta = barajar(datosBasta().letras, rngDe(sala.estado.sala.seed, 'letras')).slice(0, rondasDeSala());
    return sala.letrasBasta;
  }
  // Calendario: cierre_r = min(inicio_r + 60 s, primer ¡Basta! + 3 s); inicio_{r+1} = cierre_r + 10 s.
  function calendarioBasta() {
    const e = sala.estado; const cal = []; let ini = e.sala.inicio;
    for (let r = 0; r < rondasDeSala(); r++) {
      const gritos = e.jugadores.map(x => ((x.rondasBasta || {})[r] || {}).basta).filter(t => t && t >= ini);
      const limite = ini + dur(P_BASTA);
      const cierre = gritos.length ? Math.min(limite, Math.min(...gritos) + dur(P_GRACIA)) : limite;
      cal.push({ ini, cierre });
      ini = cierre + dur(P_PAUSA);
    }
    return cal;
  }
  const palabrasForm = () => Object.fromEntries(datosBasta().categorias.map(c => [c.id, ((document.getElementById('pb-' + c.id) || {}).value || '').trim()]));
  function enviarRonda(r, palabras) {
    sala.bastaEnviado[r] = true; sala.misRondas[r] = palabras;
    post('/juegos/sala/' + sala.codigo + '/respuesta', { ronda: r, palabras }).then(() => traerSala());
  }
  // Todos enviaron, o pasaron 6 s reales (el sondeo es cada 2.5 s; sin escalar en pruebas aceleradas).
  const rondaLista = (r, cal) => sala.estado.jugadores.every(x => (x.rondasBasta || {})[r]) || ahoraServidor() > cal[r].cierre + 6000;
  // Puntos de cada ronda (hasta la ronda `hasta`) y acumulado por participante.
  function marcadorBasta(hasta) {
    const e = sala.estado, d = datosBasta(), letras = letrasBasta();
    const ps = participantes();
    const acum = Object.fromEntries(ps.map(p => [p.id, { id: p.id, nombre: p.nombre, tipo: p.bot ? 'bot' : '', avatar: p.avatar, total: 0, ultimo: 0, porRonda: [], aciertos: 0, detalle: {} }]));
    for (let r = 0; r <= hasta; r++) {
      const parts = ps.map(p => ({ id: p.id, nombre: p.nombre, palabras: p.bot ? botBasta(e.sala.seed, p.bot, letras[r], d, r) : p.id === e.yo && sala.misRondas[r] ? sala.misRondas[r] : ((p.rondasBasta || {})[r] || {}).palabras || {} }));
      for (const x of puntuarBasta(d, letras[r], parts)) {
        const a = acum[x.id]; a.total += x.total; a.ultimo = x.total; a.porRonda[r] = x.total; a.detalle = x.detalle;
        a.aciertos += Object.values(x.detalle).filter(y => y.pts > 0).length;
      }
    }
    return Object.values(acum).sort((a, b) => b.total - a.total);
  }

  function pintarBastaSala(body) {
    const e = sala.estado; const s = e.sala;
    const idioma = s.juego === 'basta-en' ? 'en' : 'es';
    const d = datosBasta(), letras = letrasBasta(), n = rondasDeSala();
    const ahora = ahoraServidor();
    const bar = document.getElementById('m-bar');
    if (ahora < s.inicio) { bar.hidden = true; const k = 'cuenta:' + Math.ceil((s.inicio - ahora) / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárate! · ' + n + (n === 1 ? ' ronda' : ' rondas') + '</div><div class="letra">' + Math.ceil((s.inicio - ahora) / 1000) + '</div></div>'; sala.vista = k; } return; }
    const cal = calendarioBasta();
    // Al cerrar cada ronda, enviar mis palabras una sola vez (antes de redibujar el formulario).
    // Tras recargar, las rondas que el servidor ya tiene no se reenvían vacías (openspec: juegos-recarga).
    const yaEnviadas = (e.jugadores.find(x => x.id === e.yo) || {}).rondasBasta || {};
    for (let r = 0; r < n; r++) if (ahora >= cal[r].cierre && !sala.bastaEnviado[r] && !yaEnviadas[r]) enviarRonda(r, sala.vista === 'basta' + r ? palabrasForm() : {});
    const r = cal.findIndex(c => ahora < c.cierre + dur(P_PAUSA));

    }

    const cab = '<div class="sub">' + (idioma === 'en' ? 'Round ' : 'Ronda ') + (r + 1) + (idioma === 'en' ? ' of ' : ' de ') + n + ' · ' + (idioma === 'en' ? 'Letter' : 'Letra') + '</div><div class="letra">' + escapeHtml(letras[r]) + '</div>';
    if (ahora < cal[r].cierre) {
      bar.hidden = false; bar.firstChild.style.width = Math.max(0, (cal[r].cierre - ahora) / dur(P_BASTA) * 100) + '%';
      if (sala.vista !== 'basta' + r) {
        sala.vista = 'basta' + r;
        body.innerHTML = '<div class="q-card">' + cab + '<div class="sub" id="pb-aviso">Todos tienen la misma letra</div></div>' +
          '<form id="pb-form" autocomplete="off" class="basta-grid">' + d.categorias.map(c => '<label for="pb-' + c.id + '">' + escapeHtml(c.emoji + ' ' + c.titulo) + '</label><input id="pb-' + c.id + '" data-pbcat="' + c.id + '" type="text" maxlength="40" autocapitalize="off" spellcheck="false" placeholder="' + escapeHtml(letras[r]) + '…">').join('') +
          '<div class="row-btns" style="grid-column:1/-1"><button class="btn" type="submit" id="pb-basta" disabled>✋ ¡Basta!</button></div></form>';
        const primero = document.getElementById('pb-' + d.categorias[0].id); if (primero && r > 0) primero.focus();
      }
      const gritador = e.jugadores.filter(x => ((x.rondasBasta || {})[r] || {}).basta).sort((a, b) => a.rondasBasta[r].basta - b.rondasBasta[r].basta)[0];
      if (gritador) { const a = document.getElementById('pb-aviso'); if (a) { a.textContent = '✋ ¡' + gritador.nombre + ' gritó BASTA! Cierra en ' + Math.max(0, Math.ceil((cal[r].cierre - ahora) / 1000 / TIEMPO)) + ' s'; a.style.color = 'var(--bad)'; } }
      return;
    }
    // Pausa: resultados de la ronda y marcador acumulado; luego sigue sola la siguiente letra.
    bar.hidden = false; bar.firstChild.style.width = Math.max(0, (cal[r].cierre + dur(P_PAUSA) - ahora) / dur(P_PAUSA) * 100) + '%';
    const lista = rondaLista(r, cal);
    const k = 'res' + r + ':' + (lista ? e.jugadores.filter(x => (x.rondasBasta || {})[r]).length : 'esperando');
    if (sala.vista !== k) {
      sala.vista = k;
      if (!lista) { body.innerHTML = '<div class="q-card">' + cab + '<div class="big">✋</div><div class="sub">Juntando las palabras de todos…</div></div>'; }
      else {
        const filas = marcadorBasta(r);
        const mio = filas.find(f => f.id === e.yo);
        body.innerHTML = '<div class="q-card">' + cab + '<div class="sub">' + (mio ? '+' + mio.ultimo + ' en esta ronda' : '') + ' · <span id="pb-sig"></span></div></div>' +
          (mio ? '<div class="scroll-x"><table class="inv basta-res"><thead><tr><th>Categoría</th><th>Tu palabra</th><th></th><th>Pts</th></tr></thead><tbody>' +
            d.categorias.map(c => { const x = mio.detalle[c.id]; return '<tr><td>' + escapeHtml(c.emoji + ' ' + c.titulo) + '</td><td><b>' + escapeHtml(x.palabra || '—') + '</b></td><td>' + escapeHtml(x.estado) + '</td><td>' + x.pts + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
          '<h2>📊 Marcador acumulado</h2>' + marcadorHtml(filas, e.yo, 28);
      }
    }
    const sig = document.getElementById('pb-sig');
    if (sig) sig.textContent = 'Siguiente letra en ' + Math.max(0, Math.ceil((cal[r].cierre + dur(P_PAUSA) - ahora) / 1000 / TIEMPO)) + ' s';
  }

  function pintarFinalSala(body, todas, basta, titulo) {
    if (sala.vista === 'final') return;
    sala.vista = 'final';
    olvidarSala(); // terminó: recargar ya no vuelve a la sala
    sala.finT = Date.now(); escribirLocal(REVANCHA_KEY, { codigo: sala.codigo, quien: state.jugador && state.jugador.id, t: sala.finT }); // pero sí ofrece la revancha
    const filas = todas.map(f => Object.assign({}, f, { ultimo: 0 })); // en el podio no se muestra el +puntos de la última pregunta
    document.getElementById('m-bar').hidden = true;
    const e = sala.estado; const juego = e.sala.juego;
    const mio = filas.find(f => f.id === e.yo);
    const detalle = basta && basta.porRonda && mio ? '<h2>🔤 Tus puntos por ronda</h2><div class="scroll-x"><table class="inv basta-res"><thead><tr><th>Ronda</th><th>Letra</th><th>Pts</th></tr></thead><tbody>' +
      basta.letras.map((l, i) => '<tr><td>' + (i + 1) + '</td><td><b>' + escapeHtml(l) + '</b></td><td>' + (mio.porRonda[i] || 0) + '</td></tr>').join('') + '</tbody></table></div>'
      : basta && mio ? '<div class="scroll-x"><table class="inv basta-res"><thead><tr><th>Categoría</th><th>Tu palabra</th><th></th><th>Pts</th></tr></thead><tbody>' +
      basta.d.categorias.map(c => { const x = mio.detalle[c.id]; return '<tr><td>' + escapeHtml(c.emoji + ' ' + c.titulo) + '</td><td><b>' + escapeHtml(x.palabra || '—') + '</b></td><td>' + escapeHtml(x.estado) + '</td><td>' + x.pts + '</td></tr>'; }).join('') + '</tbody></table></div>' : '';

      '<div id="p-guardado" class="muted" style="margin-top:8px"></div><div id="p-revancha"></div></div><h2>🥇 Podio</h2>' + marcadorHtml(filas, e.yo, 30) + detalle + resumenFallosSala(sala, P_N) +
      '<div class="row-btns"><button class="btn ghost" data-a="hub">🎮 Otros juegos</button><button class="btn ghost" data-tab="partidas">👥 Otra partida</button></div>';
    pintarRevancha();
    if (mio && mio.total > 0) confeti();

      sala.guardado = true;
      // Registro de la partida para el admin: total final de cada quien y, del anfitrión, el podio con bots.
      post('/juegos/sala/' + sala.codigo + '/respuesta', Object.assign({ final: mio.total }, e.soyHost ? { podio: filas.map(f => Object.assign({ nombre: f.nombre, total: f.total }, f.tipo === 'bot' ? { bot: true } : {})) } : {}));
      const n = sala.finTotal !== undefined ? sala.finTotal : basta ? basta.d.categorias.length : juego === 'loteria' ? 16 : P_N;
      const aciertos = sala.finAciertos !== undefined ? sala.finAciertos : juego === 'loteria' ? (sala.aciertosLoteria || 0) : basta ? Object.values(mio.detalle).filter(x => x.pts > 0).length : Object.values((e.jugadores.find(x => x.id === e.yo) || {}).respuestas || {}).filter(x => x.correcta).length;
      post('/juegos/partida', { juego, puntos: mio.total, aciertos, total: n, segundos: 0, sala: sala.codigo }).then(r => {
        const g = document.getElementById('p-guardado');
        if (r.ok) { state.totalIndividual = r.body.totalIndividual; state.totalPartidas = r.body.totalPartidas; state.posPartidas = r.body.pos; state.mejores[juego] = r.body.mejor; pintarChip(); if (g) g.textContent = '✔ +' + fmt(r.body.puntos) + ' a tus puntos de partidas · 👥 ' + fmt(r.body.totalPartidas) + ' en la semana (#' + r.body.pos + ')'; }
        else if (g && r.body.error === 'ya_guardada') g.textContent = '✔ Esta partida ya estaba guardada en tus puntos de partidas';
        else if (g) g.textContent = 'No se guardó en el ranking (' + (r.body.error || r.status) + ')';
      });
    }
  }

  // ---- Revancha (openspec: revancha-partidas) ----
  // Quien la abrió: su nombre en la sala vieja (por siguienteHost).
  const abrioRevancha = est => ((est.jugadores || []).find(j => j.id === est.sala.siguienteHost) || {}).nombre || 'Alguien';
  const TXT_REVANCHA = { ya_empezo: 'La revancha ya empezó. Crea otra partida en 👥 Partidas.', sala_llena: 'La revancha ya está llena.', sala_vencida: 'Esta partida ya venció.', no_termino: 'La partida todavía no termina.', no_en_sala: 'No jugaste en esta partida.' };
  // Podio: «Otra con los mismos» o, si alguien ya la abrió, «{Nombre} abrió la revancha · Unirme». Solo redibuja si cambia.
  function pintarRevancha() {
    const el = document.getElementById('p-revancha'); const e = sala.estado; if (!el || !e) return;
    const sig = e.sala.siguiente || '';
    const k = sig + '|' + (sala.revMsg || '') + '|' + !!sala.revEnviando;

    el.dataset.k = k;
    el.innerHTML = (sig ? '<div class="revancha-aviso" role="status">🔁 ' + escapeHtml(abrioRevancha(e)) + ' abrió la revancha</div>' : '') +

      (sala.revMsg ? '<div class="alert">' + escapeHtml(sala.revMsg) + '</div>' : '');

  // Abre la revancha o se une a la que ya existe (la ruta es idempotente) y entra a su sala de espera.
  async function pedirRevancha(codigo) {
    const r = await post('/juegos/sala/' + codigo + '/revancha', {});
    if (r.ok) { olvidarRevancha(); entrarSala(r.body.codigo); return null; }
    return TXT_REVANCHA[r.body.error] || ('No se pudo abrir la revancha (' + (r.body.error || r.status) + ').');
  }
  async function revanchaDesdePodio() {
    if (sala.revEnviando) return;

  // Tras recargar en el podio: el inicio de Juegos con la tarjeta de revancha arriba (si la sala vieja responde).
  async function ofrecerRevancha(codigo) {

    if (state.pidiendoSesion) return;
    pantallaHub();
    if (!r.ok) return olvidarRevancha();
    const j = juegoPorId(r.body.sala.juego);

    tabs.insertAdjacentHTML('beforebegin', '<div class="card" id="revancha-inicio" style="margin-bottom:12px;text-align:center"><div class="revancha-aviso" role="status">' +
      (sig ? '🔁 ' + escapeHtml(abrioRevancha(r.body)) + ' abrió la revancha de ' : '🏁 Terminó tu partida de ') + escapeHtml(j.emoji + ' ' + j.t) + (sig ? '' : '. ¿Otra con los mismos?') + '</div>' +
      '<div class="row-btns"><button class="btn ghost" data-a="revancha-no">No, gracias</button><button class="btn" data-a="revancha-inicio" data-codigo="' + escapeHtml(codigo) + '">' + (sig ? '🔁 Unirme' : '🔁 Otra con los mismos') + '</button></div><div id="revancha-msg"></div></div>');
  }

  // ---- Lotería en sala (openspec: juegos-loteria-preguntas) ----
  const L_CANTO = 4500, L_GRITO_BOT = 1500;
  function loteriaSala() {
    if (sala.lot) return sala.lot;
    const s = sala.estado.sala; const idx = sala.contenido.cartas.map((_, i) => i);
    const lot = { orden: barajar(idx, rngDe(s.seed, 'orden')), modo: s.opciones.modo || 'linea', marcas: Array(16).fill(false), voz: 'ambos', cantadas: 0 };
    lot.tablaDe = id => tomar(idx, 16, rngDe(s.seed, 'tabla|' + id));
    lot.mia = lot.tablaDe(sala.estado.yo);
    const guardada = salaGuardada(); // marcas de antes de recargar (openspec: juegos-recarga)
    if (guardada && guardada.codigo === sala.codigo && Array.isArray(guardada.marcas) && guardada.marcas.length === 16) lot.marcas = guardada.marcas.map(Boolean);
    sala.lot = lot;
    return lot;
  }
  // Cartas cantadas a la hora t (la carta k sale en inicio + k·canto).
  const cantadasA = t => { const s = sala.estado.sala; return t < s.inicio ? 0 : Math.min(54, Math.floor((t - s.inicio) / dur(L_CANTO)) + 1); };
  const cumpleTabla = (tabla, n) => { const set = new Set(sala.lot.orden.slice(0, n)); return cumple(tabla.map(ci => set.has(ci)), sala.lot.modo); };

  // Ganador: el grito válido más temprano (humanos por su hora; bots 1.5 s después de completar).
  function ganadorLoteria() {
    const lot = loteriaSala(); const s = sala.estado.sala;
    const gritos = sala.estado.jugadores.filter(x => x.loteria && cumpleTabla(lot.tablaDe(x.id), cantadasA(x.loteria))).map(x => ({ id: x.id, nombre: x.nombre, t: x.loteria }));
    if (s.bots) for (const b of BOTS) {
      const tabla = lot.tablaDe(b.id);
      for (let k = 1; k <= 54; k++) if (cumpleTabla(tabla, k)) { gritos.push({ id: b.id, nombre: b.nombre, t: s.inicio + (k - 1) * dur(L_CANTO) + dur(L_GRITO_BOT), bot: true }); break; }
    }
    return gritos.sort((a, b) => a.t - b.t)[0] || null;
  }

  function cantarCarta(c) {
    const v = sala.lot.voz;
    if (v === 'es') hablar(c.es, 'es-MX', 1);
    else if (v === 'en') hablar(c.en, 'en-US', .95);
    else { hablar(c.es, 'es-MX', 1); if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(c.en); u.lang = 'en-US'; u.rate = .95; speechSynthesis.speak(u); } }
  }

  function pintarLoteriaSala(body) {
    const e = sala.estado; const s = e.sala; const lot = loteriaSala(); const cartas = sala.contenido.cartas;
    const ahora = ahoraServidor();
    document.getElementById('m-bar').hidden = true;
    if (ahora < s.inicio) { const k = 'cuenta:' + Math.ceil((s.inicio - ahora) / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárate! Modo: ' + (lot.modo === 'llena' ? 'tabla llena' : 'línea') + '</div><div class="letra">' + Math.ceil((s.inicio - ahora) / 1000) + '</div></div>'; sala.vista = k; } return; }
    const n = cantadasA(ahora);
    const gan = ganadorLoteria();
    const fin = (gan && gan.t <= ahora) || (n >= 54 && ahora > s.inicio + 54 * dur(L_CANTO) + 3000);
    if (fin) {
      const nFin = gan ? cantadasA(gan.t) : 54;
      const conteo = id => { const set = new Set(lot.orden.slice(0, nFin)); return lot.tablaDe(id).filter(ci => set.has(ci)).length; };
      const filas = participantes().map(p => {
        const esGan = gan && gan.id === p.id;
        const total = esGan ? Math.min(1000, (lot.modo === 'llena' ? 500 : 300) + (54 - nFin) * 10) : conteo(p.id) * 10;
        return { id: p.id, nombre: p.nombre + (esGan ? ' 🎉' : ''), tipo: p.tipo, avatar: p.avatar, total, ultimo: 0 };
      }).sort((a, b) => b.total - a.total);
      sala.aciertosLoteria = lot.marcas.filter(Boolean).length;
      return pintarFinalSala(body, filas, null, gan ? '🎴 ¡Lotería de ' + gan.nombre + '! (' + nFin + ' cartas cantadas)' : '🎴 Se acabaron las cartas');
    }
    if (sala.vista !== 'loteria') {
      sala.vista = 'loteria';
      body.innerHTML = '<div class="lot-top"><div class="lot-carta" id="lot-carta"><div class="big">🎴</div></div><div class="lot-lado"><div class="muted">Salieron <b id="lot-n">0</b>/54 · ' + (lot.modo === 'llena' ? 'tabla llena' : 'línea') + '</div>' +
        '<div class="lot-hist" id="lot-hist"></div><div id="lot-jug"></div></div></div>' +
        '<div class="lot-grid">' + lot.mia.map((ci, i) => '<button class="lot-cell' + (lot.marcas[i] ? ' marcada' : '') + '" data-lsc="' + i + '"><span class="em">' + escapeHtml(cartas[ci].emoji) + '</span><span class="nm">' + escapeHtml(cartas[ci].es) + '</span></button>').join('') + '</div>' +
        '<div class="feedback" id="lot-msg"></div>' +
        '<div class="row-btns"><button class="btn una-grito" data-lsgrito>🎉 ¡Lotería!</button></div>' +
        '<div class="row-btns" style="margin-top:6px">' + ['es:🇲🇽 Voz español', 'ambos:🔀 Bilingüe', 'en:🇺🇸 English'].map(x => { const [v, t] = x.split(':'); return '<button class="btn ghost sm" data-lsvoz="' + v + '" aria-pressed="' + (lot.voz === v) + '">' + t + '</button>'; }).join('') + '</div>';
      lot.cantadas = 0;
    }
    if (n !== lot.cantadas) {
      const nueva = n > lot.cantadas;
      lot.cantadas = n;
      const c = cartas[lot.orden[n - 1]];
      document.getElementById('lot-carta').innerHTML = '<div class="big">' + escapeHtml(c.emoji) + '</div><div class="q">' + c.n + '. ' + escapeHtml(c.es) + '</div><div class="sub"><i>' + escapeHtml(c.en) + '</i></div><div class="sub">«' + escapeHtml(c.verso) + '»</div>';
      document.getElementById('lot-n').textContent = n;
      document.getElementById('lot-hist').innerHTML = lot.orden.slice(Math.max(0, n - 6), n - 1).reverse().map(i => '<span title="' + escapeHtml(cartas[i].es) + '">' + escapeHtml(cartas[i].emoji) + '</span>').join('');
      if (nueva) cantarCarta(c);
    }

    const set = new Set(lot.orden.slice(0, n));

  // ---------- Música de fondo generada (WebAudio, sin archivos ni derechos) ----------
  const ESTILOS_MUSICA = {
    alegre: { nombre: '🎵 Alegre', bpm: 118 },
    relajante: { nombre: '😌 Relajante', bpm: 72 },
    fiesta: { nombre: '🎉 Fiesta', bpm: 126 },
  };
  const PROG = [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]]; // I–V–vi–IV (semitonos sobre Do)
  const hz = st => 261.63 * Math.pow(2, st / 12);
  const musica = { estilo: null, volumen: 'bajo', ctx: null, master: null, timer: null, paso: 0, siguiente: 0 };

  function leerPrefMusica() { try { return JSON.parse(localStorage.getItem('juegos_pref') || '{}'); } catch (e) { return {}; } }
  function guardarPrefMusica() { try { localStorage.setItem('juegos_pref', JSON.stringify({ musica: musica.estilo, volumen: musica.volumen })); } catch (e) { /* sin almacenamiento */ } }
  const volMusica = () => musica.volumen === 'medio' ? 0.16 : 0.08;

  function notaMusica(t, freq, dur, tipo, vol, filtro) {
    const c = musica.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let salida = g;
    if (filtro) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtro; g.connect(f); salida = f; }
    o.connect(g); salida.connect(musica.master); o.start(t); o.stop(t + dur + 0.05);
  }
  function ruidoMusica(t, dur, vol, agudo) {
    const c = musica.ctx; const n = Math.floor(c.sampleRate * dur); const buf = c.createBuffer(1, n, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf; const g = c.createGain(); g.gain.value = vol;
    const f = c.createBiquadFilter(); f.type = agudo ? 'highpass' : 'lowpass'; f.frequency.value = agudo ? 7000 : 900;
    src.connect(f); f.connect(g); g.connect(musica.master); src.start(t);
  }
  function bomboMusica(t) {
    const c = musica.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(musica.master); o.start(t); o.stop(t + 0.2);
  }

  // Un paso = corchea. 8 pasos por compás, 4 compases por vuelta.
  function pasoMusica(t, paso) {
    const est = musica.estilo; const acorde = PROG[Math.floor(paso / 8) % 4]; const i = paso % 8; const corchea = 30 / ESTILOS_MUSICA[est].bpm;
    if (est === 'alegre') {
      const penta = [0, 2, 4, 7, 9, 12, 14, 16];
      notaMusica(t, hz(penta[(paso * 3 + acorde[0]) % penta.length] + 12), corchea * 0.9, 'square', 0.05, 2500);
      if (i % 2 === 0) notaMusica(t, hz(acorde[0] - 12), corchea * 1.8, 'triangle', 0.22);
      if (i % 2 === 1) ruidoMusica(t, 0.04, 0.05, true);
    } else if (est === 'relajante') {
      if (i === 0) acorde.forEach((st, k) => notaMusica(t, hz(st) * (1 + (k - 1) * 0.002), corchea * 8, 'sine', 0.07));
      if (i % 2 === 0) notaMusica(t, hz(acorde[(i / 2) % 3] + 12), corchea * 2.5, 'triangle', 0.035);
      if (i === 0 || i === 4) notaMusica(t, hz(acorde[0] - 24), corchea * 4, 'sine', 0.18);
      if (Math.random() < 0.3) ruidoMusica(t, 0.02, 0.012, true);
    } else if (est === 'fiesta') {
      if (i % 2 === 0) bomboMusica(t);
      if (i % 2 === 1) notaMusica(t, hz(acorde[0] - 12), corchea * 0.9, 'sawtooth', 0.12, 700);
      if (i === 2 || i === 6) acorde.forEach(st => notaMusica(t, hz(st + 12), corchea * 0.6, 'sawtooth', 0.035, 1800));
      if (i % 2 === 1) ruidoMusica(t, 0.03, 0.06, true);
    }
  }

  function iniciarMusica(estilo) {
    detenerMusica();
    musica.estilo = estilo; guardarPrefMusica(); pintarBotonMusica();

    try {
      musica.ctx = musica.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (musica.ctx.state === 'suspended') musica.ctx.resume();
      musica.master = musica.ctx.createGain(); musica.master.gain.value = volMusica(); musica.master.connect(musica.ctx.destination);
      musica.paso = 0; musica.siguiente = musica.ctx.currentTime + 0.1;

        while (musica.siguiente < musica.ctx.currentTime + 0.12) { pasoMusica(musica.siguiente, musica.paso++); musica.siguiente += corchea; }

  function detenerMusica() {

      '<h3>Qué es un juego</h3><table><tr><td><b>Tercia o cuarteta</b></td><td>3 o 4 cartas del mismo número, de palos distintos: 5🪙 5🏆 5⚔️</td></tr><tr><td><b>Escalera</b></td><td>3 o más seguidas del mismo palo: 3⚔️ 4⚔️ 5⚔️. Ojo: <b>el 7 y la sota (10) van seguidas</b>: 6🏆 7🏆 10🏆</td></tr></table>' +
      '<h3>Tu turno</h3><ol><li>Se voltea una carta del mazo para ti. Si te sirve, <b>tómala</b>: debes bajarla en ese momento formando un juego con cartas de tu mano, o agregarla a uno de tus juegos.</li>' +
      '<li>Después de tomar, puedes bajar más juegos y al final <b>descartas</b> una carta: se la ofreces a tu rival.</li><li>Si no la quieres, di <b>«No la quiero»</b>: la carta volteada se le ofrece a tu rival; si nadie la toma, queda muerta y se voltea otra.</li></ol>' +
      '<h3>Cómo lo haces aquí</h3><ul><li>Toca cartas de tu mano para seleccionarlas (suben).</li><li>Toca uno de tus juegos bajados si quieres agregarle cartas (se marca como destino).</li><li>Usa ✅ Tomar y bajar, ⬇️ Bajar juego, 🗑️ Descartar (1 carta seleccionada) o 🙅 No la quiero.</li></ul>' +
      '<p>Empiezas con 8 cartas: para ganar necesitas bajar las 8 más la que tomes (9). Si se acaba el mazo, es empate.</p>',
  };
  Object.assign(AYUDA, ClasicosRapidosUI.AYUDA); // clasicos-rapidos
  function ayuda(id) {
    const d = document.createElement('dialog'); d.className = 'ayuda'; d.setAttribute('aria-label', 'Cómo se juega');
    d.innerHTML = (AYUDA[id] || TableroUI.ayuda(id) || AYUDA_GRANDES[id] || '<p>Pronto.</p>') + '<div class="row-btns"><button class="btn" data-cerrar-ayuda autofocus>Entendido</button></div>'; // juegos-tablero y juegos-salas-grandes
    document.body.appendChild(d);
    d.addEventListener('close', () => d.remove());
    d.addEventListener('click', e => { if (e.target.closest('[data-cerrar-ayuda]') || e.target === d) d.close(); });
    d.showModal();
  }
  document.addEventListener('click', e => { const a = e.target.closest('[data-ayuda]'); if (a) ayuda(a.dataset.ayuda); });

  // ---------- Eventos ----------
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-tab]'); if (t) { limpiar(); olvidarRevancha(); return pantallaHub(t.dataset.tab); }
    const pq = e.target.closest('[data-pq]'); if (pq) return responderSala(Number(pq.dataset.pq), Number(pq.dataset.po));
    if (SalasGrandes.clic(e)) return; // juegos-salas-grandes
    if (sala.estado && sala.estado.sala.juego === 'una' && document.getElementById('p-body') && clicUnaSala(e)) return;
    if (sala.estado && sala.estado.sala.juego === 'poker' && document.getElementById('p-body') && e.target.closest('[data-pk]')) { clicPokerSala(e); return; }
    if (sala.estado && ['brisca', 'conquian'].includes(sala.estado.sala.juego) && document.getElementById('p-body') && clicCartasSala(e)) return;
    if (sala.estado && sala.estado.sala.juego === 'ajedrez' && document.getElementById('p-body') && clicAjedrezSala(e)) return;
    if (sala.estado && TableroUI.esSala(sala.estado.sala.juego) && document.getElementById('p-body') && TableroUI.clicSala(e)) return; // juegos-tablero
    const lsc = e.target.closest('[data-lsc]'); if (lsc) return marcarLoteriaSala(Number(lsc.dataset.lsc), lsc);
    if (e.target.closest('[data-lsgrito]')) return gritarLoteriaSala();
    const lsv = e.target.closest('[data-lsvoz]'); if (lsv) { sala.lot.voz = lsv.dataset.lsvoz; document.querySelectorAll('[data-lsvoz]').forEach(x => x.setAttribute('aria-pressed', String(x === lsv))); return; }
    const pa = e.target.closest('[data-p]');
    if (pa && pa.dataset.p === 'compartir') return compartirSala(pa);
    if (pa && pa.dataset.p === 'revancha') return revanchaDesdePodio();
    if (pa && pa.dataset.p === 'empezar') { pa.disabled = true; return post('/juegos/sala/' + sala.codigo + '/empezar', {}).then(r => { if (!r.ok && r.body.error === 'faltan_jugadores') { pa.disabled = false; alert('👥 Faltan jugadores. Espera a que se una tu rival.'); } return traerSala(); }).then(() => { sala.vista = null; pintarSala(); }); }
    if (pa && pa.dataset.p === 'empezar') { pa.disabled = true; return post('/juegos/sala/' + sala.codigo + '/empezar', {}).then(r => { if (!r.ok && r.body.error === 'faltan_jugadores') { pa.disabled = false; alert(TableroUI.faltan(sala.estado.sala.juego) || '👥 Faltan jugadores. Espera a que se una tu rival.'); /* juegos-tablero */ } return traerSala(); }).then(() => { sala.vista = null; pintarSala(); }); }
    const adm = e.target.closest('[data-adm]'); if (adm) return cambiarSubAdmin(adm.dataset.adm);
    const qf = e.target.closest('[data-quitar-foto]'); if (qf) return quitarFoto(qf);
    const rt = e.target.closest('[data-rtipo]'); if (rt) { state.rtipo = rt.dataset.rtipo; return pintarRanking(); }
    const rjt = e.target.closest('#rj-todos'); // top 10 ↔ todos (openspec: ranking-juegos-top10)
    if (rjt) { const ol = document.getElementById('rank-juegos'), abre = !ol.classList.contains('todos'); ol.classList.toggle('todos', abre); rjt.setAttribute('aria-expanded', String(abre)); rjt.textContent = abre ? 'Ver solo el top 10 ▴' : 'Ver los ' + rjt.dataset.total + ' juegos ▾'; return; }
    const g = e.target.closest('[data-juego]');
    if (g) { limpiar(); const j = juegoPorId(g.dataset.juego); app.innerHTML = '<div class="loading">Preparando…</div>'; return Promise.resolve(j.jugar()).catch(err => { app.innerHTML = '<div class="alert">No se pudo cargar el juego (' + escapeHtml(err.message) + ').</div>'; }); }
    const a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'reanudar') return reanudarPartida();
    if (a.dataset.a === 'revancha-no') { olvidarRevancha(); const c = document.getElementById('revancha-inicio'); if (c) c.remove(); return; }
    if (a.dataset.a === 'revancha-inicio') {
      a.disabled = true;
      return pedirRevancha(a.dataset.codigo).then(msg => { if (msg === null) return; a.disabled = false; const m = document.getElementById('revancha-msg'); if (m) m.innerHTML = '<div class="alert">' + escapeHtml(msg) + '</div>'; });
    }
    if (a.dataset.a === 'adm-actualizar') return cargarAdmin(ADM_FUENTES);
    if (a.dataset.a === 'adm-reintentar') return cargarAdmin([a.dataset.fuente]);
    if (a.dataset.a === 'adm-limpiar') { const q = document.getElementById('adm-buscar'); q.value = ''; aplicarBusqueda(); return q.focus(); }
    if (a.dataset.a === 'salir' || a.dataset.a === 'hub') { limpiar(); olvidarRevancha(); pantallaHub(); }
    if (a.dataset.a === 'reintentar') iniciar();
    if (a.dataset.a === 'csv') descargarCsv([['correo', 'apodo', 'registrado', 'ultima_visita', 'visitas', 'puntos_semana']].concat((state.invitadosLista || []).map(x => [x.email, x.nombre, x.registradoEn, x.ultimaVisita, x.visitas, x.puntosSemana])), 'invitados-juegos.csv');
    if (a.dataset.a === 'csv-jugadores') { const l = state.jugadoresLista || { jugadores: [], pendientes: [] }; descargarCsv([['estado', 'nombre', 'nick', 'correo', 'tipo', 'puntos_semana', 'partidas_semana', 'ultima_visita_o_registro']].concat(l.jugadores.map(j => ['registrado', j.nombre, j.nick || '', j.email, j.espacio, j.puntosSemana, j.partidasSemana, j.ultimaVisita]), l.pendientes.map(p => [p.estado, '', '', p.email, '', '', '', p.creada])), 'jugadores-juegos.csv'); }
    if (a.dataset.a === 'registro') return pantallaRegistro();
    // «🆕 Registrar» (openspec: registro-juegos-hub): cierra la sesión en este aparato y abre el registro para otra persona.
    if (a.dataset.a === 'registrar') {
      if (!confirm('¿Cerrar tu sesión en este aparato para que otra persona cree su cuenta de Juegos?')) return;
      StaldAuth.salir().then(() => { state.email = null; borrarRegistro(); pantallaRegistro(); });
      return;
    }
    if (a.dataset.a === 'otro-correo') { StaldAuth.salir().then(() => { state.email = null; pantallaLogin(); }); }
  });
  app.addEventListener('change', e => { if (e.target.id === 'p-juego') { document.getElementById('p-cat-wrap').hidden = e.target.value !== 'cultura'; document.getElementById('p-modo-wrap').hidden = e.target.value !== 'loteria'; document.getElementById('p-rondas-wrap').hidden = !e.target.value.startsWith('basta'); document.getElementById('p-equipos-wrap').hidden = e.target.value !== 'poker'; document.getElementById('p-reloj-wrap').hidden = e.target.value !== 'ajedrez'; opcionesMapaArcade(e.target.value); document.getElementById('p-tema-wrap').hidden = e.target.value !== 'en-frases';
    const nota = { ajedrez: '♟️ Partida 1 vs 1 solo entre dos personas: quien crea y quien se une. Sin bots.', brisca: '🏆 Se juega entre 4 en parejas: si faltan personas, se completa con bots. Máximo 4.' }[e.target.value];
    document.getElementById('p-bots-wrap').hidden = !!nota; const n = document.getElementById('p-bots-nota'); n.hidden = !nota; n.textContent = nota || '';
    TableroUI.alCambiarJuego(e.target.value); } }); // juegos-tablero
  app.addEventListener('change', e => { if (e.target.id === 'p-juego') SalasGrandes.formulario(e.target.value); }); // juegos-salas-grandes
  // cultura-conocimiento: el tema de la Línea del tiempo solo se ve al elegirla.
  app.addEventListener('change', e => { if (e.target.id === 'p-juego') document.getElementById('p-ltema-wrap').hidden = e.target.value !== 'cultura-linea'; });
  app.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.pextra) limitarExtras(e.target, 'pextra', 'p-extra-aviso'); }); // basta-divertida-una-robo
  app.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.pbcat) { const f = document.getElementById('pb-form'); const lleno = [...f.querySelectorAll('input')].every(i => i.value.trim()); document.getElementById('pb-basta').disabled = !lleno; }
  });
  app.addEventListener('submit', async e => {
    if (e.target.id === 'f-crear') { e.preventDefault(); return crearPartida(); }
    if (e.target.id === 'f-unirse') { e.preventDefault(); return unirsePartida(); }
    if (e.target.id === 'pb-form') {
      e.preventDefault();
      const palabras = palabrasForm();
      document.getElementById('pb-basta').disabled = true;
      return post('/juegos/sala/' + sala.codigo + '/respuesta', { ronda: sala.rondaActual, palabras, basta: true }).then(() => traerSala());
    }
    if (e.target.id === 'f-entrada') {
      e.preventDefault();
      const correo = document.getElementById('ent-correo').value.trim().toLowerCase();
      const apodo = document.getElementById('ent-nick').value.trim().replace(/\s+/g, ' ');
      entradaPrevia = { correo, nick: apodo };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return pantallaLogin('Escribe un correo válido, por ejemplo tucorreo@gmail.com.');
      if (!/^[\p{L}\p{N} ]{2,20}$/u.test(apodo)) return pantallaLogin('Tu nick debe tener de 2 a 20 letras o números.');
      if (!document.getElementById('ent-acepto').checked) return pantallaLogin('Para entrar a Juegos necesitas aceptar el aviso.');
      try { localStorage.setItem(ACEPTO_KEY, '1'); } catch (err) { /* sin almacenamiento */ }
      return registrarDirecto(apodo, correo);
    }
    if (e.target.id === 'f-invitado') {
      e.preventDefault();
      const nombre = document.getElementById('apodo').value.trim();
      if (!document.getElementById('acepto').checked) return pantallaInvitado('Para crear tu cuenta de Juegos necesitas aceptar el aviso.');
      if (!/^[\p{L}\p{N} ]{2,20}$/u.test(nombre)) return pantallaInvitado('Tu apodo debe tener de 2 a 20 letras o números.');
      const r = await post('/juegos/invitado', { nombre, acepto: true });
      if (!r.ok) return pantallaInvitado('No se pudo registrar (' + (r.body.error || r.status) + ').');
      localStorage.setItem('stald_email', state.email);
      iniciar();
    }
  });

  iniciar();
</script>
