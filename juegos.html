      '<label>Modo</label><div class="opts"><button class="opt" data-pk-modo="solo" aria-pressed="true">🎩 Solo contra la mesa</button><button class="opt" data-pk-modo="pareja">🤝 En pareja con Vesper</button></div>' +
      '<div id="pk-rivales"><label>Rivales</label><div class="opts" style="grid-template-columns:repeat(4,1fr)">' + [1, 2, 3, 4].map(n => '<button class="opt" data-pk-bots="' + n + '"' + (n === 3 ? ' aria-pressed="true"' : '') + '>' + n + '</button>').join('') + '</div></div>' +
      '<div class="row-btns"><button class="btn ghost" data-ayuda="poker">📖 Cómo se juega</button><button class="btn" data-pk-go>🃏 Repartir</button></div>';
    let bots = 3, pareja = false;
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-pk-bots]'), md = e.target.closest('[data-pk-modo]');
      if (b) { bots = Number(b.dataset.pkBots); m.body.querySelectorAll('[data-pk-bots]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
      if (md) { pareja = md.dataset.pkModo === 'pareja'; m.body.querySelectorAll('[data-pk-modo]').forEach(x => x.setAttribute('aria-pressed', String(x === md))); document.getElementById('pk-rivales').hidden = pareja; }
      if (e.target.closest('[data-pk-go]')) jugarPoker(pareja ? 3 : bots, pareja);

  function jugarPoker(numBots, pareja) {
    const m = marco('poker');
    const bots = PK_BOTS.slice(0, numBots);
    const st = Cartas.pokerNueva([{ id: 'yo', nombre: 'Tú' }].concat(bots.map((b, i) => ({ id: 'b' + i, nombre: b.nombre, bot: true }))), { fichas: 1000, manos: 10 });
    const equipos = pareja ? [0, 0, 1, 1] : null;
    const nombre = i => i === 0 ? 'Tú' : bots[i - 1].nombre;
    const avatar = i => i === 0 ? '🙂 ' : bots[i - 1].emoji + ' ';
    const ganadas = {}; const t0 = Date.now();
    let terminado = false;
    const pintar = () => {
      if (terminado) return;
      const miTurno = st.fase !== 'fin' && st.turno === 0;
      const pie = st.fase === 'fin' ? '<div class="row-btns"><button class="btn" data-pk-sig>' + (st.jugadores[0].fichas <= 0 || st.mano + 1 >= st.manos ? '🏁 Ver resultado' : '➡️ Siguiente mano') + '</button></div>' : '';
      m.body.innerHTML = pkMesaHtml(st, { yo: 0, nombre, avatar, equipos, miTurno, pie });
      m.puntos(st.jugadores[0].fichas);
    };
    const fin = () => {
      terminado = true;
      const { puntos, eq } = pkPuntos(st, equipos);
      const mano = st.mano + 1;
      terminar('poker', { puntos: puntos[0], aciertos: ganadas[0] || 0, total: mano, segundos: (Date.now() - t0) / 1000,
        titulo: st.jugadores[0].fichas <= 0 ? '💸 Te quedaste sin fichas' : eq ? (eq.gana === 0 ? '🤝 ¡Ganó tu pareja!' : eq.gana === 1 ? '😅 Ganó la otra pareja' : '🤝 Empate entre parejas') : '♠️ ¡Fin de la partida!',
        detalle: 'Terminaste con 🪙 ' + fmt(st.jugadores[0].fichas) + ' fichas · ganaste ' + (ganadas[0] || 0) + ' de ' + mano + ' manos' + (eq ? ' · pareja ' + fmt(eq.tot[0]) + ' vs ' + fmt(eq.tot[1]) : '') + '.' });
    };
    let auto = null;
    const siguienteMano = () => {
      clearTimeout(auto);
      if (st.jugadores[0].fichas <= 0) return fin();
      Cartas.pokerMano(st);
      if (st.terminada) return fin();
      programar();
    };
    function programar() {
      if (terminado) return;
      pkContar(st, ganadas);
      pintar();
      if (st.fase === 'fin') {
        if (st.resultado.premios[0] > 0) sonidoOk();
        auto = setTimeout(() => { if (!terminado) siguienteMano(); }, 10000 * TIEMPO); /* ritmo más lento (ajuste del profe) */ limpiezas.push(() => clearTimeout(auto));
        return;
      }
      if (st.turno !== 0) { const t = setTimeout(() => { if (terminado) return; Cartas.pokerActuar(st, Cartas.pokerBot(st)); tono(440, 60); programar(); }, 2000 * TIEMPO); limpiezas.push(() => clearTimeout(t)); }
    }
    m.body.addEventListener('click', e => {
      if (terminado) return;
      if (e.target.closest('[data-pk-sig]')) return siguienteMano();
      const b = e.target.closest('[data-pk]');
      if (!b || st.fase === 'fin' || st.turno !== 0) return;
      if (!Cartas.pokerActuar(st, pkJugadaDe(b))) { sonidoMal(); return; }
      tono(520, 60); programar();
    });
    limpiezas.push(() => { terminado = true; });
    siguienteMano();
  }

  // ---------- Clásicos: baraja española — Brisca y Conquián (openspec: cartas-espanolas) ----------
  const ES_COLOR = ['#b45309', '#dc2626', '#1d4ed8', '#15803d']; // oros, copas, espadas, bastos
  const ES_FIG = { 1: 'AS', 10: 'SOTA', 11: 'CABALLO', 12: 'REY' };
  function esCarta(id, extra) {
    if (id === null) return '<span class="es-carta vacia' + (extra || '') + '"></span>';
    if (id === undefined) return '<span class="es-carta oculta' + (extra || '') + '"></span>';
    const v = Cartas.espValor(id), pl = Cartas.espPalo(id);
    return '<span class="es-carta' + (extra || '') + '" style="--pc:' + ES_COLOR[pl] + '" aria-label="' + escapeHtml(Cartas.nombreEsp(id)) + '"><span class="v">' + v + '</span><span class="p">' + Cartas.ESP_EMOJI[pl] + '</span><span class="f">' + (ES_FIG[v] || '') + '</span></span>';
  }
  const ordenMano = ids => ids.slice().sort((a, b) => Cartas.espPalo(a) - Cartas.espPalo(b) || Cartas.espOrden(a) - Cartas.espOrden(b));
  const ES_BOTS = [{ nombre: 'La Güera', emoji: '💃' }, { nombre: 'El Compadre', emoji: '🤠' }, { nombre: 'Doña Chonita', emoji: '👵' }];

  // Puntos de la Brisca: puntos de cartas (o de la pareja) sobre 120 → 800, +200 si gana.
  function brPuntos(st, j) {
    const r = Cartas.briscaResultado(st);
    const k = st.equipos ? st.equipos[j] : j;
    return { puntos: Math.min(1000, Math.round(r.totales[k] * 800 / 120) + (r.ganador === k ? 200 : 0)), mios: r.totales[k], gano: r.ganador === k, empate: r.ganador === -1, r };
  }
  // Puntos del Conquián: ganar = 700 + 15 por carta que queda en el mazo; si no, 50 por carta bajada.
  const cqPuntos = (st, j) => st.ganador === j ? Math.min(1000, 700 + st.mazo.length * 15) : Math.min(1000, Cartas.bajadas(st, j) * 50);

  function briscaHtml(st, o) {
    const yo = o.yo, n = st.n;
    const otros = [...Array(n).keys()].filter(i => i !== yo);
    const tagEq = i => st.equipos ? ' <span class="pk-tag eq' + 'AB'[st.equipos[i]] + '">' + (yo >= 0 && st.equipos[i] === st.equipos[yo] ? 'pareja' : 'rival') + '</span>' : '';
    const asientos = '<div class="pk-asientos">' + otros.map(i => '<div class="pk-asiento' + (!st.terminada && st.turno === i ? ' turno' : '') + '"><span class="n">' + o.avatar(i) + escapeHtml(o.nombre(i)) + tagEq(i) + '</span><span>' +
      st.manos[i].map(() => esCarta(undefined, ' chica')).join(' ') + '</span><span class="muted">' + st.ganadas[i].length / n + ' ronda(s)</span></div>').join('') + '</div>';
    const baza = st.baza.length ? st.baza : (o.verUltima && st.ultimaBaza ? st.ultimaBaza.cartas : []);
    const u = st.ultimaBaza;
    const msg = st.baza.length ? '' : u ? '🏆 ' + escapeHtml(o.nombre(u.ganador)) + ' gana la ronda' + (u.puntos ? ' (+' + u.puntos + ')' : '') : '¡A jugar! Abre ' + escapeHtml(o.nombre(st.turno));
    const mesa = '<div class="pk-mesa es-mesa"><div class="pk-titulo">🏆 Brisca · triunfo ' + Cartas.ESP_PALOS[st.paloTriunfo] + ' ' + Cartas.ESP_EMOJI[st.paloTriunfo] + '</div>' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0">' + (st.mazo.length ? esCarta(st.triunfo, ' chica triunfo') + '<span class="pk-bote">🂠 ' + st.mazo.length + '</span>' : '<span class="pk-bote">Mazo agotado</span>') + '</div>' +
      '<div class="es-baza">' + baza.map(b => '<figure>' + esCarta(b.carta) + '<figcaption>' + escapeHtml(o.nombre(b.j)) + '</figcaption></figure>').join('') + '</div>' +
      '<div class="pk-msg">' + msg + '</div></div>';
    const mio = yo >= 0 ? '<div class="pk-yo"><div class="pk-asiento' + (!st.terminada && st.turno === yo ? ' turno' : '') + '"><span class="n">' + o.avatar(yo) + escapeHtml(o.nombre(yo)) + tagEq(yo) + '</span><span class="muted">' + st.ganadas[yo].length / n + ' ronda(s) · ' + st.puntos[yo] + ' pts</span></div></div>' +
      '<div class="es-mano">' + st.manos[yo].map(c => '<button class="es-btn' + (o.miTurno ? ' jugable' : '') + '" data-br-carta="' + c + '"' + (o.miTurno ? '' : ' data-no="1"') + '>' + esCarta(c) + '</button>').join('') + '</div>' : '';
    return asientos + mesa + mio + (o.pie || '') + '<div class="row-btns" style="margin-top:8px"><button class="btn ghost sm" data-ayuda="brisca">📖 Cómo se juega</button></div>';
  }

  function conquianHtml(st, o) {
    const yo = o.yo, rival = yo >= 0 ? 1 - yo : 1, ver = yo >= 0 ? yo : 0;
    const juegos = (j, propios) => '<div class="es-juegos">' + (st.bajados[j].length ? st.bajados[j].map((m, a) => (propios ? '<button class="es-juego' + (o.destino === a ? ' destino' : '') + '" data-cq-juego="' + a + '" aria-label="Juego ' + (a + 1) + '">' : '<span class="es-juego">') +
      ordenMano(m).map(c => esCarta(c, ' chica')).join('') + (propios ? '</button>' : '</span>')).join('') : '<span class="muted" style="font-size:.78rem">Sin juegos bajados</span>') + '</div>';
    const of = st.oferta;
    const deQuien = !of ? '' : of.origen === 'descarte' ? 'Descarte de ' + escapeHtml(o.nombre(1 - of.para)) : of.segunda ? escapeHtml(o.nombre(1 - of.para)) + ' no la quiso' : 'Volteada del mazo';
    const u = st.ultima;
    const ult = !u ? '' : escapeHtml(o.nombre(u.j)) + ' ' + ({ pasar: 'no quiso ' + Cartas.nombreEsp(u.carta), tomar: 'tomó ' + Cartas.nombreEsp(u.carta), bajar: 'bajó un juego', descartar: 'descartó ' + Cartas.nombreEsp(u.carta) })[u.accion];
    const mesa = '<div class="pk-mesa es-mesa"><div class="pk-titulo">🪙 Conquián · gana quien baja 9</div>' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0"><span' + (of ? ' data-cq-oferta="' + of.carta + '"' : '') + '>' + esCarta(of ? of.carta : null) + '</span>' +
      '<div style="text-align:left;font-size:.8rem"><b>' + (of ? 'Para ' + escapeHtml(o.nombre(of.para)) : st.terminada ? 'Fin' : 'Bajando…') + '</b><br>' + deQuien + '<br>🂠 ' + st.mazo.length + ' en el mazo · 💀 ' + st.muertas.length + '</div></div>' +
      '<div class="pk-msg">' + ult + '</div></div>';
    let botones = '';
    if (o.miTurno) {
      botones = st.fase === 'oferta'
        ? '<div class="muted" style="font-size:.8rem;text-align:center">Elige cartas de tu mano que hagan juego con la carta de la mesa, o toca uno de tus juegos para agregarla.</div><div class="row-btns"><button class="btn ghost" data-cq="pasar">🙅 No la quiero</button><button class="btn" data-cq="tomar">✅ Tomar y bajar</button></div>'
        : '<div class="muted" style="font-size:.8rem;text-align:center">Puedes bajar más juegos con tu mano. Para terminar tu turno, elige 1 carta y descártala.</div><div class="row-btns"><button class="btn ghost" data-cq="bajar">⬇️ Bajar juego</button><button class="btn" data-cq="descartar">🗑️ Descartar</button></div>';
    }
    const mano = yo >= 0 ? '<div class="es-mano">' + ordenMano(st.manos[yo]).map(c => '<button class="es-btn' + (o.sel && o.sel.has(c) ? ' sel' : '') + '" data-cq-carta="' + c + '">' + esCarta(c) + '</button>').join('') + '</div>' : '';
    return '<div class="pk-asientos"><div class="pk-asiento' + (!st.terminada && st.turno === rival ? ' turno' : '') + '"><span class="n">' + o.avatar(rival) + escapeHtml(o.nombre(rival)) + '</span><span>' + st.manos[rival].map(() => esCarta(undefined, ' chica')).join('') +
      '</span><span class="muted">' + Cartas.bajadas(st, rival) + ' de 9 bajadas</span>' + juegos(rival, false) + '</div></div>' + mesa +
      (yo >= 0 ? '<div class="es-seccion">Tus juegos · ' + Cartas.bajadas(st, ver) + ' de 9' + (o.destino !== null && o.destino !== undefined ? ' · destino: juego ' + (o.destino + 1) : '') + '</div>' + juegos(yo, true) + mano : '') +
      '<div class="feedback" id="cq-msg">' + (o.msg || '') + '</div>' + botones + (o.pie || '') +
      '<div class="row-btns" style="margin-top:8px"><button class="btn ghost sm" data-ayuda="conquian">📖 Cómo se juega</button></div>';
  }
  const CQ_INVALIDA = 'Eso no forma un juego: 3 o 4 del mismo número (de palos distintos), o 3 o más seguidas del mismo palo (el 7 y la sota van seguidas).';
  // Jugada de Conquián a partir de los botones, la selección y el destino; null si falta algo.
  function cqJugadaDe(accion, sel, destino) {
    if (accion === 'pasar') return { accion };
    if (accion === 'descartar') return sel.size === 1 ? { accion, carta: [...sel][0] } : null;
    return Object.assign({ accion, con: [...sel] }, destino !== null && destino !== undefined ? { a: destino } : {});
  }

  function elegirBrisca() {
    const m = marco('brisca');
    m.body.innerHTML = '<div class="q-card"><div class="big">🪙🏆⚔️🪵</div><div class="q">Brisca</div><div class="sub">Baraja española de 40 cartas. Gana quien junta más de 60 de los 120 puntos.</div></div>' +
      '<label>Modo</label><div class="opts" style="grid-template-columns:repeat(3,1fr)"><button class="opt" data-br-modo="1" aria-pressed="true">🙂 vs 1</button><button class="opt" data-br-modo="2">👥 vs 2</button><button class="opt" data-br-modo="pareja">🤝 En pareja</button></div>' +
      '<div class="row-btns"><button class="btn ghost" data-ayuda="brisca">📖 Cómo se juega</button><button class="btn" data-br-go>🃏 Repartir</button></div>';
    let modo = '1';
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-br-modo]');
      if (b) { modo = b.dataset.brModo; m.body.querySelectorAll('[data-br-modo]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }
      if (e.target.closest('[data-br-go]')) jugarBrisca(modo);
    });
  }

  function jugarBrisca(modo) {
    const m = marco('brisca');
    const bots = modo === 'pareja' ? [ES_BOTS[0], ES_BOTS[1], ES_BOTS[2]] : ES_BOTS.slice(0, Number(modo));
    // En pareja: tú (0) y El Compadre (2) contra La Güera (1) y Doña Chonita (3).
    const lugares = modo === 'pareja' ? [null, ES_BOTS[0], ES_BOTS[1], ES_BOTS[2]] : [null].concat(bots);
    const st = Cartas.briscaNueva(lugares.map((b, i) => ({ id: 'j' + i, nombre: b ? b.nombre : 'Tú' })));
    const nombre = i => i === 0 ? 'Tú' : lugares[i].nombre, avatar = i => i === 0 ? '🙂 ' : lugares[i].emoji + ' ';
    const t0 = Date.now(); let terminado = false, verUltima = false;
    const pintar = () => { m.body.innerHTML = briscaHtml(st, { yo: 0, nombre, avatar, miTurno: !st.terminada && st.turno === 0 && !verUltima, verUltima }); m.puntos(st.puntos[0]); };
    const fin = () => {
      terminado = true;
      const b = brPuntos(st, 0);
      terminar('brisca', { puntos: b.puntos, aciertos: st.ganadas[0].length / st.n, total: 40 / st.n | 0, segundos: (Date.now() - t0) / 1000,
        titulo: b.empate ? '🤝 ¡Empate a 60!' : b.gano ? (st.equipos ? '🤝 ¡Ganó tu pareja!' : '🏆 ¡Ganaste la Brisca!') : '😅 Esta vez no',
        detalle: (st.equipos ? 'Tu pareja juntó ' : 'Juntaste ') + b.mios + ' de 120 puntos · ' + b.r.totales.join(' vs ') + '.' });
    };
    function programar() {
      if (terminado) return;
      pintar();
      if (st.terminada) { const t = setTimeout(fin, 1500 * TIEMPO); limpiezas.push(() => clearTimeout(t)); return; }
      if (verUltima) { const t = setTimeout(() => { verUltima = false; programar(); }, 5300 * TIEMPO); /* la baza se ve ~4 s más (ajuste del profe) */ limpiezas.push(() => clearTimeout(t)); return; }
      if (st.turno !== 0) { const t = setTimeout(() => { if (terminado) return; jugar(Cartas.briscaBot(st)); }, 1500 * TIEMPO); limpiezas.push(() => clearTimeout(t)); }
    }
    function jugar(carta) {
      if (!Cartas.briscaJugar(st, carta)) return false;
      tono(480, 50);
      if (!st.baza.length) { verUltima = true; if (st.ultimaBaza.ganador === 0 || (st.equipos && st.equipos[st.ultimaBaza.ganador] === 0)) sonidoOk(); }
      programar(); return true;
    }
    m.body.addEventListener('click', e => {
      const b = e.target.closest('[data-br-carta]');
      if (!b || terminado || verUltima || st.turno !== 0 || st.terminada) return;
      jugar(Number(b.dataset.brCarta));
    });
    limpiezas.push(() => { terminado = true; });
    programar();
  }

  function elegirConquian() {
    const m = marco('conquian');
    m.body.innerHTML = '<div class="q-card"><div class="big">🪙🏆⚔️🪵</div><div class="q">Conquián</div><div class="sub">El rummy mexicano: forma tercias y escaleras con la carta de la mesa hasta bajar 9 cartas.</div></div>' +
      '<div class="row-btns"><button class="btn ghost" data-ayuda="conquian">📖 Cómo se juega</button><button class="btn" data-cq-go>🃏 Repartir contra El Compadre 🤠</button></div>';
    m.body.addEventListener('click', e => { if (e.target.closest('[data-cq-go]')) jugarConquian(); });
  }

  function jugarConquian() {
    const m = marco('conquian');
    const st = Cartas.conquianNueva([{ id: 'yo', nombre: 'Tú' }, { id: 'bot', nombre: 'El Compadre' }]);
    const nombre = i => i === 0 ? 'Tú' : 'El Compadre', avatar = i => i === 0 ? '🙂 ' : '🤠 ';
    const sel = new Set(); let destino = null, msg = '', terminado = false;
    const t0 = Date.now();
    const pintar = () => { m.body.innerHTML = conquianHtml(st, { yo: 0, nombre, avatar, miTurno: !st.terminada && st.turno === 0, sel, destino, msg }); m.puntos(Cartas.bajadas(st, 0)); };
    const fin = () => {
      terminado = true;
      terminar('conquian', { puntos: cqPuntos(st, 0), aciertos: Cartas.bajadas(st, 0), total: 9, segundos: (Date.now() - t0) / 1000,
        titulo: st.ganador === 0 ? '🎉 ¡Conquián! Bajaste 9' : st.ganador === -1 ? '🤝 Se acabó el mazo: empate' : '😅 Ganó El Compadre',
        detalle: 'Bajaste ' + Cartas.bajadas(st, 0) + ' de 9 cartas · quedaron ' + st.mazo.length + ' en el mazo.' });
    };
    function programar() {
      if (terminado) return;
      pintar();
      if (st.terminada) { const t = setTimeout(fin, 1800 * TIEMPO); limpiezas.push(() => clearTimeout(t)); return; }
      if (st.turno !== 0) { const t = setTimeout(() => { if (terminado) return; Cartas.conquianActuar(st, Cartas.conquianBot(st)); tono(440, 50); programar(); }, 2500 * TIEMPO); limpiezas.push(() => clearTimeout(t)); }
    }
    m.body.addEventListener('click', e => {
      if (terminado || st.terminada) return;
      const c = e.target.closest('[data-cq-carta]'), jg = e.target.closest('[data-cq-juego]'), b = e.target.closest('[data-cq]');
      if (c) { const id = Number(c.dataset.cqCarta); if (sel.has(id)) sel.delete(id); else sel.add(id); msg = ''; return pintar(); }
      if (jg) { const a = Number(jg.dataset.cqJuego); destino = destino === a ? null : a; msg = ''; return pintar(); }
      if (!b || st.turno !== 0) return;
      const mv = cqJugadaDe(b.dataset.cq, sel, destino);
      if (!mv) { msg = 'Elige exactamente 1 carta para descartar.'; sonidoMal(); return pintar(); }
      if (!Cartas.conquianActuar(st, mv)) { msg = CQ_INVALIDA; sonidoMal(); return pintar(); }
      sel.clear(); destino = null; msg = ''; if (mv.accion === 'tomar' || mv.accion === 'bajar') sonidoOk();
      programar();
    });
    limpiezas.push(() => { terminado = true; });
    programar();
  }

  // ---------- Mente ágil: Ajedrez (openspec: ajedrez). Motor en juegos/ajedrez.js ----------
  const AJ_GLIFO = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
  const AJ_NIVEL = { 1: { t: '🐣 Básico', pts: 400 }, 2: { t: '🦊 Intermedio', pts: 700 }, 3: { t: '🦉 Avanzado', pts: 1000 } };
  const ajPieza = p => p ? '<span class="aj-p ' + Ajedrez.colorDe(p) + '">' + AJ_GLIFO[p.toLowerCase()] + '\uFE0E</span>' : '';
  // Tablero: abajo = color que juega abajo; sel = casilla elegida; destinos = jugadas legales de esa pieza.
  function ajTableroHtml(st, o) {

    let h = '<div class="aj-tablero" role="grid" aria-label="Tablero de ajedrez">';

      const cls = ((f + c) % 2 ? 'os' : 'cl') + (o.ultima && (o.ultima.de === sq || o.ultima.a === sq) ? ' ult' : '') + (o.sel === sq ? ' sel' : '') + (sq === rey ? ' jaque' : '');
      const m = dest.get(sq);

        ajPieza(st.t[sq]) + (m ? '<span class="dest' + (m.captura ? ' come' : '') + '"></span>' : '') + '</button>';
    }
    return h + '</div>';
  }
  const ajCapturasHtml = (lista) => lista.map(p => '<span class="aj-p ' + Ajedrez.colorDe(p) + '" style="font-size:1rem">' + AJ_GLIFO[p.toLowerCase()] + '\uFE0E</span>').join('');
  const ajJugadasHtml = sanes => sanes.length ? '<div class="aj-jugadas">' + sanes.reduce((a, x, i) => a + (i % 2 ? ' ' + escapeHtml(x) + ' &nbsp;' : '<b>' + (i / 2 + 1) + '.</b> ' + escapeHtml(x)), '') + '</div>' : '';
  const ajPromoHtml = color => '<div class="aj-promo" role="group" aria-label="Elige la pieza para coronar">' + ['q', 'r', 'b', 'n'].map(x => '<button data-aj-promo="' + x + '" aria-label="' + Ajedrez.LETRA[x] + '">' + ajPieza(color === 'w' ? x.toUpperCase() : x) + '</button>').join('') + '</div>';
  const AJ_FIN = { mate: 'jaque mate', ahogado: 'rey ahogado (tablas)', '50': '50 jugadas sin captura (tablas)', repeticion: 'triple repetición (tablas)', material: 'material insuficiente (tablas)', tiempo: 'se acabó el tiempo', rendicion: 'rendición' };
  // Selección de casilla común al individual y a la sala; devuelve { sel, promo, jugada }.
  function ajClic(st, color, sel, sq) {
    const mias = sq2 => st.t[sq2] && Ajedrez.colorDe(st.t[sq2]) === color;
    if (sel !== null) {
      const ms = Ajedrez.legales(st).filter(m => m.de === sel && m.a === sq);
      if (ms.length > 1) return { sel, promo: { de: sel, a: sq } };
      if (ms.length === 1) return { sel: null, jugada: ms[0] };
    }
    return { sel: mias(sq) && sel !== sq ? sq : null };
  }

  function elegirAjedrez() {
    const m = marco('ajedrez');
    m.body.innerHTML = '<div class="q-card"><div class="big">♚♛♞</div><div class="q">Ajedrez</div><div class="sub">Juega contra Gambito 🤖. Gana dando jaque mate.</div></div>' +

      '<label>Juegas con</label><div class="opts" style="grid-template-columns:repeat(3,1fr)"><button class="opt" data-aj-color="w" aria-pressed="true">♔ Blancas</button><button class="opt" data-aj-color="b">♚ Negras</button><button class="opt" data-aj-color="azar">🎲 Al azar</button></div>' +

  function jugarAjedrez(nivel, yo) {

    const sanes = [], t0 = Date.now();

        ajJugadasHtml(sanes) + '<div class="row-btns"><button class="btn ghost sm" data-ayuda="ajedrez">📖 Cómo se juega</button><button class="btn ghost sm" data-aj-rendir>🏳️ Rendirme</button></div></div>';
      m.puntos(Ajedrez.capturas(st)['puntos' + yo.toUpperCase()]);
    };
    const fin = res => {
      terminado = true;
      const cap = Ajedrez.capturas(st)['puntos' + yo.toUpperCase()];
      const gane = res.gana === yo, tablas = !res.gana;

    function turnoBot() {
      if (terminado || st.turno === yo) return pintar();

  // ---------- Clásicos: Lotería ----------

  // Líneas de una tabla 4×4: 4 filas, 4 columnas y 2 diagonales.
  const LINEAS = [0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => r * 4 + c)).concat([0, 1, 2, 3].map(c => [0, 1, 2, 3].map(r => r * 4 + c)), [[0, 5, 10, 15], [3, 6, 9, 12]]);
  const cumple = (marcas, modo) => modo === 'llena' ? marcas.every(Boolean) : LINEAS.some(l => l.every(i => marcas[i]));

  async function jugarLoteria(modo, voz) {
    const d = await datos('loteria');

    const marcas = Array(16).fill(false);

    let k = 0, terminado = false, botGrito = null;
    const t0 = Date.now();
    const cantar = c => {

      '<div class="lot-grid">' + tabla.map((ci, i) => '<button class="lot-cell" data-lot="' + i + '"><span class="em">' + escapeHtml(cartas[ci].emoji) + '</span><span class="nm">' + escapeHtml(cartas[ci].es) + '</span></button>').join('') + '</div>' +

    const $m = document.getElementById('lot-msg');
    function acabar(gano, quien) {

      terminar('loteria', { puntos, aciertos: bien, total: 16, segundos: (Date.now() - t0) / 1000,
        titulo: gano ? '🎉 ¡LOTERÍA!' : (quien ? '😮 ¡Lotería de ' + quien + '!' : '🎴 Se acabaron las cartas'),

    function siguiente() {

        else { cel.classList.remove('tiembla'); void cel.offsetWidth; cel.classList.add('tiembla'); $m.className = 'feedback bad'; $m.textContent = '¡Esa carta todavía no sale!'; }

      }
    });
    const iv = setInterval(siguiente, 4500 * TIEMPO);
    limpiezas.push(() => clearInterval(iv));
    siguiente();
  }

  // ---------- Partidas multijugador (openspec: juegos-partidas) ----------
  // Aleatorio con semilla: todos los dispositivos de una partida generan lo mismo.
  function fnv(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rngDe = (seed, etiqueta) => mulberry(fnv(seed + '|' + etiqueta));

  const JUEGOS_PARTIDA = ['en-vocab', 'en-frases', 'es-ortografia', 'cultura', 'mente-calculo', 'basta-es', 'basta-en', 'loteria', 'una', 'poker', 'brisca', 'conquian', 'ajedrez'];
  const BOT_EXTRA = { id: 'bot-chonita', nombre: 'BOT-CHONITA', acierto: 0.5, avatar: { emoji: '👵', color: '#a855f7' } }; // 3.er bot para completar la Brisca
  const BOTS = [{ id: 'bot-vachira', nombre: 'BOT-VACHIRA', acierto: 0.6, avatar: { emoji: '⚡', color: '#f59e0b' } }, { id: 'bot-isagii', nombre: 'BOT-ISAGII', acierto: 0.45, avatar: { emoji: '🌀', color: '#0ea5e9' } }];
  const P_Q = 15000, P_REV = 4000, P_N = 10; // ms por pregunta, ms de revelación, preguntas
  const P_BASTA = 60000, P_GRACIA = 3000, P_PAUSA = 10000; // Basta por rondas: escribir, gracia tras ¡Basta!, resultados
  const dur = ms => ms * TIEMPO;

  // Diez preguntas iguales para todos a partir de la semilla.
  async function preguntasPartida(juego, seed, opciones) {
    const rnd = rngDe(seed, 'preguntas');
    const d = juego.startsWith('en-') ? await datos('ingles') : juego.startsWith('es-') ? await datos('espanol') : juego === 'cultura' ? await datos('cultura') : null;
    const lista = [];
    if (juego === 'en-vocab') for (const w of tomar(d.vocabulario, P_N, rnd)) {
      const dis = tomar(d.vocabulario.filter(x => x.en !== w.en && x.tema === w.tema), 2, rnd).concat(tomar(d.vocabulario.filter(x => x.tema !== w.tema), 3, rnd)).map(x => x.en).filter((v, k, a) => a.indexOf(v) === k).slice(0, 3);
      lista.push(conOpciones({ big: w.emoji, q: w.es, sub: '¿Cómo se dice en inglés?' }, w.en, dis, rnd));
    }
    if (juego === 'en-preguntas') for (const f of tomar(d.preguntas, P_N, rnd)) lista.push(conOpciones({ big: '💬', q: f.pregunta, sub: f.es }, f.opciones[f.correcta], f.opciones.filter((_, k) => k !== f.correcta), rnd));
    // Fusionados (openspec: juegos-fusion): las 10 preguntas se reparten entre sus fuentes.
    if (juego === 'en-frases') {
      const fr = tomar(d.verbos, 5, rnd), pr = tomar(d.preguntas, 5, rnd);
      for (let k = 0; k < 5; k++) lista.push(conOpciones({ big: '🧩', q: fr[k].frase, sub: fr[k].es }, fr[k].opciones[fr[k].correcta], fr[k].opciones.filter((_, x) => x !== fr[k].correcta), rnd),
        conOpciones({ big: '💬', q: pr[k].pregunta, sub: pr[k].es }, pr[k].opciones[pr[k].correcta], pr[k].opciones.filter((_, x) => x !== pr[k].correcta), rnd));
    }
    if (juego === 'es-ortografia') {
      for (const [t, n] of [['ortografia', 4], ['acentos', 3]]) for (const f of tomar(d[t], n, rnd))
        lista.push(conOpciones({ big: t === 'acentos' ? 'á' : '✍️', q: f.frase, sub: f.regla ? 'Regla: ' + f.regla : '' }, f.opciones[f.correcta], f.opciones.filter((_, k) => k !== f.correcta), rnd));
      for (const f of tomar(poolSinonimos(d), 3, rnd)) lista.push(conOpciones({ big: f.tipo === 'sinónimo' ? '🟰' : '↔️', q: '«' + f.palabra + '»', sub: 'Elige el ' + f.tipo }, f.respuesta, f.distractores, rnd));
      return barajar(lista, rnd);
    }
    if (juego === 'es-acentos') for (const f of tomar(d.acentos, P_N, rnd))
      lista.push(conOpciones({ big: 'á', q: f.frase, sub: f.regla ? 'Regla: ' + f.regla : '' }, f.opciones[f.correcta], f.opciones.filter((_, k) => k !== f.correcta), rnd));
    if (juego === 'es-sinonimos') {
      const pool = d.sinonimos.map(x => Object.assign({ tipo: 'sinónimo' }, x)).concat(d.antonimos.map(x => Object.assign({ tipo: 'antónimo' }, x)));
      for (const f of tomar(pool, P_N, rnd)) lista.push(conOpciones({ big: f.tipo === 'sinónimo' ? '🟰' : '↔️', q: '«' + f.palabra + '»', sub: 'Elige el ' + f.tipo }, f.respuesta, f.distractores, rnd));
    }
    if (juego === 'cultura') {
      const del = d.preguntas.filter(p => !opciones.cat || opciones.cat === 'todas' || p.cat === opciones.cat);
      const orden = tomar(del.filter(p => p.nivel === 1), 4, rnd).concat(tomar(del.filter(p => p.nivel === 2), 4, rnd), tomar(del.filter(p => p.nivel === 3), 2, rnd));
      for (const p of orden.concat(tomar(del.filter(x => !orden.includes(x)), P_N, rnd)).slice(0, P_N))
        lista.push(conOpciones({ q: p.pregunta, sub: (d.categorias.find(c => c.id === p.cat) || {}).titulo, dato: p.dato }, p.opciones[p.correcta], p.opciones.filter((_, k) => k !== p.correcta), rnd));
    }
    if (juego === 'mente-calculo') for (let n = 0; n < P_N; n++) lista.push(n % 3 === 2 ? genSecuencia(Math.floor(n / 3) * 2, rnd) : genCalculo(n * 2, rnd));
    if (juego === 'mente-secuencias') for (let n = 0; n < P_N; n++) lista.push(genSecuencia(n, rnd));
    return lista;
  }

  // Respuesta de un bot a la pregunta q: al azar con su % de acierto y un tiempo de 2 a 13 s.
  function botPregunta(seed, bot, q, pregunta) {
    const r = rngDe(seed, bot.id + '|q' + q);
    const correcta = r() < bot.acierto;
    const ms = Math.round((2 + r() * 11) * 1000);
    const malas = pregunta.opciones.map((_, k) => k).filter(k => k !== pregunta.correcta);
    const opcion = correcta ? pregunta.correcta : malas[Math.floor(r() * malas.length)];
    return { correcta, opcion, ms, puntos: correcta ? 100 + Math.round(100 * Math.max(0, 1 - ms / P_Q)) : 0 };
  }

  // Palabras de un bot en Basta: 75 % de las categorías con una palabra del diccionario al azar.
  function botBasta(seed, bot, letra, d, ronda = 0) {
    const r = rngDe(seed, bot.id + '|basta' + (ronda ? '|' + ronda : ''));
    const L = normBasta(letra);
    return Object.fromEntries(d.categorias.map(c => {
      const opciones = (d.palabras[c.id] || []).filter(w => normBasta(w).startsWith(L));
      return [c.id, r() < 0.75 && opciones.length ? opciones[Math.floor(r() * opciones.length)] : ''];
    }));
  }

  // Puntuación de Basta en sala: única/verificada 100, repetida 50; no verificada 25/10; inválida 0.
  function puntuarBasta(d, letra, participantes) {
    const L = normBasta(letra);
    const dic = Object.fromEntries(d.categorias.map(c => [c.id, new Set((d.palabras[c.id] || []).map(normBasta))]));
    const res = participantes.map(p => ({ nombre: p.nombre, id: p.id, total: 0, detalle: {} }));
    for (const c of d.categorias) {
      const norm = participantes.map(p => normBasta((p.palabras || {})[c.id] || ''));
      norm.forEach((n, i) => {
        let pts = 0, estado = '—';
        const valida = n && n.startsWith(L) && n.length >= 2;
        if (valida) {
          const repetida = norm.filter(x => x === n).length > 1;
          if (dic[c.id].has(n)) { pts = repetida ? 50 : 100; estado = repetida ? 'repetida' : 'única'; }
          else if (n.length >= 3) { pts = repetida ? 10 : 25; estado = 'no verificada'; }
          else estado = 'inválida';
        } else if (n) estado = 'inválida';
        res[i].total += pts;
        res[i].detalle[c.id] = { palabra: (participantes[i].palabras || {})[c.id] || '', pts, estado };
      });
    }
    return res.sort((a, b) => b.total - a.total);
  }

  const sala = { codigo: null, estado: null, offset: 0, poll: null, guardado: false };
  const ahoraServidor = () => Date.now() + sala.offset;

  const TIEMPO_REAL = new Set(['una', 'basta-es', 'basta-en', 'loteria', 'poker', 'brisca', 'conquian', 'ajedrez']);

  // Supabase Realtime (openspec: salas-realtime): si el servidor entrega `rt`, la página escucha el canal de la
  // sala y recibe cada cambio al instante; el sondeo baja a 30 s de respaldo. Si el canal falla, vuelve el sondeo normal.
  let supabaseLib = null;
  function cargarSupabase() {
    if (window.supabase) return Promise.resolve(window.supabase);
    if (supabaseLib) return supabaseLib;
    supabaseLib = new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
      s.onload = () => ok(window.supabase); s.onerror = () => { supabaseLib = null; mal(new Error('supabase')); };
      document.head.appendChild(s);
    });
    return supabaseLib;
  }
  // Los avisos pueden llegar fuera de orden: por jugador gana la versión `v` más alta, se conservan los jugadores que
  // solo existen localmente y una sala ya empezada no vuelve a la espera.
  function mezclarEstado(local, p) {
    const previos = new Map(local.jugadores.map(j => [j.id, j]));
    const jugadores = p.jugadores.map(j => { const l = previos.get(j.id); previos.delete(j.id); return l && (l.v || 0) > (j.v || 0) ? l : j; }).concat([...previos.values()]);
    const salaNueva = local.sala.inicio !== null && p.sala.inicio === null ? local.sala : p.sala;
    return { sala: salaNueva, jugadores };
  }
  async function conectarRealtime(rt, codigo, alCambiar) {
    try {
      const lib = await cargarSupabase();
      if (sala.codigo !== codigo) return;
      const cliente = lib.createClient(rt.url, rt.key, { auth: { persistSession: false, autoRefreshToken: false } });
      const canal = cliente.channel(rt.topic);
      canal.on('broadcast', { event: 'estado' }, ({ payload: p }) => {
        if (sala.codigo !== codigo || !sala.estado || !p || !p.sala) return;
        sala.estado = Object.assign({}, sala.estado, mezclarEstado(sala.estado, p), { ahora: p.ahora });
        sala.offset = p.ahora - Date.now();
        sala.rtRecibidos = (sala.rtRecibidos || 0) + 1;
        pintarSala();
      }).subscribe(st => {
        const antes = sala.rtVivo;
        sala.rtVivo = st === 'SUBSCRIBED';
        if (antes !== sala.rtVivo) alCambiar();
        // Ponerse al día con lo que cambió mientras se conectaba (un aviso previo a la suscripción no llega).
        if (sala.rtVivo && !antes) traerSala().then(r => { if (r.ok && sala.codigo === codigo) pintarSala(); });
      });
      limpiezas.push(() => { sala.rtVivo = false; cliente.removeChannel(canal); });
    } catch (e) { sala.rtVivo = false; /* sin Realtime: sigue el sondeo normal */ }
  }

  async function traerSala() {
    const r = await api('/juegos/sala/' + sala.codigo);
    if (r.ok) { sala.estado = r.body; sala.offset = r.body.ahora - Date.now(); }
    return r;
  }

      '<div id="p-equipos-wrap" hidden><label class="check"><input id="p-equipos" type="checkbox"><span>👥 Por equipos (A y B, alternados por orden de entrada)</span></label></div>' +
      '<div id="p-rondas-wrap" hidden><label for="p-rondas">Rondas</label><select id="p-rondas" class="sel"><option value="5">5 rondas</option><option value="10" selected>10 rondas</option><option value="12">12 rondas</option></select></div>' +

      '<div class="muted" id="p-bots-nota" hidden style="font-size:.82rem;margin:6px 0"></div>' +
      '<div class="row-btns"><button class="btn" type="submit">Crear partida</button></div></form></div>' +
      '<div class="card"><h2 style="margin-top:0">🔑 Unirme con código</h2><form id="f-unirse" autocomplete="off"><label for="p-codigo">Código de 4 letras</label>' +

    datos('cultura').then(d => {

  async function entrarSala(codigo) {
    limpiar();
    Object.assign(sala, { codigo, estado: null, guardado: false, mias: {}, enviado: false, misPalabras: null, vista: null, lot: null, unaSt: null, unaLocal: null, unaElegir: null, unaEnviando: false, unaAnunciada: null, cqSel: new Set(), cqDestino: null, cqMsg: '', csEnviando: false, csSt: null, ajSel: null, ajPromo: null, ajEnviando: false, ajA: null, ajCache: new Map(), finAciertos: undefined, finTotal: undefined, bastaEnviado: {}, misRondas: {}, letrasBasta: null, rondaActual: 0, rtVivo: false, rtRecibidos: 0 });
    app.innerHTML = '<div class="loading">Entrando a la partida ' + escapeHtml(codigo) + '…</div>';
    const r = await traerSala();
    if (!r.ok) { pantallaHub('partidas'); const m = document.getElementById('p-msg'); if (m) m.innerHTML = '<div class="alert">No se pudo abrir la partida (' + escapeHtml(r.body.error || r.status) + ').</div>'; return; }
    const j = juegoPorId(sala.estado.sala.juego);
    const preparar = ['una', 'poker', 'brisca', 'conquian', 'ajedrez'].includes(sala.estado.sala.juego) ? Promise.resolve(null) : sala.estado.sala.juego.startsWith('basta') ? datos('basta') : sala.estado.sala.juego === 'loteria' ? datos('loteria') : preguntasPartida(sala.estado.sala.juego, sala.estado.sala.seed, sala.estado.sala.opciones);
    sala.contenido = await preparar;
    // Deja de consultar cuando ya no sirve (openspec: github-etag-cache): partida terminada, sala vencida o
    // inexistente, o 1 h con la pestaña abierta. Así una pestaña olvidada no gasta el límite de GitHub.
    const t0 = Date.now();
    let tick, detenido = false;
    const parar = msg => { detenido = true; clearTimeout(tick); const pb = document.getElementById('p-body'); if (msg && pb && sala.vista !== 'final') pb.innerHTML = '<div class="card muted" style="text-align:center">' + msg + '</div>'; };
    // Intervalo por tipo de juego (openspec: ahorro-peticiones): 2.5 s en la sala de espera y en los juegos que
    // necesitan verse en tiempo real (¡Una!, Basta, Lotería); 5 s en los de preguntas (van sincronizados por
    // reloj). La sala de espera deja de consultar a los 15 min si nadie empieza.
    const programarTick = () => {
      const esperando = sala.estado && sala.estado.sala.inicio === null;
      tick = setTimeout(() => {
        if (document.hidden) return programarTick();
        if (sala.vista === 'final') return parar();
        if (Date.now() - t0 > 60 * 60000 || (sala.estado.sala.inicio === null && Date.now() - t0 > 15 * 60000)) return parar('⏸️ La partida se pausó por inactividad. Vuelve a entrar con el código 🔑 ' + escapeHtml(codigo) + '.');
        traerSala().then(r => {
          if (r && !r.ok && [403, 404, 410].includes(r.status)) return parar(r.status === 410 ? '⌛ Esta partida ya terminó (vencen a las 3 horas).' : 'Esta partida ya no está disponible.');
          if (r && r.status === 503) { /* mucho tráfico: se reintenta en el siguiente ciclo */ } else pintarSala();
          programarTick();
        });
      }, sala.rtVivo ? 30000 : esperando || TIEMPO_REAL.has(sala.estado.sala.juego) ? 2500 : 5000);
    };
    programarTick();
    // Al cambiar el estado del canal se reprograma el siguiente ciclo con el intervalo que corresponde.
    if (sala.estado.rt) conectarRealtime(sala.estado.rt, codigo, () => { if (detenido) return; clearTimeout(tick); programarTick(); });
    const reloj = setInterval(() => pintarSala(), 250);
    limpiezas.push(() => { detenido = true; clearTimeout(tick); }, () => clearInterval(reloj));
    app.innerHTML = '<div class="cat-' + escapeHtml(j.cat) + '"><div class="play-top"><button class="btn ghost sm" data-a="salir" aria-label="Salir">✕</button><span class="t">' + j.emoji + ' ' + escapeHtml(j.t) + ' · partida</span>' +
      '<span class="stat" id="p-codigo-chip">🔑 ' + escapeHtml(codigo) + '</span></div><div class="bar" id="m-bar" hidden><span style="width:100%"></span></div><div id="p-body"></div></div>';
    sala.vista = null;
    pintarSala();
  }

  function participantes() {
    const e = sala.estado;
    const humanos = e.jugadores.map(x => ({ id: x.id, nombre: x.nombre, tipo: x.tipo, avatar: x.avatar, respuestas: x.respuestas || {}, palabras: x.palabras, basta: x.basta, rondasBasta: x.rondasBasta || {}, loteria: x.loteria }));
    const comoBot = b => ({ id: b.id, nombre: b.nombre, tipo: 'bot', bot: b, avatar: b.avatar });
    // Ajuste del profe: ajedrez 1 vs 1 solo entre personas; Brisca siempre entre 4 (se completa con bots).
    if (e.sala.juego === 'ajedrez') return humanos.slice(0, 2);
    if (e.sala.juego === 'brisca') { const h = humanos.slice(0, 4); return h.concat(BOTS.concat(BOT_EXTRA).slice(0, 4 - h.length).map(comoBot)); }
    return e.sala.bots ? humanos.concat(BOTS.map(comoBot)) : humanos;
  }

  function pintarSala() {
    const e = sala.estado; if (!e) return;
    const body = document.getElementById('p-body'); if (!body) return;
    const s = e.sala;
    if (s.inicio === null) return pintarEspera(body);
    if (s.juego.startsWith('basta')) return pintarBastaSala(body);
    if (s.juego === 'loteria') return pintarLoteriaSala(body);
    if (s.juego === 'una') return pintarUnaSala(body);
    if (s.juego === 'poker') return pintarPokerSala(body);
    if (s.juego === 'brisca' || s.juego === 'conquian') return pintarCartasSala(body, s.juego);
    if (s.juego === 'ajedrez') return pintarAjedrezSala(body);
    return pintarPreguntaSala(body);
  }

  function pintarEspera(body) {

      '<div class="row-btns" style="margin-top:8px"><button class="btn ghost sm" data-p="compartir">📤 Compartir</button></div></div></div></div>' +
      '<h2>👥 Jugadores (' + lista.length + ')</h2><ol class="rank">' + lista.map(x => '<li>' + avatarHtml(x.avatar, 32) + '<span class="n">' + escapeHtml(x.nombre) +
        (x.id === e.sala.host ? ' <small>(anfitrión)</small>' : '') + (x.tipo === 'invitado' ? ' <small>(invitado)</small>' : '') + '</span></li>').join('') + '</ol>' +
      '<div class="row-btns">' + (e.soyHost ? '<button class="btn" data-p="empezar">▶ Empezar partida</button>' : '<div class="muted" style="text-align:center;width:100%">Esperando a que el anfitrión empiece…</div>') + '</div>';
    if (sala.vista !== 'espera:' + lista.length + ':' + e.soyHost) { body.innerHTML = html; sala.vista = 'espera:' + lista.length + ':' + e.soyHost; pintarQr(document.getElementById('p-qr'), enlaceSala(e.sala.codigo)); }
  }

  function totalesPreguntas(hasta) {
    const e = sala.estado; const s = e.sala;
    return participantes().map(p => {
      let total = 0, ultimo = 0;
      for (let q = 0; q <= hasta; q++) {
        const r = p.bot ? botPregunta(s.seed, p.bot, q, sala.contenido[q]) : p.respuestas[q];
        if (r) { total += r.puntos; if (q === hasta) ultimo = r.puntos; }
      }
      return { id: p.id, nombre: p.nombre, tipo: p.tipo, avatar: p.avatar, total, ultimo };
    }).sort((a, b) => b.total - a.total);
  }

  function marcadorHtml(filas, yo, max = 6) {
    return '<ol class="rank">' + filas.slice(0, max).map((f, i) => '<li class="' + (f.id === yo ? 'yo' : '') + '"><span class="pos">' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1) + '</span>' +
      avatarHtml(f.avatar, 28) + '<span class="n">' + escapeHtml(f.nombre) + (f.tipo === 'bot' ? ' <small>🤖</small>' : '') + (f.ultimo ? ' <small>+' + f.ultimo + '</small>' : '') + '</span><span class="pts">⭐ ' + fmt(f.total) + '</span></li>').join('') + '</ol>';
  }

  function pintarPreguntaSala(body) {
    const e = sala.estado; const s = e.sala;
    const t = ahoraServidor() - s.inicio;
    const ciclo = dur(P_Q + P_REV);
    const bar = document.getElementById('m-bar');
    if (t < 0) { bar.hidden = true; const k = 'cuenta:' + Math.ceil(-t / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárate!</div><div class="letra">' + Math.ceil(-t / 1000) + '</div><div class="sub">' + participantes().length + ' jugadores</div></div>'; sala.vista = k; } return; }
    const q = Math.floor(t / ciclo);
    if (q >= P_N) return pintarFinalSala(body, totalesPreguntas(P_N - 1));
    const enQ = t - q * ciclo;
    const p = sala.contenido[q];
    const mia = (e.jugadores.find(x => x.id === e.yo) || { respuestas: {} }).respuestas[q] || sala.mias && sala.mias[q];
    if (enQ < dur(P_Q)) {
      bar.hidden = false; bar.firstChild.style.width = Math.max(0, 100 - enQ / dur(P_Q) * 100) + '%';
      const k = 'q:' + q + ':' + (mia ? 'r' : '');
      if (sala.vista !== k) {
        sala.vista = k;
        body.innerHTML = '<div class="muted" style="text-align:center;margin-bottom:6px">Pregunta ' + (q + 1) + ' de ' + P_N + '</div><div class="q-card">' + (p.big ? '<div class="big">' + escapeHtml(p.big) + '</div>' : '') +
          '<div class="q">' + escapeHtml(p.q) + '</div>' + (p.sub ? '<div class="sub">' + escapeHtml(p.sub) + '</div>' : '') + '</div>' +
          (mia ? '<div class="feedback ok">✔ Respuesta enviada · esperando a los demás…</div>'
            : '<div class="opts' + (p.opciones.some(o => String(o).length > 18) ? ' una-col' : '') + '">' + p.opciones.map((o, i) => '<button class="opt" data-pq="' + q + '" data-po="' + i + '"><span class="k">' + (i + 1) + '</span>' + escapeHtml(o) + '</button>').join('') + '</div>');
        sala.inicioQ = s.inicio + q * ciclo;
      }
    } else {
      bar.hidden = true;
      const k = 'rev:' + q + ':' + e.jugadores.map(x => Object.keys(x.respuestas || {}).length).join(',');
      if (sala.vista !== k) {
        sala.vista = k;
        body.innerHTML = '<div class="q-card"><div class="q">' + escapeHtml(p.q) + '</div><div class="sub">Respuesta correcta: <b>' + escapeHtml(p.opciones[p.correcta]) + '</b></div>' +
          (mia ? '<div class="feedback ' + (mia.correcta ? 'ok">✔ ¡Bien! +' + mia.puntos : 'bad">✘ Esta vez no') + '</div>' : '<div class="feedback bad">⏰ No respondiste</div>') +
          (p.dato ? '<div class="sub">💡 ' + escapeHtml(p.dato) + '</div>' : '') + '</div><h2>🏆 Marcador</h2>' + marcadorHtml(totalesPreguntas(q), e.yo);
      }
    }
  }

  async function responderSala(q, i) {
    const s = sala.estado.sala; const p = sala.contenido[q];
    if (sala.mias && sala.mias[q]) return;
    const ms = Math.max(0, ahoraServidor() - (s.inicio + q * dur(P_Q + P_REV)));
    if (ms > dur(P_Q)) return;
    const correcta = i === p.correcta;
    const puntos = correcta ? 100 + Math.round(100 * Math.max(0, 1 - ms / dur(P_Q))) : 0;
    sala.mias = sala.mias || {}; sala.mias[q] = { correcta, puntos, ms };
    correcta ? sonidoOk() : sonidoMal();
    sala.vista = null; pintarSala();
    await post('/juegos/sala/' + sala.codigo + '/respuesta', { q, correcta, puntos, ms: Math.round(ms / TIEMPO) });
  }

  // ---- Basta en sala por rondas (openspec: basta-rondas) ----
  const rondasDeSala = () => Number(sala.estado.sala.opciones.rondas || 1);
  const datosBasta = () => sala.contenido[sala.estado.sala.juego === 'basta-en' ? 'en' : 'es'];
  // Letras sin repetir, iguales para todos (semilla de la sala).
  function letrasBasta() {
    if (!sala.letrasBasta) sala.letrasBasta = barajar(datosBasta().letras, rngDe(sala.estado.sala.seed, 'letras')).slice(0, rondasDeSala());
    return sala.letrasBasta;
  }
  // Calendario: cierre_r = min(inicio_r + 60 s, primer ¡Basta! + 3 s); inicio_{r+1} = cierre_r + 10 s.
  function calendarioBasta() {
    const e = sala.estado; const cal = []; let ini = e.sala.inicio;
    for (let r = 0; r < rondasDeSala(); r++) {
      const gritos = e.jugadores.map(x => ((x.rondasBasta || {})[r] || {}).basta).filter(t => t && t >= ini);
      const limite = ini + dur(P_BASTA);
      const cierre = gritos.length ? Math.min(limite, Math.min(...gritos) + dur(P_GRACIA)) : limite;
      cal.push({ ini, cierre });
      ini = cierre + dur(P_PAUSA);
    }
    return cal;
  }
  const palabrasForm = () => Object.fromEntries(datosBasta().categorias.map(c => [c.id, ((document.getElementById('pb-' + c.id) || {}).value || '').trim()]));
  function enviarRonda(r, palabras) {
    sala.bastaEnviado[r] = true; sala.misRondas[r] = palabras;
    post('/juegos/sala/' + sala.codigo + '/respuesta', { ronda: r, palabras }).then(() => traerSala());
  }
  // Todos enviaron, o pasaron 6 s reales (el sondeo es cada 2.5 s; sin escalar en pruebas aceleradas).
  const rondaLista = (r, cal) => sala.estado.jugadores.every(x => (x.rondasBasta || {})[r]) || ahoraServidor() > cal[r].cierre + 6000;
  // Puntos de cada ronda (hasta la ronda `hasta`) y acumulado por participante.
  function marcadorBasta(hasta) {
    const e = sala.estado, d = datosBasta(), letras = letrasBasta();
    const ps = participantes();
    const acum = Object.fromEntries(ps.map(p => [p.id, { id: p.id, nombre: p.nombre, tipo: p.bot ? 'bot' : '', avatar: p.avatar, total: 0, ultimo: 0, porRonda: [], aciertos: 0, detalle: {} }]));
    for (let r = 0; r <= hasta; r++) {
      const parts = ps.map(p => ({ id: p.id, nombre: p.nombre, palabras: p.bot ? botBasta(e.sala.seed, p.bot, letras[r], d, r) : p.id === e.yo && sala.misRondas[r] ? sala.misRondas[r] : ((p.rondasBasta || {})[r] || {}).palabras || {} }));
      for (const x of puntuarBasta(d, letras[r], parts)) {
        const a = acum[x.id]; a.total += x.total; a.ultimo = x.total; a.porRonda[r] = x.total; a.detalle = x.detalle;
        a.aciertos += Object.values(x.detalle).filter(y => y.pts > 0).length;
      }
    }
    return Object.values(acum).sort((a, b) => b.total - a.total);
  }

  function pintarBastaSala(body) {
    const e = sala.estado; const s = e.sala;
    const idioma = s.juego === 'basta-en' ? 'en' : 'es';
    const d = datosBasta(), letras = letrasBasta(), n = rondasDeSala();
    const ahora = ahoraServidor();
    const bar = document.getElementById('m-bar');
    if (ahora < s.inicio) { bar.hidden = true; const k = 'cuenta:' + Math.ceil((s.inicio - ahora) / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárate! · ' + n + (n === 1 ? ' ronda' : ' rondas') + '</div><div class="letra">' + Math.ceil((s.inicio - ahora) / 1000) + '</div></div>'; sala.vista = k; } return; }
    const cal = calendarioBasta();
    // Al cerrar cada ronda, enviar mis palabras una sola vez (antes de redibujar el formulario).
    for (let r = 0; r < n; r++) if (ahora >= cal[r].cierre && !sala.bastaEnviado[r]) enviarRonda(r, sala.vista === 'basta' + r ? palabrasForm() : {});
    const r = cal.findIndex(c => ahora < c.cierre + dur(P_PAUSA));
    const ultima = n - 1;
    if (r === -1 || (ahora >= cal[ultima].cierre && rondaLista(ultima, cal))) {
      const filas = marcadorBasta(ultima);
      const mio = filas.find(f => f.id === e.yo);
      if (mio) { sala.finAciertos = mio.aciertos; sala.finTotal = d.categorias.length * n; }
      return pintarFinalSala(body, filas, { d, letras, porRonda: true });
    }
    sala.rondaActual = r;
    const cab = '<div class="sub">' + (idioma === 'en' ? 'Round ' : 'Ronda ') + (r + 1) + (idioma === 'en' ? ' of ' : ' de ') + n + ' · ' + (idioma === 'en' ? 'Letter' : 'Letra') + '</div><div class="letra">' + escapeHtml(letras[r]) + '</div>';
    if (ahora < cal[r].cierre) {
      bar.hidden = false; bar.firstChild.style.width = Math.max(0, (cal[r].cierre - ahora) / dur(P_BASTA) * 100) + '%';
      if (sala.vista !== 'basta' + r) {
        sala.vista = 'basta' + r;
        body.innerHTML = '<div class="q-card">' + cab + '<div class="sub" id="pb-aviso">Todos tienen la misma letra</div></div>' +
          '<form id="pb-form" autocomplete="off" class="basta-grid">' + d.categorias.map(c => '<label for="pb-' + c.id + '">' + escapeHtml(c.emoji + ' ' + c.titulo) + '</label><input id="pb-' + c.id + '" data-pbcat="' + c.id + '" type="text" maxlength="40" autocapitalize="off" spellcheck="false" placeholder="' + escapeHtml(letras[r]) + '…">').join('') +
          '<div class="row-btns" style="grid-column:1/-1"><button class="btn" type="submit" id="pb-basta" disabled>✋ ¡Basta!</button></div></form>';
        const primero = document.getElementById('pb-' + d.categorias[0].id); if (primero && r > 0) primero.focus();
      }

  // ---- Lotería en sala (openspec: juegos-loteria-preguntas) ----
  const L_CANTO = 4500, L_GRITO_BOT = 1500;
  function loteriaSala() {
    if (sala.lot) return sala.lot;
    const s = sala.estado.sala; const idx = sala.contenido.cartas.map((_, i) => i);
    const lot = { orden: barajar(idx, rngDe(s.seed, 'orden')), modo: s.opciones.modo || 'linea', marcas: Array(16).fill(false), voz: 'ambos', cantadas: 0 };
    lot.tablaDe = id => tomar(idx, 16, rngDe(s.seed, 'tabla|' + id));
    lot.mia = lot.tablaDe(sala.estado.yo);
    sala.lot = lot;
    return lot;
  }
  // Cartas cantadas a la hora t (la carta k sale en inicio + k·canto).
  const cantadasA = t => { const s = sala.estado.sala; return t < s.inicio ? 0 : Math.min(54, Math.floor((t - s.inicio) / dur(L_CANTO)) + 1); };
  const cumpleTabla = (tabla, n) => { const set = new Set(sala.lot.orden.slice(0, n)); return cumple(tabla.map(ci => set.has(ci)), sala.lot.modo); };

  // Ganador: el grito válido más temprano (humanos por su hora; bots 1.5 s después de completar).
  function ganadorLoteria() {
    const lot = loteriaSala(); const s = sala.estado.sala;
    const gritos = sala.estado.jugadores.filter(x => x.loteria && cumpleTabla(lot.tablaDe(x.id), cantadasA(x.loteria))).map(x => ({ id: x.id, nombre: x.nombre, t: x.loteria }));
    if (s.bots) for (const b of BOTS) {
      const tabla = lot.tablaDe(b.id);
      for (let k = 1; k <= 54; k++) if (cumpleTabla(tabla, k)) { gritos.push({ id: b.id, nombre: b.nombre, t: s.inicio + (k - 1) * dur(L_CANTO) + dur(L_GRITO_BOT), bot: true }); break; }
    }
    return gritos.sort((a, b) => a.t - b.t)[0] || null;
  }

  function cantarCarta(c) {
    const v = sala.lot.voz;
    if (v === 'es') hablar(c.es, 'es-MX', 1);
    else if (v === 'en') hablar(c.en, 'en-US', .95);
    else { hablar(c.es, 'es-MX', 1); if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(c.en); u.lang = 'en-US'; u.rate = .95; speechSynthesis.speak(u); } }
  }

  function pintarLoteriaSala(body) {
    const e = sala.estado; const s = e.sala; const lot = loteriaSala(); const cartas = sala.contenido.cartas;
    const ahora = ahoraServidor();

    if (ahora < s.inicio) { const k = 'cuenta:' + Math.ceil((s.inicio - ahora) / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárate! Modo: ' + (lot.modo === 'llena' ? 'tabla llena' : 'línea') + '</div><div class="letra">' + Math.ceil((s.inicio - ahora) / 1000) + '</div></div>'; sala.vista = k; } return; }
    const n = cantadasA(ahora);
    const gan = ganadorLoteria();
    const fin = (gan && gan.t <= ahora) || (n >= 54 && ahora > s.inicio + 54 * dur(L_CANTO) + 3000);
    if (fin) {
      const nFin = gan ? cantadasA(gan.t) : 54;
      const conteo = id => { const set = new Set(lot.orden.slice(0, nFin)); return lot.tablaDe(id).filter(ci => set.has(ci)).length; };
      const filas = participantes().map(p => {

        return { id: p.id, nombre: p.nombre + (esGan ? ' 🎉' : ''), tipo: p.tipo, avatar: p.avatar, total, ultimo: 0 };
      }).sort((a, b) => b.total - a.total);
      sala.aciertosLoteria = lot.marcas.filter(Boolean).length;

    }
    if (sala.vista !== 'loteria') {
      sala.vista = 'loteria';
      body.innerHTML = '<div class="lot-top"><div class="lot-carta" id="lot-carta"><div class="big">🎴</div></div><div class="lot-lado"><div class="muted">Salieron <b id="lot-n">0</b>/54 · ' + (lot.modo === 'llena' ? 'tabla llena' : 'línea') + '</div>' +
        '<div class="lot-hist" id="lot-hist"></div><div id="lot-jug"></div></div></div>' +

      document.getElementById('lot-n').textContent = n;
      document.getElementById('lot-hist').innerHTML = lot.orden.slice(Math.max(0, n - 6), n - 1).reverse().map(i => '<span title="' + escapeHtml(cartas[i].es) + '">' + escapeHtml(cartas[i].emoji) + '</span>').join('');
      if (nueva) cantarCarta(c);

    // Progreso de cada quien (cartas de su tabla que ya salieron)
    const set = new Set(lot.orden.slice(0, n));
    const prog = participantes().map(p => escapeHtml(p.nombre) + ' <b>' + lot.tablaDe(p.id).filter(ci => set.has(ci)).length + '</b>/16' + (p.loteria ? ' 📣' : '')).join('<br>');
    const jug = document.getElementById('lot-jug'); if (jug && jug.innerHTML !== prog) jug.innerHTML = prog;
  }

  function marcarLoteriaSala(i, cel) {

    else { cel.classList.remove('tiembla'); void cel.offsetWidth; cel.classList.add('tiembla'); $m.className = 'feedback bad'; $m.textContent = '¡Esa carta todavía no sale!'; }

    if (!cumple(lot.marcas, lot.modo)) { sonidoMal(); $m.className = 'feedback bad'; $m.textContent = 'Aún no tienes lotería 😉 ' + (lot.modo === 'llena' ? 'Necesitas la tabla llena.' : 'Necesitas una línea completa.'); return; }
    sonidoOk(); $m.className = 'feedback ok'; $m.textContent = '📣 ¡LOTERÍA! Revisando…';
    post('/juegos/sala/' + sala.codigo + '/respuesta', { loteria: true }).then(() => traerSala());

  // ---- ¡Una! en sala (openspec: una-en-partida) ----
  // Estado reconstruido reproduciendo las jugadas sobre el mazo de la semilla: igual en todos los dispositivos.
  const U_BOT_MS = 3000, U_TURNO_MS = 30000; // ritmo más lento (ajuste del profe)
  const UNA_CARTAS = (() => {
    const m = []; let id = 0;
    for (const c of ['r', 'y', 'g', 'b']) {
      m.push({ id: id++, c, v: '0' });
      for (let k = 0; k < 2; k++) { for (let n = 1; n <= 9; n++) m.push({ id: id++, c, v: String(n) }); m.push({ id: id++, c, v: 'skip' }, { id: id++, c, v: 'rev' }, { id: id++, c, v: '+2' }); }
    }
    for (let k = 0; k < 4; k++) m.push({ id: id++, c: null, v: 'wild' }, { id: id++, c: null, v: '+4' });
    return m;
  })();
  const colorMas = ids => { const q = { r: 0, y: 0, g: 0, b: 0 }; ids.forEach(id => { const c = UNA_CARTAS[id].c; if (c) q[c]++; }); return Object.entries(q).sort((a, b) => b[1] - a[1])[0][0]; };

  function estadoUna() {
    const e = sala.estado, s = e.sala;
    const orden = participantes();
    const jugs = new Map();
    e.jugadores.forEach(x => (x.jugadas || []).forEach(j => { if (!jugs.has(j.n)) jugs.set(j.n, Object.assign({ jugador: x.id }, j)); }));
    const mazo = barajar(UNA_CARTAS.map(c => c.id), rngDe(s.seed, 'una-mazo'));
    const manos = orden.map(() => []);
    for (let k = 0; k < 7; k++) for (let j = 0; j < orden.length; j++) manos[j].push(mazo.pop());
    let pila = [mazo.pop()];
    while (UNA_CARTAS[pila[0]].v === '+4') { mazo.unshift(pila[0]); pila = [mazo.pop()]; }
    const st = { orden, manos, mazo, pila, color: UNA_CARTAS[pila[0]].c || 'r', dir: 1, turno: 0, paso: 0, T0: s.inicio, pendiente: null, fin: null, jugadas: orden.map(() => 0), ultima: null, castigos: [] };
    const top = () => UNA_CARTAS[st.pila[st.pila.length - 1]];
    const valida = id => { const c = UNA_CARTAS[id]; return !c.c || c.c === st.color || c.v === top().v; };
    const sig = (d, pasos = 1) => ((d + st.dir * pasos) % orden.length + orden.length) % orden.length;
    // Devuelve cuántas cartas llegaron de verdad (0 si ya no hay mazo ni pila para rebarajar).
    const robar = (j, n) => {
      let r = 0;
      for (let k = 0; k < n; k++) {
        if (!st.mazo.length) { const t = st.pila.pop(); st.mazo = barajar(st.pila, rngDe(s.seed, 'rebaraja' + st.paso)); st.pila = [t]; }
        if (st.mazo.length) { st.manos[j].push(st.mazo.pop()); r++; }
      }
      return r;
    };
    const hayParaRobar = () => st.mazo.length > 0 || st.pila.length > 1;
    const aplicar = (j, mv, t) => {
      st.paso++; st.T0 = t;
      if (mv.accion === 'jugar') {
        const c = UNA_CARTAS[mv.carta];
        st.manos[j].splice(st.manos[j].indexOf(mv.carta), 1); st.pila.push(mv.carta);
        st.color = c.c || (['r', 'y', 'g', 'b'].includes(mv.color) ? mv.color : 'r');
        st.pendiente = null; st.jugadas[j]++;
        st.ultima = { j, accion: 'jugar', carta: mv.carta, color: st.color, paso: st.paso };
        if (!st.manos[j].length) { st.fin = { ganador: j, t }; return; }
        if (st.manos[j].length === 1) st.esperaUna = { j, paso: st.paso - 1, t0: t }; // se resuelve antes del siguiente turno
        let pasos = 1;
        if (c.v === 'skip') pasos = 2;
        if (c.v === 'rev') { if (orden.length === 2) pasos = 2; else st.dir *= -1; }
        if (c.v === '+2') { robar(sig(j), 2); pasos = 2; }
        if (c.v === '+4') { robar(sig(j), 4); pasos = 2; }
        st.turno = sig(j, pasos);
      } else if (mv.accion === 'robar') {
        const n = robar(j, 1) ? st.manos[j][st.manos[j].length - 1] : undefined; // sin cartas no hay "robada"
        st.ultima = { j, accion: 'robar', auto: !!mv.auto, paso: st.paso };
        if (!mv.auto && n !== undefined && valida(n)) st.pendiente = n; else st.turno = sig(j);
      } else {
        st.ultima = { j, accion: 'pasar', auto: !!mv.auto, paso: st.paso };
        st.pendiente = null; st.turno = sig(j);
      }
    };
    const esValida = (j, mv) => {
      if (mv.accion === 'jugar') return st.manos[j].includes(mv.carta) && valida(mv.carta) && (st.pendiente === null || st.pendiente === mv.carta);
      if (mv.accion === 'robar') return st.pendiente === null;
      if (mv.accion === 'pasar') return st.pendiente !== null || (!hayParaRobar() && !st.manos[j].some(valida)); // atorado sin cartas: puede pasar
      return false;
    };
    const bot = j => {
      const mano = st.manos[j];
      if (st.pendiente !== null) return { accion: 'jugar', carta: st.pendiente, color: colorMas(mano.filter(x => x !== st.pendiente)), una: true };
      const ops = mano.filter(valida);
      if (!ops.length) return { accion: 'robar' };
      const r = rngDe(s.seed, 'bot' + st.paso);
      const sigN = st.manos[sig(j)].length;
      const accion = ops.filter(id => ['skip', '+2', '+4', 'rev'].includes(UNA_CARTAS[id].v));
      const nums = ops.filter(id => UNA_CARTAS[id].c && /^\d$/.test(UNA_CARTAS[id].v));
      const c = sigN <= 2 && accion.length && r() < 0.4 ? accion[0] : (nums.length ? nums[0] : (ops.find(id => UNA_CARTAS[id].c) ?? ops[0]));
      return { accion: 'jugar', carta: c, color: colorMas(mano.filter(x => x !== c)), una: true };
    };
    const unasDe = id => ((e.jugadores.find(x => x.id === id) || {}).unas || []);
    const ahora = ahoraServidor();
    for (let guard = 0; guard < 4000 && !st.fin; guard++) {
      if (st.esperaUna) {
        const w = st.esperaUna, quien = orden[w.j], lim = w.t0 + dur(5000);
        let tUna = null;
        if (quien.bot) tUna = w.t0 + dur(800 + rngDe(s.seed, 'una' + w.paso)() * 1000);
        else { const u = unasDe(quien.id).find(x => x.paso === w.paso); if (u && u.t <= lim) tUna = u.t; }
        let seg;
        if (tUna !== null) { if (ahora < tUna) break; seg = (tUna - w.t0) / dur(1000); }
        else if (ahora >= lim) { seg = Infinity; tUna = lim; }
        else break; // esperando a que presione UNA
        const n = castigoUna(seg);
        if (n) { robar(w.j, n); st.castigos.push({ j: w.j, n }); if (st.ultima) st.ultima.castigo = n; }
        st.esperaUna = null; st.T0 = tUna;
        continue;
      }
      const j = st.turno, p = orden[j];
      if (p.bot) {
        const t = st.T0 + dur(U_BOT_MS); if (ahora < t) break;
        aplicar(j, bot(j), t);
      } else {
        const mv = jugs.get(st.paso); const limite = st.T0 + dur(U_TURNO_MS);
        if (mv && mv.jugador === p.id && mv.t <= limite && esValida(j, mv)) aplicar(j, mv, mv.t);
        else if (ahora >= limite) aplicar(j, st.pendiente !== null ? { accion: 'pasar', auto: true } : { accion: 'robar', auto: true }, limite);
        else break;
      }
    }
    st.valida = valida; st.top = top; st.hayParaRobar = hayParaRobar;
    return st;
  }

  function unaNombre(c, lang) {
    const T = UNA_TXT[lang];
    if (c.v === 'wild' || c.v === '+4') return T[c.v];
    const num = /^\d$/.test(c.v) ? (lang === 'en' ? NUM_EN : NUM_ES)[Number(c.v)] : T[c.v];
    return lang === 'en' ? T.color[c.c] + ' ' + num : num + ' ' + T.color[c.c].toLowerCase();
  }
  const unaCartaHtml = (c, extra) => '<span class="una-card' + (extra || '') + '" style="--c:' + (c.c ? UNA_COLOR[c.c] : '#1e1b2e') + '">' + (c.c ? '' : '<span class="una-wild"></span>') + '<b>' + escapeHtml(unaSimbolo(c.v)) + '</b></span>';

  function pintarUnaSala(body) {
    const e = sala.estado, s = e.sala;

  async function jugadaUnaSala(jugada) {

  // ---- Póker en sala (openspec: poker): cada jugada lleva su paso n; todos reconstruyen la mesa desde la semilla ----
  const PK_BOT_MS = 2500, PK_TURNO_MS = 30000, PK_PAUSA_MS = 9000; // ritmo más lento (ajuste del profe)
  function estadoPoker() {
    const e = sala.estado, s = e.sala;
    const orden = participantes();
    const jugs = new Map();
    e.jugadores.forEach(x => (x.jugadas || []).forEach(j => { if (!jugs.has(j.n)) jugs.set(j.n, Object.assign({ jugador: x.id }, j)); }));
    const st = Cartas.pokerNueva(orden.map(p => ({ id: p.id, nombre: p.nombre, bot: !!p.bot })), { fichas: 1000, manos: 10 });
    Cartas.pokerMano(st, rngDe(s.seed, 'poker-mano-0'));
    const ganadas = {}; let paso = 0, T0 = s.inicio;
    const ahora = ahoraServidor();
    for (let guard = 0; guard < 6000 && !st.terminada; guard++) {
      pkContar(st, ganadas);
      if (st.fase === 'fin') { const t = T0 + dur(PK_PAUSA_MS); if (ahora < t) break; Cartas.pokerMano(st, rngDe(s.seed, 'poker-mano-' + (st.mano + 1))); T0 = t; continue; }
      const j = st.turno, p = orden[j];
      if (p.bot) {
        const t = T0 + dur(PK_BOT_MS); if (ahora < t) break;
        Cartas.pokerActuar(st, Cartas.pokerBot(st, rngDe(s.seed, 'pbot' + paso))); paso++; T0 = t;
      } else {
        const mv = jugs.get(paso), lim = T0 + dur(PK_TURNO_MS);
        if (mv && mv.jugador === p.id && mv.t <= lim && Cartas.pokerActuar(st, mv)) { paso++; T0 = Math.max(T0, mv.t); }
        else if (ahora >= lim) { Cartas.pokerActuar(st, { accion: Cartas.opciones(st).pasar ? 'pasar' : 'retirarse' }); st.ultima.auto = true; paso++; T0 = lim; }
        else break;
      }
    }
    pkContar(st, ganadas);
    return Object.assign(st, { orden, paso, T0, ganadas, equipos: s.opciones && s.opciones.equipos === '1' ? orden.map((_, i) => i % 2) : null });
  }

  function pintarPokerSala(body) {

  // ---- Brisca y Conquián en sala (openspec: cartas-espanolas): reproducción genérica por pasos ----
  const CS_BOT_MS = 1500, CS_TURNO_MS = 30000, CS_PAUSA_BAZA_MS = 4000; // Brisca: la baza se ve 4 s antes del siguiente turno
  const CFG_CARTAS = {
    brisca: { max: 4, botMs: 2500, pausa: st => !st.baza.length && st.ultimaBaza && !st.terminada ? CS_PAUSA_BAZA_MS : 0, nueva: (js, rng) => Cartas.briscaNueva(js, rng), actuar: (st, mv) => mv.accion === 'jugar' && Cartas.briscaJugar(st, mv.carta), bot: (st, rng) => ({ accion: 'jugar', carta: Cartas.briscaBot(st, rng) }) },
    conquian: { max: 2, botMs: 2500, nueva: (js, rng) => Cartas.conquianNueva(js, rng), actuar: (st, mv) => Cartas.conquianActuar(st, mv), bot: (st, rng) => Cartas.conquianBot(st, rng) },
  };
  function estadoCartasSala(juego) {
    const cfg = CFG_CARTAS[juego];
    const e = sala.estado, s = e.sala;
    const orden = participantes().slice(0, cfg.max);
    if (orden.length < 2) return { faltan: true, orden };
    const jugs = new Map();
    e.jugadores.forEach(x => (x.jugadas || []).forEach(j => { if (!jugs.has(j.n)) jugs.set(j.n, Object.assign({ jugador: x.id }, j)); }));
    const st = cfg.nueva(orden.map(p => ({ id: p.id, nombre: p.nombre })), rngDe(s.seed, juego + '-mazo'));
    let paso = 0, T0 = s.inicio;
    const ahora = ahoraServidor();
    for (let guard = 0; guard < 3000 && !st.terminada; guard++) {
      const p = orden[st.turno];
      if (p.bot) {
        const t = T0 + dur(cfg.botMs || CS_BOT_MS); if (ahora < t) break;
        cfg.actuar(st, cfg.bot(st, rngDe(s.seed, juego + 'bot' + paso))); paso++; T0 = t + dur(cfg.pausa ? cfg.pausa(st) : 0);
      } else {
        const mv = jugs.get(paso), lim = T0 + dur(CS_TURNO_MS);
        if (mv && mv.jugador === p.id && mv.t <= lim && cfg.actuar(st, mv)) { paso++; T0 = Math.max(T0, mv.t) + dur(cfg.pausa ? cfg.pausa(st) : 0); }
        else if (ahora >= lim) { cfg.actuar(st, cfg.bot(st, rngDe(s.seed, juego + 'auto' + paso))); st.auto = true; paso++; T0 = lim + dur(cfg.pausa ? cfg.pausa(st) : 0); }
        else break;
      }
    }
    return Object.assign(st, { orden, paso, T0 });
  }

  function pintarCartasSala(body, juego) {
    const e = sala.estado, s = e.sala;

    const ahora = ahoraServidor();
    if (ahora < s.inicio) { bar.hidden = true; const k = 'cuenta:' + Math.ceil((s.inicio - ahora) / 1000); if (sala.vista !== k) { body.innerHTML = '<div class="q-card"><div class="sub">¡Prepárense! Se reparten las cartas</div><div class="letra">' + Math.ceil((s.inicio - ahora) / 1000) + '</div></div>'; sala.vista = k; } return; }
    const st = estadoCartasSala(juego);
    if (st.faltan) { bar.hidden = true; if (sala.vista !== 'faltan') { body.innerHTML = '<div class="card muted" style="text-align:center">Se necesitan al menos 2 jugadores (activa los bots al crear la partida).</div>'; sala.vista = 'faltan'; } return; }
    const yo = st.orden.findIndex(p => p.id === e.yo);

    if (st.terminada) {
      bar.hidden = true;
      const pts = j => juego === 'brisca' ? brPuntos(st, j).puntos : cqPuntos(st, j);
      const filas = st.orden.map((p, j) => ({ id: p.id, nombre: p.nombre + (st.equipos ? ' (' + 'AB'[st.equipos[j]] + ')' : ''), tipo: p.tipo, avatar: p.avatar, total: pts(j), ultimo: 0 })).sort((a, b) => b.total - a.total);
      if (juego === 'brisca') { sala.finAciertos = yo >= 0 ? st.ganadas[yo].length / st.n : 0; sala.finTotal = 40 / st.n | 0; }
      else { sala.finAciertos = yo >= 0 ? Cartas.bajadas(st, yo) : 0; sala.finTotal = 9; }
      const r = juego === 'brisca' ? Cartas.briscaResultado(st) : null;
      const titulo = juego === 'brisca' ? (r.ganador < 0 ? '🤝 ¡Empate!' : '🏆 Gana ' + (st.equipos ? 'el equipo ' + 'AB'[r.ganador] : nombre(r.ganador)) + ' · ' + r.totales.join(' vs ')) :

    bar.hidden = false; bar.firstChild.style.width = Math.max(0, Math.min(100, (st.T0 + ventana - ahora) / ventana * 100)) + '%';

    const clave = 'cs:' + st.paso + ':' + (miTurno ? 1 : 0) + ':' + (sala.csEnviando ? 1 : 0) + ':' + [...sel].join(',') + ':' + sala.cqDestino + ':' + (sala.cqMsg || '');

    sala.vista = clave;
    const pie = miTurno ? '<div class="feedback ok">👉 ¡Tu turno! Tienes 30 s</div>' : '<div class="feedback">⏳ Turno de ' + escapeHtml(nombre(st.turno)) + '</div>';
    body.innerHTML = juego === 'brisca' ? briscaHtml(st, { yo, nombre, avatar, miTurno, verUltima: true, pie }) :
      conquianHtml(st, { yo, nombre, avatar, miTurno, sel, destino: sala.cqDestino ?? null, msg: sala.cqMsg, pie });
    sala.csSt = st;

  // ---- Ajedrez 1 vs 1 en sala (openspec: ajedrez): reloj por jugador; todos reproducen las jugadas ----
  const AJ_BOT_MS = 1500;
  function estadoAjedrez() {
    const e = sala.estado, s = e.sala;
    const orden = participantes().slice(0, 2);
    if (orden.length < 2) return { faltan: true, orden };
    const R = dur(Number(s.opciones.reloj || 10) * 60000);
    const jugs = new Map();
    e.jugadores.forEach(x => (x.jugadas || []).forEach(j => { if (!jugs.has(j.n)) jugs.set(j.n, Object.assign({ jugador: x.id }, j)); }));
    const cache = sala.ajCache || (sala.ajCache = new Map());
    let st = Ajedrez.desdeFEN(Ajedrez.INICIAL), paso = 0, T0 = s.inicio, fin = null, ultima = null;
    const usado = [0, 0], sanes = [];
    const ahora = ahoraServidor();
    for (let guard = 0; guard < 1200 && !fin; guard++) {
      const res = Ajedrez.resultado(st);
      if (res) { fin = res; break; }
      const j = st.turno === 'w' ? 0 : 1, p = orden[j], lim = T0 + (R - usado[j]);
      const aplicar = (mv, t) => { const k = Ajedrez.aFEN(st) + mv.de + mv.a + (mv.promo || ''); if (!cache.has(k)) cache.set(k, Ajedrez.san(st, mv)); sanes.push(cache.get(k)); st = Ajedrez.aplicar(st, mv); ultima = mv; usado[j] += Math.max(0, t - T0); T0 = Math.max(T0, t); };
      if (p.bot) {
        const t = T0 + dur(AJ_BOT_MS); if (ahora < t) break;
        const k = 'bot:' + Ajedrez.aFEN(st);
        if (!cache.has(k)) cache.set(k, Ajedrez.bot(st, 2, rngDe(s.seed, 'aj' + paso)));
        aplicar(cache.get(k), t); paso++;
      } else {
        const mv = jugs.get(paso);
        if (mv && mv.jugador === p.id && mv.t <= lim) {
          paso++;
          if (mv.accion === 'rendirse') { fin = { fin: 'rendicion', gana: j ? 'w' : 'b' }; usado[j] += Math.max(0, mv.t - T0); break; }
          const m = Ajedrez.buscarJugada(st, mv.de, mv.a, mv.promo);
          if (m) aplicar(m, mv.t); // una jugada ilegal se ignora: sigue el mismo turno con el siguiente paso
        } else if (ahora >= lim) { fin = { fin: 'tiempo', gana: j ? 'w' : 'b' }; usado[j] = R; break; }

      }
    }
    const turnoIdx = st.turno === 'w' ? 0 : 1;
    const quedan = [0, 1].map(k => Math.max(0, R - usado[k] - (!fin && k === turnoIdx ? Math.max(0, ahora - T0) : 0)));

  const ajFmtReloj = ms => { const sg = Math.ceil(ms / 1000 / TIEMPO); return Math.floor(sg / 60) + ':' + String(sg % 60).padStart(2, '0'); };

      (sala.ajPromo && miTurno ? ajPromoHtml(color) : '') +

  // ---------- Música de fondo generada (WebAudio, sin archivos ni derechos) ----------
  const ESTILOS_MUSICA = {
    alegre: { nombre: '🎵 Alegre', bpm: 118 },
    relajante: { nombre: '😌 Relajante', bpm: 72 },
    fiesta: { nombre: '🎉 Fiesta', bpm: 126 },
  };
  const PROG = [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]]; // I–V–vi–IV (semitonos sobre Do)
  const hz = st => 261.63 * Math.pow(2, st / 12);
  const musica = { estilo: null, volumen: 'bajo', ctx: null, master: null, timer: null, paso: 0, siguiente: 0 };

  function leerPrefMusica() { try { return JSON.parse(localStorage.getItem('juegos_pref') || '{}'); } catch (e) { return {}; } }
  function guardarPrefMusica() { try { localStorage.setItem('juegos_pref', JSON.stringify({ musica: musica.estilo, volumen: musica.volumen })); } catch (e) { /* sin almacenamiento */ } }
  const volMusica = () => musica.volumen === 'medio' ? 0.16 : 0.08;

  function notaMusica(t, freq, dur, tipo, vol, filtro) {
    const c = musica.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.type = tipo; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let salida = g;
    if (filtro) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtro; g.connect(f); salida = f; }
    o.connect(g); salida.connect(musica.master); o.start(t); o.stop(t + dur + 0.05);
  }
  function ruidoMusica(t, dur, vol, agudo) {
    const c = musica.ctx; const n = Math.floor(c.sampleRate * dur); const buf = c.createBuffer(1, n, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf; const g = c.createGain(); g.gain.value = vol;
    const f = c.createBiquadFilter(); f.type = agudo ? 'highpass' : 'lowpass'; f.frequency.value = agudo ? 7000 : 900;
    src.connect(f); f.connect(g); g.connect(musica.master); src.start(t);
  }
  function bomboMusica(t) {
    const c = musica.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(musica.master); o.start(t); o.stop(t + 0.2);
  }

  // Un paso = corchea. 8 pasos por compás, 4 compases por vuelta.
  function pasoMusica(t, paso) {
    const est = musica.estilo; const acorde = PROG[Math.floor(paso / 8) % 4]; const i = paso % 8; const corchea = 30 / ESTILOS_MUSICA[est].bpm;
    if (est === 'alegre') {
      const penta = [0, 2, 4, 7, 9, 12, 14, 16];
      notaMusica(t, hz(penta[(paso * 3 + acorde[0]) % penta.length] + 12), corchea * 0.9, 'square', 0.05, 2500);
      if (i % 2 === 0) notaMusica(t, hz(acorde[0] - 12), corchea * 1.8, 'triangle', 0.22);
      if (i % 2 === 1) ruidoMusica(t, 0.04, 0.05, true);
    } else if (est === 'relajante') {
      if (i === 0) acorde.forEach((st, k) => notaMusica(t, hz(st) * (1 + (k - 1) * 0.002), corchea * 8, 'sine', 0.07));
      if (i % 2 === 0) notaMusica(t, hz(acorde[(i / 2) % 3] + 12), corchea * 2.5, 'triangle', 0.035);
      if (i === 0 || i === 4) notaMusica(t, hz(acorde[0] - 24), corchea * 4, 'sine', 0.18);
      if (Math.random() < 0.3) ruidoMusica(t, 0.02, 0.012, true);
    } else if (est === 'fiesta') {
      if (i % 2 === 0) bomboMusica(t);
      if (i % 2 === 1) notaMusica(t, hz(acorde[0] - 12), corchea * 0.9, 'sawtooth', 0.12, 700);
      if (i === 2 || i === 6) acorde.forEach(st => notaMusica(t, hz(st + 12), corchea * 0.6, 'sawtooth', 0.035, 1800));
      if (i % 2 === 1) ruidoMusica(t, 0.03, 0.06, true);
    }
  }

  function iniciarMusica(estilo) {

    musica.estilo = estilo; guardarPrefMusica(); pintarBotonMusica();
    if (!estilo) return;
    try {
      musica.ctx = musica.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (musica.ctx.state === 'suspended') musica.ctx.resume();
      musica.master = musica.ctx.createGain(); musica.master.gain.value = volMusica(); musica.master.connect(musica.ctx.destination);
      musica.paso = 0; musica.siguiente = musica.ctx.currentTime + 0.1;
      musica.timer = setInterval(() => {
        const corchea = 30 / ESTILOS_MUSICA[musica.estilo].bpm;
        while (musica.siguiente < musica.ctx.currentTime + 0.12) { pasoMusica(musica.siguiente, musica.paso++); musica.siguiente += corchea; }
      }, 25);
    } catch (e) { musica.estilo = null; pintarBotonMusica(); }
  }
  function detenerMusica() {
    if (musica.timer) clearInterval(musica.timer);
    musica.timer = null;
    if (musica.master) { try { musica.master.disconnect(); } catch (e) { /* ya desconectado */ } musica.master = null; }
  }
  // Mientras habla la voz (gritón, Spelling), la música baja.
  function bajarMusica(ms = 2500) {
    if (!musica.master || !musica.ctx) return;
    const g = musica.master.gain, t = musica.ctx.currentTime;
    g.cancelScheduledValues(t); g.setTargetAtTime(volMusica() * 0.25, t, 0.05); g.setTargetAtTime(volMusica(), t + ms / 1000, 0.3);

  function pintarBotonMusica() {

      '<div class="muted" style="margin:8px 0 4px">Volumen</div><div style="display:flex;gap:6px"><button class="mus-opt" data-vol="bajo">Bajo</button><button class="mus-opt" data-vol="medio">Medio</button></div></div>';

  (() => {

  document.getElementById('menu-musica-wrap').innerHTML = menuMusicaHtml();

  document.getElementById('menu-musica').addEventListener('click', e => {
    e.stopPropagation();
    const b = e.target.closest('[data-mus]'), v = e.target.closest('[data-vol]');
    if (b) iniciarMusica(b.dataset.mus || null);
    if (v) { musica.volumen = v.dataset.vol; guardarPrefMusica(); if (musica.master) musica.master.gain.value = volMusica(); pintarBotonMusica(); }
  });
  document.addEventListener('click', () => { const m = document.getElementById('menu-musica'); if (m) m.hidden = true; });
  chip.addEventListener('click', () => { if (state.jugador) pantallaAvatar(); });

  // ---------- 📖 Cómo se juega (openspec: poker; Sprint 2 suma Brisca y Conquián) ----------
  const AYUDA = {
